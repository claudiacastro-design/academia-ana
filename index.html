ses","Cada 3 meses durante la primera semana del mes","Anualmente con la renovación de la membresía"],"ok": 2,"exp": "Las reinscripciones son cada 3 meses, durante la primera semana del mes correspondiente. Se avisa con una semana de anticipación para que las GPs puedan organizar sus horarios."},{"id": "qc1c","text": "¿Cuál de estos NO es un dominio de clases de la Comunidad Koltin?","opts": ["Movimiento y funcionalidad","Mente activa y aprendizaje","Salud y nutrición avanzada","Conexión social y participación"],"ok": 2,"exp": "Los 3 dominios son: Movimiento y funcionalidad, Mente activa y aprendizaje, y Conexión social y participación. \"Salud y nutrición avanzada\" no es un dominio de Comunidad."},{"id": "qc1d","text": "¿Por qué las clases de Yoga y Funcional no necesitan enlace de Google Meet?","opts": ["Porque son exclusivamente presenciales en Casa Koltin","Porque se transmiten en vivo por YouTube y Facebook de Koltin","Porque están disponibles solo en la app de Koltin","Porque son solo para GPs de CDMX"],"ok": 1,"exp": "Las clases de Yoga y Funcional son por transmisión en vivo en los canales de YouTube y Facebook de Koltin. No usan Google Meet — a diferencia de Cine Club, Historia de Arte, Escritura Creativa y Mindfulness."},{"id": "qc1e","text": "¿Cuándo puede un acompañante de una GP asistir a las clases de Comunidad?","opts": ["Siempre, pagando una cuota de visitante","Solo los fines de semana en eventos especiales","Únicamente si es indispensable para la movilidad de la GP","Si la clase tiene lugares disponibles el día del evento"],"ok": 2,"exp": "Los acompañantes solo pueden asistir si es indispensable para la movilidad de la GP. Si no son miembros de Koltin, deben esperar en el área de encuentro — no participan en la clase."},{"id": "qc1f","text": "¿Qué beneficio principal de salud buscan las clases del dominio \"Conexión social y participación\"?","opts": ["Mejorar la fuerza y el equilibrio físico","Estimular la memoria y la función cognitiva","Fortalecer los lazos sociales y combatir el aislamiento","Reducir el colesterol y mejorar la salud cardiovascular"],"ok": 2,"exp": "Las clases de Conexión social y participación buscan fortalecer lazos sociales, combatir el aislamiento y fomentar el sentido de pertenencia — factores clave para la salud integral de los adultos mayores."},{"id": "qc1g","text": "Verdadero o Falso: Las clases virtuales solo están disponibles para GPs de CDMX.","opts": ["Verdadero","Falso"],"ok": 1,"exp": "Falso. Las clases virtuales están disponibles para cualquier miembro activo de Koltin sin importar en qué parte de México se encuentre. Es uno de los grandes beneficios del formato virtual."},{"id": "qc1h","text": "¿Cuándo se avisa a las GPs sobre las reinscripciones?","opts": ["El mismo día que abren","Con 2 semanas de anticipación","Con 1 semana de anticipación","Al final del período anterior"],"ok": 2,"exp": "Se avisa con una semana de anticipación antes de que abran las reinscripciones. Esto permite a las GPs organizar sus preferencias y asegurar sus lugares en las clases más populares."}],"subc2": [{"id": "qc2a","text": "¿Cuántas clases por dominio se permiten según el criterio de modulación?","opts": ["1 clase por dominio máximo","1 a 2 clases por dominio","3 clases por dominio si la GP lo solicita","Sin límite — la GP elige libremente"],"ok": 1,"exp": "El criterio de modulación permite 1 a 2 clases por dominio: 1-2 de movimiento, 1-2 de mente activa y 1-2 de conexión social. Esto cuida la salud integral de las GPs."},{"id": "qc2b","text": "¿Para qué sirve LANA en el contexto de la Comunidad?","opts": ["Es el calendario público de eventos y clases que las GPs pueden consultar","Es la plataforma interna operativa para gestión de clases, inscripciones y listas de espera","Es la app donde las GPs ven sus beneficios de membresía","Es la herramienta de pagos y facturación de Koltin"],"ok": 1,"exp": "LANA es la herramienta operativa interna de Comunidad — desde ahí se consulta disponibilidad, se inscriben GPs, se gestiona la lista de espera y se completa el cuestionario de autopercepción."},{"id": "qc2c","text": "¿Qué es LUMA y para qué se usa?","opts": ["La plataforma interna de gestión de clases de Casa Koltin","El sistema de pagos de la membresía Koltin","La plataforma pública de calendario de eventos y clases virtuales de Koltin","El portal donde las GPs descargan sus recetas médicas"],"ok": 2,"exp": "LUMA es la plataforma pública donde se encuentra el calendario completo de eventos presenciales y clases virtuales de Koltin. Tanto las GPs como el equipo pueden consultarla."},{"id": "qc2d","text": "Una GP se registra en lista de espera. ¿Qué información necesitas registrar en LANA?","opts": ["Nombre, correo y teléfono","Número de certificado y nombre de la GP","Solo el nombre — el sistema completa el resto automáticamente","Nombre, CURP y número de membresía"],"ok": 1,"exp": "Para registrar a una GP en lista de espera se necesita su número de certificado y nombre. Cuando se libere un lugar, el equipo de Comunidad la contactará directamente."},{"id": "qc2e","text": "¿Qué debe hacer la GP antes de su primera clase presencial?","opts": ["Solo presentar su credencial de membresía digital","Completar 5 pasos: cuestionario, reglamento, declaración, deslinde y se recomienda onboarding 15 min antes","Solo firmar la declaración de salud","No hay pasos previos — puede entrar directamente"],"ok": 1,"exp": "La primera vez en Comunidad involucra 5 pasos: cuestionario de autopercepción, reglamento, declaración de salud, deslinde de responsabilidades, y se sugiere llegar 15 minutos antes para el onboarding."},{"id": "qc2f","text": "¿Es obligatorio completar los 5 pasos de primera vez al momento de la inscripción?","opts": ["Sí — sin completarlos no puede asistir a ninguna clase","No — pero es importante informarle a la GP que debe completarlos","Solo el cuestionario es obligatorio en ese momento","Solo los documentos físicos son obligatorios el primer día"],"ok": 1,"exp": "No es obligatorio completarlos al momento de la inscripción, pero sí es importante que la Expertx le informe a la GP que debe completarlos antes de su primera clase."},{"id": "qc2g","text": "¿Qué pasa si la GP no avisa que no puede asistir a una clase?","opts": ["Se le cobra una penalización según el reglamento","Se asume que no asistirá y el lugar puede liberarse para alguien en lista de espera","Se le llama para confirmar su asistencia ese mismo día","No hay consecuencias — simplemente no asistió"],"ok": 1,"exp": "Si la GP no avisa su inasistencia, se asume que no asistirá y el lugar puede liberarse para la siguiente persona en lista de espera. Por eso es importante que las GPs avisen con anticipación."},{"id": "qc2h","text": "¿Cuál de estas clases usa Google Meet para su transmisión virtual?","opts": ["Yoga","Funcional","Mindfulness","Ninguna — todas son por YouTube y Facebook"],"ok": 2,"exp": "Mindfulness usa Google Meet para su transmisión virtual. Yoga y Funcional son por YouTube y Facebook Live. Cine Club, Historia de Arte y Escritura Creativa también usan Google Meet."}],"subc3": [{"id": "qc3a","text": "Una GP te llama para quejarse del profesor de Tai Chi. ¿Qué haces?","opts": ["Escuchas, tratas de resolver tú la queja y das seguimiento","Escuchas con empatía y derivas inmediatamente al equipo de Comunidad para que den solución oportuna","Le explicas que no puedes ayudarla con eso","Le pides que envíe la queja por escrito al correo del profesor"],"ok": 1,"exp": "Las quejas sobre clases o profesores van directo al equipo de Comunidad. La Expertx escucha con empatía, valida el sentimiento de la GP y genera el escalamiento correspondiente — no intenta resolver sola."},{"id": "qc3b","text": "Una GP pregunta si su clase de Yoga cambió de horario. ¿Qué le dices?","opts": ["Le confirmas el nuevo horario si lo conoces","Le dices que no puedes confirmar cambios de horario — solo el equipo de Comunidad puede hacerlo, y lo canalizas con ellos","Le dices que revise LUMA porque ahí aparecen todos los horarios actualizados","Le dices que espere a que le llegue una notificación por WhatsApp"],"ok": 1,"exp": "Solo el equipo de Comunidad confirma cambios de horarios. Para evitar confusiones, la Expertx no confirma modificaciones aunque las conozca — canaliza a la GP con el equipo de Comunidad."},{"id": "qc3c","text": "¿Qué haces cuando una GP tiene dudas sobre el Programa de Salud Muscular?","opts": ["Lo resuelves tú con la información del manual de Comunidad","Lo escalas al equipo de Comunidad","Reasignas el ticket al equipo de Gero","Le dices que el programa ya no existe en Koltin"],"ok": 2,"exp": "Las dudas sobre el Programa de Salud Muscular se reasignan al equipo de Gero — no al equipo de Comunidad ni lo resuelve la Expertx. Es importante conocer esta distinción para escalar correctamente."},{"id": "qc3d","text": "¿Hasta qué edad puede inscribirse una GP a las clases presenciales de Casa Koltin?","opts": ["Hasta los 75 años","Hasta los 80 años","No hay límite de edad máxima","Hasta los 84 años y 11 meses como en el seguro"],"ok": 2,"exp": "No hay límite de edad máxima para participar en las clases de Comunidad. Cualquier miembro activo mayor de 50 años puede inscribirse, sin importar su edad."},{"id": "qc3e","text": "Una GP quiere saber qué debe llevar a sus clases en Casa Koltin. ¿Qué le dices?","opts": ["Tapete de yoga, agua y ropa cómoda","Solo ropa cómoda y calzado adecuado — Koltin proporciona todos los materiales","Su credencial de membresía y una foto tamaño infantil","Nada — todo está disponible en la recepción"],"ok": 1,"exp": "Koltin proporciona todos los materiales necesarios. Las GPs solo necesitan asistir con ropa cómoda y calzado adecuado. Es una respuesta sencilla pero importante para quitar barreras de entrada."},{"id": "qc3f","text": "¿Cómo accede una GP a una clase virtual que aparece como llena en LUMA?","opts": ["No puede — si aparece llena, debe esperar a la siguiente sesión","Se registra en lista de espera en LANA","La Expertx le puede enviar el enlace directo de la clase para que acceda de todas formas","Debe contactar directamente al equipo de Comunidad para que la inscriban"],"ok": 2,"exp": "Si una clase virtual aparece llena en LUMA, la Expertx puede enviar el enlace directo de la clase. Las clases virtuales son accesibles para cualquier miembro activo — el cupo en LUMA es referencial."},{"id": "qc3g","text": "Una GP nueva pregunta por qué debe llenar un Cuestionario de Autopercepción. ¿Qué le explicas?","opts": ["Que es para evaluar su nivel de condición física antes de las clases","Que es para medir sus expectativas y su autopercepción de salud física y emocional al inicio de su experiencia en Comunidad","Que es obligatorio por ley para actividades físicas con adultos mayores","Que es para asignarle el dominio de clases correcto"],"ok": 1,"exp": "El Cuestionario de Autopercepción mide las expectativas y la autopercepción de salud física y emocional de la GP al inicio de su participación en Comunidad. Es parte del registro completo que el equipo necesita."},{"id": "qc3h","text": "¿Cuál es el rol principal de la Expertx en la Comunidad de Koltin?","opts": ["Coordinar y organizar las clases junto con el equipo de Comunidad","Ser el primer puente entre las GPs y las actividades de Comunidad — resolver dudas con calidez y confianza","Reemplazar al equipo de Comunidad cuando no están disponibles","Gestionar las inscripciones y cancelaciones de forma autónoma"],"ok": 1,"exp": "La Expertx es el primer puente entre las GPs y la Comunidad. Su rol es resolver dudas con calidez y confianza, promover la participación y asegurar que cada interacción refleje el espíritu de Koltin — siempre sabiendo qué escalar."}],"subs1": [{"id": "qs1a","text": "¿Cuál es la edad máxima para estar asegurado con el SGMM de Koltin?","opts": ["70 años","75 años","80 años","84 años y 11 meses"],"ok": 3,"exp": "Gracias a la alianza de Koltin con GNP, el seguro está disponible para personas de hasta 84 años y 11 meses. La mayoría de las aseguradoras limitan la contratación a los 60-65 años — este es uno de los principales diferenciadores de Koltin."},{"id": "qs1b","text": "Una GP viaja a España de vacaciones y tiene un infarto. ¿El SGMM la cubre?","opts": ["No — el seguro solo cubre en México","Sí — con pago directo en el hospital español","Sí — hasta $50,000 USD, pero mediante reembolso ya que GNP no tiene convenios en el extranjero","Sí — pero solo si el hospital pertenece a la red de GNP"],"ok": 2,"exp": "El SGMM cubre emergencias en el extranjero hasta $50,000 USD, pero mediante reembolso: la GP paga en el momento y después solicita el reembolso. GNP no tiene convenios hospitalarios en el extranjero."},{"id": "qs1c","text": "Una GP tuvo una emergencia médica en el extranjero. ¿En cuántos días debe reportarla?","opts": ["15 días","10 días","5 días","30 días"],"ok": 2,"exp": "El plazo para reportar la emergencia es de 5 días posteriores al evento, llenando el documento \"Aviso de accidente o enfermedad\". No cumplirlo puede afectar el procesamiento del reembolso."},{"id": "qs1d","text": "¿Por qué el SGMM de Koltin puede ofrecer precios más accesibles que las pólizas individuales?","opts": ["Porque GNP ofrece tarifas especiales para adultos mayores enfermos","Porque forma parte de una póliza grupal que distribuye el riesgo","Porque Koltin subsidia parte del costo con sus ingresos de membresía","Porque el seguro tiene menos cobertura que las pólizas individuales"],"ok": 1,"exp": "El SGMM de Koltin forma parte de una póliza grupal, lo que permite repartir el riesgo entre todos los asegurados y ofrecer precios más accesibles que si cada persona contratara una póliza individual."},{"id": "qs1e","text": "Verdadero o Falso: El SGMM de Koltin tiene un límite de edad para renovación si la GP cumple 85 años.","opts": ["Verdadero","Falso"],"ok": 1,"exp": "Falso. El SGMM se ofrece sin límite de edad para su renovación, siempre que la GP mantenga su membresía activa. No hay límite de edad para renovar."},{"id": "qs1f","text": "Una GP te dice que lleva 3 años con Koltin y que su seguro es con BBVA Seguros Salud. ¿Es posible?","opts": ["No — todos los clientes Koltin ya están con GNP desde octubre 2026","Sí — los clientes que llegaron como empleados, familiares o jubilados de BBVA mantienen su póliza con BBVA Seguros Salud","No — BBVA Seguros Salud nunca fue la aseguradora de Koltin","Solo si contrataron antes de 2023"],"ok": 1,"exp": "Sí es posible. A partir del 14 de octubre de 2026, Koltin transicionó al público general a GNP. Pero los clientes que llegaron siendo empleados, familiares o jubilados de BBVA siguen con BBVA Seguros Salud. Como Experta debes identificar con qué aseguradora está cada GP."},{"id": "qs1g","text": "¿Qué diferencia principal tiene el SGMM de Koltin frente a otras aseguradoras para adultos mayores?","opts": ["Ofrece cobertura dental y de visión incluida","No requiere pago de deducible para cirugías electivas","Acepta asegurados de hasta 84 años y 11 meses, cuando la mayoría limita entre 60 y 65","Cubre enfermedades preexistentes desde el primer día"],"ok": 2,"exp": "El gran diferenciador es la edad de acceso: gracias a la alianza con GNP, Koltin ofrece el SGMM hasta los 84 años y 11 meses. La mayoría de las aseguradoras no aceptan a personas mayores de 65 años."},{"id": "qs1h","text": "¿Con qué aseguradora están los nuevos miembros del público general que ingresan a Koltin a partir del 14 de octubre de 2026?","opts": ["BBVA Seguros Salud","Mapfre","GNP Seguros","Metlife"],"ok": 2,"exp": "A partir del 14 de octubre de 2026, todos los nuevos miembros del público general ingresan con GNP Seguros. Los clientes que llegaron como empleados, familiares o jubilados de BBVA siguen con BBVA Seguros Salud."},{"id": "qs1i","text": "Una GP viaja a Estados Unidos de turismo y sufre una caída que requiere hospitalización. ¿Qué debe hacer para asegurarse de recibir el reembolso?","opts": ["Llamar a GNP antes de recibir atención para que autoricen el hospital","Recibir atención, reunir facturas, formatos de la aseguradora e informe médico, y reportar a Koltin en 5 días","Pagar con tarjeta de crédito y mandar el estado de cuenta como comprobante","No hay reembolso — la cobertura en el extranjero solo aplica para urgencias en hospitales aliados de GNP"],"ok": 1,"exp": "En el extranjero, la GP debe: recibir atención, obtener todos los documentos, guardar facturas o recibos, y reportar la emergencia a Koltin (WhatsApp 5624529159) dentro de los 5 días posteriores al evento para gestionar el reembolso."},{"id": "qs1j","text": "¿Qué tipo de cambio utiliza GNP para calcular el reembolso de gastos médicos en el extranjero?","opts": ["El tipo de cambio del banco donde la GP tiene su cuenta","El tipo de cambio oficial de Banxico (Banco de México)","El tipo de cambio promedio del mes en que ocurrió el evento","GNP no reembolsa en pesos — lo hace directamente en la moneda del país"],"ok": 1,"exp": "Para reembolsos en el extranjero, GNP usa el tipo de cambio oficial de Banxico. Es importante comunicárselo a la GP para que sepa a qué tipo de cambio esperar la devolución."},{"id": "qs1k","text": "¿Por qué la GP tiene que pagar de su bolsillo en caso de emergencia en el extranjero, aunque tenga el SGMM de GNP activo?","opts": ["Porque la cobertura en el extranjero se suspende automáticamente al salir de México","Porque GNP no tiene convenios con hospitales en el extranjero — después la GP solicita el reembolso con documentación completa","Porque la GP debe activar previamente la cobertura internacional desde la app","Porque el deducible en el extranjero siempre cubre el 100% del gasto"],"ok": 1,"exp": "GNP no tiene convenios hospitalarios fuera de México, así que no puede hacer pago directo. La GP atiende la emergencia, paga, y después solicita el reembolso con documentación. La cobertura existe, pero siempre es por reembolso en el extranjero."},{"id": "qs1l","text": "¿Qué debe hacer una GP que viaja al extranjero para estar bien preparada?","opts": ["Contratar un seguro adicional — el SGMM no cubre fuera de México","Llamar a GNP antes del viaje para activar la cobertura internacional","Revisar los detalles de cobertura antes de viajar y tener guardado el WhatsApp de Koltin (5624529159)","No hay que hacer nada especial — se activa automáticamente"],"ok": 2,"exp": "Se recomienda revisar los detalles de cobertura antes del viaje y guardar el WhatsApp de Koltin. En emergencia, la GP tiene 5 días para reportarlo — estar preparada agiliza el proceso de reembolso."}],"subs2": [{"id": "qs2a","text": "Una GP llama diciendo que se hizo una cirugía estética de párpados y quiere saber si el seguro la cubre. ¿Qué le dices?","opts": ["Que sí cubre si es por razones médicas documentadas","Que no cubre — los tratamientos estéticos son una exclusión general del SGMM","Que depende del monto de la cirugía y si supera el deducible","Que hay que revisar con GNP caso por caso"],"ok": 1,"exp": "Los tratamientos estéticos son una exclusión general del SGMM. Esto incluye cirugías plásticas con fines estéticos. Es importante comunicarlo con claridad para evitar falsas expectativas."},{"id": "qs2b","text": "Una GP contrató su membresía hace 3 meses y necesita operarse de cataratas. ¿El seguro cubre?","opts": ["Sí — las cataratas no tienen tiempo de espera","No todavía — las cataratas tienen tiempo de espera de 6 meses","No — las cataratas son una exclusión general","Sí — siempre que supere el deducible de $30,000"],"ok": 1,"exp": "Las cataratas tienen un tiempo de espera de 6 meses, así que la cobertura no aplica aún. Pero hay un punto crítico: si los síntomas ya se manifestaban antes de que se cumpliera el plazo, el padecimiento queda excluido incluso después, porque los síntomas iniciaron dentro del periodo de espera. No basta con que el diagnóstico formal llegue después del plazo."},{"id": "qs2c","text": "Una GP se lastima practicando paracaidismo. ¿El SGMM cubre los gastos médicos?","opts": ["Sí — cualquier accidente está cubierto sin deducible","No — los deportes extremos son una exclusión del seguro","Sí — pero aplica deducible y coaseguro normales","Solo si el accidente pone en peligro su vida"],"ok": 1,"exp": "Los deportes extremos como el paracaidismo son una exclusión del SGMM. Las lesiones sufridas practicando deportes extremos no están cubiertas por la póliza."},{"id": "qs2d","text": "¿Cuál es el tiempo de espera para urgencias médicas derivadas de accidentes?","opts": ["30 días","15 días","7 días","0 días — cobertura inmediata"],"ok": 3,"exp": "Las urgencias médicas derivadas de padecimientos cubiertos o accidentes tienen tiempo de espera de 0 días — hay cobertura desde el primer día. Esto es especialmente importante comunicárselo a las GPs nuevas."},{"id": "qs2e","text": "¿Cuál es la tarea más importante de una Experta frente a las exclusiones del seguro?","opts": ["Evitar hablar de las exclusiones para no desanimar al cliente","Comunicarlas con claridad y anticipación para evitar malentendidos y falsas expectativas","Solo mencionarlas cuando la GP pregunta directamente","Referir siempre a GNP para que ellos las expliquen"],"ok": 1,"exp": "Comunicar las exclusiones con claridad es fundamental. Evitar malentendidos y falsas expectativas es parte del trabajo de transmitir confianza y transparencia que caracteriza a Koltin."},{"id": "qs2f","text": "Una GP con 8 meses de membresía necesita operarse las amígdalas por indicación médica. ¿El seguro cubre?","opts": ["Sí — las amígdalas no tienen tiempo de espera","No — las amígdalas son una exclusión del seguro","No todavía — las amígdalas tienen tiempo de espera de 1 año","Sí — con 6 meses de espera ya está cubierto"],"ok": 2,"exp": "Las amígdalas (solo por causas médicas, no estéticas) tienen un tiempo de espera de 1 año. Con 8 meses de membresía, la GP todavía no tiene cobertura para este procedimiento."},{"id": "qs2g","text": "¿Cuál es la actitud correcta de una Experta al explicarle las exclusiones del seguro a una GP molesta?","opts": ["Evitar el tema para no empeorar la situación","Culpar a GNP por las restricciones del seguro","Comunicarlas con empatía y claridad, transmitiendo que la cobertura disponible sigue siendo sólida","Ofrecerle una excepción especial para su caso particular"],"ok": 2,"exp": "Las exclusiones se comunican con empatía y claridad. No se inventan excepciones ni se culpa a terceros. La GP necesita entender qué está cubierto y qué no para confiar en Koltin."},{"id": "qs2h","text": "¿Qué tiempo de espera aplica para enfermedades de columna vertebral?","opts": ["30 días","6 meses","10 meses","1 año"],"ok": 3,"exp": "Las afecciones de columna vertebral tienen tiempo de espera de 1 año (solo por causas médicas, no estéticas). Es uno de los tiempos de espera más largos junto con rodilla, amígdalas y várices."},{"id": "qs2i","text": "¿Cuánto tiempo de espera aplica para enfermedades de la vesícula biliar?","opts": ["30 días","6 meses","1 año","No tiene tiempo de espera"],"ok": 1,"exp": "La vesícula biliar tiene tiempo de espera de 6 meses, junto con cataratas, reflujo gastroesofágico, cáncer de mama, hernias (excepto disco) y padecimientos ginecológicos."},{"id": "qs2j","text": "¿Cuál es la suma asegurada máxima del SGMM de GNP para diagnóstico de VIH/SIDA?","opts": ["No está cubierto bajo ninguna condición","$200,000 MXN, solo para tratamiento antirretroviral","$500,000 MXN en territorio nacional","La misma suma asegurada que para cualquier otra enfermedad"],"ok": 2,"exp": "El SGMM de GNP cubre VIH/SIDA con una suma asegurada de $500,000 MXN, cobertura exclusiva en territorio nacional. La antigüedad se genera desde la contratación. No aplica reducción ni eliminación de periodos de espera, pero sí aplica reconocimiento de antigüedad."},{"id": "qs2k","text": "Una GP llama porque su póliza no cubrió un tratamiento psicológico. ¿Era de esperarse?","opts": ["No — los tratamientos psicológicos deberían estar cubiertos","Sí — los tratamientos psiquiátricos y psicológicos son exclusión general, salvo casos como cáncer terminal o secuestro","Depende del monto y si supera el deducible","Solo están excluidos si son anteriores a contratar el seguro"],"ok": 1,"exp": "Los tratamientos psiquiátricos y psicológicos son exclusión general del SGMM, salvo casos muy específicos. Es una exclusión que hay que comunicar claramente desde el inicio para evitar sorpresas."},{"id": "qs2l","text": "¿Las complicaciones del embarazo y el parto están cubiertas por el SGMM de GNP en la membresía Koltin?","opts": ["Sí, sin tiempo de espera — desde el primer día","Sí, después de 10 meses de membresía activa","No — las complicaciones del embarazo y parto son una exclusión general del seguro","Solo si requieren hospitalización de más de 24 horas"],"ok": 2,"exp": "Las complicaciones del embarazo y el parto son una exclusión general del SGMM de Koltin. No tienen tiempo de espera — están excluidas completamente, sin importar el tiempo que lleve la GP en la membresía. No confundirlas con padecimientos con periodo de espera."}],"subs3": [{"id": "qs3a","text": "Una GP tiene una cirugía que cuesta $25,000. ¿El SGMM la cubre?","opts": ["Sí — el seguro cubre desde el primer peso","No — el costo no alcanza el deducible de $30,000","Sí — pero aplica el coaseguro del 20%","Depende del tipo de cirugía"],"ok": 1,"exp": "El deducible del SGMM Koltin es de $30,000. Como la cirugía cuesta $25,000 (menos que el deducible), el seguro no la cubre. El asegurado asume el costo completo."},{"id": "qs3b","text": "Alicia tiene una cirugía de $150,000. ¿Cuánto paga ella y cuánto paga GNP?","opts": ["Alicia paga $30,000 (deducible) y GNP paga $120,000","Alicia paga $50,000 ($30,000 deducible + $20,000 coaseguro tope) y GNP paga $100,000","Alicia paga $60,000 (deducible + 20% de coaseguro sin tope) y GNP paga $90,000","Alicia paga $30,000 deducible y GNP paga el 80% del resto"],"ok": 1,"exp": "Deducible: $30,000. Coaseguro: 20% de los $120,000 restantes = $24,000, pero hay tope de $20,000 en coaseguro. Total Alicia: $30,000 + $20,000 = $50,000. GNP cubre: $100,000."},{"id": "qs3c","text": "Una GP tuvo un accidente automovilístico. ¿Aplica deducible y coaseguro?","opts": ["Sí — aplican los mismos términos que para enfermedades","No — los gastos de accidentes amparados están exentos de deducible y coaseguro","Solo aplica el deducible, no el coaseguro","Depende de si el accidente fue en México o en el extranjero"],"ok": 1,"exp": "Los gastos derivados de accidentes amparados están exentos de deducible y coaseguro. Esto es una ventaja importante del SGMM que vale la pena comunicar a las GPs."},{"id": "qs3d","text": "¿Qué es un Endoso en el contexto del SGMM?","opts": ["El documento de renovación anual del seguro","Un documento que modifica aspectos del contrato — tiene prioridad sobre las condiciones generales si hay contradicción","El comprobante de pago de la prima del seguro","La carta de cobertura que emite GNP para cada hospitalización"],"ok": 1,"exp": "El Endoso es un documento que modifica aspectos del contrato. Si hay contradicción entre el endoso y las condiciones generales, el endoso tiene prioridad. Puede incluir exclusiones específicas para un asegurado."},{"id": "qs3e","text": "Verdadero o Falso: Koltin tiene acceso al tabulador de honorarios médicos de GNP para orientar a las GPs sobre montos máximos cubiertos.","opts": ["Verdadero","Falso"],"ok": 0,"exp": "Verdadero. Koltin sí tiene acceso al tabulador de honorarios médicos de GNP. Esto permite verificar si el médico tratante cobra dentro del tabulador antes de la cirugía — si cobra más, la diferencia la asume la GP."},{"id": "qs3f","text": "¿Cuál es la diferencia entre Contratante y Asegurado en el SGMM?","opts": ["Son lo mismo — solo hay una persona involucrada en el seguro","En la membresía Koltin, el Contratante es Aplicaciones Gerontológicas (Koltin); el Asegurado es la GP","El Asegurado paga el deducible; el Contratante recibe el reembolso","El Contratante es siempre el titular de la membresía Koltin"],"ok": 1,"exp": "El Contratante es quien suscribe y administra la póliza — en este caso, Aplicaciones Gerontológicas (Koltin). El Asegurado es la Gran Persona que recibe los beneficios. Es un dato clave para manejar documentación y no confundir roles."},{"id": "qs3g","text": "Una GP fue hospitalizada por un accidente automovilístico hace 40 días y apenas va a solicitar atención por complicaciones. ¿Cómo se procesa?","opts": ["Como accidente — exento de deducible y coaseguro","Como enfermedad — aplicando deducible y coaseguro normales","No hay cobertura ya que pasó más de 30 días","Como urgencia — con tiempo de espera de 0 días"],"ok": 1,"exp": "Si la atención médica por accidente ocurre después de 30 días del suceso, los gastos se reembolsan como si fueran de una enfermedad, aplicando deducible, coaseguro y límites correspondientes. El accidente sigue cubierto, pero ya no está exento."},{"id": "qs3h","text": "¿Qué documento puede solicitar GNP cuando una factura médica tiene un concepto muy general como \"Honorarios médicos\"?","opts": ["Una segunda factura con mayor importe","Un desglose complementario o carta membretada del médico especificando los conceptos","La firma del asegurado en el documento original","Una nota de crédito del hospital"],"ok": 1,"exp": "Cuando el concepto de una factura es muy general, GNP puede solicitar un desglose complementario o carta membretada del médico donde se especifiquen los conceptos (consulta, cirugía, ayudante, etc.). Esto agiliza el reembolso."},{"id": "qs3i","text": "¿Qué 4 condiciones debe cumplir una enfermedad para estar \"amparada\" por el SGMM?","opts": ["Superar el deducible, tener médico autorizado, estar en la red hospitalaria y reportarse en 5 días","Ocurrir durante la vigencia, ser diagnosticada por médico autorizado, no estar excluida, y no ser preexistente ni congénita","Tener documentación completa, estar en México, superar el deducible y no ser estética","Ocurrir en México, estar en la red, no ser accidente y tener expediente activo"],"ok": 1,"exp": "Una enfermedad está amparada si: ocurre durante la vigencia, la diagnostica un médico autorizado, no está excluida en las condiciones generales, y no es preexistente ni congénita. Las 4 condiciones deben cumplirse."},{"id": "qs3j","text": "¿Qué es el tabulador de honorarios médicos y qué debe saber la Experta sobre él?","opts": ["Es la lista de hospitales en red donde hay pago directo — la Experta puede consultarlo","Es la tabla de montos máximos que GNP paga por procedimiento — Koltin sí tiene acceso a ella","Es el contrato entre Koltin y GNP que define la cobertura grupal","Es el documento que define el deducible y coaseguro de cada GP"],"ok": 1,"exp": "Koltin sí tiene acceso al tabulador de honorarios médicos de GNP. Esto permite verificar si el médico cobra dentro del tabulador antes de la cirugía. Si el médico cobra más, la diferencia la asume la GP."},{"id": "qs3k","text": "Una GP pagó $100,000 por una cirugía. ¿Cuánto le reembolsa GNP? (Deducible: $30,000 / Coaseguro: 20% tope $20,000)","opts": ["$100,000 — el seguro cubre el total","$70,000 — GNP cubre todo menos el deducible","$56,000 — GNP reembolsa lo que resta tras deducible y coaseguro","$44,000 — ese es el monto que paga la GP, no lo que cubre GNP"],"ok": 2,"exp": "Deducible: $30,000. Resto: $70,000. Coaseguro del 20% = $14,000 (menor al tope de $20,000). GP paga: $30,000 + $14,000 = $44,000. GNP reembolsa: $100,000 − $44,000 = $56,000. La opción '$50,000' era incorrecta."},{"id": "qs3l","text": "¿Qué ventaja tiene que un hospital esté dentro de la red hospitalaria de GNP?","opts": ["Que es el único hospital donde la GP puede ser atendida en emergencias","Que GNP liquida directamente su parte proporcional — la GP solo paga deducible y coaseguro sin adelantar todo","Que el hospital garantiza la mejor atención médica disponible","Que GNP ofrece descuentos especiales para miembros de Koltin"],"ok": 1,"exp": "En un hospital de la red, GNP liquida su parte directamente — es la modalidad de pago directo. La GP solo paga el deducible y coaseguro. Fuera de la red, la GP paga todo y después solicita reembolso."}],"subm1": [{"id": "qm1a","text": "Una GP acaba de contratar su membresía y no sabe por dónde empezar. ¿Cuál es el primer paso obligatorio?","opts": ["Agendar una consulta de seguimiento con el equipo médico","Realizar el Estudio de Longevidad — es la base de todo el acompañamiento","Descargar la app y llenar sus datos de facturación","Elegir el hospital de su preferencia dentro de la red GNP"],"ok": 1,"exp": "El EDL es el primer paso obligatorio. Sin él no pueden iniciarse las consultas de seguimiento. Es la base del acompañamiento que recibirá en Koltin."},{"id": "qm1b","text": "¿Cuántos traslados en ambulancia terrestre incluye la membresía Koltin al año?","opts": ["1 traslado","Hasta 2 traslados","Hasta 3 traslados","Ilimitados en caso de urgencia"],"ok": 1,"exp": "La membresía incluye hasta 2 traslados en ambulancia terrestre al año, al hospital más cercano dentro de la red hospitalaria. El número es 55 5809 4518, opción 1."},{"id": "qm1c","text": "¿Qué puede emitir el médico durante una consulta de seguimiento virtual?","opts": ["Solo recetas digitales — los estudios se solicitan en persona","Órdenes de estudios, recetas digitales y referencias a especialistas","Solo orientación verbal — no emiten documentos en consultas virtuales","Únicamente referencias a especialistas dentro de la red GNP"],"ok": 1,"exp": "En una consulta virtual el médico puede emitir órdenes de estudios, recetas digitales válidas en cualquier farmacia, y referencias a especialistas si el caso lo requiere."},{"id": "qm1d","text": "Una GP contrató su membresía hace 35 días y aún no ha realizado sus estudios del EDL. ¿Qué consecuencia tiene esto?","opts": ["Pierde el derecho a realizar el EDL ese año","No hay consecuencias — puede hacerlos cuando quiera","El aumento en renovaciones se define según condiciones de mercado y el funcionamiento puede verse afectado","Se le cancela automáticamente la membresía al cumplir 60 días"],"ok": 2,"exp": "La regla de los 30 días es clave: si los estudios no se realizan en ese plazo, el aumento en renovaciones se define según condiciones de mercado (no el límite del 15%) y el funcionamiento de la membresía puede verse afectado."},{"id": "qm1e","text": "¿Para qué sirven las consultas de seguimiento después del EDL?","opts": ["Son obligatorias para mantener activa la cobertura del seguro GNP","Son opcionales — solo se usan si la GP tiene una enfermedad activa","Revisar evolución, dar seguimiento al plan, resolver dudas, ajustar tratamientos y emitir documentos médicos","Reemplazar las consultas con especialistas de la red hospitalaria"],"ok": 2,"exp": "Las consultas de seguimiento tienen múltiples propósitos: revisar evolución, dar seguimiento al plan del EDL, resolver dudas, ajustar tratamientos y emitir documentos médicos (órdenes, recetas, referencias). Están incluidas en la membresía."},{"id": "qm1f","text": "¿Qué puede emitir el médico en una consulta de seguimiento que le sirva a la GP para ir al especialista?","opts": ["Una póliza de extensión de cobertura","Una referencia a especialista — válida para ser atendida fuera de Koltin","Una nota de incapacidad laboral temporal","Un alta médica que cierra el seguimiento"],"ok": 1,"exp": "Durante las consultas virtuales, el médico puede emitir referencias a especialistas si el caso lo requiere. También puede emitir órdenes de estudios y recetas digitales válidas en cualquier farmacia."},{"id": "qm1g","text": "Una GP pregunta si el seguimiento preventivo reemplaza a su médico de cabecera. ¿Qué le explicas?","opts": ["Que sí — con Koltin ya no necesita otro médico","Que las consultas son un complemento y acompañamiento, no un reemplazo de otros médicos","Que solo puede ver médicos de Koltin para mantener el beneficio del seguro","Que las videoconsultas son solo para urgencias leves"],"ok": 1,"exp": "Las consultas de seguimiento de Koltin son un complemento y acompañamiento, no un reemplazo del médico de cabecera. La GP puede y debe seguir con sus médicos habituales."},{"id": "qm1h","text": "¿A qué especialidades médicas tiene acceso la GP en las consultas de seguimiento virtuales incluidas en la membresía?","opts": ["Cardiología, neurología y oncología — las de mayor demanda","Medicina general (50-74 años), Geriatría (75+) y Nutrición — sin tope anual","Cualquier especialidad médica según disponibilidad del día","Solo medicina general — las demás requieren cita presencial en clínica"],"ok": 1,"exp": "Las consultas virtuales de seguimiento incluyen 3 especialidades: Medicina general (50-74 años), Geriatría (75 años en adelante) y Nutrición (cualquier edad, con referencia interna). No tienen tope anual — se otorgan las que sean necesarias según indicación médica."}],"subm2": [{"id": "qm2a","text": "¿Cuántos años de experiencia en el mercado asegurador mexicano tiene GNP, la aseguradora que respalda el SGMM de Koltin?","opts": ["Más de 30 años","Más de 50 años","Más de 100 años","Fue fundada hace menos de 20 años"],"ok": 2,"exp": "GNP Seguros tiene más de 100 años de experiencia en el mercado asegurador mexicano — uno de los respaldos más sólidos que una aseguradora puede tener. Este es uno de los argumentos de confianza que las Expertas pueden usar al presentar el seguro a las GPs."},{"id": "qm2b","text": "¿Qué significa \"Grandes Personas\" en el contexto de Koltin?","opts": ["Es el nombre del plan premium de la membresía","Es como Koltin llama a sus médicos especialistas","Es como Koltin llama a sus miembros — personas mayores con grandeza, sabiduría y experiencia","Es un programa de reconocimiento para los miembros más antiguos"],"ok": 2,"exp": "\"Grandes Personas\" es la forma en que Koltin se refiere a sus miembros. En México \"persona grande\" alude a alguien de edad avanzada, pero Koltin lo resignifica: gente con grandeza, sabiduría y experiencia, más que números y evaluaciones de riesgo."},{"id": "qm2c","text": "¿Cuáles son los 3 pilares de la propuesta de valor de Koltin?","opts": ["Salud, Bienestar y Seguridad","Prevención, Seguros y Comunidad","Medicina, Tecnología y Compañía","Expediente, Consultas y Red Hospitalaria"],"ok": 1,"exp": "La pirámide de valor de Koltin tiene 3 pilares: Prevención (base) → Seguros → Comunidad. Esta estructura conecta los beneficios con las necesidades y deseos de las Grandes Personas."},{"id": "qm2d","text": "¿Quién emite y opera los certificados de póliza del Seguro de Gastos Médicos Mayores que incluye la membresía Koltin?","opts": ["Koltin directamente, sin intermediarios","GNP, parte del Grupo GNP","GNP, a través de un contrato con Koltin","La CNSF supervisa y emite las pólizas"],"ok": 1,"exp": "GNP emite y opera los certificados de póliza. Koltin \"empaca\" ese seguro dentro de la Membresía de Salud. GNP no comercializa este producto directamente al público."},{"id": "qm2e","text": "¿Cuál es la diferencia fundamental entre Koltin y un seguro médico tradicional?","opts": ["Koltin es más barato porque no cubre cirugías mayores","Koltin se enfoca solo en adultos mayores de 70 años","Koltin combina prevención activa, acompañamiento continuo y protección — no solo actúa cuando la GP se enferma","Koltin ofrece el mismo producto que los seguros tradicionales pero con mejor servicio"],"ok": 2,"exp": "A diferencia de un seguro tradicional, Koltin actúa antes de que la GP se enferme: la conoce con el EDL, la acompaña con consultas, la protege con el seguro y la conecta con la comunidad. Su misión es \"proteger a quienes otros no se atreven\" de forma proactiva e integral."},{"id": "qm2f","text": "Una GP pregunta si puede contratar la membresía para su mamá de 80 años. ¿Qué le dices?","opts": ["Que no — la membresía solo es para la persona que paga","Que sí — la GP puede ser el Contratante y su mamá la Asegurada, siempre que tenga hasta 84 años y 11 meses","Que depende del estado de salud de su mamá — necesita pasar un examen médico","Que solo puede hacerlo si la mamá también contrata su propia membresía"],"ok": 1,"exp": "Sí puede. En Koltin, la persona que contrata (Contratante) puede ser distinta del beneficiario (Asegurado). La membresía puede contratarse para un familiar, siempre dentro del rango de edad de la póliza (hasta 84 años y 11 meses)."},{"id": "qm2g","text": "Si una GP deja de pagar su membresía por 2 meses, ¿qué pasa con sus beneficios?","opts": ["Mantiene el acceso a los beneficios preventivos pero pierde el seguro","Todos los beneficios quedan suspendidos — la membresía requiere pagos al día","Solo pierde acceso a la Comunidad pero mantiene el seguro vigente","Tiene un periodo de gracia de 90 días antes de perder beneficios"],"ok": 1,"exp": "La membresía está vigente siempre que los pagos estén al día. Si hay un adeudo, todos los beneficios quedan suspendidos — incluyendo el seguro. Es fundamental que las GPs mantengan sus pagos vigentes."},{"id": "qm2h","text": "¿Cuál de las siguientes afirmaciones describe mejor la misión de Koltin?","opts": ["Ser la red hospitalaria más grande para adultos mayores en México","Convertirnos en la plataforma de salud integral más relevante para personas de 50+ años","Ofrecer el seguro médico más barato disponible en México para adultos mayores","Reemplazar la atención médica tradicional con soluciones digitales"],"ok": 1,"exp": "La misión de Koltin es convertirse en la plataforma de salud integral más relevante para personas de 50 a más años, poniendo énfasis especial en las dimensiones financiera, física, intelectual, emocional y social de la salud."}],"subm3": [{"id": "qm3a","text": "¿Cuáles de los siguientes formatos están disponibles en la Comunidad Digital de Koltin?","opts": ["Solo clases grabadas en YouTube","Clases en vivo, masterclasses, contenido on demand y micro learnings","Solo eventos presenciales en CDMX","Únicamente talleres con cupo limitado para miembros seleccionados"],"ok": 1,"exp": "La Comunidad Digital incluye: clases en vivo (FB y YouTube Live), masterclasses con expertos, contenido on demand y micro learnings — cápsulas cortas. Todo disponible para miembros en cualquier parte de México."},{"id": "qm3b","text": "Una GP de Monterrey pregunta si puede asistir a las clases presenciales de Koltin. ¿Qué le dices?","opts": ["Que sí — hay espacios presenciales en CDMX, Monterrey y Guadalajara","Que por ahora la comunidad presencial solo está disponible en CDMX, aunque Koltin sigue creciendo","Que las clases presenciales no existen — todo es digital","Que puede asistir si viaja a CDMX, pero debe pagar un costo adicional"],"ok": 0,"exp": "Koltin ya cuenta con clases presenciales en CDMX, Monterrey y Guadalajara. La GP de Monterrey puede asistir a las clases presenciales en su ciudad."},{"id": "qm3c","text": "¿Con cuánto tiempo de anticipación llegan las invitaciones a eventos de Koltin?","opts": ["1 semana antes","2 semanas antes","3 días antes","El mismo día del evento"],"ok": 1,"exp": "Las invitaciones a eventos llegan 2 semanas antes. Como algunos tienen cupo limitado, es importante que las GPs aparten su lugar en cuanto reciban la invitación."},{"id": "qm3d","text": "¿Por qué es importante la Comunidad dentro de la propuesta de valor de Koltin?","opts": ["Porque genera ingresos adicionales para financiar el seguro GNP","Porque es obligatoria para activar las consultas de seguimiento","Porque la dimensión social es clave para la salud integral — la conexión y el sentido de pertenencia son parte del bienestar","Porque permite que los miembros accedan a descuentos en farmacias aliadas"],"ok": 2,"exp": "La salud integral según la OMS — y según Koltin — incluye la dimensión social. Para adultos mayores, el sentido de pertenencia, el aprendizaje continuo y la conexión con otros son fundamentales para el bienestar. La Comunidad atiende esa dimensión."},{"id": "qm3e","text": "¿Qué tipo de experiencias forman parte de los eventos y encuentros de la Comunidad Koltin?","opts": ["Solo actividades deportivas y de movimiento","Exposiciones de arte, conversatorios, visitas guiadas a museos y eventos especiales","Únicamente talleres de salud y bienestar físico","Clases de tecnología y uso de dispositivos digitales"],"ok": 1,"exp": "Los eventos y encuentros de la Comunidad incluyen: exposiciones de arte y cultura, conversatorios con expertos, visitas guiadas a museos y eventos especiales. Son experiencias culturales y sociales para conectar miembros entre sí."},{"id": "qm3f","text": "¿Cuándo se recomienda a las GPs apartar su lugar en un evento de la Comunidad Koltin?","opts": ["El mismo día del evento para asegurarse de que se realizará","Con al menos una semana de anticipación","En cuanto reciban la invitación — que llega 2 semanas antes — ya que algunos eventos tienen cupo limitado","Solo si ya fueron a un evento anterior y les gustó"],"ok": 2,"exp": "Las invitaciones llegan 2 semanas antes y algunos eventos tienen cupo limitado. Se recomienda apartar el lugar en cuanto llegue la invitación para no quedarse sin espacio."},{"id": "qm3g","text": "¿Cuál de los formatos de la Comunidad Digital está disponible para ver cuando la GP quiera, sin horario fijo?","opts": ["Las clases en vivo por YouTube","Los conversatorios con expertos","El contenido on demand","Las masterclasses en tiempo real"],"ok": 2,"exp": "El contenido on demand es el único formato sin horario fijo — la GP puede acceder cuando quiera. Las clases en vivo y masterclasses en tiempo real tienen un horario específico."},{"id": "qm3h","text": "Una GP de Monterrey quiere asistir a clases en Casa Koltin. ¿Qué le explicas?","opts": ["Que puede ir cualquier día de lunes a viernes con previa reservación","Que Koltin ya tiene clases presenciales en CDMX, Monterrey y Guadalajara — puede inscribirse en la sede de Monterrey","Que puede acceder de forma virtual a las mismas clases de Casa Koltin","Que necesita pagar un costo adicional para acceder a las instalaciones de CDMX"],"ok": 1,"exp": "Koltin ya tiene comunidad presencial en CDMX, Monterrey y Guadalajara. La GP de Monterrey puede inscribirse directamente en su sede."}],"suba1": [{"id": "qa1a","text": "Una GP te da su código de verificación de 6 dígitos de WhatsApp sin que tú se lo hayas pedido. ¿Qué haces?","opts": ["Lo anoto por si lo necesito más adelante para verificar","Lo uso solo esta vez ya que ella lo compartió voluntariamente","Le agradezco y lo uso para confirmar que es la titular de la cuenta","Le digo que no te lo diga y le pido que solicite un código nuevo"],"ok": 3,"exp": "El código OTP es la llave de la cuenta — quien lo tiene, entra. Koltin NUNCA lo pide. Si la GP lo comparte voluntariamente, debes decirle que no lo comparta y pedirle uno nuevo."},{"id": "qa1b","text": "¿Cuáles son las 3 secciones de la app Koltin?","opts": ["Salud, Expediente y Membresía","Inicio, Salud y Emergencia","Salud y Expediente, Emergencia y Membresía","Expediente, Estudios y Consulta"],"ok": 2,"exp": "La app tiene 3 secciones: Salud y Expediente (EDL, expediente, estudios), Emergencia (asistencia 24/7) y Membresía (credencial, pagos, documentos)."},{"id": "qa1c","text": "Una GP te dice: \"quiero descargar mi Plan de Longevidad desde la app\". ¿Cuál es la respuesta correcta?","opts": ["El Plan de Longevidad todavía no existe — lo que puede descargar hoy es el Reporte de Longevidad","Se descarga en Membresía → Documentos → Plan de Longevidad","Necesita actualizar la app a la última versión para poder verlo","Se solicita directamente con el médico en la cita de resultados"],"ok": 0,"exp": "El Plan de Longevidad todavía NO existe en la app. Si prometes algo que no existe, generas un reclamo. Lo que sí existe y se puede descargar es el Reporte de Longevidad."},{"id": "qa1d","text": "¿Para qué eventos envía la app Koltin notificaciones push?","opts": ["Para pagos, recordatorios y resultados del EDL","Para todos los eventos importantes de la membresía","Solo para la consulta de resultados del EDL","Para recordatorios de estudios y vencimiento de membresía"],"ok": 2,"exp": "Las notificaciones push SOLO existen para la consulta de resultados del EDL. Para todo lo demás, todavía no se avisa por push."},{"id": "qa1e","text": "Una GP toca el botón \"Tengo una emergencia\" en la app. ¿Qué ocurre exactamente?","opts": ["Se abre un chat de WhatsApp con el equipo de asistencia","Solo muestra el número — la GP debe buscarlo y marcarlo manualmente desde su app de teléfono","Se envía una alerta automática a su contacto de emergencia registrado","La app hace una llamada telefónica directa a la línea de asistencia 24/7"],"ok": 3,"exp": "El botón inicia una llamada telefónica directa a la línea de asistencia 24/7. En algunos teléfonos puede aparecer una pantalla de confirmación de iOS con el número y el botón 'Llamar' — la GP solo confirma y ya, no tiene que buscar ni marcar manualmente el número. No abre WhatsApp ni chat."},{"id": "qa1f","text": "¿En qué momento debe usar la GP el botón \"Tengo una emergencia\" en la app?","opts": ["Cuando quiere agendar su EDL","Cuando tiene dudas sobre su membresía","Cuando tiene una urgencia médica y necesita contacto inmediato","Cuando olvidó su contraseña y necesita un código nuevo"],"ok": 2,"exp": "El botón de emergencia es exclusivo para urgencias médicas — hace una llamada directa 24/7. No es para agendar, recuperar contraseña ni resolver dudas sobre la membresía."},{"id": "qa1g","text": "Una GP dice que quiere eliminar su cuenta de la app. ¿Qué le explicas?","opts": ["Que no es posible eliminar cuentas","Que puede hacerlo en Configuración → Cuenta → Eliminar","Que eliminar la cuenta solo desactiva el acceso a la app — el expediente, membresía y datos permanecen","Que debe llamar a Koltin para que el equipo lo haga"],"ok": 2,"exp": "Eliminar la cuenta en la app solo desactiva el acceso digital — no cancela la membresía ni borra el expediente. Es importante aclarárselo para que la GP no piense que está cancelando todo."},{"id": "qa1h","text": "¿Para qué sirve la credencial digital en la sección Membresía de la app?","opts": ["Para ingresar a la app en lugar de la contraseña","Para identificarse como miembro activo de Koltin y acceder a beneficios","Para autorizar procedimientos médicos directamente con GNP","Para demostrar que realizó el EDL"],"ok": 1,"exp": "La credencial digital identifica a la GP como miembro activo de Koltin. Puede ocultarse momentáneamente, pero al cerrar y abrir la app vuelve a ser visible — es el comportamiento esperado."},{"id": "qa1i","text": "Una GP pregunta por qué no ve el Plan de Longevidad en su app. ¿Qué le dices?","opts": ["Que debe actualizar la app a la versión más reciente","Que aparece en la sección de Membresía, no en Salud","Que el Plan de Longevidad todavía no está disponible en la app","Que debe ir a la sección de Emergencia para encontrarlo"],"ok": 2,"exp": "El Plan de Longevidad es una función que todavía NO está disponible en la app. Conocer las limitaciones actuales es fundamental para no generar expectativas incorrectas con las GPs."},{"id": "qa1j","text": "Una GP cambió de número de teléfono y ya no puede entrar a la app. ¿Qué le dices?","opts": ["Que descargue la app de nuevo — eso actualiza el número automáticamente","Que el número de registro en la app viene de Sales: hay que actualizarlo ahí para que el OTP llegue al número nuevo","Que use su correo electrónico como método alternativo de entrada","Que restablezca su contraseña desde la opción '¿Olvidaste tu contraseña?'"],"ok": 1,"exp": "El número registrado en la app es el que está en Sales al momento de contratar. Si la GP cambió de número, hay que actualizarlo en Sales para que el OTP llegue al número correcto. No hay contraseña ni correo de acceso — el único método de entrada es número + OTP (o biometría si ya la activó)."}],"suba2": [{"id": "qa2a","text": "Una GP dice \"ya no me sale la pantalla bonita de bienvenida desde que volví a entrar\". ¿Qué le explicas?","opts": ["Que debe reinstalar la app para que vuelva a aparecer","Que cerrar sesión y volver a entrar la reactiva","Que esa pantalla solo aparece una vez en el primer acceso — es el comportamiento correcto","Que la pantalla tarda hasta 24 horas en aparecer si la cuenta es nueva"],"ok": 2,"exp": "La pantalla de bienvenida solo aparece una vez, en el primer acceso. Si ya no le sale, todo está funcionando correctamente."},{"id": "qa2b","text": "¿En cuántas secciones está dividido el expediente médico de la app?","opts": ["5 secciones","7 secciones","9 secciones","12 secciones"],"ok": 2,"exp": "El expediente está dividido en 9 secciones agrupadas en: Sobre ti, Salud y bienestar, Condiciones de salud y Medicamentos y suplementos."},{"id": "qa2c","text": "Una GP salió del expediente al 60% porque tuvo que atender algo. Ahora cree que perdió todo. ¿Qué le dices?","opts": ["Que lamentablemente debe empezar desde el principio si cerró la app","Que el avance se guarda automáticamente — puede continuar exactamente donde se quedó","Que se guardó solo si tocó el botón Guardar antes de salir","Que depende de si cerró la app completamente o solo la mandó al fondo"],"ok": 1,"exp": "El avance del expediente SIEMPRE se guarda, sin importar cómo salió. Puede volver días después y arranca donde se quedó. Díselo proactivamente — mucha gente no llena el expediente por miedo a hacerlo de un jalón."},{"id": "qa2d","text": "¿Cuándo se desbloquea la sección de estudios de laboratorio para una GP?","opts": ["Cuando descarga y abre la app por primera vez","Cuando acepta los términos y condiciones en el primer acceso","Cuando el equipo médico de Koltin la da de alta en el sistema","Cuando envía su expediente médico completo"],"ok": 3,"exp": "Los estudios se desbloquean cuando el expediente está enviado. Si dice \"le doy a estudios y no pasa nada\", casi siempre el expediente no está completo. No es una falla."},{"id": "qa2e","text": "De los 3 estudios del EDL, ¿cuál puede realizarse sin cita previa?","opts": ["Estudios de laboratorio en sucursales Chopo","Electrocardiograma en clínicas Koltin","Densitometría ósea","Los 3 estudios requieren cita"],"ok": 0,"exp": "Los estudios de laboratorio están disponibles sin cita en todas las sucursales del Chopo. El electrocardiograma y la densitometría requieren cita por llamada o WhatsApp."},{"id": "qa2f","text": "¿Qué ocurre con el avance del expediente médico si la GP sale de la app a la mitad sin terminarlo?","opts": ["Se pierde todo — debe empezar desde cero al volver a entrar","Se guarda solo si tocó el botón Guardar antes de salir","El avance se guarda automáticamente — puede continuar donde se quedó días después","Solo se guarda si tiene conexión a internet al momento de cerrar"],"ok": 2,"exp": "El avance del expediente siempre se guarda automáticamente. La GP puede cerrar la app en cualquier momento y volver días después — arranca exactamente donde se quedó. Es uno de los datos más importantes para comunicarle proactivamente y quitar el miedo a hacerlo de un jalón."},{"id": "qa2g","text": "Un expediente lleva 3 días al 97% y la GP no puede enviarlo. ¿Qué haces?","opts": ["Decirle que espere 24 horas más","Pedirle que vuelva a llenar el expediente desde cero","Generar ticket para Roxana y cerrar el expediente desde el portal web para destrabar la app","Decirle que borre la app y la reinstale"],"ok": 2,"exp": "Un expediente atascado al 97-98% es un caso conocido. Se genera ticket para Roxana Y se cierra desde el portal web — eso destraba la app. No es un problema que la GP pueda resolver sola."},{"id": "qa2h","text": "¿Cuándo se desbloquean las órdenes de estudios en la app?","opts": ["Al crear la cuenta","Solo cuando el expediente médico ha sido enviado completamente","Al pagar la primera mensualidad","Cuando el médico las autoriza en consulta"],"ok": 1,"exp": "Las órdenes se desbloquean solo cuando el expediente está completamente enviado. Sin el expediente al 100%, el agendamiento y las órdenes no están disponibles."},{"id": "qa2i","text": "¿Con qué número se registra la GP en la app de Koltin?","opts": ["Con cualquier número activo, independientemente de lo que esté en Sales","Con el número de WhatsApp registrado en Sales al contratar — puede ser el suyo o el de un familiar","Con el número del titular de la cuenta bancaria","Con el número que elija en el momento, sin importar cuál tiene en Sales"],"ok": 1,"exp": "La app usa el número de WhatsApp registrado en Sales. Ese número puede ser el propio de la GP o el de un familiar (hijo, sobrino, cuidador) si así quedó registrado al contratar. Si la GP intenta entrar con un número diferente al que está en Sales, el OTP no llegará al teléfono correcto. Siempre confirma cuál es el número en Sales antes de dar soporte."},{"id": "qa2j","text": "Una GP acepta Face ID al entrar a la app. ¿Puede después entrar con código OTP?","opts": ["No — una vez activado el Face ID es obligatorio","Sí — puede elegir entre biometría o código OTP en cada acceso","Solo en iPhone — en Android siempre es por código","Depende de la versión de la app que tenga instalada"],"ok": 1,"exp": "La biometría es opcional. Si la acepta, puede usarla en accesos posteriores. Si prefiere el código, siempre funciona. Para adultos mayores con huella difícil de leer, el código es la alternativa confiable."}],"suba3": [{"id": "qa3a","text": "Una GP llama asustada: \"eliminé mi cuenta en la app, ¿cancelé mi membresía?\". ¿Qué le dices?","opts": ["Que no — la cuenta queda desactivada pero la membresía, expediente y pagos siguen intactos","Que sí, lamentablemente debe llamar a ventas para reactivar su membresía","Que sus datos del expediente se borraron pero la membresía sigue vigente","Que debe crear una cuenta nueva porque la anterior ya no existe"],"ok": 0,"exp": "Eliminar la cuenta en la app NO cancela la membresía, NO borra el expediente y NO borra la información financiera. Solo desactiva el acceso. Si vuelve a entrar, se reactiva automáticamente."},{"id": "qa3b","text": "¿Cuántas veces puede reagendar o cancelar su consulta EDL una GP desde la app?","opts": ["Sin límite — puede modificarla cuantas veces necesite","Solo 1 vez por ciclo","Hasta 5 veces","Hasta 3 veces"],"ok": 3,"exp": "La app le dice a la GP que puede reagendar o cancelar hasta 3 veces. Al reagendar puede cambiar modalidad, fecha y horario."},{"id": "qa3c","text": "Una GP de Guadalajara quiere agendar su consulta EDL de forma presencial. ¿Qué le explicas?","opts": ["Que puede ir a cualquier clínica Koltin — hay en CDMX, Monterrey y Guadalajara","Que la modalidad presencial solo aparece en CDMX y Monterrey — a ella solo le sale virtual","Que primero debe agendar por teléfono y luego confirmar en la app","Que puede ir presencial si viaja a CDMX, pero debe agendar con mínimo 15 días de anticipación"],"ok": 1,"exp": "La modalidad presencial solo aparece para GPs de CDMX y Monterrey. Las GPs de otras ciudades (como Guadalajara) solo ven la opción virtual."},{"id": "qa3d","text": "El Paso 3 (Agendamiento EDL) no le aparece a una GP en la sección Salud. ¿Qué revisas primero?","opts": ["Si la app está actualizada a la versión más reciente","Si su membresía está vigente y sin adeudos pendientes","Si ya completó y envió el expediente y si ya tiene sus estudios realizados","Si tiene conexión estable a internet al momento de abrir la app"],"ok": 2,"exp": "El Paso 3 se desbloquea solo cuando se completaron el Paso 1 (expediente enviado) y el Paso 2 (estudios realizados). Si no le aparece, revisa el estado de esos pasos primero."},{"id": "qa3e","text": "Una GP dice que \"su credencial desapareció de la app\". ¿Cuál es la causa más probable?","opts": ["La usó en otro dispositivo y eso la desactivó en este","Casi seguro la ocultó con el botón de ocultar/mostrar — pídele que lo toque de nuevo","La membresía tiene un adeudo pendiente que bloqueó la credencial","La app necesita actualización para mostrar la credencial correctamente"],"ok": 1,"exp": "La credencial tiene un control ocultar/mostrar. Si la GP lo tocó y cerró la app, al volver la credencial aparece de nuevo — el estado de ocultar no se guarda entre sesiones. Casi siempre esto resuelve el \"problema\"."},{"id": "qa3f","text": "Una GP quiere reagendar su cita del EDL por tercera vez. ¿Puede hacerlo?","opts": ["No — solo se permiten 2 reagendamientos","Sí — puede reagendar hasta 3 veces y cambiar modalidad, fecha y horario","Solo si lo solicita con 48 horas de anticipación","Depende de si es presencial o virtual"],"ok": 1,"exp": "La GP puede reagendar hasta 3 veces y puede cambiar modalidad, fecha y horario. En la tercera reagendación vale la pena verificar si hay algún obstáculo que le impide asistir."},{"id": "qa3g","text": "¿Qué debe tener completado una GP para poder agendar su EDL desde la app?","opts": ["Solo la app instalada","El expediente médico enviado Y los estudios de laboratorio realizados","El expediente al 50% es suficiente","Solo haber firmado los términos y condiciones"],"ok": 1,"exp": "Para agendar el EDL desde la app se necesitan ambas cosas: expediente completamente enviado Y estudios de laboratorio ya realizados. Sin los dos pasos, el agendamiento no está disponible."},{"id": "qa3h","text": "Una GP de Puebla quiere hacer su EDL. ¿Qué modalidad le corresponde?","opts": ["Presencial en la sede más cercana","Virtual desde cualquier lugar","Foráneos — videoconsulta para la entrega de resultados del EDL","El EDL solo está disponible en CDMX y Monterrey"],"ok": 2,"exp": "Las GPs fuera de CDMX y Monterrey son \"foráneos\" — su modalidad es videoconsulta para la entrega de resultados. No hay sedes presenciales en otras ciudades por ahora."},{"id": "qa3i","text": "Una GP no encuentra su credencial digital en la app aunque la había visto antes. ¿Cuál es la causa más probable?","opts": ["La membresía tiene un adeudo y la credencial se oculta automáticamente","La ocultó con el control ocultar/mostrar — ese estado no persiste entre sesiones, pídele que lo toque de nuevo","La app necesita actualización para mostrar correctamente la credencial","Debe cerrar sesión y volver a entrar para que aparezca"],"ok": 1,"exp": "La credencial tiene un control ocultar/mostrar. El estado de oculta NO se guarda entre sesiones — al abrir la app de nuevo la credencial siempre aparece visible. Pídele que toque el control y listo."},{"id": "qa3j","text": "Una GP reporta que su credencial aparece aunque la ocultó antes de cerrar la app. ¿Es un error?","opts": ["Sí — debe reportarlo al equipo técnico","No — ocultar la credencial no se guarda entre sesiones, es el comportamiento esperado","Solo pasa en versiones antiguas de la app","Es un error de sincronización con el servidor de membresías"],"ok": 1,"exp": "No es un error. Ocultar la credencial es temporal — no persiste entre sesiones. Al volver a abrir la app, la credencial vuelve a ser visible. Así hay que explicárselo a la GP."}],"suba4": [{"id": "qa4a","text": "\"La app no carga nada.\" ¿Cuál es tu primer paso antes de cualquier otra acción?","opts": ["Guiarla a revisar su conexión a internet — modo avión, WiFi o datos","Pedirle que desinstale y reinstale la app","Escalar de inmediato a tmp-lanzamiento-app en Slack","Pedirle que cierre sesión, espere 5 minutos y vuelva a entrar"],"ok": 0,"exp": "Lo primero siempre es la conexión. Modo avión, WiFi caído o datos apagados resuelven la mayoría de estos casos. Si ya verificó y sigue sin cargar, entonces escala."},{"id": "qa4b","text": "¿Cuál de estos datos NUNCA debes incluir en un ticket de escalamiento?","opts": ["El número de membresía de la GP","La versión de la app y el tipo de teléfono","El código de verificación OTP de la GP","La pantalla exacta donde ocurrió el problema"],"ok": 2,"exp": "Nunca pongas en un ticket el código OTP, datos de tarjeta ni el contenido de las respuestas del expediente. El OTP es la llave de la cuenta."},{"id": "qa4c","text": "Un expediente aparece al 100% completado pero la app no le deja cerrarlo ni enviarlo. ¿Qué haces?","opts": ["Pedirle que desinstale y reinstale la app, eso actualiza el avance","Mandas el caso a Roxana y le explicas que cerrar el expediente desde el portal web puede desatrancar la app","Pedirle que conteste de nuevo desde la sección que quedó incompleta","Esperar 48 horas para que el sistema procese automáticamente"],"ok": 1,"exp": "Cuando el expediente está al 100% en Sales pero la app no deja cerrarlo, es el problema conocido de cierre. Manda el caso a Roxana Y cierra el expediente desde el portal web — eso destraba la app. La GP no necesita volver a llenar nada. Nota: si está al 97-98%, primero revisa en Sales qué sección podría estar incompleta."},{"id": "qa4d","text": "Una GP con Android dice que su huella ya no le funciona para entrar a la app. ¿Qué le dices?","opts": ["Que puede entrar con su código OTP — las huellas se desgastan con la edad y es muy común","Que debe ir a una tienda de su operadora para calibrar el sensor de huella","Que hay un bug en la versión de Android — vas a escalarlo","Que active Face ID como alternativa"],"ok": 0,"exp": "Las huellas se desgastan con la edad — es muy común en adultos mayores. Siempre pueden entrar con su código OTP. Nunca lo presentes como un fallo de la persona."},{"id": "qa4e","text": "Una GP dice: \"puse mal el código varias veces y ya no me deja entrar\". ¿Qué le explicas?","opts": ["Que debes escalar urgente porque es un bug de seguridad","Que su cuenta fue bloqueada permanentemente y debe llamar a soporte","Que llegó a la pantalla de Acceso pausado por seguridad — es una protección, no una falla","Que debe desinstalar la app y volver a registrarse con otro número"],"ok": 2,"exp": "\"Acceso pausado por seguridad\" es una protección del sistema, no una falla. El acceso se restablece automáticamente después de un tiempo."},{"id": "qa4f","text": "Una GP dice que la app \"se congela\" en el paso 3 del expediente. ¿Cuál es tu primer paso?","opts": ["Decirle que reinstale la app","Pedirle que describa exactamente la pantalla y la acción que hizo antes de que se congelara","Escalar a soporte sin más preguntas","Decirle que espere 24 horas"],"ok": 1,"exp": "Antes de escalar, necesitas entender el problema. Pedir la descripción exacta de la pantalla y la acción previa te da la información que el ticket de soporte necesita para resolver rápido."},{"id": "qa4g","text": "¿Qué información debe incluir siempre un ticket de soporte de la app?","opts": ["Solo nombre y correo de la GP","Número de membresía, teléfono o versión de app, y descripción exacta del error o pantalla","Nombre, edad y si tiene iPhone o Android","Solo una captura de pantalla"],"ok": 1,"exp": "Un buen ticket siempre incluye: número de membresía, teléfono o versión de app, y descripción exacta del error. Sin esa información, soporte no puede reproducir ni resolver el problema eficientemente."},{"id": "qa4h","text": "¿En cuál de estas situaciones debes escalar inmediatamente sin intentar resolver tú?","opts": ["La GP lleva más de 10 minutos en espera","El problema está relacionado con un cobro, es un caso conocido o está fuera de tu guión","La GP está enojada y no quiere escuchar","La app tiene una interfaz diferente a la que conoces"],"ok": 1,"exp": "Escala inmediatamente cuando: el problema involucra un cobro (nunca lo manejes tú), es un problema conocido con solución documentada, o está completamente fuera de tu guión. En otros casos, primero intenta los pasos básicos."},{"id": "qa4i","text": "Una GP mayor dice que la huella digital nunca le funciona bien. ¿Qué le recomiendas?","opts": ["Que pruebe con todos los dedos hasta que uno funcione","Que entre siempre con el código OTP — es igual de seguro y más confiable para ella","Que actualice la app porque las nuevas versiones leen mejor","Que llame a soporte para que activen acceso especial"],"ok": 1,"exp": "El código OTP es igual de seguro que la huella y siempre funciona. Es la solución más práctica para adultos mayores con huella difícil de leer — no hay que escalar ni buscar configuraciones especiales."},{"id": "qa4j","text": "Una GP no recibe el OTP y ya confirmaste que tiene WhatsApp con internet. ¿Qué verificas a continuación?","opts": ["Que el número de WhatsApp en el sistema coincida con el número actual de la GP","Que tenga la versión más reciente de WhatsApp instalada","Que no tenga otra app abierta al mismo tiempo","Que su teléfono no esté en modo avión"],"ok": 0,"exp": "El caso más común cuando hay internet pero no llega el OTP es que el número en el sistema no coincide con el WhatsApp actual. Verificar y actualizar el número resuelve la mayoría de los casos antes de escalar."}],"subx1": [{"id": "qx1a","text": "¿Cuál es el papel de un Expertx en Koltin además de resolver problemas directamente?","opts": ["Supervisar el trabajo de otros equipos de la empresa","Diseñar los productos de salud de la membresía","Ser el representante del cliente dentro de Koltin, alimentando la estrategia con su experiencia","Gestionar la agenda médica de las GPs"],"ok": 2,"exp": "Los Expertxs son los representantes de los clientes dentro de Koltin. Su experiencia y perspectivas alimentan la estrategia, garantizando que las Grandes Personas estén al centro de todo."},{"id": "qx1b","text": "¿Cuál de las siguientes actitudes es CONTRARIA al perfil de un Expertx en Koltin?","opts": ["Esperar que alguien le indique cómo resolver cada situación antes de actuar","Tomar decisiones con agilidad cuando la GP lo necesita","Estar en constante aprendizaje de sí mismo y de otros equipos","Conectar los beneficios de la membresía con la necesidad real de cada GP"],"ok": 0,"exp": "Los Expertxs son proactivos y toman decisiones con criterio. Esperar instrucciones para resolver cada cosa es lo opuesto al perfil: los que solo ejecutan son fáciles de reemplazar."},{"id": "qx1c","text": "Verdadero o Falso: Los Expertxs deben enfocarse únicamente en el área de atención al cliente y no involucrarse en otras áreas.","opts": ["Verdadero","Falso"],"ok": 1,"exp": "Falso. Los Expertxs son agentes de cambio que se integran en diversas áreas para asegurar comunicación constante y efectiva. No están confinados a un solo departamento."},{"id": "qx1d","text": "¿Por qué es esencial el servicio humano en Koltin según la definición del equipo Expertxs?","opts": ["Porque las herramientas digitales todavía no son confiables para la atención en salud","Porque reduce costos operativos frente a la automatización","Porque la capacidad de conectar, comprender y acompañar no puede reemplazarla ningún sistema","Porque las GPs prefieren no usar tecnología digital"],"ok": 2,"exp": "En la era de la automatización, lo que diferencia a Koltin es la parte humana: la capacidad de conectar, comprender y acompañar a las GPs. Eso nace de cada Expertx y ningún sistema puede replicarlo."},{"id": "qx1e","text": "¿Qué combinación define el modelo de atención de Koltin?","opts": ["Automatización total con revisión humana ocasional","Atención médica especializada con seguimiento administrativo","Innovación digital con servicio cálido y personalizado","Protocolo estricto de guiones con escalamiento estructurado"],"ok": 2,"exp": "Koltin combina innovación digital con un servicio cálido y personalizado. Esta combinación es la base del enfoque que desafía el estatus quo del servicio al cliente convencional."},{"id": "qx1f","text": "¿Cuál es la diferencia clave entre un Expertx y un agente de servicio al cliente tradicional?","opts": ["El Expertx trabaja exclusivamente con adultos mayores de 80 años","El Expertx solo atiende llamadas, no WhatsApp","El Expertx representa y defiende a la GP dentro de Koltin — no solo resuelve tickets","El Expertx tiene acceso a funciones médicas del sistema"],"ok": 2,"exp": "El Expertx es la voz de la GP dentro de Koltin. No solo resuelve problemas — defiende sus intereses, señala mejoras y genera confianza. Eso lo diferencia de un agente transaccional."},{"id": "qx1g","text": "¿Cuáles son las 5 dimensiones de la salud integral en las que Koltin pone especial énfasis?","opts": ["Financiera, física, intelectual, emocional y social","Física, mental, espiritual, vocacional y ambiental","Médica, preventiva, reactiva, comunitaria y digital","Solo física y emocional — las más relevantes para adultos mayores"],"ok": 0,"exp": "Koltin pone énfasis especial en 5 dimensiones: financiera, física, intelectual, emocional y social. La salud no es solo ausencia de enfermedad — es bienestar completo en múltiples dimensiones."},{"id": "qx1h","text": "Una GP agradece mucho tu atención pero no queda satisfecha con la solución. ¿Qué haces?","opts": ["La cierras como resuelta — fue cordial y eso cuenta","Escuchas qué faltó, buscas una solución real y haces seguimiento hasta que quede satisfecha","Le explicas que hiciste todo lo posible y cierras el caso","La transfieres a otro equipo para no comprometerte con algo que no puedes cumplir"],"ok": 1,"exp": "El trabajo de la Experta no termina cuando la GP agradece — termina cuando el problema está realmente resuelto. Escuchar qué faltó y hacer seguimiento es parte del compromiso con la experiencia de las GPs."}],"subx2": [{"id": "qx2a","text": "Tienes un problema con un compañerx del equipo. Según el Manifiesto, ¿qué es lo primero que debes hacer?","opts": ["Hablar directamente con esa persona antes de comentarlo con alguien más","Documentar el problema por escrito y enviarlo al líder","Comentarlo con otro compañerx de confianza para obtener perspectiva","Esperar a la siguiente reunión de equipo para abordarlo formalmente"],"ok": 0,"exp": "El principio 1 dice: habla con esa persona antes de comentarlo con alguien más. Los conflictos no resueltos se acumulan y dañan al equipo. Ir de frente requiere valentía, pero es la única manera de resolver de verdad."},{"id": "qx2b","text": "El principio 3 dice que cuando algo sale mal con una GP, aunque el error sea de otra área, debes:","opts": ["Explicarle a la GP de qué área fue el error para que sepa a quién reclamar","Escalar de inmediato sin dar respuestas que no te corresponden","Asumir la responsabilidad, actuar con empatía y asegurarte de que quede acompañada","Pedirle que espere a que el área responsable la contacte directamente"],"ok": 2,"exp": "El cliente no necesita saber de quién fue la falla — necesita sentirse escuchado, acompañado y respaldado. De cara al cliente, somos una sola voz: cálida, confiable y resolutiva."},{"id": "qx2c","text": "¿Qué distingue a los Expertxs más difíciles de reemplazar, según el principio 6?","opts": ["Que siguen el guión de atención al pie de la letra en todo momento","Que resuelven el mayor número de interacciones por turno","Que llevan más tiempo en la empresa y conocen todos los procesos","Que entienden el producto, conectan los beneficios con la necesidad real y resuelven fuera del guión"],"ok": 3,"exp": "El principio 6 dice: los que solo ejecutan instrucciones son fáciles de reemplazar. Los que entienden el producto, conectan los beneficios con la necesidad real y resuelven fuera del guión — esos son los verdaderos Expertxs."},{"id": "qx2d","text": "Verdadero o Falso: Según el Manifiesto, cometer errores en el trabajo es equivalente a faltar al compromiso.","opts": ["Verdadero","Falso"],"ok": 1,"exp": "Falso. El principio 2 distingue claramente: los errores son bienvenidos como oportunidades de aprendizaje. Las faltas de responsabilidad son otra cosa. Equivocarse y aprender es parte del equipo."},{"id": "qx2e","text": "¿Qué dice el Manifiesto sobre el feedback?","opts": ["Solo es útil cuando viene de quien tiene más experiencia que tú","Un aprendizaje guardado se pierde — uno compartido se multiplica","Debe darse únicamente en las evaluaciones formales para no interrumpir el trabajo","Es responsabilidad del líder darlo; recibirlo es tu responsabilidad"],"ok": 1,"exp": "El principio 4 dice: \"Un aprendizaje guardado se pierde, uno compartido se multiplica.\" Dar feedback requiere valentía, recibirlo requiere madurez — las dos son igual de importantes."},{"id": "qx2f","text": "Principio #4: \"el feedback es un regalo\". ¿Qué significa en la práctica?","opts": ["Agradecer siempre al cliente aunque no tengas razón","Pedir feedback al final de cada llamada","Lo que aprendes — de GPs, errores o situaciones difíciles — se comparte con el equipo","Solo el feedback positivo vale la pena registrar"],"ok": 2,"exp": "El principio #4 dice: lo que se aprende, se comparte. El feedback de GPs y situaciones complejas es información valiosa para todo el equipo — no algo que se guarda para uno mismo."},{"id": "qx2g","text": "¿Qué significa \"sacar el chip convencional\" (principio #5)?","opts": ["Ignorar el guión por completo y resolver con creatividad","Hablar de forma natural y conectar con la GP como igual — sin scripts rígidos","Usar lenguaje técnico médico para transmitir credibilidad","Usar solo mensajes de texto sin llamadas telefónicas"],"ok": 1,"exp": "El principio #5 dice: habla normal, conecta como igual. Las GPs son adultos con experiencia — la conversación natural genera más confianza que el lenguaje corporativo o los scripts robóticos."},{"id": "qx2h","text": "Una Experta nueva dice \"solo soy agente, no puedo cambiar nada\". ¿Qué principio del Manifiesto contradice eso directamente?","opts": ["Principio #1: ve de frente","Principio #6: conecta los puntos","Principio #8: sé buen compañerx","Principio #10: trabaja con orgullo — no hay roles pequeños"],"ok": 3,"exp": "El principio #10 dice: trabaja con orgullo — no hay roles pequeños. Cada interacción importa. \"Solo soy agente\" no existe en Koltin — cada Expertx tiene impacto real en la vida de las GPs."}],"sub1": [{"id": "q1a","text": "¿Cuál de las siguientes describe correctamente cómo se realiza el EDL según la zona donde vive la GP?","opts": ["Solo en CDMX y Monterrey de forma presencial — las GPs de otros estados no tienen acceso al EDL","CDMX (presencial o virtual), Monterrey (presencial; virtual por excepción con autorización médica) y foráneos (siempre virtual)","En todo México de forma virtual, con opción presencial solo en clínicas privadas","Solo en CDMX: Santa Fe para presencial y Roma Norte para virtual"],"ok": 1,"exp": "El EDL opera con modalidades distintas por zona: CDMX/Edo. Méx. (la GP elige), Monterrey (presencial por default, virtual solo con autorización médica por movilidad o distancia) y foráneos (siempre virtual). Roma Norte dejó de operar EDL desde agosto 2026."},{"id": "q1b","text": "¿Cuál es el rol de las Expertas durante el EDL de una GP?","opts": ["Realizar los estudios de laboratorio junto con el personal médico","Interpretar los resultados del EDL y explicárselos a la GP","Orientar, agendar, dar seguimiento y acompañar — NO hacer el estudio médico","Llenar el expediente médico por la GP si esta tiene dificultades con la app"],"ok": 2,"exp": "Las Expertas no realizan el estudio ni interpretan resultados médicos. Su rol es orientar, agendar, dar seguimiento y acompañar a la GP durante todo el proceso."},{"id": "q1c","text": "¿Con qué frecuencia se recomienda que una GP realice su EDL?","opts": ["Cada 6 meses","Una vez al año","Cada 2 años según criterio médico","Solo cuando la GP lo solicita expresamente"],"ok": 1,"exp": "La frecuencia recomendada es una vez al año para mantener un monitoreo continuo del estado de salud de la GP."},{"id": "q1d","text": "Verdadero o Falso: Los estudios de seguimiento que recomienda el médico después del EDL están cubiertos por Koltin.","opts": ["Verdadero","Falso"],"ok": 1,"exp": "Falso. Los estudios derivados del EDL que el médico recomiende como seguimiento los cubre la GP, no Koltin. Es importante no generar expectativas incorrectas sobre la cobertura."},{"id": "q1e","text": "¿Qué hace el EDL principalmente para la GP?","opts": ["Reemplaza su consulta médica anual de cabecera","Le da acceso a descuentos en estudios de laboratorio externos","Genera un diagnóstico definitivo de sus condiciones de salud","Detecta riesgos a tiempo y construye
