 Aplica únicamente cuando la GP viaja fuera de México <strong>por motivos ajenos a la atención médica</strong> y enfrenta una emergencia de salud.</p>\n<div class=\"callout amber\"><p>⚠️ Como GNP no tiene convenios con hospitales en el extranjero, <strong>el pago se realiza mediante reembolso</strong>: la GP paga en el momento y después solicita el reembolso con la documentación correspondiente.</p></div>\n\n<h3>🔴 ¿Qué es una Urgencia Médica?</h3>\n<p>Según GNP, se considera urgencia médica cualquier <strong>alteración súbita del estado de salud</strong> o una crisis médica que pone en peligro la vida, la viabilidad de algún órgano o la integridad corporal, y que requiere atención inmediata. La urgencia termina cuando el médico tratante considera que la situación crítica ha concluido.</p>\n\n<h3>🧭 Procedimiento de emergencia en el extranjero</h3>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li><strong>Buscar asistencia médica inmediata</strong> en un hospital o centro médico local.</li>\n<li><strong>Obtener todos los documentos</strong> — diagnósticos, tratamientos, recetas.</li>\n<li><strong>Solicitar facturas o comprobantes de pago</strong> a nombre del asegurado. En el extranjero, los recibos de pago son suficientes.</li>\n<li><strong>Reportar la emergencia dentro de los 5 días posteriores al evento</strong> y reunir toda la documentación de reembolso: <strong>facturas o recibos a nombre del asegurado</strong>, <strong>Aviso de accidente y/o enfermedad</strong>, <strong>informe médico del médico tratante</strong> (en formato de la aseguradora o traducido al español), <strong>formato de reembolso de GNP</strong>, <strong>formato de alta de cuenta bancaria</strong> y <strong>estado de cuenta</strong>. La GP puede contactar a Koltin por WhatsApp (5624529159) para recibir los formatos y apoyo.</li>\n</ol>\n<div class=\"callout amber\"><p>⚠️ <strong>El plazo para reportar la emergencia es de 5 días posteriores al evento.</strong> No cumplir con este plazo puede afectar el reembolso.</p></div>\n\n<h3>🌱 Medicina preventiva y siniestralidad</h3>\n<p>Koltin mantiene un índice de siniestralidad por debajo de la norma gracias a su enfoque preventivo. Tu labor como Experta no es solo asistir cuando hay una urgencia — también es <strong>promover el uso proactivo</strong> de los beneficios preventivos (EDL, videoconsultas) para evitar que las GPs lleguen a necesitar el seguro con frecuencia.</p>\n\n<img src=\"/_blob/5731ad0ce40929ac976ecc92407d39df\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Cómo identificar el tipo de seguro en Sails?</p>\n</div>","subs2": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Seguro de Gastos Médicos Mayores · Koltin.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar conocerás qué NO cubre el seguro, los tiempos de espera y tus responsabilidades clave como Experta frente al SGMM.</p>\n\n<img src=\"/_blob/d9390ba39fe8cc9962b998727c4fee97\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Qué NO cubre el SGMM?</p>\n\n<h3>🚫 Exclusiones Generales</h3>\n<h3>⚠️ Preexistencias y padecimientos congénitos</h3>\n<ul>\n<li><strong>Padecimiento preexistente:</strong> cualquier condición médica que ya existía, fue diagnosticada o cuyos síntomas se manifestaron <em>antes</em> de contratar el seguro. El SGMM no la cubre.</li>\n<li><strong>Padecimiento congénito:</strong> condición presente desde el nacimiento (con origen genético o de desarrollo intrauterino). Generalmente excluida, salvo excepciones específicas en las condiciones de la póliza.</li>\n</ul>\n<div class=\"callout amber\"><p>⚠️ <strong>Regla crítica de los tiempos de espera:</strong> si los síntomas o la atención médica de un padecimiento <em>empezaron</em> antes de que se cumpliera el tiempo de espera, ese padecimiento <strong>no estará cubierto aunque después se cumpla el plazo</strong>. No basta con que el diagnóstico formal llegue después — lo que importa es cuándo iniciaron los síntomas.</p></div>\n\n<div class=\"callout amber\"><p>⚠️ Comunicar las exclusiones con claridad evita malentendidos y falsas expectativas. Es parte fundamental del trabajo de una Experta.</p></div>\n\n<p><strong>Tratamientos estéticos y reconstructivos:</strong></p>\n<ul>\n<li>Cirugías plásticas con fines estéticos.</li>\n<li>Tratamientos para calvicie, aumento o disminución de peso, acné.</li>\n</ul>\n\n<p><strong>Padecimientos preexistentes y congénitos:</strong></p>\n<ul>\n<li>No se cubren enfermedades preexistentes, salvo pacto en contrario.</li>\n<li>Enfermedades congénitas excluidas, excepto si el recién nacido cumple los requisitos.</li>\n</ul>\n\n<p><strong>Accidentes bajo ciertas condiciones:</strong></p>\n<ul>\n<li>Lesiones en estado de ebriedad (alcohol en sangre mayor a 0.8 g/L).</li>\n<li>Riñas si el asegurado es el provocador.</li>\n<li>Intento de suicidio o autolesiones.</li>\n<li>Ciclismo de pista/ruta/montaña y motociclismo en cualquier forma.</li>\n</ul>\n\n<p><strong>Condiciones médicas específicas:</strong></p>\n<ul>\n<li>Infertilidad, esterilidad y reproducción asistida.</li>\n<li>Partos, cesáreas y <strong>complicaciones del embarazo</strong> — <strong>excluidos completamente</strong>, sin importar el tiempo de membresía.</li>\n<li>Tratamientos psiquiátricos y psicológicos, salvo cáncer en fase terminal o secuestro.</li>\n</ul>\n\n<p><strong>Deportes y actividades riesgosas:</strong></p>\n<ul>\n<li>Deportes extremos: paracaidismo, buceo, motocross, boxeo, etc.</li>\n<li>Competencias de velocidad en vehículos motorizados.</li>\n<li>Actividades militares o conflictos armados.</li>\n</ul>\n\n<p><strong>Otros conceptos no cubiertos:</strong></p>\n<ul>\n<li>Internamientos en establecimientos no reconocidos como hospitales.</li>\n<li>Medicamentos o tratamientos experimentales.</li>\n<li>Lentes, anteojos, plantillas ortopédicas, prótesis dentales (salvo accidente cubierto).</li>\n<li>Tratamientos preventivos, check-ups o vacunas.</li>\n</ul>\n\n<img src=\"/_blob/7bd542b32a0be6ce788b7d4c0b4737cd\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Tiempos de espera del SGMM</p>\n\n<h3>⏳ Tiempos de Espera</h3>\n<p>El tiempo de espera es el periodo que debe transcurrir antes de que la GP pueda acceder a ciertos beneficios del seguro:</p>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.75rem 0\">\n<tr style=\"background:var(--g1)\"><th style=\"padding:.5rem .75rem;text-align:left;border-bottom:2px solid var(--g3)\">Plazo</th><th style=\"padding:.5rem .75rem;text-align:left;border-bottom:2px solid var(--g3)\">Aplica a</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.5rem .75rem;font-weight:700;color:var(--g7)\">0 días</td><td style=\"padding:.5rem .75rem\">Urgencias médicas derivadas de padecimientos cubiertos o accidentes.</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.5rem .75rem;font-weight:700\">30 días</td><td style=\"padding:.5rem .75rem\">Todas las enfermedades, excepto gastroenteritis infecciosa, intoxicación alimentaria y neumonía.</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.5rem .75rem;font-weight:700\">6 meses</td><td style=\"padding:.5rem .75rem\">Cataratas, reflujo gastroesofágico, vesícula biliar, cáncer de mama, hernias (excepto disco), padecimientos ginecológicos.</td></tr>\n\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.5rem .75rem;font-weight:700\">1 año</td><td style=\"padding:.5rem .75rem\">Columna vertebral, rodilla, amígdalas, várices, nariz y senos paranasales (solo por causas médicas).</td></tr>\n<tr style=\"background:var(--n0)\"><td style=\"padding:.5rem .75rem;font-weight:700\">Especial</td><td style=\"padding:.5rem .75rem\">VIH/SIDA — Suma asegurada $500,000 MXN en territorio nacional. La antigüedad se genera desde la contratación. No aplica reducción ni eliminación de periodos de espera, pero sí aplica reconocimiento de antigüedad.</td></tr>\n</table>\n\n\n<div class=\"callout amber\"><p>🦷 <strong>Sin cobertura dental:</strong> ningún tratamiento odontológico está cubierto por el SGMM de GNP — incluidos extracciones, implantes, ortodoncia y prótesis dentales.</p></div>\n<h3>✅ Tareas clave de una Experta sobre el SGMM</h3>\n<ul>\n<li><strong>Explicar beneficios y límites con claridad</strong> — que la GP entienda qué está cubierto y qué no.</li>\n<li><strong>Acompañar en urgencias, hospitalizaciones o reembolsos</strong> — guiar el proceso paso a paso.</li>\n<li><strong>Orientar sobre tiempos de espera</strong> — para que las GPs sepan cuándo pueden acceder a cada beneficio.</li>\n<li><strong>Transmitir tranquilidad</strong> — la cobertura está garantizada mientras la membresía esté activa.</li>\n<li><strong>Resolver dudas de forma empática y proactiva</strong> — generando confianza en cada interacción.</li>\n</ul>\n</div>","subs3": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Glosario del SGMM · Koltin.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar dominarás los términos clave del seguro para poder explicarlos con claridad a las GPs y usarlos correctamente en tu trabajo diario.</p>\n\n<div class=\"callout blue\"><p>💰 <strong>Cifras más comunes de la póliza Koltin (60 a 84 años y 11 meses):</strong> Deducible $30,000 · Coaseguro 20% con tope de $20,000. <em>Nota: existen otras opciones de deducible, por ejemplo $100,000. Los ejemplos de esta sección usan $30,000 como referencia.</em></p></div>\n\n<img src=\"/_blob/4e58b0f0e021d7d2a759d3385f1dd429\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Deducible y Coaseguro — ¿cómo funcionan?</p>\n\n<h3>💳 Deducible</h3>\n<p>Cantidad desde la cual se activa la cobertura del seguro. En la póliza Koltin, el deducible es de <strong>$30,000</strong>.</p>\n<ul>\n<li><strong>Ejemplo 1:</strong> Cecilia requiere una cirugía de \"dedo en gatillo\" con costo de $23,000. No alcanza el deducible → el seguro no cubre.</li>\n<li><strong>Ejemplo 2 — padecimiento bilateral:</strong> Gabriel necesita operación de cataratas en <em>ambos</em> ojos: $45,000 por ojo, total $90,000. Para padecimientos bilaterales (que afectan los dos lados del cuerpo), <strong>solo se cobra un deducible</strong>. Deducible: $30,000. Coaseguro: 20% de $60,000 = $12,000 (dentro del tope). Gabriel paga $30,000 + $12,000 = $42,000. GNP cubre $48,000.</li>\n</ul>\n\n<h3>📊 Coaseguro</h3>\n<p>Porcentaje adicional que el asegurado aporta al usar el seguro. En la póliza Koltin es del <strong>20%, con tope de $20,000</strong>.</p>\n<ul>\n<li><strong>Ejemplo 1:</strong> Regina necesita cirugía de rodilla: $80,000. Paga $30,000 de deducible + $10,000 de coaseguro = $40,000. GNP cubre $40,000.</li>\n<li><strong>Ejemplo 2:</strong> Alonso necesita cirugía de columna: $400,000. Paga $30,000 deducible + $20,000 coaseguro (tope) = $50,000. GNP cubre $350,000.</li>\n</ul>\n<div class=\"callout green\"><p>💡 <strong>Los gastos derivados de un accidente están exentos de coaseguro y deducible.</strong></p></div>\n\n<img src=\"/_blob/38a3930fe968263a7e69f51a428b11c7\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Pago directo vs Reembolso</p>\n\n<h3>🏥 Modalidades de pago</h3>\n<ul>\n<li><strong>Pago Directo:</strong> GNP liquida su parte directamente en un hospital dentro de su red hospitalaria.</li>\n<li><strong>Reembolso:</strong> El asegurado paga y GNP reembolsa posteriormente con la documentación.</li>\n</ul>\n\n<h3>🏨 Red Hospitalaria</h3>\n<p>Hospitales, clínicas y consultorios con alianza con GNP donde el asegurado puede recibir atención con pago directo.</p>\n\n<h3>👤 Contratante vs Asegurado</h3>\n<ul>\n<li><strong>Contratante:</strong> En la membresía Koltin, el contratante es <strong>Aplicaciones Gerontológicas (Koltin)</strong>, no la Gran Persona. El <strong>Asegurado</strong> es la GP que recibe los beneficios. No hay que confundirlos.</li>\n<li><strong>Asegurado:</strong> Persona que es la beneficiaria directa del seguro y sus beneficios.</li>\n</ul>\n\n<h3>⚠️ Preexistencia</h3>\n<p>Cualquier enfermedad, patología o condición conocida y diagnosticada médicamente <strong>antes de contratar el seguro</strong>. Las preexistencias no están cubiertas, salvo pacto en contrario.</p>\n\n<h3>📄 Endoso</h3>\n<p>Documento que modifica aspectos específicos del contrato para un asegurado en particular. <strong>Cuando hay contradicción entre el endoso y las condiciones generales, el endoso tiene prioridad.</strong></p>\n<p>Puede ser de dos tipos:</p>\n<ul>\n<li><strong>Exclusión por preexistencia:</strong> si al momento del ingreso se detecta una condición de salud específica, se puede emitir un endoso que la excluye del seguro para esa persona. Ejemplo: si la GP tiene hipertensión diagnosticada antes de contratar, el endoso puede excluir complicaciones derivadas de esa condición.</li>\n<li><strong>Ajuste de cobertura:</strong> modifica la suma asegurada u otros elementos para ese asegurado en particular.</li>\n</ul>\n<div class=\"callout blue\"><p>💡 El endoso afecta solo al asegurado en cuestión — no cambia las condiciones generales de la póliza para todos los demás miembros.</p></div>\n\n<h3>✅ Enfermedad amparada</h3>\n<p>Una enfermedad está amparada si: ocurre mientras la póliza está vigente, es diagnosticada por médico autorizado, no está excluida en las condiciones generales y no es preexistente o congénita.</p>\n\n<h3>🚨 Accidente amparado</h3>\n<p>Un accidente es cualquier cambio en la salud resultante de un evento inesperado, repentino y violento, de causa externa y ajena a la voluntad del asegurado. Los gastos de accidente <strong>están exentos de deducible y coaseguro</strong>.</p>\n<p>No se considera accidente cubierto cuando: el asegurado está ebrio o bajo drogas, fue provocado por él mismo, o se practicaba un deporte extremo.</p>\n<div class=\"callout amber\"><p>⚠️ Si la atención médica por accidente ocurre <strong>después de 30 días</strong> del suceso, los gastos se reembolsan como enfermedad (con deducible y coaseguro).</p></div>\n\n<h3>📋 Tabulador de honorarios médicos</h3>\n<p>Lista que establece los montos máximos que el seguro paga por honorarios de cada procedimiento médico. <strong>Koltin sí tiene acceso al tabulador de honorarios médicos de GNP.</strong> Esto permite verificar si el médico tratante cobra dentro del tabulador antes de la cirugía — si el médico cobra más que el tabulador, la diferencia la asume la GP.</p>\n\n<h3>📑 Desglose de gastos</h3>\n<p>Documento que detalla cada concepto de una factura hospitalaria (medicamentos, material quirúrgico, estudios, habitación). Es necesario para que GNP valide y procese el reembolso. Si una factura es muy general, se puede pedir una <strong>carta membretada</strong> del médico especificando los conceptos.</p>\n</div>","subm1": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Manual de Membresía Koltin.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar comprenderás el primer pilar de la membresía Koltin: la prevención. Sabrás explicar el EDL, las consultas de seguimiento, el servicio de ambulancias y la regla clave de los 30 días.</p>\n\n<img src=\"/_blob/b80971a848a9bdb8978658074cb5b52e\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Prevención — el primer pilar de Koltin</p>\n\n<h3>🔬 La pirámide de valor Koltin</h3>\n<p>Koltin estructura su propuesta de valor en 3 pilares:</p>\n<div class=\"callout blue\"><p><strong>Prevención</strong> (base) → <strong>Seguros</strong> → <strong>Comunidad</strong></p></div>\n<p>La prevención es la base de todo. Sin ella, los demás pilares no tienen el mismo impacto. El Estudio de Longevidad es el punto de partida obligatorio de cualquier GP al unirse a Koltin.</p>\n\n<h3>🔬 Estudio de Longevidad (EDL)</h3>\n<p>Al contratar la membresía, el primer paso de la GP es realizar su Estudio de Longevidad. Este estudio permite conocer su estado de salud y darle un acompañamiento claro, responsable y útil.</p>\n<p><strong>5 pasos del EDL:</strong></p>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li><strong>Expediente clínico</strong> — responde un cuestionario con su historia médica, medicamentos y estado actual.</li>\n<li><strong>Estudios de laboratorio</strong> — análisis de sangre y orina + electrocardiograma.</li>\n<li><strong>Análisis del equipo de salud</strong> — equipo multidisciplinario revisa resultados (medicina general, geriatría, gerontología, nutrición, ortopedia).</li>\n<li><strong>Consulta de resultados</strong> — el médico entrega el Reporte de Salud, resuelve dudas y presenta el plan de acompañamiento.</li>\n<li><strong>Canalización si aplica</strong> — si el reporte identifica necesidades específicas, se conecta a la GP con especialistas o programas preventivos.</li>\n</ol>\n\n<h3>⏰ La regla de los 30 días — MUY IMPORTANTE</h3>\n<div class=\"callout amber\">\n<p><strong>Los estudios de laboratorio deben realizarse dentro de los primeros 30 días naturales después de contratar.</strong></p>\n<ul>\n<li>✅ Si lo hace en 30 días → el aumento en la primera renovación será máximo 15% sobre el precio de lista.</li>\n<li>❌ Si no lo hace → el aumento se define según condiciones de mercado y el funcionamiento de la membresía puede verse afectado.</li>\n</ul>\n<p>Como Expertx, es tu responsabilidad informar esto a cada GP desde el primer contacto.</p>\n</div>\n\n<h3>📞 Consultas y seguimiento preventivo</h3>\n<p>Después del EDL, la GP tiene acceso a <strong>consultas virtuales incluidas en su membresía</strong> — videollamadas con el Equipo de Salud, sin salir de casa.</p>\n<p><strong>¿Para qué sirven?</strong></p>\n<ul>\n<li>Revisar la evolución de su estado de salud.</li>\n<li>Dar seguimiento al plan definido en el EDL.</li>\n<li>Resolver dudas sobre salud, medicamentos o cuidado.</li>\n<li>Ajustar tratamientos si es necesario.</li>\n<li>Emitir documentos médicos: órdenes de estudios, recetas digitales y referencias a especialistas.</li>\n</ul>\n\n<h3>🚑 Servicio de Ambulancias</h3>\n<p>La membresía incluye <strong>hasta 2 traslados en ambulancia terrestre al año</strong> en caso de urgencia médica, al hospital más cercano dentro de la red hospitalaria.</p>\n<div class=\"callout green\"><p>📞 <strong>55 5809 4518, opción 1</strong> — disponible 24/7</p></div>\n<p><strong>Qué NO cubre:</strong> ambulancias aéreas, traslados a citas programadas, traslados entre hospitales por conveniencia, hospitales fuera de la red.</p>\n</div>","subm2": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Manual de Membresía Koltin.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar comprenderás quién es GNP, cómo funciona su relación con Koltin, qué es la Membresía de Salud y cómo posicionar el seguro correctamente con las GPs.</p>\n\n<img src=\"/_blob/3996f4831403e8122de718fb84cfe187\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Seguros — el segundo pilar de Koltin</p>\n\n<h3>🏦 ¿Quién es GNP?</h3>\n<p>GNP es una institución de seguros especializada en salud, parte del <strong>Grupo GNP</strong> — uno de los grupos financieros más grandes de México. Está autorizada por la <strong>Secretaría de Hacienda y Crédito Público (SHCP)</strong> y la <strong>Comisión Nacional de Seguros y Fianzas (CNSF)</strong> para practicar operaciones de accidentes, enfermedades, salud y gastos médicos.</p>\n<ul>\n<li>Es una de las 84 aseguradoras de la AMIS (Asociación Mexicana de Instituciones de Seguros).</li>\n<li>Ofrece cobertura en <strong>todo el territorio nacional</strong>.</li>\n<li><strong>No comercializa este producto directamente al público</strong> — solo lo hace a través de Koltin.</li>\n</ul>\n\n<h3>🔄 La transición de aseguradora</h3>\n<div class=\"callout amber\">\n<p>A partir del <strong>14 de octubre de 2026</strong>, Koltin transicionó del público general a <strong>GNP Seguros</strong> como aseguradora. Los clientes que llegaron a Koltin como empleados, familiares o jubilados de BBVA siguen con <strong>BBVA Seguros Salud</strong>. Todos los nuevos miembros del público general ingresan con GNP.</p>\n</div>\n\n<img src=\"/_blob/7816d783792f8cdaaa21ca41cd89756b\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Cómo funciona nuestra relación con GNP?</p>\n\n<h3>🤝 ¿Cómo funciona la relación Koltin — GNP?</h3>\n<div class=\"callout blue\"><p><strong>GNP</strong> emite y opera los certificados de póliza del Seguro de Gastos Médicos Mayores.<br><strong>Koltin</strong> \"empaca\" ese seguro dentro de la Membresía de Salud, junto con los demás beneficios (prevención y comunidad).</p></div>\n<p>La GP adquiere la <strong>Membresía de Salud de Koltin</strong> — no una póliza directamente de GNP. Esto es importante saberlo para explicárselo correctamente a las GPs que pregunten.</p>\n\n<h3>💳 ¿Qué es la Membresía de Salud Koltin?</h3>\n<p>Es el producto que Koltin comercializa. Contiene todos los beneficios de los 3 pilares: Prevención + Seguro + Comunidad.</p>\n<ul>\n<li>Si la GP es <strong>titular</strong>: disfruta directamente los beneficios.</li>\n<li>Si contrató para un <strong>ser querido</strong>: esa persona es quien goza de la membresía.</li>\n</ul>\n<p>Koltin actualiza constantemente los beneficios incluidos. La membresía está vigente <strong>siempre que los pagos estén al día</strong>.</p>\n\n<h3>🗓️ Frecuencias de pago</h3>\n<p>La membresía puede pagarse en distintas frecuencias — cada una define la vigencia:</p>\n<ul>\n<li><strong>Anual</strong> — vigente por 12 meses.</li>\n<li><strong>Semestral</strong> — vigente por 6 meses.</li>\n<li><strong>Trimestral</strong> — vigente por 90 días.</li>\n<li><strong>Mensual</strong> — vigente por 30 días.</li>\n</ul>\n<div class=\"callout amber\"><p>⚠️ Si el pago no está al día, <strong>todos los beneficios quedan suspendidos</strong>, incluyendo el seguro. Es fundamental que las GPs mantengan sus pagos vigentes.</p></div>\n\n<h3>💡 Cómo posicionar el seguro con las GPs</h3>\n<p>Al hablar con una GP, el eje central siempre es el ecosistema completo:</p>\n<ul>\n<li>Koltin los <strong>conoce</strong> (EDL) antes de protegerlos.</li>\n<li>Los <strong>acompaña</strong> (consultas) para mantener su salud.</li>\n<li>Los <strong>protege</strong> (seguro GNP) si algo mayor ocurre.</li>\n<li>Los <strong>conecta</strong> (comunidad) con otros como ellos.</li>\n</ul>\n<div class=\"callout blue\"><p>Los detalles de siniestros y uso del seguro se verán en un módulo posterior. Este módulo cubre la propuesta de valor general.</p></div>\n</div>","subm3": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Manual de Membresía Koltin.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar comprenderás el tercer pilar de la membresía: la Comunidad. Sabrás qué incluye, cómo funciona y cómo comunicarlo a las GPs.</p>\n\n<img src=\"/_blob/f9e1bc49e8b5cbc5220c96c4d6639e97\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Comunidad — el tercer pilar de Koltin</p>\n\n<img src=\"/_blob/ce41c54ff35d83fc9642c18fb5a2a70e\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Los 3 dominios de la Comunidad Koltin</p>\n\n<h3>🌱 ¿Qué es la Comunidad Koltin?</h3>\n<p>La membresía da acceso a una comunidad pensada para <strong>moverse, aprender, conectar y disfrutar</strong>. Son clases, talleres y eventos digitales y presenciales diseñados para adultos mayores de 50.</p>\n\n<h3>💻 Comunidad Digital</h3>\n<p>Disponible para cualquier miembro en todo México:</p>\n<ul>\n<li><strong>Clases en vivo</strong> por Facebook y YouTube Live.</li>\n<li><strong>Masterclasses</strong> con personas expertas en distintos temas.</li>\n<li><strong>Contenido on demand</strong> para ver cuando quieran.</li>\n<li><strong>Micro learnings</strong> — cápsulas cortas para aprender algo útil en pocos minutos.</li>\n</ul>\n\n<h3>🏠 Comunidad Presencial (CDMX)</h3>\n<p>Para miembros en la Ciudad de México o de visita:</p>\n<ul>\n<li><strong>Clases en Casa Koltin</strong> — movimiento, creación y más.</li>\n<li><strong>Espacios wellness aliados</strong> con horarios exclusivos para miembros.</li>\n</ul>\n<div class=\"callout blue\"><p>La comunidad presencial está disponible en <strong>CDMX, Monterrey y Guadalajara</strong>.</p></div>\n\n<h3>🎭 Eventos y experiencias</h3>\n<p>Koltin organiza experiencias culturales y sociales con otros miembros:</p>\n<ul>\n<li>Exposiciones de arte y cultura.</li>\n<li>Conversatorios con expertos.</li>\n<li>Visitas guiadas a museos.</li>\n<li>Eventos especiales.</li>\n</ul>\n<div class=\"callout amber\"><p>📅 Las invitaciones llegan <strong>2 semanas antes</strong>. Algunos eventos tienen cupo limitado — recomienda a las GPs apartar su lugar en cuanto reciban la invitación.</p></div>\n\n<h3>💬 ¿Por qué importa la Comunidad?</h3>\n<p>La dimensión <strong>social</strong> es una de las más importantes para la salud integral de los adultos mayores. Koltin entiende que la salud no es solo física — el sentido de pertenencia, el aprendizaje continuo y la conexión con otros son parte fundamental del bienestar de las Grandes Personas.</p>\n</div>","suba1": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Basado en Guía de App Koltin V1.0 (oct 2026).</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar conocerás las 3 secciones de la app, la regla fundamental del código OTP y qué hace y qué todavía no hace la app Koltin.</p>\n\n<h3>👵 A quién atiendes</h3>\n<p>Nuestros miembros son <strong>Grandes Personas</strong>: adultos mayores. Eso cambia cómo das soporte, no solo qué contestas.</p>\n\n<h3>🔴 NUNCA pidas el código de verificación</h3>\n<p>El código de 6 dígitos que llega por WhatsApp <strong>es la llave de la cuenta</strong>. Quien lo tiene, entra.</p>\n<div class=\"callout amber\">\n<p><strong>Reglas absolutas:</strong></p>\n<ul>\n<li><strong>Nunca</strong> se lo pidas a un miembro, ni \"para verificar\", ni \"para ayudarte a entrar\", ni por teléfono, ni por WhatsApp, ni por correo.</li>\n<li>Si alguien te lo dicta sin que se lo pidas, <strong>dile que no te lo diga</strong> y pídele que solicite uno nuevo.</li>\n<li>Enséñales esta regla: <strong>Koltin nunca les va a pedir ese código.</strong> Si alguien se los pide, es un fraude.</li>\n</ul>\n</div>\n\n<img src=\"/_blob/69d23033cbf7d8ba0c13412d7f6cf85f\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">La app Koltin — 3 secciones principales</p>\n\n<h3>📱 ¿Qué es la app y qué tiene?</h3>\n<img src=\"/_blob/a91f6fb05a6cd192d99b2742b4913c87\" style=\"max-width:100%;border-radius:12px;margin:1rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\" alt=\"Sección Salud con el EDL en 3 pasos\">\n<p>La app es el espacio de salud del miembro. Tiene <strong>3 secciones:</strong></p>\n<ul>\n<li><strong>Salud y Expediente:</strong> el Estudio de Longevidad, el expediente médico, los medicamentos y los estudios de laboratorio. Solicitar agendamiento de EDL.</li>\n<li><strong>Emergencia:</strong> el botón de asistencia 24/7 y los contactos de emergencia.</li>\n<li><strong>Membresía:</strong> la credencial, los documentos, los pagos, la facturación y los ajustes.</li>\n</ul>\n\n<h3>🚫 Lo que la app todavía NO hace</h3>\n<div class=\"callout amber\"><p>Esto es tan importante como lo anterior. Si prometes algo que no existe, generas un reclamo.</p></div>\n<ul>\n<li><strong>No existe el Plan de Longevidad.</strong> Lo que sí se puede descargar hoy es el <strong>Reporte de Longevidad</strong>.</li>\n<li><strong>Las notificaciones push solo existen para la consulta de resultados del EDL.</strong> Para todo lo demás, todavía no avisamos por push.</li>\n<li><strong>No hay pantalla de inicio.</strong> Al entrar, la GP cae directo en la sección de Salud.</li>\n<li><strong>No se reembolsan siniestros desde la app</strong> ni se suben documentos de reembolso.</li>\n</ul>\n\n<img src=\"/_blob/eee5813689ad5fbc45569d718f1ab5e4\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">⚠️ El código OTP es personal e intransferible — pedirlo es una falta grave</p>\n</div>","suba2": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Basado en Guía de App Koltin V1.0 (oct 2026).</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar entenderás cómo entra una GP a la app por primera vez, cómo funciona el expediente médico y los estudios de laboratorio.</p>\n\n<img src=\"/_blob/9ba95d70c7c85bc7c4b60d4dcf29f7ca\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Cómo entra la GP por primera vez? — 6 pasos</p>\n\n<h3>4.1 Entrar (primera vez)</h3>\n<p>El orden es siempre este:</p>\n<ol style=\"padding-left:1.25rem;color:var(--n5);font-size:.9rem;line-height:1.8\">\n<li><strong>Abre la app</strong> → pantalla de arranque</li>\n<li><strong>Toca Entrar</strong> → le pide su número de teléfono. <strong>Debe usar el número de WhatsApp registrado en Sales al contratar</strong> — puede ser el suyo o el de un familiar (hijo, sobrino, etc.). Si entra con un número diferente al que está en Sales, el OTP no llegará al número correcto.</li>\n<li><strong>Acepta los términos y condiciones</strong> → no puede avanzar sin aceptar</li>\n<li><strong>Le llega un código de 6 dígitos por WhatsApp</strong> → lo captura</li>\n<li><strong>Le ofrece activar Face ID o huella</strong> → puede aceptar o rechazar</li>\n<li><strong>Pantalla de bienvenida</strong> → toca \"Comenzar\"</li>\n<li><strong>Entra a la sección de Salud</strong></li>\n</ol>\n<img src=\"/_blob/1c1439c3780eda86e26516c235e46dfe\" style=\"width:100%;max-width:100%;border-radius:12px;margin:1.25rem 0;box-shadow:0 4px 20px rgba(0,0,0,.15);display:block\" alt=\"Flujo de primer acceso en la app Koltin\">\n<div class=\"callout blue\"><p>La pantalla de bienvenida <strong>solo aparece una vez</strong>. Si dice \"ya no me sale la pantalla bonita\", es el comportamiento correcto.</p></div>\n\n<h3>4.2 Entrar (veces siguientes)</h3>\n<p>Si activó los biométricos, entra con su cara o su huella. Si no, le vuelve a llegar un código.</p>\n\n<img src=\"/_blob/8334c68944c628a5f61b9a9075203b99\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Qué secciones tiene el expediente médico?</p>\n\n<h3>4.4 Expediente médico</h3>\n<img src=\"/_blob/4f0623b65510dfbdc0b18855cb64cc32\" style=\"max-width:100%;border-radius:12px;margin:1rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\" alt=\"Pantalla de expediente médico en la app\">\n<p>Es un cuestionario largo, dividido en <strong>9 secciones</strong> agrupadas en: Sobre ti · Salud y bienestar · Condiciones de salud · Medicamentos y suplementos.</p>\n<div class=\"callout green\"><p><strong>Lo más importante:</strong> el avance <strong>se guarda</strong>. La GP puede salir a la mitad, cerrar la app y volver días después. Arranca donde se quedó. Díselo sin que pregunten — mucha gente no lo llena por miedo a tener que hacerlo de un jalón.</p></div>\n<p>Al terminar todas las secciones llega a \"Tu expediente está listo\" y ahí lo envía.</p>\n\n<h3>4.5 Estudios de laboratorio</h3>\n<img src=\"/_blob/4ea035bea5400b7ffac38ceebf07ea27\" style=\"max-width:100%;border-radius:12px;margin:1rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\" alt=\"Pantalla de estudios de laboratorio en la app\">\n<p>Se desbloquea cuando el expediente es enviado. La GP ve 3 estudios:</p>\n<ul>\n<li><strong>Estudios de laboratorio</strong> — sin cita, en sucursales Chopo</li>\n<li><strong>Electrocardiograma</strong> — requiere cita por llamada o WhatsApp</li>\n<li><strong>Densitometría</strong> — requiere cita (solo si aplica según expediente)</li>\n</ul>\n<p>También ve cómo prepararse para cada estudio (ayunos, horarios) y un mapa con sucursales cercanas.</p>\n<div class=\"callout amber\"><p>Si dice \"le doy a estudios y no pasa nada\": casi siempre es que no ha terminado su expediente. <strong>No es una falla.</strong> Revisa el estado del paso 1.</p></div>\n</div>","suba3": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Basado en Guía de App Koltin V1.0 (oct 2026).</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar conocerás las secciones de Emergencia y Membresía, el flujo de Agendamiento EDL en la app y qué hacer cuando una GP quiere reagendar o cancelar.</p>\n\n<img src=\"/_blob/c61465220ed460af7121455856bd4dd8\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Qué hace el botón de emergencia?</p>\n\n<h3>4.6 Emergencia</h3>\n<img src=\"/_blob/eb370f9d48bc0af1010c0ca05f18e869\" style=\"max-width:100%;border-radius:12px;margin:1rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\" alt=\"Pantalla de emergencia en la app Koltin\">\n<p>Tiene el botón <strong>\"Tengo una emergencia\"</strong>. Este botón <strong>hace una llamada telefónica</strong> a la línea de asistencia 24/7. No abre WhatsApp ni lleva a otra pantalla: marca.</p>\n<p>Debajo está la card de <strong>Gestiones de asistencia</strong>: Contactos de emergencia, Cirugías y reembolsos, y Direcciones relevantes.</p>\n\n<h3>4.7 Membresía</h3>\n<img src=\"/_blob/4df2c5707cf8b7ce23c856b54f08495c\" style=\"max-width:100%;border-radius:12px;margin:1rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\" alt=\"Pantalla de membresía en la app Koltin\">\n<p>Aquí vive casi todo lo administrativo:</p>\n<ul>\n<li><strong>La credencial digital.</strong> Si la GP la oculta y cierra la app, al volver a abrirla la credencial vuelve a verse. El ocultar no se guarda entre sesiones — es normal, no es un error.</li>\n<li><strong>Detalle y cobertura</strong> de su plan.</li>\n<li><strong>Documentos:</strong> credencial de membresía y certificado individual, cada uno descargable.</li>\n<li><strong>Plan de pagos, historial de pagos y detalle de cada pago.</strong></li>\n<li><strong>Facturación:</strong> alta de datos fiscales (RFC, razón social, uso y régimen).</li>\n</ul>\n\n<h3>4.9 Eliminar cuenta — lee esto con cuidado</h3>\n<div class=\"callout amber\"><p>Eliminar la cuenta en la app <strong>NO</strong> cancela la membresía, NO borra el expediente médico, NO borra la información financiera. Lo que sí hace: deja la cuenta <strong>desactivada</strong>. Si vuelve a entrar, se reactiva.</p></div>\n<p>Si un miembro quiere <strong>cancelar su membresía</strong>, eso es otro trámite y no se hace desde la app.</p>\n\n<img src=\"/_blob/4cb10ef6f71ed4562efa784d15661190\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Cuándo puedes agendar el EDL?</p>\n\n<h3>4.10 Agendamiento EDL</h3>\n<p>Es el <strong>paso 3</strong> en Salud. Se desbloquea cuando la GP ya envió su expediente y ya tenemos sus estudios. Si dice que no le aparece, revisa primero los pasos 1 y 2.</p>\n<p><strong>Paso a paso:</strong></p>\n<ol style=\"padding-left:1.25rem;color:var(--n5);font-size:.9rem;line-height:1.8\">\n<li>Salud → paso 3 → \"Agendar consulta\"</li>\n<li>Ve qué incluye la consulta y toca \"Comenzar\"</li>\n<li>Elige modalidad: Presencial (solo CDMX y Monterrey) o Virtual</li>\n<li>Si es presencial: ve la clínica con mapa → \"Ver horarios disponibles\"</li>\n<li>Elige un horario. Si ninguno le sirve, toca \"Ver calendario\"</li>\n<li>Revisa sus datos. Con los lápices puede cambiar modalidad, fecha u horario</li>\n<li>Toca \"Confirmar\" → sale \"Consulta confirmada\"</li>\n</ol>\n<div class=\"callout blue\"><p>La app le dice que puede reagendar o cancelar <strong>hasta 3 veces</strong>. Al reagendar puede cambiar modalidad, fecha y horario.</p></div>\n</div>","suba4": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Basado en Guía de App Koltin V1.0 (oct 2026).</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar identificarás los problemas más comunes de la app, sabrás cómo responderlos y qué datos llevar siempre al escalar.</p>\n\n<h3>🔑 Acceso — problemas frecuentes</h3>\n<ul>\n<li><strong>\"No me llega el código\":</strong> ¿Tiene WhatsApp con internet? ¿Es el número registrado con Koltin? ¿Pasaron más de 2 minutos? Ofrécele \"Reenviar código\".</li>\n<li><strong>\"Me dice que mi número no existe\":</strong> Verifica si es miembro de Koltin, si tiene acceso al portal y si está entrando con el número registrado.</li>\n<li><strong>\"Puse mal el código muchas veces y ya no me deja\":</strong> Llegó a \"Acceso pausado por seguridad\". Es una protección, no una falla.</li>\n<li><strong>\"No veo el botón para continuar\":</strong> Con el teclado arriba, en teléfonos de pantalla chica el botón puede quedar tapado. Dile que <strong>baje el teclado</strong> (tocando fuera del campo).</li>\n<li><strong>\"El Face ID / la huella no funciona\":</strong> Siempre puede entrar con el código. Las huellas se desgastan con la edad — es muy común. Nunca lo presentes como un fallo de la persona.</li>\n</ul>\n\n<h3>📋 Expediente — problemas frecuentes</h3>\n<ul>\n<li><strong>\"Se me borró lo que había contestado\":</strong> El avance se guarda. Pídele que entre a Salud y vea si dice \"Continuar\" con una barra de avance. Casi siempre está ahí.</li>\n<li><strong>\"Me saltó preguntas\":</strong> Problema conocido. Anota en qué sección iba y escala.</li>\n<li><strong>\"El expediente está al 97-98%\":</strong> Revisa en Sales qué sección podría estar incompleta — nosotros lo podemos ver desde ahí. Si la GP dice que contestó todo y aún no sube, verifica el estatus desde el sistema antes de escalar.</li>\n<li><strong>\"El expediente aparece al 100% pero la GP no puede cerrarlo\":</strong> Problema conocido. Manda el caso a Roxana. Mientras tanto, cerrar el expediente desde el portal web puede destrabar la app sin que la GP pierda nada.</li>\n<li><strong>\"No me deja ver mis estudios\":</strong> Casi siempre el expediente no está enviado. Revisa el paso 1.</li>\n</ul>\n\n<h3>💳 Membresía y pagos — problemas frecuentes</h3>\n<ul>\n<li><strong>\"Mi credencial desapareció\":</strong> Casi seguro la ocultó con el control de ocultar/mostrar. Pídele que lo toque otra vez.</li>\n<li><strong>\"Mi pago no pasó\":</strong> No pidas datos de tarjeta. Toma cuándo intentó y qué mensaje vio, y escala al área de pagos.</li>\n</ul>\n\n<h3>🚨 Cuándo escalar — siempre que:</h3>\n<ul>\n<li>El problema esté marcado como \"problema conocido\" en la guía</li>\n<li>Se trate de un cobro, monto o factura</li>\n<li>Alguien reporte que ve información que no es suya</li>\n<li>No sepas la respuesta — inventarla cuesta más que escalar</li>\n</ul>\n\n<h3>📋 Lo que debe llevar el ticket, siempre:</h3>\n<ul>\n<li><strong>Número de membresía</strong> — para identificar la cuenta</li>\n<li><strong>iPhone o Android, y versión de la app</strong> — varios problemas son de una sola plataforma</li>\n<li><strong>Qué pantalla exacta</strong> — \"Salud\" no basta; ¿el hub de 3 pasos o el expediente?</li>\n<li><strong>Qué hizo paso a paso</strong> y qué esperaba que pasara</li>\n<li><strong>El texto exacto del mensaje de error</strong>, si hubo</li>\n</ul>\n<div class=\"callout amber\"><p><strong>Nunca pongas en un ticket:</strong> el código de verificación, datos de tarjeta, ni el contenido de las respuestas del expediente.</p></div>\n<p>Escalar a: <strong>tmp-lanzamiento-app</strong> en Slack.</p>\n</div>","subx1": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Basado en la definición del equipo Expertxs de Koltin.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar esta lectura comprenderás qué significa ser un Expertx en Koltin: el tipo de perfil que somos, el rol que jugamos y por qué el servicio humano es la base de todo lo que hacemos.</p>\n\n<img src=\"/_blob/3deb1f4ebbd4a34a394af75e90d29cf2\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Qué es un Expertx de Koltin?</p>\n\n<h3>🌟 ¿Qué es un Expertx en Koltin?</h3>\n<p>En Koltin, un Expertx va más allá de ser un representante de servicio al cliente. Son los pilares del compromiso con las Grandes Personas. Su labor no se limita a responder preguntas y resolver problemas: se enfocan en escuchar de manera activa, comprender necesidades de forma profunda y resolverlas con empatía y claridad.</p>\n<div class=\"callout blue\"><p>\"Si te parece familiar, es porque hemos tomado inspiración del modelo de Nubank, reconocido por su excelencia en atención al cliente.\"</p></div>\n\n<h3>🎯 El perfil de un Expertx</h3>\n<p>El perfil abarca cualidades como:</p>\n<ul>\n<li><strong>Amabilidad y atención genuina</strong> — con las GPs y con el equipo.</li>\n<li><strong>Proactividad</strong> — no esperas que alguien te diga cómo resolver; encuentras la solución.</li>\n<li><strong>Agilidad para tomar decisiones</strong> — actúas con criterio, no solo con guiones.</li>\n<li><strong>Curiosidad y aprendizaje constante</strong> — de ti mismo, de tus colegas y de otros equipos.</li>\n<li><strong>Respeto por la diversidad</strong> — conectas con todas las personas, unidas por su humanidad.</li>\n</ul>\n\n<h3>🎭 ¿Cuál es el papel de un Expertx?</h3>\n<p>Los Expertxs son <strong>representantes de los clientes dentro de Koltin</strong>. Su experiencia y perspectivas alimentan la estrategia del equipo, garantizando que las Grandes Personas estén al centro de todo.</p>\n<p>También son <strong>agentes de cambio</strong>: tienen la libertad de señalar oportunidades de mejora y dar retroalimentación directa. No están confinados a un solo departamento — se integran en diversas áreas para asegurar comunicación constante y efectiva.</p>\n\n<h3>❤️ ¿Por qué el servicio humano es esencial?</h3>\n<div class=\"callout green\"><p>🌟 <strong>Koltin combina innovación digital con un servicio cálido y personalizado.</strong> En la era de la automatización, lo que diferencia a Koltin es la parte humana: la capacidad de conectar, comprender y acompañar a las GPs.</p></div>\n<p>La misión de desafiar las convenciones de las aseguradoras no sería posible sin cuestionar también el estatus quo del servicio al cliente convencional.</p>\n<div class=\"callout green\"><p>En la era de ChatGPT y la automatización, las tareas administrativas y repetitivas van a desaparecer. Lo que nos diferencia es nuestra parte humana: la capacidad de conectar, comprender y acompañar. Eso no puede reemplazarlo ningún sistema.</p></div>\n<p>Escuchar a las Grandes Personas y comprender su perspectiva es lo que permite diseñar productos y servicios que se adaptan a sus vidas.</p>\n\n<h3>🏆 La pasión por el servicio excepcional</h3>\n<p>Los Expertxs saben que la atención verdadera se construye con amor y paciencia, y que superar las expectativas es esencial. Sin el feedback y las experiencias que comparten, sería imposible mantener a los clientes al centro de todo lo que hace Koltin.</p>\n</div>","subx2": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Manifiesto del equipo Expertxs & Front Desk, por Lups.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar esta lectura conocerás los 10 principios del Manifiesto del equipo. Este no es un reglamento — es la forma en que entendemos nuestro trabajo, nos relacionamos entre nosotrxs y ponemos a las Grandes Personas al centro de todo.</p>\n<div class=\"callout blue\"><p><em>\"La hospitalidad irracional es el acto de dar a las personas más de lo que esperan, con toda la intención del mundo.\"</em> — Will Guidara</p></div>\n\n<img src=\"/_blob/4624636f0c2dc64e71f22efd0f75b3f8\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Nuestro Manifiesto — 10 principios que nos guían</p>\n\n<h3>1. No nos vamos a dormir enojadxs</h3>\n<p>Si tienes un problema con alguien del equipo, habla con esa persona <strong>antes</strong> de comentarlo con alguien más. Los conflictos no resueltos se acumulan y dañan al equipo. Asume siempre buenas intenciones: lo que viene de otro Kolter, aunque sea una crítica, sale de un lugar de mejora.</p>\n\n<h3>2. Somos adultos responsables</h3>\n<p>Nadie va a recordarle a nadie sus responsabilidades — todos ya las conocemos. Los errores son bienvenidos como oportunidades de aprendizaje. Las faltas de responsabilidad son otra cosa. Si quieres ser parte de este equipo, el compromiso no es opcional.</p>\n\n<h3>3. Somos guardianes de la experiencia del cliente</h3>\n<p>Cuando algo sale mal — ya sea error propio, de Aseguradora, de ventas o de cualquier área — asumimos la responsabilidad y actuamos con empatía y sentido de urgencia. El cliente no necesita saber de quién fue la falla; necesita sentirse escuchado, acompañado y respaldado. De cara al cliente, somos <strong>una sola voz: cálida, confiable y resolutiva.</strong></p>\n\n<h3>4. El feedback es un regalo</h3>\n<p>Hay que compartir lo que se aprende, lo que no funcionó, lo que se descubrió. <strong>Un aprendizaje guardado se pierde, uno compartido se multiplica.</strong> Dar feedback requiere valentía, recibirlo requiere madurez — las dos cosas son igual de importantes.</p>\n\n<h3>5. Sácate el chip del servicio al cliente convencional</h3>\n<p>Cuando atiendes a una persona, no estás resolviendo un ticket — estás hablando con alguien. Cambia:</p>\n<div class=\"callout amber\"><p><em>\"Entiendo señora, levantaré un ticket para revisar la situación.\"</em></p></div>\n<p>Por:</p>\n<div class=\"callout green\"><p><em>\"Silvia, soy Guadalupe. Quiero entender bien lo que pasó para poder ayudarle. Cualquiera que sea la situación, cuente conmigo para resolverlo.\"</em></p></div>\n\n<h3>6. Pensamiento crítico: conecta los puntos</h3>\n<p>Los que solo ejecutan instrucciones son fáciles de reemplazar. Los que entienden el producto, conectan los beneficios de la membresía con la necesidad real de cada persona y resuelven fuera del guión — esos son los verdaderos Expertxs. Pregúntate siempre: ¿qué beneficio de la membresía resuelve esto?</p>\n\n<h3>7. Aprende algo nuevo cada semana</h3>\n<p>Un buen indicador de que el trabajo te está estimulando es saber si aprendiste algo nuevo esta semana. Si la respuesta es no, es una señal. Los verdaderos Expertxs nunca dejan de aprender.</p>\n\n<h3>8. Sé buen compañerx — los malos sobran</h3>\n<p>Trabajar en un lugar donde uno se siente cómodo, querido y respetado no tiene precio. No es necesario que todos seamos amigos, pero sí respetuosos y amables. Un buen día puede empezar con un saludo genuino.</p>\n\n<h3>9. Empatía hacia los tuyos</h3>\n<p>La misma energía que ponemos en entender a nuestras Grandes Personas, la ponemos en entendernos entre nosotrxs. La empatía no es debilidad — es lo que hace que un equipo funcione de verdad.</p>\n\n<h3>10. Trabaja con orgullo en tu posición</h3>\n<p>No hay roles pequeños en este equipo. El cliente no sabe ni le importa el título de quien le atendió — solo sabe si le resolvieron o no. El orgullo viene de saber que hoy hiciste bien el trabajo. Eso es suficiente.</p>\n<div class=\"callout green\"><p><strong>¡Bienvenidx al equipo! 💚</strong><br><em>Este equipo es de los que se quedan. Los que saben que lo extraordinario no es más que lo ordinario, bien hecho, todos los días, por mucho tiempo.</em></p></div>\n</div>","sub1": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Basado en documentación operativa de Koltin.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar podrás explicar qué es el EDL, cuál es su propósito, qué incluye y cuál es el rol de las Expertas en este proceso.</p>\n<img src=\"/_blob/582f954218a2671a2edaf050609ec708\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Qué es el Estudio de Longevidad (EDL)?</p>\n\n<h3>📖 ¿Qué es el Estudio de Longevidad?</h3>\n<p>El Estudio de Longevidad (EDL) es una evaluación médica completa que permite conocer el estado de salud y envejecimiento de una persona a través de diversas pruebas y estudios. Su objetivo es proporcionar un diagnóstico integral que ayude a la prevención y al seguimiento de la salud de nuestros clientes.</p>\n<div class=\"callout green\"><p>Este estudio es una parte clave de la propuesta de valor de Koltin: no solo permite detectar riesgos de salud, sino que se convierte en una herramienta fundamental para acompañar a las <strong>Grandes Personas</strong> en su bienestar.</p></div>\n<h3>🔬 ¿Qué estudios incluye?</h3>\n<p>El EDL incluye pruebas que varían según la localidad del cliente. Las pruebas de laboratorio aplican para todas las localidades; las presenciales solo para CDMX y Monterrey:</p>\n<ul>\n<li><strong>Todas las localidades:</strong> electrocardiograma, muestra sanguínea (biometría hemática, química de 27 elementos, hemoglobina glucosilada, HOMA-IR, perfil tiroideo, y antígeno prostático en hombres) y examen general de orina — realizados en Laboratorios Chopo.</li>\n<li><strong>CDMX y Monterrey (presencial):</strong> exploración física, signos vitales, escala Downton, SPPB, dinamometría y MMSE.</li>\n<li><strong>DXA o InBody:</strong> depende del resultado del triage de riesgo de fractura en el expediente médico (no lo decide el médico durante la visita — se define desde el inicio).</li>\n</ul>\n<div class=\"callout amber\"><p><strong>Importante:</strong> Los estudios derivados del EDL que el médico recomiende como seguimiento <strong>no están cubiertos por Koltin</strong>. El beneficio del EDL cubre únicamente las pruebas incluidas en el estudio mismo.</p></div>\n<h3>🙋 Rol de las Expertas en el EDL</h3>\n<p>Las Expertas tienen un papel <strong>informativo y de acompañamiento</strong> en el proceso del EDL:</p>\n<ul>\n<li>Brindar información clara y precisa sobre cómo iniciar y acceder al estudio, y sobre cómo avanza el flujo en cada etapa.</li>\n<li>Apoyar al cliente si tiene dificultades, incluyendo ayuda con el llenado del Historial Clínico (HC) o incentivarlo a acudir a laboratorios sin retrasar el proceso.</li>\n<li>Resolver dudas y notificar cambios en la cita.</li>\n</ul>\n<div class=\"callout amber\"><p>⚠️ <strong>El EDL no está relacionado con el SGMM (seguro de gastos médicos).</strong> Son dos beneficios completamente independientes dentro de la membresía. Realizarse o no el EDL no afecta ni activa la cobertura del seguro. Muchas GPs confunden ambos beneficios — es importante aclararlo desde el inicio.</p></div>\n\n<h3>💡 Importancia para Koltin</h3>\n<ul>\n<li>Fortalece la relación con las Grandes Personas, brindándoles valor más allá del servicio de cobertura médica.</li>\n<li>Permite a Koltin identificar tendencias y riesgos de salud en su comunidad, mejorando las estrategias de prevención.</li>\n</ul>\n<div class=\"callout blue\"><p>📅 <strong>Frecuencia recomendada:</strong> cada cliente debería realizar un EDL <strong>anual</strong> para mantener un monitoreo continuo de su bienestar.</p></div>\n\n<img src=\"/_blob/b0365074ec68d75a6c1efb3a19847179\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Qué estudios incluye el EDL?</p>\n</div>","sub2": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Basado en documentación operativa de Koltin.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar conocerás el proceso completo del EDL desde que el cliente crea su cuenta hasta el seguimiento médico posterior, incluyendo las diferencias por localidad.</p>\n<img src=\"/_blob/684adf6d806558c16f5634d5a1e6a92b\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">El recorrido completo del Estudio de Longevidad en Koltin</p>\n\n<h3>📍 Primero: confirma la localidad del cliente</h3>\n<p>El proceso varía según la localidad. Antes de cualquier paso, identifica dónde está el cliente:</p>\n<ul>\n<li><strong>CDMX:</strong> Ciudad de México / Estado de México — cita presencial en Clínica Santa Fe <em>o</em> virtual, según prefiera.</li>\n<li><strong>Monterrey:</strong> presencial en Clínica Koltin Monterrey. <em>Excepción:</em> si la GP tiene limitaciones de movilidad o distancia, el médico puede autorizar la modalidad virtual previa evaluación.</li>\n<li><strong>Foráneos:</strong> cualquier otro estado — solo videoconsulta, sin opción presencial.</li>\n</ul>\n<div class=\"callout amber\"><p>⚠️ Hay <strong>3 links de agenda distintos</strong>. Siempre confirma la localidad antes de enviar cualquier link — es fácil confundirlos.</p></div>\n<h3>🔁 Pasos comunes a todas las localidades</h3>\n<p><strong>1. Correo de bienvenida</strong><br>El cliente recibe su correo de bienvenida de Koltin.</p>\n<p><strong>2. Crear cuenta en la app</strong><br>El cliente descarga la app e ingresa su <strong>número de teléfono</strong>. Recibe un <strong>código de validación de 6 dígitos por WhatsApp</strong> (OTP) y puede activar reconocimiento facial o huella. <strong>No hay contraseña.</strong></p>\n<p><strong>3. Llenar expediente médico</strong><br>En la primera pantalla después de crear la cuenta, el cliente completa su <strong>expediente médico</strong>.</p>\n<p><strong>4. Órdenes de laboratorio automáticas</strong><br>Al completar el expediente, se generan automáticamente las órdenes para electrocardiograma, sangre y orina — descargables desde el portal. También se determina el triage de riesgo de fractura, que define si se genera además una orden de densitometría.</p>\n<p><strong>5. Estudios en Chopo</strong><br>El cliente agenda y acude a una sucursal de Laboratorios Chopo. Al realizar los estudios, Chopo sube los resultados automáticamente al expediente.</p>\n<p><strong>6. Generación del reporte</strong><br>Al llegar los resultados, el cliente recibe el mensaje: \"Ya tenemos tus resultados; en aproximadamente <strong>5 días hábiles</strong> generamos tu reporte de salud.\" Una vez listo el reporte, recibe el link para agendar su cita de entrega.</p>\n<p><strong>7. Recordatorios automáticos</strong><br>Se envían dos recordatorios via HubSpot: <strong>7 días antes</strong> y <strong>1 día antes</strong> de la cita. El recordatorio de 1 día en citas presenciales incluye la dirección de la clínica y recomendaciones previas para DXA/In-Body.</p>\n<p><strong>8. Seguimiento médico virtual</strong><br>Todo cliente recibe seguimiento médico virtual después del EDL, sin importar la localidad. La derivación a especialistas la decide el médico, no la Experta.</p>\n<h3>📍 Diferencias por localidad — entrega de resultados</h3>\n<div class=\"callout blue\"><p><strong>CDMX:</strong> La cita puede ser presencial en Clínica Santa Fe o virtual. En la cita presencial se realizan pruebas cognitivas, de fuerza y DXA/In-Body, y el reporte se entrega y explica en la misma visita.</p></div>\n<div class=\"callout blue\"><p><strong>Monterrey:</strong> Solo presencial en Clínica Koltin Monterrey. Incluye pruebas cognitivas, de fuerza e In-Body. El reporte se entrega y explica en la visita. <em>No existe opción virtual.</em></p></div>\n<div class=\"callout blue\"><p><strong>Foráneos:</strong> Solo videoconsulta. No hay clínica presencial, no hay In-Body, no hay pruebas cognitivas ni físicas. Solo los estudios de Chopo y la entrega virtual del reporte.</p></div>\n<div style=\"margin:.875rem 0\">\n<div style=\"font-size:.8125rem;font-weight:600;color:var(--n7);margin-bottom:.5rem\">🎬 Cómo se ve el EDL en Sails</div>\n<video controls style=\"width:100%;border-radius:10px;border:1px solid #D1FAE5;background:#000;max-height:380px\" preload=\"metadata\">\n  <source src=\"/_blob/367c8f5496850fb452b59414d10d779e\" type=\"video/mp4\">\n</video>\n<div style=\"font-size:.75rem;color:#6B7280;margin-top:.375rem\">Observa cómo avanza el proceso del EDL en el sistema Sails, desde el expediente hasta la confirmación de cita.</div>\n</div>\n<div class=\"callout amber\"><p>⚠️ <strong>Excepción Foráneos:</strong> clientes de <strong>Guerrero, Durango y Baja California</strong> no tienen cobertura de Chopo — la orden de laboratorio no se genera en automático. Escala la duda; no asumas un proceso alternativo.</p></div>\n\n<img src=\"/_blob/a7cf8c578e0f0fd2bb02a1b2bd7ed1c3\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Entrega de resultados por ciudad</p>\n</div>","sub3": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Basado en documentación operativa de Koltin.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás verificar el estado del expediente médico, entender qué se genera automáticamente, interpretar el triage de riesgo de fractura y saber cuándo y cómo escalar.</p>\n<img src=\"/_blob/a19598f27f186cff4de6ad7e3639c8e1\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Cómo se ve el EDL en el expediente médico?</p>\n\n<h3>🗂️ Cómo está organizado el expediente médico</h3>\n<p>El expediente médico de la Gran Persona está dividido en las siguientes pestañas:</p>\n<div style=\"display:flex;flex-wrap:wrap;gap:.4rem;margin:.625rem 0 .875rem\">\n  <span style=\"background:#fff;border:1.5px solid var(--g3);border-radius:var(--r-full);padding:.3rem .75rem;font-size:.8125rem;font-weight:600;color:var(--g9)\">🏠 Perfil</span>\n  <span style=\"background:#fff;border:1.5px solid var(--g3);border-radius:var(--r-full);padding:.3rem .75rem;font-size:.8125rem;font-weight:600;color:var(--g9)\">🩺 Diagnósticos</span>\n  <span style=\"background:#fff;border:1.5px solid var(--g3);border-radius:var(--r-full);padding:.3rem .75rem;font-size:.8125rem;font-weight:600;color:var(--g9)\">📋 Consultas</span>\n  <span style=\"background:var(--g5);border:1.5px solid var(--g5);border-radius:var(--r-full);padding:.3rem .75rem;font-size:.8125rem;font-weight:600;color:#fff\">🧬 Estudio longevidad ←</span>\n  <span style=\"background:#fff;border:1.5px solid var(--g3);border-radius:var(--r-full);padding:.3rem .75rem;font-size:.8125rem;font-weight:600;color:var(--g9)\">📊 Resultados</span>\n  <span style=\"background:#fff;border:1.5px solid var(--g3);border-radius:var(--r-full);padding:.3rem .75rem;font-size:.8125rem;font-weight:600;color:var(--g9)\">📐 Mediciones y escalas</span>\n  <span style=\"background:#fff;border:1.5px solid var(--g3);border-radius:var(--r-full);padding:.3rem .75rem;font-size:.8125rem;font-weight:600;color:var(--g9)\">📜 Historia clínica</span>\n</div>\n<p>Esto es lo que contiene cada pestaña relevante para el trabajo del equipo Expertxs:</p>\n\n<h3>🧬 Estudio longevidad</h3>\n<p>Es la pestaña principal para todo lo relacionado con el EDL. Contiene tres secciones:</p>\n<ul>\n<li><strong>Línea del tiempo de ciclos:</strong> muestra los 7 pasos del ciclo de EDL con fecha y responsable de cada uno. Puedes seleccionar cada ciclo para ver sus pasos, los pendientes y el historial detallado. También puedes agregar un nuevo ciclo si es necesario.</li>\n<li><strong>Reportes de salud:</strong> lista todos los reportes generados para la GP con el ciclo al que pertenecen, la fecha de apertura y el estado. Puedes editarlos, eliminarlos y ver el historial detallado de cada reporte.</li>\n<li><strong>Resultados por ciclo:</strong> los resultados están segmentados por ciclo para que no estén mezclados. Puedes filtrar por ciclos anteriores y ver, descargar o eliminar los laboratorios (se abren en una pestaña aparte).</li>\n</ul>\n<p><strong>Los 7 pasos del ciclo de EDL que aparecen en la línea del tiempo:</strong></p>\n<div style=\"display:flex;flex-wrap:wrap;gap:.375rem;margin:.5rem 0 .875rem\">\n  <span style=\"background:var(--g1);border-radius:var(--r-full);padding:.25rem .7rem;font-size:.75rem;font-weight:600;color:var(--g9)\">1 · Expediente enviado</span>\n  <span style=\"background:var(--g1);border-radius:var(--r-full);padding:.25rem .7rem;font-size:.75rem;font-weight:600;color:var(--g9)\">2 · Expediente completado</span>\n  <span style=\"background:var(--g1);border-radius:var(--r-full);padding:.25rem .7rem;font-size:.75rem;font-weight:600;color:var(--g9)\">3 · Orden médica enviada</span>\n  <span style=\"background:var(--g1);border-radius:var(--r-full);padding:.25rem .7rem;font-size:.75rem;font-weight:600;color:var(--g9)\">4 · Estudios completados</span>\n  <span style=\"background:var(--g1);border-radius:var(--r-full);padding:.25rem .7rem;font-size:.75rem;font-weight:600;color:var(--g9)\">5 · Entrega de resultados agendada</span>\n  <span style=\"background:var(--g1);border-radius:var(--r-full);padding:.25rem .7rem;font-size:.75rem;font-weight:600;color:var(--g9)\">6 · Reporte entregado</span>\n  <span style=\"background:var(--g1);border-radius:var(--r-full);padding:.25rem .7rem;font-size:.75rem;font-weight:600;color:var(--g9)\">7 · DXA completado</span>\n</div>\n<p>Cada paso muestra la fecha en que ocurrió y quién lo completó (Sistema Koltin o el nombre de la persona del equipo). El paso \"Estudios completados\" desglosa cada estudio con su fecha individual. El paso <strong>DXA completado</strong> solo aparece si el triage del expediente indicó riesgo de fractura — si no aplica, la línea de tiempo muestra 6 pasos.</p>\n<img src=\"/_blob/899131bf27b45f2f65526b78464dc087\" alt=\"Línea del tiempo del EDL — ciclo completo\" style=\"width:100%;border-radius:var(--r);border:1px solid var(--g1);margin:.625rem 0\">\n<div class=\"callout amber\"><p>⚠️ <strong>Ejemplo de ciclo completo no apto para renovación:</strong> todos los pasos aparecen completados, pero si el último reporte fue entregado hace menos de 6 meses, no se puede iniciar un nuevo ciclo todavía.</p></div>\n\n<h3>📊 Resultados</h3>\n<p>Muestra todos los documentos subidos al expediente de la GP — desde alguna cita, desde una consulta, o subidos de forma manual. Los documentos se vinculan al ciclo activo de la GP. Puedes ver, descargar y eliminar. El expediente separa los documentos actuales del histórico; el histórico sigue disponible para consulta pero ya no permite subir archivos nuevos.</p>\n\n<h3>📐 Mediciones y escalas</h3>\n<ul>\n<li><strong>Signos vitales:</strong> puedes revisarlos, editarlos y acceder al historial registrado a lo largo del tiempo.</li>\n<li><strong>Calculadoras:</strong> diabetes, riesgo de fractura, función renal y riesgo cardiovascular. Solo aparecen si hay información suficiente para calcularlas — no hay espacios vacíos.</li>\n<li><strong>Escalas:</strong> fuerza de prensión y Downton, con vista más visual. Al hacer clic te lleva a la sección de consulta donde se capturaron los datos. Solo aparecen si la GP tiene datos capturados.</li>\n<li><strong>InBody:</strong> muestra la fecha de medición y todos los datos del estudio una vez que la GP lo realizó.</li>\n</ul>\n\n<h3>📜 Historia clínica</h3>\n<p>Contiene la información que la GP proporcionó en el formulario de consentimiento. <strong>No es editable — solo es de consulta.</strong> Muestra la fecha en que la GP llenó el formulario y toda la información que proporcionó. Solo aparecen los campos con respuesta, sin espacios vacíos.</p>\n<div class=\"callout amber\"><p>Si es necesario editar el formulario: clic en \"Editar\" → llenar → confirmar. Al confirmar, los datos actualizados quedan disponibles de inmediato para consulta.</p></div>\n<div style=\"margin:.875rem 0\">\n<div style=\"font-size:.8125rem;font-weight:600;color:var(--n7);margin-bottom:.5rem\">🎬 Funciones del expediente de la Gran Persona</div>\n<video controls style=\"width:100%;border-radius:10px;border:1px solid #D1FAE5;background:#000;max-height:380px\" preload=\"metadata\">\n  <source src=\"/_blob/de47f5fd6bd6526d661749f99207d5a2\" type=\"video/mp4\">\n</video>\n<div style=\"font-size:.75rem;color:#6B7280;margin-top:.375rem\">Recorrido completo del expediente médico y sus secciones. Presta atención a la pestaña \"Estudio longevidad\".</div>\n</div>\n<h3>📋 Estado clave a verificar</h3>\n<p>La frase que confirma que el expediente está completo es:</p>\n<div class=\"callout green\"><p><strong>\"La Gran Persona completó su expediente\"</strong></p></div>\n<p>Mientras no aparezca este estado, las órdenes de laboratorio no se habrán generado. Este es el primer dato que debes revisar antes de cualquier escalamiento.</p>\n<h3>⚙️ ¿Qué se genera automáticamente al completar el expediente?</h3>\n<ul>\n<li>Órdenes de laboratorio: electrocardiograma, sangre y orina.</li>\n<li>Resultado del triage de riesgo de fractura: <strong>\"DXA requerida\"</strong> o <strong>\"DXA no requerida\"</strong> (también puede aparecer como \"con riesgo\" / \"sin riesgo de fractura\").</li>\n<li>Si el triage indica riesgo de fractura en Monterrey o Foráneos: también se genera una orden de <strong>densitometría de cadera</strong> para Chopo.</li>\n</ul>\n<div class=\"callout amber\"><p>⚠️ <strong>El triage de riesgo de fractura define desde el inicio qué prueba se realiza</strong> — no es una decisión que tome el médico después de la visita. Esto aplica en las 3 localidades.</p></div>\n<h3>🦴 ¿Qué significa DXA requerida / no requerida?</h3>\n<ul>\n<li><strong>CDMX con riesgo (DXA requerida):</strong> densitometría con Manu (radiólogo) en consultorio — evalúa hueso y composición corporal.</li>\n<li><strong>CDMX sin riesgo (DXA no requerida):</strong> In-Body con enfermería — solo composición corporal. Nunca ambas.</li>\n<li><strong>Monterrey con riesgo:</strong> densitometría de cadera en Chopo (hueso, sin composición corporal) + In-Body en clínica (siempre).</li>\n<li><strong>Monterrey sin riesgo:</strong> solo In-Body en clínica.</li>\n<li><strong>Foráneos con riesgo:</strong> densitometría de cadera en Chopo (sin composición corporal). No hay In-Body.</li>\n<li><strong>Foráneos sin riesgo:</strong> solo laboratorio. Sin prueba de composición corporal.</li>\n</ul>\n<img src=\"/_blob/7d18cf9f30d807e0c0ae3beeda4ce578\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Checklist — cliente sin órdenes de laboratorio</p>\n\n<h3>✅ Checklist: cliente sin órdenes de laboratorio</h3>\n<ul>\n<li>Verifica que el expediente diga: \"La Gran Persona completó su expediente\".</li>\n<li>Revisa que en el apartado de documentos ya estén cargadas las órdenes.</li>\n<li>Si están: indícale que puede descargarlas desde su portal, o compártelas por WhatsApp o correo.</li>\n<li>Si cumple todos los pasos anteriores y las órdenes no aparecen: valida en Slack genera las órdenes manualmente desde el apartado de órdenes médicas usando el número de certificado y envíaselas.</li>\n</ul>\n<div class=\"callout blue\"><p>💡 <strong>Si las órdenes no aparecen:</strong> genera las órdenes manualmente desde el apartado de <strong>órdenes médicas</strong> usando el número de certificado de la GP. Envíaselas para que pueda descargarlas, imprimirlas y agendar en Chopo.</p></div>\n<h3>📦 Resultados de Chopo</h3>\n<p>Al llegar los resultados de Chopo, se suben automáticamente al expediente. El cliente recibe el mensaje de aviso. Solo en expedientes anteriores al 31 de julio de 2026 los resultados se cargan de forma manual — esto lo hace únicamente el equipo de enfermería.</p>\n</div>","sub5": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Basado en sesión con Katia, Oct 30 2026.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás cómo acompañar a una GP que ya completó su primer ciclo de EDL y necesita iniciar uno nuevo: qué verificar, cómo activar el ciclo y cómo gestionar las órdenes médicas.</p>\n<img src=\"/_blob/54dad18dd5a5fb818388b28c68c21402\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">EDL después de la renovación — 5 pasos</p>\n\n<h3>¿Cuándo aplica este proceso?</h3>\n<p>Cuando una GP ya terminó su primer ciclo — es decir, completó su expediente y su estudio de longevidad durante su periodo de anualidad — y necesita iniciar un nuevo ciclo para repetir el EDL.</p>\n<div class=\"callout amber\"><p>⏱️ <strong>Regla de tiempo:</strong> El EDL se puede realizar a partir de <strong>6 meses</strong> del último estudio. Siempre verifica la fecha del último reporte antes de iniciar el nuevo ciclo.</p></div>\n<h3>Paso 1 · Verificar que el ciclo anterior esté completado</h3>\n<p>En atención clínica en Sales y en el expediente, abre el apartado de <strong>Estudio de longevidad</strong> y confirma que aparecen los siguientes 7 pasos en la línea del tiempo:</p>\n<ul>\n<li>✅ Expediente enviado</li>\n<li>✅ Expediente completado</li>\n<li>✅ Orden médica enviada</li>\n<li>✅ Estudios completados</li>\n<li>✅ Entrega de resultados agendada</li>\n<li>✅ Reporte entregado</li>\n<li>✅ DXA completado <span style=\"font-weight:400;color:var(--n5)\">(solo si aplica según el triage)</span></li>\n</ul>\n<img src=\"/_blob/899131bf27b45f2f65526b78464dc087\" alt=\"Línea del tiempo del EDL — ciclo completo\" style=\"width:100%;border-radius:var(--r);border:1px solid var(--g1);margin:.5rem 0\">\n<div class=\"callout amber\"><p>⚠️ Que el ciclo esté completo <strong>no significa que ya puedas iniciar uno nuevo</strong>. Siempre verifica también la fecha del último reporte entregado.</p></div>\n<h3>Paso 2 · Verificar la fecha y decidir cómo proceder</h3>\n<p>Revisa la fecha del último paso completado en el ciclo anterior. Hay dos escenarios:</p>\n\n<div class=\"callout green\"><p><strong>✅ Ciclo completo + más de 6 meses:</strong> todos los pasos están completados y ya transcurrieron 6 meses desde el último reporte. Puedes proceder directamente a iniciar un nuevo ciclo.</p></div>\n\n<div class=\"callout amber\"><p><strong>⚠️ Ciclo incompleto + más de 6 meses desde el último paso completado:</strong> algunos pasos no están marcados como completados, pero ya han pasado más de 6 meses. En este caso, usa el botón <strong>\"Editar pasos\"</strong> y activa todos los pasos restantes para cerrar el ciclo. Una vez cerrado, puedes iniciar el nuevo ciclo.</p></div>\n\n<img src=\"/_blob/fe28d6285b88b15836279548da2d78c6\" alt=\"Ciclo 2 — ciclo en proceso con pasos pendientes\" style=\"width:100%;border-radius:var(--r);border:1px solid var(--g1);margin:.5rem 0\">\n<p style=\"font-size:.8125rem;color:var(--n5);margin-bottom:.75rem\">Ejemplo de un ciclo en proceso: los primeros 3 pasos están completados y los siguientes 3 están pendientes. Si ya pasaron 6+ meses desde el último paso completado, se editan y activan todos para poder iniciar el nuevo ciclo.</p>\n\n<div class=\"callout blue\"><p>🎯 <strong>Objetivo:</strong> asegurarnos de que todas las GPs realicen su EDL de manera anual después de cada renovación. Nunca debe quedar un ciclo abierto indefinidamente.</p></div>\n\n<h3>Paso 3 · Iniciar el nuevo ciclo</h3>\n<p>Ve a <strong>Seleccionar ciclo → Nuevo</strong>. Informa a la GP que en un momento podrá acceder a su portal o a la app de Koltin para completar su expediente médico.</p>\n<h3>Paso 4 · Configurar el expediente correctamente</h3>\n<p>En el apartado de expediente médico, en lugar de dejarlo como <strong>\"Activo\"</strong>, cámbialo a <strong>\"Sin expediente\"</strong>. Esto permite que la GP edite y actualice su historial clínico y antecedentes.</p>\n<div class=\"callout green\"><p>💡 La información del expediente anterior <strong>se queda guardada</strong>. La GP solo necesita revisarla y agregar lo que haya ocurrido durante el período transcurrido.</p></div>\n<h3>Paso 5 · Generación de órdenes médicas</h3>\n<p>Una vez que la GP termina de revisar su expediente y presiona <strong>\"Guardar expediente\"</strong>, las órdenes médicas se generan automáticamente.</p>\n<div class=\"callout blue\"><p>⏳ Las órdenes pueden descargarse después de aproximadamente <strong>3 minutos</strong>. Si pasa ese tiempo y no pueden descargarse, genera las órdenes manualmente.</p></div>\n<h3>¿Cómo generar las órdenes manualmente?</h3>\n<p>Si las órdenes automáticas no están disponibles después de 3 minutos, ve al apartado de <strong>órdenes médicas</strong>, usa el <strong>número de certificado</strong> de la GP y genéralas desde ahí. Envíaselas para que pueda descargarlas, imprimirlas y agendar su cita en Chopo.</p>\n<div style=\"margin:.875rem 0\">\n<div style=\"font-size:.8125rem;font-weight:600;color:var(--n7);margin-bottom:.5rem\">🎬 Tutorial — Cómo se crean las órdenes médicas</div>\n<video controls style=\"width:100%;border-radius:10px;border:1px solid #D1FAE5;background:#000;max-height:380px\" preload=\"metadata\">\n  <source src=\"/_blob/7098789a9f24ab71be1f7f21d31b2707\" type=\"video/mp4\">\n</video>\n<div style=\"font-size:.75rem;color:#6B7280;margin-top:.375rem\">Referencia visual del proceso de creación de órdenes médicas cuando no se generan automáticamente.</div>\n</div>\n<h3>✅ Buenas prácticas</h3>\n<ul>\n<li>Siempre verifica primero que el ciclo anterior esté completamente cerrado antes de abrir uno nuevo.</li>\n<li>Confirma la fecha del último reporte — no inicies el ciclo si no han pasado 6 meses.</li>\n<li>Recuerda cambiar el expediente a \"Sin expediente\", no dejarlo como \"Activo\".</li>\n<li>Si las órdenes no aparecen en 3 minutos, no esperes más — genéralas manualmente.</li>\n</ul>\n</div>","sub4": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Basado en documentación operativa de Koltin.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar tendrás claridad sobre qué corresponde y qué no corresponde a las Expertas en el EDL, cuándo escalar y qué verificar antes de actuar.</p>\n<img src=\"/_blob/c84b7db1ac551caa71aaa273b1812b19\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Qué depende de nosotros como Expertxs?</p>\n\n<h3>✅ Sí corresponde a las Expertas</h3>\n<ul>\n<li>Brindar información clara y precisa sobre cómo iniciar, acceder y avanzar en el proceso del EDL.</li>\n<li>Apoyar si el cliente tiene dificultades para llenar su Historial Clínico (HC) o para ir a Chopo.</li>\n<li>Resolver dudas del cliente a lo largo del proceso.</li>\n<li>Notificar cambios en la cita.</li>\n<li>Verificar que los datos de contacto del cliente en HubSpot estén correctos (para que lleguen los recordatorios automáticos).</li>\n<li>Confirmar la localidad antes de enviar cualquier link de agenda.</li>\n</ul>\n<h3>🚫 No corresponde a las Expertas</h3>\n<ul>\n<li>Decidir qué pruebas se realizan (eso lo define el expediente desde el inicio).</li>\n<li>Interpretar resultados clínicos ni dar recomendaciones médicas.</li>\n<li>Derivar a especialistas (esa decisión es del médico).</li>\n<li>Dejar de atender a la GP sin resolver su situación.</li>\n<li>Asumir que todos los estados tienen cobertura de Chopo.</li>\n</ul>\n<div class=\"callout amber\"><p>⚠️ Siempre verifica primero que el expediente esté completo y revisa el apartado de documentos antes de generar las órdenes manualmente.</p></div>\n<img src=\"/_blob/dc579cc1ef8ade449140fc6f70abc1f5\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Cómo hablarle al cliente del EDL?</p>\n\n<h3>📌 Guiones para hablar con el cliente</h3>\n<div class=\"callout blue\"><p><strong>CDMX:</strong> \"Su cita en la Clínica de Santa Fe incluye pruebas cognitivas y de fuerza de manera presencial, lo que nos ayudará a brindarle un reporte mucho más completo. Al terminar, le entregamos su reporte y se lo explicamos ahí mismo.\"</p></div>\n<div class=\"callout blue\"><p><strong>Monterrey:</strong> \"Su cita en Clínica Koltin Monterrey incluye pruebas cognitivas y de fuerza (In-Body) de manera presencial. Al terminar, le entregamos su reporte y se lo explicamos ahí mismo.\"</p></div>\n<div class=\"callout blue\"><p><strong>Foráneos:</strong> \"Su reporte de salud integral se entrega y se explica en una videoconsulta con nuestro equipo de salud. Ahí también recibirá recomendaciones de seguimiento.\"</p></div>\n<h3>⚠️ Verificaciones antes de actuar</h3>\n<ul>\n<li>Confirma la localidad del cliente antes de enviar cualquier link de agenda — hay 3 links distintos.</li>\n<li>Si el cliente es de Guerrero, Durango o Baja California: escala la duda; no asumas un proceso alternativo.</li>\n<li>No asumir que la densitometría es automática: depende del resultado del triage de riesgo de fractura en el expediente.</li>\n<li>Verifica el corte del 31 de julio de 2026 al diagnosticar casos de órdenes faltantes.</li>\n</ul>\n<h3>📣 ¿Qué hacer si las órdenes no aparecen?</h3>\n<p>Si después de verificar que el expediente está completo y revisar el apartado de documentos las órdenes no aparecen: <strong>genera las órdenes manualmente</strong> desde el apartado de órdenes médicas usando el número de certificado de la GP. Envíaselas para que pueda
