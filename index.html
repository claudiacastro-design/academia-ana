<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Academia de Expertos · Koltin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --g9: #064E3B; --g7: #047857; --g5: #059669; --g3: #34D399; --g1: #D1FAE5; --g0: #ECFDF5;
  --n9: #111827; --n7: #374151; --n5: #6B7280; --n3: #D1D5DB; --n1: #F3F4F6; --n0: #FAFAFA;
  --amber: #D97706; --amber-bg: #FEF3C7; --red: #DC2626; --red-bg: #FEE2E2;
  --blue: #2563EB; --blue-bg: #EFF6FF;
  --bg: #F0FDF4; --surface: #fff;
  --r: 10px; --r-lg: 14px; --r-xl: 20px; --r-full: 9999px;
  --sh: 0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --sh-md: 0 4px 12px rgba(0,0,0,.09),0 2px 4px rgba(0,0,0,.05);
  --sh-lg: 0 10px 24px rgba(0,0,0,.11),0 4px 8px rgba(0,0,0,.06);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0);
  padding-bottom: env(safe-area-inset-bottom,0);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--n9);min-height:100vh;-webkit-font-smoothing:antialiased}
.view{display:none;min-height:100vh;flex-direction:column}
.view.on{display:flex}

/* ── TYPOGRAPHY ── */
h1{font-size:1.625rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
h2{font-size:1.25rem;font-weight:700;letter-spacing:-.015em;line-height:1.3}
h3{font-size:1.0625rem;font-weight:600;line-height:1.35}
h4{font-size:.9375rem;font-weight:600}
p{font-size:.9375rem;line-height:1.65;color:var(--n5)}

/* ── UTILS ── */
.flex{display:flex}.col{flex-direction:column}.gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-4{gap:1rem}.gap-6{gap:1.5rem}
.ai-c{align-items:center}.jc-b{justify-content:space-between}.jc-c{justify-content:center}.tc{text-align:center}
.w100{width:100%}.ml-a{margin-left:auto}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.375rem;border:none;border-radius:var(--r);font-size:.9375rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--g5);color:#fff}
.btn-primary:hover{background:var(--g7);box-shadow:var(--sh-md);transform:translateY(-1px)}
.btn-primary:active{transform:none;box-shadow:none}
.btn-ghost{background:transparent;color:var(--n5);padding:.625rem .875rem;font-size:.875rem}
.btn-ghost:hover{background:var(--n1);color:var(--n9)}
.btn-outline{background:transparent;border:1.5px solid var(--g5);color:var(--g7)}
.btn-outline:hover{background:var(--g0)}
.btn-muted{background:var(--n1);color:var(--n7)}
.btn-muted:hover{background:var(--n3)}
.btn-sm{padding:.5rem 1rem;font-size:.8125rem}
.btn-lg{padding:.875rem 2rem;font-size:1rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.25rem .625rem;border-radius:var(--r-full);font-size:.75rem;font-weight:600}
.bg{background:var(--g1);color:var(--g9)}
.ba{background:var(--amber-bg);color:#92400E}
.br{background:var(--red-bg);color:#991B1B}
.bb{background:var(--blue-bg);color:#1E40AF}
.bn{background:var(--n1);color:var(--n7)}

/* ── CARDS ── */
.card{background:var(--surface);border-radius:var(--r-lg);padding:1.25rem;box-shadow:var(--sh);border:1px solid var(--g1)}

/* ── PROGRESS ── */
.pbar{height:7px;background:var(--n1);border-radius:var(--r-full);overflow:hidden}
.pfill{height:100%;background:var(--g5);border-radius:var(--r-full);transition:width .6s cubic-bezier(.4,0,.2,1)}
.pfill.amber{background:var(--amber)}
.pfill.red{background:var(--red)}

/* ── FORMS ── */
.label{display:block;font-size:.8125rem;font-weight:600;color:var(--n7);margin-bottom:.375rem}
.input{width:100%;padding:.75rem 1rem;border:1.5px solid var(--n3);border-radius:var(--r);font-size:.9375rem;color:var(--n9);background:#fff;transition:border-color .15s,box-shadow .15s;outline:none;font-family:inherit}
.input:focus{border-color:var(--g5);box-shadow:0 0 0 3px rgba(5,150,105,.15)}
.input::placeholder{color:var(--n5)}
.hint{font-size:.75rem;color:var(--n5);margin-top:.3rem}

/* ══════════════════════════════════
   LOGIN
══════════════════════════════════ */
#vLogin{background:linear-gradient(150deg,var(--g9) 0%,var(--g7) 60%,#0E7490 100%);align-items:center;justify-content:center;padding:2rem}
.login-card{background:#fff;border-radius:var(--r-xl);padding:2.5rem;width:100%;max-width:420px;box-shadow:var(--sh-lg)}
.login-logo{text-align:center;margin-bottom:2rem}
.logo-mark{display:inline-flex;align-items:center;justify-content:center;width:60px;height:60px;background:var(--g5);border-radius:14px;font-size:1.625rem;margin-bottom:.875rem;box-shadow:0 4px 12px rgba(5,150,105,.4)}
.login-logo h2{font-size:1.25rem;color:var(--n9);font-weight:800}
.login-logo p{font-size:.8125rem;color:var(--n5);margin:.2rem 0 0}
.demo-pill{display:inline-flex;align-items:center;gap:.375rem;background:var(--amber-bg);color:#92400E;font-size:.75rem;font-weight:600;padding:.3rem .75rem;border-radius:var(--r-full);margin-bottom:1.25rem}
.fg{margin-bottom:.875rem}
.quick-divider{border-top:1px solid var(--n1);margin:1.125rem 0;display:flex;align-items:center;gap:.75rem}
.quick-divider span{font-size:.75rem;color:var(--n5);white-space:nowrap}
.quick-divider::before,.quick-divider::after{content:'';flex:1;height:1px;background:var(--n1)}
.quick-btns{display:flex;gap:.5rem;flex-wrap:wrap}
.qbtn{padding:.35rem .75rem;background:var(--g0);border:1px solid var(--g1);border-radius:var(--r-full);font-size:.75rem;font-weight:500;color:var(--g9);cursor:pointer;transition:all .15s;font-family:inherit}
.qbtn:hover{background:var(--g1);border-color:var(--g3)}

/* ══════════════════════════════════
   APP SHELL
══════════════════════════════════ */
.appbar{background:#fff;border-bottom:1px solid var(--g1);padding:0 1.5rem;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:.625rem;font-weight:800;font-size:.9375rem;color:var(--g9);cursor:pointer;letter-spacing:-.01em}
.brand-k{width:30px;height:30px;background:var(--g5);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.875rem}
.appbar-r{display:flex;align-items:center;gap:.75rem}
.ava{width:32px;height:32px;background:var(--g1);color:var(--g9);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8125rem}
.user-chip{display:flex;align-items:center;gap:.5rem;font-size:.8125rem;color:var(--n7);font-weight:500}
.main{flex:1;padding:1.5rem;max-width:860px;width:100%;margin:0 auto}

/* ══════════════════════════════════
   DASHBOARD
══════════════════════════════════ */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.875rem;margin-bottom:1.5rem}
.stat{background:#fff;border-radius:var(--r-lg);padding:1.125rem;box-shadow:var(--sh);border:1px solid var(--g1)}
.stat-n{font-size:2rem;font-weight:800;color:var(--g9);line-height:1}
.stat-l{font-size:.75rem;color:var(--n5);margin-top:.25rem;font-weight:500}

/* Module card – accent top border instead of full gradient header */
.mcard{background:#fff;border-radius:var(--r-lg);border:1px solid var(--g1);border-top:3px solid var(--g5);box-shadow:var(--sh);cursor:pointer;transition:all .2s;margin-bottom:1rem}
.mcard:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:var(--g3);border-top-color:var(--g5)}
.mcard-head{padding:1.125rem 1.25rem .875rem;border-bottom:1px solid var(--g0)}
.mcard-body{padding:.875rem 1.25rem}
.mcard-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.mcard-emoji{font-size:1.375rem}
.subtopic-line{display:flex;align-items:center;gap:.625rem;padding:.5rem 0;border-bottom:1px solid var(--n1);cursor:pointer;border-radius:6px;transition:background .12s;padding-left:.25rem;padding-right:.25rem}
.subtopic-line:last-child{border-bottom:none}
.subtopic-line:hover{background:var(--g0)}
.sub-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8125rem;flex-shrink:0}
.next-card{background:#fff;border-radius:var(--r-lg);padding:1.125rem 1.25rem;box-shadow:var(--sh);border-left:3px solid var(--g5);border-top:1px solid var(--g1);border-right:1px solid var(--g1);border-bottom:1px solid var(--g1);display:flex;align-items:center;gap:1rem;margin-top:1.25rem}

/* ══════════════════════════════════
   STAGE NAVIGATOR
══════════════════════════════════ */
.bc{display:flex;align-items:center;gap:.375rem;font-size:.8125rem;color:var(--n5);margin-bottom:1.125rem;flex-wrap:wrap}
.bc-link{color:var(--g7);cursor:pointer;font-weight:500}
.bc-link:hover{text-decoration:underline}
.bc-sep{color:var(--n3)}

.stage-track{display:flex;align-items:center;margin-bottom:1.5rem}
.stage-item{display:flex;align-items:center;gap:.5rem;padding:.625rem .875rem;border-radius:var(--r);font-size:.8125rem;font-weight:600;color:var(--n5);background:var(--n1);flex:1;transition:all .2s}
.clickable-stage:hover{opacity:.8;transform:translateY(-1px)}
.stage-item.active{background:var(--g1);color:var(--g9)}
.stage-item.done{background:var(--g5);color:#fff}
.stage-connector{width:12px;height:2px;background:var(--n3);flex-shrink:0;transition:background .3s}
.stage-connector.done{background:var(--g5)}
.stage-num{width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:.6875rem;font-weight:700;flex-shrink:0}
.stage-item.active .stage-num{background:var(--g5);color:#fff}
.stage-item.done .stage-num{background:rgba(255,255,255,.25);color:#fff}

/* ══════════════════════════════════
   READING CONTENT
══════════════════════════════════ */
.prov{background:var(--amber-bg);border:1px solid #FDE68A;border-radius:var(--r);padding:.75rem 1rem;margin-bottom:1.125rem;display:flex;align-items:flex-start;gap:.5rem;font-size:.8125rem;color:#92400E;font-weight:500}
.reading h3{color:var(--g9);margin:1.375rem 0 .5rem;display:flex;align-items:center;gap:.5rem;font-size:.9375rem}
.reading h3:first-child{margin-top:0}
.reading p{margin-bottom:.625rem;font-size:.9rem}
.reading ul{padding-left:1.25rem;margin-bottom:.625rem;color:var(--n5);font-size:.9rem;line-height:1.65}
.reading li{margin-bottom:.25rem}
.callout{border-radius:0 var(--r) var(--r) 0;padding:.75rem 1rem;margin:.875rem 0;border-left:3px solid}
.callout.green{background:var(--g0);border-left-color:var(--g5)}
.callout.amber{background:var(--amber-bg);border-left-color:var(--amber)}
.callout.blue{background:var(--blue-bg);border-left-color:var(--blue)}
.callout p{margin:0;font-size:.875rem;color:var(--n7)}

/* ══════════════════════════════════
   ANIMATION STAGE
══════════════════════════════════ */
.anim-wrap{background:var(--g0);border:1px solid var(--g1);border-radius:var(--r-lg);padding:1.5rem;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative}
.anim-step-card{background:#fff;border:2px solid var(--g3);border-radius:var(--r-lg);padding:1.75rem 1.5rem;width:100%;max-width:360px;text-align:center;box-shadow:0 4px 16px rgba(5,150,105,.12);transition:opacity .3s ease,transform .3s ease}
.anim-step-card.hide{opacity:0;transform:scale(.96)}
.anim-step-emoji{font-size:2.5rem;margin-bottom:.625rem;line-height:1}
.anim-step-title{font-size:1rem;font-weight:700;color:var(--g9);margin-bottom:.375rem}
.anim-step-sub{font-size:.875rem;color:var(--n5)}
.anim-nav{display:flex;align-items:center;gap:1rem;margin-top:1.25rem;justify-content:center}
.anim-counter{font-size:.8125rem;font-weight:600;color:var(--n5);min-width:80px;text-align:center}
.anim-hint{font-size:.75rem;color:var(--n5);margin-top:.625rem;font-style:italic}

/* ══════════════════════════════════
   EXAM
══════════════════════════════════ */
.q-block{margin-bottom:1.375rem;padding-bottom:1.375rem;border-bottom:1px solid var(--n1)}
.q-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.q-head{display:flex;gap:.625rem;align-items:flex-start;margin-bottom:.875rem}
.q-num{width:24px;height:24px;border-radius:50%;background:var(--g1);color:var(--g9);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0;margin-top:.1rem}
.q-text{font-size:.9375rem;font-weight:600;color:var(--n9);line-height:1.45}
.opts{display:flex;flex-direction:column;gap:.4375rem}
.opt{display:flex;align-items:flex-start;gap:.75rem;padding:.75rem .875rem;border:1.5px solid var(--n3);border-radius:var(--r);background:#fff;text-align:left;cursor:pointer;transition:all .15s;font-family:inherit;font-size:.8875rem;color:var(--n7);line-height:1.45;width:100%}
.opt:hover{border-color:var(--g3);background:var(--g0)}
.opt.sel{border-color:var(--g5);background:var(--g1);color:var(--g9);font-weight:500}
.opt.correct{border-color:#16A34A;background:#F0FFF4;color:#14532D}
.opt.wrong{border-color:var(--red);background:var(--red-bg);color:#991B1B}
.opt-l{width:22px;height:22px;border-radius:50%;background:var(--n1);color:var(--n5);display:flex;align-items:center;justify-content:center;font-size:.6875rem;font-weight:700;flex-shrink:0;transition:all .15s}
.opt.sel .opt-l{background:var(--g5);color:#fff}
.opt.correct .opt-l{background:#16A34A;color:#fff}
.opt.wrong .opt-l{background:var(--red);color:#fff}

/* ══════════════════════════════════
   RESULTS
══════════════════════════════════ */
.score-ring{width:136px;height:136px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 1.25rem;border:6px solid}
.score-ring.pass{border-color:var(--g5);background:var(--g0)}
.score-ring.fail{border-color:var(--amber);background:var(--amber-bg)}
.score-n{font-size:2.25rem;font-weight:800;line-height:1}
.score-ring.pass .score-n{color:var(--g9)}
.score-ring.fail .score-n{color:#92400E}
.score-sub{font-size:.7rem;color:var(--n5);font-weight:500}
.review-item{margin-bottom:.75rem;padding:.875rem;border-radius:var(--r);border:1px solid}
.review-item.ok{background:#F0FFF4;border-color:#86EFAC}
.review-item.ko{background:var(--red-bg);border-color:#FCA5A5}
.review-q{font-size:.8125rem;font-weight:600;color:var(--n9);margin-bottom:.375rem}
.review-ans{font-size:.8rem;margin:.125rem 0}
.review-exp{font-size:.8rem;color:var(--n5);margin-top:.375rem}

/* ══════════════════════════════════
   ADMIN
══════════════════════════════════ */
.admin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.875rem;margin-bottom:1.5rem}
.atab{display:flex;gap:0;border-bottom:2px solid var(--n1);margin-bottom:1.25rem}
.atab-btn{padding:.5rem 1rem;font-size:.875rem;font-weight:600;color:var(--n5);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;font-family:inherit;transition:all .15s}
.atab-btn:hover{color:var(--n9)}
.atab-btn.on{color:var(--g7);border-bottom-color:var(--g5)}
.atable{width:100%;border-collapse:collapse;font-size:.875rem}
.atable th{text-align:left;padding:.625rem 1rem;background:var(--n0);color:var(--n5);font-size:.75rem;font-weight:600;border-bottom:1px solid var(--n3)}
.atable td{padding:.8125rem 1rem;border-bottom:1px solid var(--n1);color:var(--n7)}
.atable tr:last-child td{border-bottom:none}
.atable tr:hover td{background:var(--g0)}

@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fin{animation:fadein .25s ease forwards}

@media(max-width:640px){
  .main{padding:1rem}
  .stat-row{grid-template-columns:repeat(2,1fr)}
  .admin-stats{grid-template-columns:repeat(2,1fr)}
  h1{font-size:1.375rem}
  .stage-item{font-size:.75rem;padding:.5rem .625rem}
}

.admin-jump{cursor:pointer;opacity:.85;transition:opacity .15s}.admin-jump:hover{opacity:1;outline:2px dashed var(--g5);outline-offset:2px;border-radius:6px}
button:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
/* ══ JUEGOS ══ */
.game-wrap{background:var(--g0);border:1px solid var(--g1);border-radius:var(--r-lg);padding:1.25rem;min-height:280px}
/* Scenario */
.sc-card{background:#fff;border-radius:var(--r);padding:1.125rem;margin-bottom:.875rem;box-shadow:var(--sh);border:1px solid var(--g1)}
.sc-txt{font-size:.9375rem;font-weight:600;color:var(--n9);margin-bottom:.875rem;line-height:1.5}
.sc-opts{display:flex;flex-direction:column;gap:.5rem}
.sc-opt{padding:.75rem 1rem;border:1.5px solid var(--n3);border-radius:var(--r);background:#fff;cursor:pointer;font-size:.875rem;color:var(--n7);text-align:left;font-family:inherit;transition:all .15s;width:100%}
.sc-opt:hover{border-color:var(--g3);background:var(--g0)}
.sc-opt.ok{border-color:var(--g5);background:var(--g0);color:var(--g9);font-weight:500}
.sc-opt.ko{border-color:var(--red);background:var(--red-bg);color:#991B1B}
/* Memorama */
.memo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;max-width:480px;margin:0 auto}
.memo-card{min-height:70px;border-radius:var(--r);cursor:pointer;perspective:600px;position:relative}
.m-front,.m-back{position:absolute;inset:0;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;text-align:center;padding:.5rem;backface-visibility:hidden;transition:transform .35s}
.m-front{background:var(--g5);color:#fff}
.m-back{background:#fff;border:2px solid var(--g3);color:var(--g9);transform:rotateY(180deg)}
.memo-card.flip .m-front{transform:rotateY(-180deg)}
.memo-card.flip .m-back{transform:rotateY(0)}
.memo-card.match .m-back{background:var(--g1);border-color:var(--g5)}
/* True/False */
.tf-stmt{font-size:1rem;font-weight:600;color:var(--n9);text-align:center;padding:1.125rem;background:#fff;border-radius:var(--r);margin-bottom:1rem;line-height:1.45;box-shadow:var(--sh);border:1px solid var(--g1)}
.tf-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.tf-btn{padding:.875rem;border-radius:var(--r);font-size:1rem;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.tf-btn.v{background:var(--g1);color:var(--g9)}.tf-btn.v:hover{background:var(--g5);color:#fff}
.tf-btn.f{background:var(--red-bg);color:#991B1B}.tf-btn.f:hover{background:var(--red);color:#fff}
.tf-score{font-size:1.5rem;font-weight:800;color:var(--g9);text-align:center;margin:.5rem 0}
/* Sequence */
.seq-zone{display:flex;flex-direction:column;gap:.4rem}
.seq-item{display:flex;align-items:center;gap:.625rem;padding:.625rem .875rem;border:1.5px solid var(--n3);border-radius:var(--r);cursor:pointer;font-size:.875rem;color:var(--n7);font-family:inherit;background:#fff;transition:all .15s;width:100%;text-align:left}
.seq-item:hover{border-color:var(--g3);background:var(--g0)}
.seq-item.placed{border-color:var(--g5);background:var(--g1);color:var(--g9);cursor:default}
.seq-item.ok{border-color:var(--g5);background:var(--g0)}
.seq-item.ko{border-color:var(--red);background:var(--red-bg)}
.seq-num{width:24px;height:24px;border-radius:50%;background:var(--n1);color:var(--n5);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.seq-item.placed .seq-num{background:var(--g5);color:#fff}
/* Word Search */
.ws-grid-wrap{overflow-x:auto;text-align:center}
.ws-grid{display:inline-grid;gap:2px}
.ws-cell{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.6875rem;font-weight:700;cursor:pointer;border-radius:4px;background:#fff;color:var(--n7);user-select:none;border:1px solid var(--n1);transition:all .1s}
.ws-cell.sel{background:var(--amber-bg);color:#92400E;border-color:var(--amber)}
.ws-cell.found{background:var(--g1);color:var(--g9);border-color:var(--g3)}
.ws-words{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:.875rem;justify-content:center}
.ws-word{padding:.2rem .6rem;background:var(--n1);color:var(--n7);border-radius:var(--r-full);font-size:.75rem;font-weight:600}
.ws-word.found{background:var(--g1);color:var(--g9);text-decoration:line-through}
/* Hangman */
.hm-word{display:flex;gap:.375rem;justify-content:center;flex-wrap:wrap;margin:.75rem 0}
.hm-l{width:28px;height:36px;border-bottom:2px solid var(--n9);display:flex;align-items:center;justify-content:center;font-size:1.125rem;font-weight:700;color:var(--g9)}
.hm-keys{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;max-width:320px;margin:0 auto}
.hm-k{width:30px;height:30px;border-radius:6px;font-size:.8rem;font-weight:700;cursor:pointer;border:1.5px solid var(--n3);background:#fff;font-family:inherit;transition:all .12s;color:var(--n7)}
.hm-k:hover:not(:disabled){background:var(--g1);border-color:var(--g5);color:var(--g9)}
.hm-k:disabled{cursor:not-allowed;opacity:.5}
.hm-k.ko{background:var(--red-bg)!important;border-color:var(--red)!important;color:var(--red)!important}
.hm-k.ok{background:var(--g1)!important;border-color:var(--g5)!important;color:var(--g9)!important}

<script type="application/json" id="reads-json">{"subs_t": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Capacitación nuevo módulo de siniestros, nov 2026.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás clasificar cualquier caso de siniestro correctamente, llenar el triage en el nuevo sistema y evitar los errores que más afectan la calidad del proceso.</p>\n\n<h3>🔍 ¿Qué es el triage de siniestros?</h3>\n<p>El triage es el primer registro del caso: recopila la información del asegurado, clasifica el tipo de siniestro y abre el expediente que Care Coordination y el equipo de Ops Control usarán para dar seguimiento. <strong>Tu rol termina cuando das clic en Enviar.</strong> El sistema envía automáticamente los correos y notificaciones correspondientes.</p>\n\n<img src=\"/_blob/6a3564c55406c28d1a5b3766b9b0b72b\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">3 tipos de caso en el triage</p>\n\n<h3>📋 Los 3 tipos de caso</h3>\n<ul>\n<li><strong>Emergencia</strong> — Urgencia médica o accidente grave. Va a la pestaña de Emergencias del sistema. Care Coordination determina la salida: incidencia, siniestro o reembolso.</li>\n<li><strong>Programación / Reembolso</strong> — Cirugía o tratamiento planificado, o gastos que la GP ya realizó. Va a la pestaña de Siniestros.</li>\n<li><strong>Incidencia</strong> — Casos sin diagnóstico claro, consultas informativas o situaciones que podrían convertirse en siniestro a futuro. Va a la pestaña de Incidencias.</li>\n</ul>\n<div class=\"callout blue\"><p>💡 <strong>Criterio para incidencia:</strong> si el cliente solo está preguntando cómo funciona el seguro, no tiene diagnóstico o el gasto aún no supera el deducible, es una incidencia. Estadísticamente, el 50% de estos casos no avanza a un siniestro real.</p></div>\n<p><strong>Campos del triage de incidencia:</strong> Aseguradora · Nombre · Póliza · Certificado · Estado · Especialidad → Motivo/Descripción · Contexto y acciones tomadas.</p>\n\n<h3>⚠️ La regla de oro: Accidente vs Enfermedad</h3>\n<p>Esta clasificación cambia todo y debe confirmarse verbalmente con la GP:</p>\n<ul>\n<li><strong>Enfermedad</strong> — Aplican deducible y coaseguro (20%, topado a $20,000). No se cubren preexistencias ni estudios previos al diagnóstico.</li>\n<li><strong>Accidente</strong> — NO aplican deducible ni coaseguro. Cubierto desde el primer peso, <strong>siempre que el primer gasto comprobable sea dentro de los primeros 30 días del accidente.</strong> Si no puede comprobarse, se trata como enfermedad.</li>\n</ul>\n\n<div class=\"callout blue\"><p>🖥️ Accede al triage desde: <a href=\"https://koltin-bandeja.vercel.app/triage.html\" target=\"_blank\"><strong>koltin-bandeja.vercel.app/triage.html</strong></a></p></div>\n<img src=\"/_blob/a82cd500371301817c20fa5ed284c990\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.75rem\">Triage de Emergencias — Página 1: identificación y datos del asegurado</p>\n<img src=\"/_blob/d860edbdc466807ad6c2d953dd73fc2a\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.75rem\">Triage de Emergencias — Página 2: WhatsApp, correo y envío</p>\n<div class=\"callout amber\"><p>⚠️ <strong>Regla para todos los tipos de caso:</strong> antes de registrar, revisa en Slack si ya existe un reporte previo para ese certificado. Los siniestros duplicados manchan la data y dificultan el control y seguimiento de todos los equipos.</p></div>\n\n<h3>📝 Cómo llenar el triage correctamente</h3>\n<p><strong>Campos clave del triage:</strong></p>\n<ul>\n<li><strong>Número de certificado</strong> — Al ingresarlo, el sistema carga automáticamente los datos del asegurado y su cobertura.</li>\n<li><strong>Tipo</strong> — Emergencia, Programación, Reembolso o Incidencia.</li>\n<li><strong>Diagnóstico / Sintomatología</strong> — Escribe síntomas concretos: <em>dolor de rodilla, sangrado, fiebre alta, fractura</em>. ❌ NO escribas contexto aquí: \"se cayó el 15 de septiembre jugando con su nieto\" va en el campo Contexto.</li>\n<li><strong>Especialidad</strong> — Ayuda a determinar la ruta del cliente. Ej: dolor de rodilla → músculo esquelético (MSK).</li>\n<li><strong>Médico tratante</strong> — Nombre y especialidad.</li>\n<li><strong>Contexto</strong> — Aquí sí va la historia: cuándo ocurrió, cómo, qué estaba haciendo.</li>\n<li><strong>Acciones</strong> — Si quedaron en algo concreto al cierre de la llamada (opcional).</li>\n</ul>\n<div class=\"callout amber\"><p>⚠️ <strong>Segundas opiniones:</strong> ciertos casos requieren segunda opinión médica — principalmente MSK, cardiología y urología en CDMX, Monterrey y Guadalajara. La especialidad que captures determina si se activa este proceso. Llénalas con precisión.</p></div>\n\n<h3>🚫 Evitar duplicados</h3>\n<p>Antes de registrar un nuevo caso, verifica si ya existe un siniestro activo para ese certificado. El sistema muestra todos los casos relacionados al ingresar el número de certificado. Un duplicado mancha la data y complica el seguimiento.</p>\n\n<h3>✅ Tu rol termina aquí</h3>\n<p>Una vez que das clic en <strong>Enviar</strong>, el sistema manda automáticamente los correos y notificaciones. No necesitas regresar a Slack ni hacer nada más. El estado del caso lo actualiza el equipo de Ops Control en tiempo real.</p>\n</div>","subs_e": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Emergencias / Atención de Urgencia, Guía para Expertxs.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar podrás actuar con rapidez y empatía en una emergencia: clasificar el tipo de urgencia, verificar en Vigor, orientar al hospital correcto según el nivel y registrar el caso correctamente.</p>\n\n<h3>🚨 ¿Qué es una emergencia?</h3>\n<p>Una crisis de salud repentina, un accidente grave o cualquier situación que requiera atención médica inmediata. Aquí no hay tiempo para trámites largos. Tu trabajo es triple: <strong>comprender la situación, verificar el estatus y orientar de inmediato hacia la atención correcta.</strong></p>\n<div class=\"callout amber\"><p>⚠️ Nunca garantices cobertura o autorización — esa decisión es siempre de la aseguradora.</p></div>\n\n<h3>📊 Cómo clasificar lo que te llega</h3>\n<ul>\n<li><strong>Urgencia médica / accidente grave</strong> — Compromete la salud o la vida. Atención inmediata: hospital más cercano dentro de su nivel.</li>\n<li><strong>Accidente menor</strong> — Golpes, torceduras, heridas superficiales. No es crítico pero puede requerir atención.</li>\n<li><strong>Cirugía o tratamiento programado</strong> — No es emergencia. Sigue su propio proceso con documentación y dictamen previo.</li>\n</ul>\n\n<h3>✅ Lo primero que debe hacer la GP</h3>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li>Acudir al hospital más cercano <strong>de su nivel</strong>.</li>\n<li>En admisiones: identificarse como asegurada de GNP, con número de póliza y certificado.</li>\n<li>Recibir atención prioritaria.</li>\n</ol>\n\n<h3>🗂️ Verificar en el Excel Vigor</h3>\n<p>Antes de confirmar pago directo, busca a la GP en el <strong>Excel Vigor</strong>, que contiene: número de póliza, número de certificado y número de sistema GNP.</p>\n<div class=\"callout blue\">\n<p>✅ Está en Vigor + hospital de su nivel → puede aplicar pago directo.<br>\n❌ No aparece en el sistema → informar a supervisor. Probablemente va por reembolso.</p>\n</div>\n\n<h3>🏥 Red y nivel hospitalario — Regla dura</h3>\n<div class=\"callout amber\"><p>⚠️ <strong>Nunca envíes a una GP a un hospital fuera de su nivel.</strong></p></div>\n<ul>\n<li><strong>Nivel Alto</strong> — acceso a toda la red hospitalaria.</li>\n<li><strong>Nivel Medio</strong> — solo hospitales de nivel medio o bajo.</li>\n<li>Si acude a nivel superior al contratado → cobertura por reembolso con penalización.</li>\n</ul>\n\n<h3>💳 Pago directo vs Reembolso</h3>\n<ul>\n<li><strong>Pago directo</strong> — Hospital dentro de la red y su nivel. La GP no adelanta dinero.</li>\n<li><strong>Reembolso</strong> — Hospital fuera de red o nivel superior. La GP paga y después solicita devolución.</li>\n</ul>\n\n<h3>🔗 Herramienta de triage</h3>\n<div class=\"callout blue\"><p>🖥️ Triage de emergencias: <a href=\"https://koltin-bandeja.vercel.app/triage.html\" target=\"_blank\"><strong>koltin-bandeja.vercel.app/triage.html</strong></a></p></div>\n<div class=\"callout amber\"><p>⚠️ Antes de registrar: verifica en Slack si ya existe un reporte previo para ese certificado. Aplica a todos los tipos de siniestro — los duplicados afectan el control y seguimiento de todos los equipos.</p></div>\n\n<img src=\"/_blob/1fa7cfa444be34dd6628482887f39490\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Modelo de llamada de emergencia — 5 pasos</p>\n\n<h3>📞 Modelo de llamada — Paso a paso</h3>\n<div class=\"callout amber\"><p>⚠️ <strong>Antes de aceptar:</strong> verifica que la llamada muestre \"#1 - Emergencias\" en Aircall.</p></div>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li><strong>Saludo oficial:</strong> <em>\"Línea de emergencia Koltin, le atiende [nombre completo]. ¿Cuál es su emergencia?\"</em></li>\n<li><strong>Datos del asegurado:</strong> Aseguradora · Nombre · Póliza · Certificado · Código postal (para ubicar hospital). Busca en sales.koltin.mx/certificates para ver nivel hospitalario.</li>\n<li><strong>¿Necesita ambulancia?</strong><br>\n— Sí → <strong>Número interno Koltin para gestionar ambulancias: 55 5809 4518</strong> (úsalo tú para coordinar). El número que la GP puede llamar directamente es <strong>55 8993 9299</strong>. Captura: edad, peso, ¿qué pasó?, dirección completa con referencia, teléfono de contacto, estado de consciencia. Otro Expertx coordina vía Slack en paralelo.<br>\n— No → Va por propios medios.</li>\n<li><strong>Hospital:</strong> Orienta al hospital más cercano según código postal y nivel. \"Al llegar a admisiones, identifíquese como asegurada de GNP con número de póliza y certificado.\"</li>\n<li><strong>WhatsApp + correo:</strong> Obtén el WhatsApp de contacto antes de cerrar la llamada. Envía el correo de ingreso hospitalario.</li>\n</ol>\n\n<img src=\"/_blob/a82cd500371301817c20fa5ed284c990\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.75rem\">Triage de Emergencias — campos a capturar en la llamada</p>\n\n<h3>⏱️ Tono y manejo del tiempo</h3>\n<ul>\n<li>\"Soy [Nombre], estaré con usted hasta que esta situación se resuelva.\"</li>\n<li>Si necesitas tiempo: \"Permítame un momento, voy a…\" — retoma en menos de 60 segundos.</li>\n<li>La empatía es lo más importante. Acompañas a alguien en alta tensión.</li>\n</ul>\n\n<h3>📋 Registro del caso</h3>\n<ul>\n<li><strong>Slack:</strong> canal de Siniestros.</li>\n<li><strong>Triage:</strong> registra todos los detalles del caso en koltin-bandeja.vercel.app/triage.html</li>\n</ul>\n\n<h3>🔄 Las 3 salidas de una emergencia</h3>\n<p>Care Coordination (no tú) determina la salida del caso:</p>\n<ul>\n<li>No fue emergencia real → se convierte en incidencia.</li>\n<li>Fue emergencia y se usó el seguro → siniestro.</li>\n<li>La GP pagó y solicita devolución → reembolso.</li>\n</ul>\n</div>","subs_c": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Programación de Cirugía, Guía para Expertxs.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás acompañar a una GP en el proceso de cirugía programada: verificar elegibilidad, clasificar correctamente, explicar la documentación y cerrar la llamada con los siguientes pasos claros.</p>\n\n<h3>🏥 ¿Qué es y por qué importa?</h3>\n<p>La programación de cirugía es el proceso para acompañar a una GP que necesita una cirugía o tratamiento cubierto por su SGMM. No es una urgencia — hay tiempo para validar, documentar y tramitar ordenadamente con la aseguradora.</p>\n<p>Hacerlo bien evita dos errores costosos: avanzar un trámite que no procedía, y que la GP reúna documentos equivocados y tenga que empezar de nuevo.</p>\n\n<h3>👤 Tu rol</h3>\n<p><strong>Informar, validar y acompañar.</strong> Lo que nunca debes hacer: garantizar una autorización, un monto o una fecha — esa decisión depende del dictamen de la aseguradora.</p>\n\n<div class=\"callout blue\"><p>🖥️ Triage de programación: <a href=\"https://koltin-bandeja.vercel.app/triage.html\" target=\"_blank\"><strong>koltin-bandeja.vercel.app/triage.html</strong></a> → pestaña Programación 🏥</p></div>\n<img src=\"/_blob/eb4efd780b2d61bd227f3132e050cbe5\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.75rem\">Triage de Programación — Página 1: datos y elegibilidad</p>\n<img src=\"/_blob/c89cef298e6087fc6a1da7b12a0391f2\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.75rem\">Triage de Programación — Página 2: detalle del caso, cobertura y correo</p>\n<div class=\"callout amber\"><p>⚠️ Antes de registrar: verifica en Slack si ya existe un reporte previo para ese certificado. Aplica a todos los tipos de siniestro — los duplicados afectan el control y seguimiento de todos los equipos.</p></div>\n\n<h3>📞 Las dos etapas de la llamada</h3>\n<ul>\n<li><strong>1. Primer Reporte — Customer Success (tú)</strong><br>\nPrimer contacto sobre la cirugía. Comprendes la solicitud, reúnes datos, clasificas accidente o enfermedad, explicas la cobertura y abres el caso. Al cerrar: envías el correo de programación y levantas el reporte de siniestros → el caso se asigna a Care Coordination.</li>\n<li><strong>2. Seguimiento de Documentación — Care Coordination</strong><br>\nAcompañamiento posterior: validan la documentación, comunican tiempos y dan seguimiento hasta que el caso esté completo.</li>\n</ul>\n\n<h3>✅ Elegibilidad — Antes de avanzar</h3>\n<div class=\"callout amber\"><p>Solo continúa el trámite si:<br>\n1. Hay un <strong>diagnóstico confirmado</strong><br>\n2. Ese diagnóstico <strong>supera el deducible</strong> de la membresía.<br>\nSi alguna condición no se cumple, el caso no procede todavía.</p></div>\n\n<h3>⚠️ Accidente o Enfermedad — La regla de oro</h3>\n<ul>\n<li><strong>Enfermedad</strong> — Aplican deducible y coaseguro (20%, topado a $20,000).</li>\n<li><strong>Accidente</strong> — NO aplican. Cubierto desde el primer peso si el primer gasto comprobable es dentro de los primeros 30 días. Si no puede comprobarse → se trata como enfermedad.</li>\n</ul>\n\n<img src=\"/_blob/f41ffc46850db28d91b69a3f45c292d6\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Quién llena qué documento?</p>\n\n<h3>📄 La documentación — Quién llena qué</h3>\n<div class=\"callout blue\"><p>📌 Regla simple: <strong>el médico llena el Informe Médico. La GP llena el Aviso. Nunca al revés.</strong></p></div>\n<ul>\n<li><strong>Informe Médico</strong> — Lo llena y firma el médico tratante en el formato oficial de la aseguradora. Sin tachaduras, no se corrige una vez enviado, vigencia 6 meses. Cada médico que cobre y facture llena el suyo.</li>\n<li><strong>Aviso de Accidente y/o Enfermedad</strong> — Lo llena y firma la GP. Debe coincidir con el Informe Médico. El contratante es Aplicaciones Gerontológicas / Koltin (ya viene prellenado).</li>\n<li><strong>Estudios e imagenología</strong> — Todos los realizados para llegar al diagnóstico, con imágenes e interpretación.</li>\n<li><strong>Si es accidente ortopédico</strong> — Se requieren además: carta de hechos y lista de osteosíntesis.</li>\n</ul>\n\n<h3>⏰ Tiempos del proceso</h3>\n<p>Con documentación completa:</p>\n<ul>\n<li>Revisión interna Koltin: hasta <strong>5 días hábiles</strong></li>\n<li>Dictamen de la aseguradora: hasta <strong>5 días hábiles</strong></li>\n</ul>\n<div class=\"callout amber\"><p>⚠️ Si falta documentación, el reloj no corre. Por eso es crucial enumerar desde el inicio todo lo que se necesita.</p></div>\n\n<h3>💳 Pago directo vs Reembolso</h3>\n<ul>\n<li><strong>Pago directo</strong> — Atención dentro de la red, trámite normal.</li>\n<li><strong>Reembolso</strong> — Hospital fuera de la red, nivel superior (con penalización), atención en el extranjero, o menos de 30 días de membresía.</li>\n</ul>\n\n<h3>📋 Cómo cerrar bien la llamada</h3>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li>Reconoce la situación de salud de la GP antes de entrar a trámites.</li>\n<li>Deja claro el siguiente paso con fecha o ventana de tiempo concreta.</li>\n<li>Enumera los documentos que debe reunir.</li>\n<li>Confirma el correo/WhatsApp donde recibirá la información.</li>\n<li>Indica que habrá seguimiento y que llegará un correo con todo detallado.</li>\n</ol>\n</div>","subs_r": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Reembolso, Guía para Expertxs.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás cuándo aplica el reembolso, cómo orientar a la GP, qué documentos se necesitan, la regla crítica de las facturas y cómo manejar el seguimiento.</p>\n\n<h3>💸 ¿Qué es y cuándo aplica?</h3>\n<p>El reembolso es la modalidad donde la GP paga de su bolsillo la atención médica y después solicita a la aseguradora la devolución del monto que corresponda.</p>\n<p>Va por reembolso cuando:</p>\n<ul>\n<li>El hospital está <strong>fuera de la red</strong> de la aseguradora.</li>\n<li>Acude a hospital de <strong>nivel superior</strong> al contratado (con penalización).</li>\n<li>La atención ocurre en el <strong>extranjero</strong>.</li>\n<li>La GP tiene <strong>menos de 30 días de membresía</strong>.</li>\n<li>La GP elige pagar y solicitar la devolución.</li>\n</ul>\n<div class=\"callout blue\"><p>🔍 Cómo saberlo: revisa el Excel Vigor. Si no aparece su número GNP, probablemente va por reembolso. Ante la duda, confirma con supervisión.</p></div>\n<div class=\"callout amber\"><p>📌 Antes de continuar: <strong>revisa en Slack si ya existe un reporte previo</strong> para ese certificado. Esta regla aplica para todos los tipos de siniestro — los duplicados manchan la data y dificultan el seguimiento de todos los equipos.</p></div>\n<div class=\"callout blue\"><p>🖥️ Triage de reembolso: <a href=\"https://koltin-bandeja.vercel.app/triage.html\" target=\"_blank\"><strong>koltin-bandeja.vercel.app/triage.html</strong></a> → pestaña Reembolso 💰</p></div>\n<img src=\"/_blob/5cffe0bfddee45719ed6a703683bf860\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.75rem\">Triage de Reembolso — Página 1: datos, accidente vs enfermedad y diagnóstico</p>\n<img src=\"/_blob/fdb0f4e104651b41bbee3236dcd91568\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.75rem\">Triage de Reembolso — Página 2: contexto, correo y envío</p>\n\n<h3>👤 Tu rol</h3>\n<p>Orientar, reunir la documentación correcta, revisarla antes de enviarla. <strong>Nunca garantices aprobación, monto ni fecha de pago</strong> — eso lo determina la aseguradora.</p>\n\n<h3>⚠️ Accidente vs Enfermedad</h3>\n<ul>\n<li><strong>Enfermedad</strong> — Aplican deducible y coaseguro (20%, topado a $20,000). No se cubren preexistencias ni estudios previos al diagnóstico.</li>\n<li><strong>Accidente</strong> — NO aplican. Cubierto desde el primer peso, siempre que el primer gasto sea dentro de los primeros 30 días del accidente. Si no puede comprobarse → se trata como enfermedad.</li>\n</ul>\n\n<h3>📄 Documentos requeridos (reembolso nacional)</h3>\n<p>Todos deben ir completos, legibles y con firmas autógrafas:</p>\n<ul>\n<li><strong>Documento de identidad</strong> (INE, pasaporte o licencia) — ambas caras.</li>\n<li><strong>Comprobante de domicilio</strong> — no mayor a 3 meses.</li>\n<li><strong>Aviso de Accidente y/o Enfermedad</strong> — lo llena y firma la GP. Contratante: Aplicaciones Gerontológicas (Koltin). Una vez firmado, no se pueden modificar fechas ni diagnósticos.</li>\n<li><strong>Instrucción de Pago Finiquito</strong> — relación de gastos (cada factura con fecha, número, proveedor e importe con IVA) + datos bancarios/CLABE + carátula del estado de cuenta. Si la GP no tiene cuenta → formato Cambio de instrucción de pago (retrasa el proceso).</li>\n<li><strong>Informe Médico</strong> — lo llena el médico tratante. Sin tachaduras, vigencia 6 meses, uno por cada médico que cobre y facture.</li>\n<li><strong>Estudios e imagenología</strong> (RX, tomografías, ultrasonidos) — con interpretación. Ambos son indispensables.</li>\n<li><strong>Nota postquirúrgica</strong> — solo si hubo cirugía.</li>\n<li><strong>Facturas de los gastos</strong> (ver regla crítica abajo).</li>\n<li><strong>Estado de cuenta con CLABE</strong> del asegurado.</li>\n</ul>\n\n<img src=\"/_blob/47120ef27b89b163dfb0e6fd859128cf\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Regla crítica de facturas para reembolso</p>\n\n<h3>🚨 La regla crítica: las facturas</h3>\n<div class=\"callout amber\">\n<p>❌ Deben estar <strong>a nombre del asegurado</strong>. Si están a otro nombre, la aseguradora NO procesa el pago.<br>\n❌ Deben enviarse en <strong>PDF y XML</strong> — nunca escaneadas.<br>\n💡 Si la GP no tiene RFC: se factura a público en general con RFC genérico del SAT <strong>XAXX010101000</strong> y su nombre.</p>\n</div>\n\n<h3>📤 Envío</h3>\n<p>Todos los documentos se envían en <strong>un solo correo</strong> a <strong>ayuda@koltin.mx</strong>. Koltin revisa que el expediente esté completo antes de mandarlo a la aseguradora.</p>\n\n<h3>🌍 Reembolso en el extranjero</h3>\n<ul>\n<li>Solo por reembolso — no hay pago directo fuera de México.</li>\n<li>Cubre emergencias hasta estabilizar.</li>\n<li>Deducible: <strong>USD 50</strong> · Suma asegurada máxima: <strong>USD 50,000</strong>.</li>\n<li>Aviso dentro de los <strong>5 días</strong> posteriores al evento.</li>\n<li>Tipo de cambio oficial de Banxico.</li>\n<li>Se aceptan recibos en lugar de facturas.</li>\n</ul>\n\n<h3>⏰ Tiempos del proceso</h3>\n<ul>\n<li>Revisión interna Koltin: hasta <strong>5 días hábiles</strong></li>\n<li>Dictamen de la aseguradora: hasta <strong>30 días hábiles</strong></li>\n<li>Una vez aprobado: hasta <strong>5 días hábiles</strong> adicionales para reflejarse en la cuenta.</li>\n</ul>\n<div class=\"callout blue\"><p>📞 La comunicación con la GP durante el proceso debe ser <strong>semanal</strong>. Cuando se apruebe, pídele que confirme al recibir el dinero. Si no llega, levanta el reclamo con la aseguradora.</p></div>\n\n<h3>📊 Estatus posibles</h3>\n<p>Revisión documental · Pendiente de información · Revisión por la aseguradora · Aprobado · Rechazado · Pagado · Concluido.</p>\n<p>No todos los casos tienen documentos pendientes — es correcto confirmar que el expediente está completo o que sigue en revisión.</p>\n</div>","subco1": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Manual de Cobranzas Koltin 2026.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar conocerás los 3 métodos de pago de Koltin, el periodo de gracia, las políticas de fechas y las reglas de prórrogas que aplican al equipo Expertxs.</p>\n\n<img src=\"/_blob/a28ca6c71119e9bc673fd8b0914a2813\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Los 3 métodos de pago Koltin</p>\n\n<h3>💳 Los 3 métodos de pago</h3>\n<ul>\n<li><strong>Transferencia Bancaria (STP)</strong> — Sistema de Transferencias y Pagos. Referencia única por cliente. Operación 24/7 con confirmación en tiempo real.</li>\n<li><strong>Link de Pago Online (Toku)</strong> — Enlace personalizado para pago rápido y seguro desde cualquier dispositivo. Acepta tarjetas de débito y crédito. Pagos por cuotas.</li>\n<li><strong>Domiciliación</strong> — Cargo automático recurrente. Evita olvidos involuntarios. Proceso 100% automatizado. Asegura la vigencia de la membresía sin retrasos.</li>\n</ul>\n<div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin:.75rem 0\">\n  <div><img src=\"/_blob/226b491337a6bab1770b9dd14364260b\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\"><p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.25rem;margin-bottom:.75rem\">Link de Pago Toku</p></div>\n  <div><img src=\"/_blob/13fe6d301bf8e1a9a2faf4d433802374\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\"><p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.25rem;margin-bottom:.75rem\">Transferencia STP</p></div>\n  <div><img src=\"/_blob/df6b7e2907b500d0a04721057e1227f0\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\"><p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.25rem;margin-bottom:.75rem\">Domiciliación</p></div>\n</div>\n\n<h3>⏰ Periodo de Gracia</h3>\n<div class=\"callout blue\"><p>Se otorgan <strong>3 días naturales</strong> posteriores a la fecha de vencimiento. Los pagos atrasados solo se aceptan dentro de este plazo.</p></div>\n\n<h3>📅 Fechas de Pago — Políticas clave</h3>\n<ul>\n<li><strong>Fecha inamovible</strong> — Se establece al contratar la membresía y no se puede modificar durante la vigencia del contrato.</li>\n<li><strong>Ventana de ajuste</strong> — Cualquier cambio de fecha solo es posible durante el proceso de renovación.</li>\n<li><strong>Prohibición de pagos combinados</strong> — No se realizan pagos con múltiples métodos para una misma cuota.</li>\n<li><strong>Una liga por membresía</strong> — No se pueden hacer pagos de varias membresías en una sola cuenta o con una sola liga de pago.</li>\n</ul>\n\n<h3>📊 Proceso de pago</h3>\n\n<h3>🚫 Prórrogas y convenios de pago</h3>\n<div class=\"callout amber\"><p>⚠️ <strong>Las prórrogas SOLO las puede autorizar el área de Cobranzas.</strong> Ningún Expertx puede comprometerse por cuenta propia. Nunca prometer una prórroga sin validación oficial del área responsable.</p></div>\n<ul>\n<li>No existen prórrogas automáticas — cada caso se evalúa individualmente.</li>\n<li>Se analiza: historial de la GP, motivo del retraso y viabilidad del compromiso de pago.</li>\n<li>Con el cliente: informar que el caso está en revisión. No generar expectativas ni compromisos anticipados.</li>\n</ul>\n\n<h3>📋 Lo que corresponde al Expertx en pagos</h3>\n<ul>\n<li>Enviar ligas de pago personalizadas desde Sales.</li>\n<li>Informar la fecha de pago o si el cliente está al corriente (Sales → sección Pagos).</li>\n<li>Validar comprobantes de transferencia y etiquetarlos en el canal correspondiente.</li>\n<li>Derivar a Cobranzas cuando hay pagos pendientes no relacionados con renovación.</li>\n</ul>\n</div>","subco2": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Manual de Cobranzas Koltin 2026.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás cuándo y cómo se emiten las facturas en Koltin, qué tipo de CFDI aplica, la diferencia entre Factura y Complemento de Pago y cómo manejar solicitudes de facturación.</p>\n\n<h3>📅 Calendario de emisión de facturas</h3>\n<p>Las facturas se generan en fechas específicas del mes:</p>\n<div class=\"callout blue\"><p>📆 <strong>Días 15 · 30 · 31</strong> del mes — son los únicos días en que se emiten facturas de forma manual.</p></div>\n<div class=\"callout amber\"><p>⚠️ Solo se factura dentro del mismo mes calendario en que se realizó la contratación o renovación. <strong>No se prometen facturas anticipadas.</strong></p></div>\n\n<h3>📄 Factura vs Complemento de Pago</h3>\n<ul>\n<li><strong>Factura</strong> — Documento que ampara el valor <em>total</em> del servicio contratado.</li>\n<li><strong>Complemento de Pago</strong> — Documento que especifica el abono de cada parcialidad (pago parcial). A partir de abril 2025, todas las facturas salen con el monto anual y se generan complementos según la frecuencia de pago:\n  <ul>\n    <li>Anual → 1 complemento</li>\n    <li>Semestral → 2 complementos</li>\n    <li>Trimestral → 4 complementos</li>\n    <li>Mensual → 12 complementos</li>\n  </ul>\n</li>\n</ul>\n\n<img src=\"/_blob/20ff28f6cd6bc1b90d0dee07e18f4293\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.25rem;margin-bottom:.75rem\">Estructura de facturación en Koltin</p>\n\n<h3>⚠️ Concepto fiscal correcto — MUY IMPORTANTE</h3>\n<div class=\"callout amber\">\n<p><strong>Concepto fiscal:</strong> \"Servicios preventivos de salud y gestión de seguro médico\"<br>\n<strong>Clasificación:</strong> Honorarios médicos / Gastos en general<br>\n<strong>Deducible como:</strong> Gastos personales</p>\n<p>❌ <strong>Koltin NO es aseguradora</strong><br>\n❌ <strong>CFDI tipo D07 (seguros) NO aplica</strong></p>\n</div>\n\n<h3>🔄 Sistema de facturas: Sales vs Facturama</h3>\n<ul>\n<li><strong>Antes de abril 2025</strong> → las facturas se encuentran en <strong>Facturama</strong>. Solicitar el RFC del cliente para rastrearla.</li>\n<li><strong>A partir de abril 2025</strong> → las facturas están en el nuevo sistema. Si el cliente no aparece, es porque no solicitó facturación — enviar el link de llenado de datos: <a href=\"https://airtable.com/app4WAbdzKo6uukSp/shrFkZCLZAgrsJLJ6\" target=\"_blank\">airtable.com/Koltin-Factura</a></li>\n</ul>\n\n<h3>📨 Escalamiento en facturación</h3>\n<p>Cuando haya un caso de facturación compleja, <strong>el Expertx envía un correo a facturacion@koltin.mx</strong> para que el área lo resuelva directamente con el cliente.</p>\n<p>Casos que requieren escalamiento: pagos duplicados · reembolsos · problemas con pagos · pagos diferidos · temas fiscales complejos.</p>\n<div class=\"callout blue\"><p>💡 Todo escalamiento debe incluir evidencia clara (comprobantes, capturas de pantalla) para agilizar la respuesta.</p></div>\n</div>","subco3": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Billing Koltin + Manual de Cobranzas 2026.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás exactamente qué acciones tomar en temas de cobranza, qué nunca debes prometer, cómo generar ligas de domiciliación y cuándo escalar.</p>\n\n<h3>✅ Acciones que SÍ debes tomar</h3>\n<ul>\n<li>Dejar claro siempre que <strong>Koltin NO es aseguradora</strong> para temas de facturación.</li>\n<li>Enviar ligas de pago desde Sales.</li>\n<li>Informar al cliente que prórrogas o convenios de pago <strong>solo los revisa Cobranzas</strong>.</li>\n<li>Levantar ticket a \"soporte-de-cobranzas-y-reembolsos\" para: pagos duplicados, reembolsos, confirmación de pagos diferidos o temas fiscales.</li>\n<img src=\"/_blob/f8aebde5a774f587bb569a055ce9fe06\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.25rem;margin-bottom:.75rem\">Gestión operativa de cobranza</p>\n<li>Etiquetar a <strong>@Pahoran</strong> y <strong>@cobranza</strong> en el canal \"Facturas y pagos clientes\" al recibir comprobante de pago vía BBVA — incluyendo: nombre completo, número de certificado y comprobante de pago.</li>\n<li>Informar fechas de pago desde <a href=\"https://clientes.koltin.mx/\" target=\"_blank\">clientes.koltin.mx</a> o sección Pagos en Sales.</li>\n<li>Actuar con prontitud — Cobranzas está investigando la mejor forma de resolver.</li>\n</ul>\n\n<h3>❌ Acciones que NUNCA debes hacer</h3>\n<div class=\"callout amber\">\n<ul style=\"margin:0\">\n<li>Prometer cambios en facturas <strong>ya emitidas</strong>.</li>\n<li>Prometer prórrogas o descuentos sin consultar a Cobranzas.</li>\n<li>Decir que el cliente puede hacer pagos en partes o con más de un método de pago.</li>\n<li>Prometer facturas anticipadas para cerrar una venta o renovación.</li>\n<li>Decir que pueden pagar varias membresías en una sola cuenta o una sola liga.</li>\n<li>Prometer el envío <em>inmediato</em> de facturas.</li>\n<li>No ser claro con las fechas de pago que muestra Sales.</li>\n</ul>\n</div>\n\n<img src=\"/_blob/c53e92694563d8fe5774e9b5f13758c5\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Cómo generar el link de domiciliación?</p>\n\n<h3>🔗 Cómo enviar ligas de pago desde Sales</h3>\n<p>Puedes enviar ligas de pago personalizadas directamente desde Sales. Tutorial en video:</p>\n<div style=\"display:flex;gap:.75rem;align-items:center;background:var(--g0);border-radius:var(--r);padding:.75rem;margin:.5rem 0\">\n  <a href=\"https://www.loom.com/share/501bb68c230a4bd98b3feea9d745f706?sid=4fda9a43-5c9b-414c-8882-ee37625bef3c\" target=\"_blank\">\n    <img src=\"/_blob/4c6cc7e2368fef0c261b5e354285ea8a\" style=\"width:120px;border-radius:8px;flex-shrink:0\">\n  </a>\n  <div><p style=\"margin:0;font-size:.875rem\"><strong>🎬 Tutorial: Envío de ligas de pago desde Sales</strong></p>\n  <a href=\"https://www.loom.com/share/501bb68c230a4bd98b3feea9d745f706?sid=4fda9a43-5c9b-414c-8882-ee37625bef3c\" target=\"_blank\" style=\"font-size:.8125rem\">Ver en Loom →</a></div>\n</div>\n\n<h3>🔗 Cómo generar el link de domiciliación</h3>\n<p>El link de domiciliación <strong>requiere autorización previa de Cobranzas</strong>, excepto en estos casos donde puedes enviarlo directamente sin autorización:</p>\n<ul>\n<li>Le robaron la tarjeta.</li>\n<li>Se venció la tarjeta.</li>\n<li>La GP no tiene tarjeta domiciliada.</li>\n</ul>\n<p><strong>Cómo convertir un link normal en link de domiciliación:</strong></p>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li>Selecciona la cuota en Sales — se abre una nueva pestaña.</li>\n<li>Copia la URL completa de esa pestaña.</li>\n<li>Agrega al final exactamente esto: <code style=\"background:var(--n1);padding:.2rem .5rem;border-radius:4px;font-size:.9rem\">&amp;portal=1</code></li>\n<li>Copia y pega el enlace completo donde lo requieras.</li>\n</ol>\n<p><strong>Ejemplo:</strong><br>\n<code style=\"background:var(--n1);padding:.2rem .5rem;border-radius:4px;font-size:.8rem;display:block;margin:.5rem 0\">https://sales.koltin.mx/certificates/12329#payments-table<strong style=\"color:var(--g7)\">&amp;portal=1</strong></code></p>\n<div style=\"display:flex;gap:.75rem;align-items:center;background:var(--g0);border-radius:var(--r);padding:.75rem;margin:.5rem 0\">\n  <a href=\"https://www.loom.com/share/2818d441b3ec4794b40fa8ff8d5194d2?sid=eff7b4c4-dff0-4e2f-a6af-b9358b555112\" target=\"_blank\">\n    <img src=\"/_blob/5c155a95d17b79ce2218d970679a6193\" style=\"width:120px;border-radius:8px;flex-shrink:0\">\n  </a>\n  <div><p style=\"margin:0;font-size:.875rem\"><strong>🎬 Tutorial: Cómo hacer el link de domiciliación</strong></p>\n  <a href=\"https://www.loom.com/share/2818d441b3ec4794b40fa8ff8d5194d2?sid=eff7b4c4-dff0-4e2f-a6af-b9358b555112\" target=\"_blank\" style=\"font-size:.8125rem\">Ver en Loom →</a></div>\n</div>\n\n<h3>🔄 ¿Cobranzas o Renovaciones?</h3>\n<ul>\n<li><strong>→ Renovaciones</strong>: todo lo que esté en proceso de renovación.</li>\n<li><strong>→ Cobranzas</strong>: todo lo que no esté en renovación y tenga pagos pendientes, acuerdos de pago, pagos duplicados, liquidaciones anticipadas.</li>\n</ul>\n\n<h3>🧪 Caso práctico — ¿Qué hago con este pago?</h3>\n<div style=\"display:flex;flex-direction:column;gap:.75rem;margin:.75rem 0\">\n<div class=\"callout amber\"><p><strong>Situación A:</strong> La GP dice que pagó hace 3 días pero en Sales aparece adeudo.<br>\n→ Pide el comprobante de pago → etiqueta a @Pahoran y @cobranza en el canal \"Facturas y pagos clientes\" con nombre, certificado y comprobante.</p></div>\n<div class=\"callout amber\"><p><strong>Situación B:</strong> La GP quiere liquidar toda su membresía de un solo pago antes de que venza.<br>\n→ Esto es una liquidación anticipada → deriva a Cobranzas.</p></div>\n<div class=\"callout amber\"><p><strong>Situación C:</strong> La GP está en proceso de renovación y quiere pagar pero su tarjeta venció.<br>\n→ Esto va a Renovaciones (está en proceso de renovación) → genera el link de domiciliación sin autorización (tarjeta vencida).</p></div>\n<div class=\"callout amber\"><p><strong>Situación D:</strong> La GP dice que le hicieron 2 cargos en el mismo mes.<br>\n→ Pago duplicado → levanta ticket en soporte-de-cobranzas-y-reembolsos con evidencia.</p></div>\n<div class=\"callout amber\"><p><strong>Situación E:</strong> La GP quiere que le emitas una factura de octubre pero ya estamos en noviembre.<br>\n→ No es posible → solo se factura dentro del mismo mes de contratación o renovación. Informarlo claramente sin prometer excepciones.</p></div>\n</div>\n\n<h3>📋 Recursos y links clave</h3>\n<ul>\n<li>📧 Escalamiento fiscal: <strong>facturacion@koltin.mx</strong></li>\n<li>💳 Solicitar factura (cliente sin facturación): <a href=\"https://airtable.com/app4WAbdzKo6uukSp/shrFkZCLZAgrsJLJ6\" target=\"_blank\">airtable.com/Koltin-Factura</a></li>\n<li>🔍 Estatus de pagos: <a href=\"https://clientes.koltin.mx/\" target=\"_blank\">clientes.koltin.mx</a></li>\n<li>🎬 Tutorial ligas de pago: <a href=\"https://www.loom.com/share/501bb68c230a4bd98b3feea9d745f706\" target=\"_blank\">Loom — Ligas de pago</a></li>\n<li>🎬 Tutorial domiciliación: <a href=\"https://www.loom.com/share/2818d441b3ec4794b40fa8ff8d5194d2\" target=\"_blank\">Loom — Link domiciliación</a></li>\n<li>🎬 Presentación Cobranza: <a href=\"https://view.genially.com/68ed84972a11631847cc1bde/presentation-cobranza\" target=\"_blank\">Genially — Presentación Cobranza</a></li>\n</ul>\n</div>","subc1": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Guía de Comunidad para Expertxs, Sales &amp; Renewals.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar entenderás qué es la Comunidad Koltin, por qué es un pilar de salud integral y cómo se organiza la oferta de clases por dominio.</p>\n\n<h3>❤️ ¿Por qué existe la Comunidad Koltin?</h3>\n<p>La Comunidad Koltin nace para combatir dos de los factores de salud más silenciosos en adultos mayores: el <strong>aislamiento y la soledad</strong>. Crear un espacio donde las Grandes Personas se sientan valoradas, activas y conectadas tiene impacto directo en su salud física, emocional y cognitiva.</p>\n<div class=\"callout blue\"><p>\"Al desafiar los estereotipos negativos sobre el envejecimiento, se promueve una cultura de respeto y apoyo mutuo que contribuye a la salud integral de todos sus miembros.\"</p></div>\n\n<h3>🏠 ¿Qué ofrece la Comunidad?</h3>\n<p>La Comunidad tiene dos modalidades:</p>\n<ul>\n<li><strong>Presencial</strong> — Clases en Casa Koltin (CDMX, Monterrey y Guadalajara) y espacios wellness aliados.</li>\n<li><strong>Virtual</strong> — Clases por YouTube Live, Facebook Live y Google Meet, disponibles para miembros en toda la república.</li>\n</ul>\n\n<h3>🎨 Los 3 dominios de clases</h3>\n<p>Toda la oferta de clases se organiza en 3 dominios, cada uno con un propósito específico para la salud integral:</p>\n<ul>\n<li>🏃 <strong>Movimiento y funcionalidad</strong> — Mejoran fuerza, equilibrio, movilidad y salud cardiovascular.\n  <ul style=\"margin:.375rem 0 0 1rem;line-height:1.8;color:var(--n6)\">\n    <li><strong>Tai Chi</strong>: movimientos lentos y fluidos que mejoran el equilibrio y la coordinación.</li>\n    <li><strong>Yoga</strong>: posiciones y respiración para ganar flexibilidad, fuerza y calma.</li>\n    <li><strong>Funcional</strong>: ejercicios prácticos para mantener la autonomía en actividades del día a día.</li>\n    <li><strong>Qi Gong</strong>: práctica de respiración y energía que combina movimiento suave con relajación profunda.</li>\n  </ul>\n</li>\n<li>🧠 <strong>Mente activa y aprendizaje</strong> — Estimulan la función cognitiva y la creatividad.\n  <ul style=\"margin:.375rem 0 0 1rem;line-height:1.8;color:var(--n6)\">\n    <li><strong>Historia de Arte</strong>: recorrido por obras y movimientos artísticos con enfoque en apreciación y cultura.</li>\n    <li><strong>Escritura Creativa</strong>: espacio para explorar la escritura narrativa, poética y de memoria.</li>\n    <li><strong>Cine Club</strong>: proyección y análisis de películas para fomentar el pensamiento crítico y la conversación.</li>\n  </ul>\n</li>\n<li>🤝 <strong>Conexión social y participación</strong> — Fortalecen los lazos sociales y el sentido de pertenencia.\n  <ul style=\"margin:.375rem 0 0 1rem;line-height:1.8;color:var(--n6)\">\n    <li><strong>Conversatorios</strong>: encuentros para dialogar sobre temas de interés con otros miembros.</li>\n    <li><strong>Eventos culturales</strong>: experiencias compartidas como exposiciones, conciertos o actividades especiales.</li>\n    <li><strong>Visitas guiadas</strong>: recorridos a museos, galerías u otros espacios de interés cultural.</li>\n  </ul>\n</li>\n</ul>\n\n<h3>📅 Reinscripciones</h3>\n<p>Las inscripciones a <strong>clases presenciales</strong> se renuevan <strong>cada 3 meses</strong>, durante la primera semana del mes correspondiente. Se envía un aviso con una semana de anticipación.</p>\n<div class=\"callout amber\"><p>📌 Próximas reinscripciones: septiembre 2026 (7 sep) · diciembre 2026 (7 dic) · marzo 2027 (1 mar) · junio 2027 (7 jun)</p></div>\n\n<h3>👥 ¿Quién puede participar?</h3>\n<ul>\n<li>Cualquier miembro activo de Koltin <strong>a partir de los 50 años</strong>.</li>\n<li>Las clases virtuales son accesibles desde cualquier parte de México.</li>\n<li>Los acompañantes pueden asistir <strong>solo si es indispensable para la movilidad</strong> de la GP. Si no son miembros, esperan en el área de encuentro.</li>\n</ul>\n</div>","subc2": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Guía de Comunidad para Expertxs, Sales &amp; Renewals.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás cómo inscribir a una GP a una clase, qué es LANA y LUMA, y cómo manejar listas de espera y primera inscripción.</p>\n\n<h3>📋 Proceso de inscripción</h3>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li>La GP solicita inscripción a una clase (en persona, por WhatsApp, por llamada o en recepción).</li>\n<li>La Expertx verifica disponibilidad y aplica los criterios de modulación.</li>\n<li>Se completan los datos de inscripción en LANA.</li>\n<li>Si es la primera vez, hay 5 pasos adicionales (ver sección Primera vez).</li>\n</ol>\n\n<h3>⚖️ Modulación de clases (criterio obligatorio)</h3>\n<p>Para cuidar la salud integral de las GPs, hay un criterio de modulación al inscribirse:</p>\n<ul>\n<li>1 a 2 clases de <strong>movimiento y funcionalidad</strong></li>\n<li>1 a 2 clases de <strong>mente activa y aprendizaje</strong></li>\n<li>1 a 2 clases de <strong>conexión social y participación</strong></li>\n</ul>\n<p>Cada clase tiene el nombre del dominio visible para facilitar la clasificación.</p>\n<div class=\"callout blue\"><p>💡 Los límites de modulación son <strong>al día</strong> — no al mes ni al ciclo. Una GP puede inscribirse a 1 o 2 clases de cada dominio en su horario diario.</p></div>\n\n<img src=\"/_blob/f422a2c7b4e781536a0d09725aa2df0c\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">LANA vs LUMA — ¿cuál es cuál?</p>\n\n<h3>🛠️ LANA — Herramienta operativa de Comunidad</h3>\n<p>LANA es la plataforma interna de control y gestión de la Comunidad. Desde ahí puedes:</p>\n<ul>\n<li>Consultar la oferta y disponibilidad de clases en Casa Koltin.</li>\n<li>Inscribir a una GP a una clase.</li>\n<li>Registrar a una GP en lista de espera.</li>\n<li>Completar el cuestionario de autopercepción desde el perfil del asistente.</li>\n</ul>\n<img src=\"/_blob/ff137b5878ff90910a61eeea39475b8a\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.25rem\">Pantalla de inscripción en LANA</p>\n<img src=\"/_blob/d74fc5714585635d77c7f217ce6a1fc4\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.25rem\">Vista general de LANA — gestión de Comunidad</p>\n<div class=\"callout amber\"><p>⚠️ Si no tienes acceso a LANA, solicítalo al equipo de Comunidad según tu rol y equipo.</p></div>\n\n<h3>📅 LUMA — Calendario de eventos y clases</h3>\n<img src=\"/_blob/5a645e42a660bfb845b01e66e88f99b9\" style=\"width:100%;border-radius:12px;margin:.75rem 0;box-shadow:0 2px 12px rgba(0,0,0,.1)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.25rem\">Ejemplo de evento en LUMA</p>\n<p>LUMA es la plataforma pública de eventos de Koltin. Las GPs y el equipo pueden consultarla para ver el calendario completo de actividades.</p>\n<ul>\n<li><strong>Eventos y encuentros presenciales:</strong> <a href=\"https://luma.com/calendar/calqZ1VSuBNtgxCLgn\" target=\"_blank\">luma.com/calendar/eventos</a></li>\n<li><strong>Clases virtuales:</strong> <a href=\"https://luma.com/calendar/calEhOHk8GS958ysnE\" target=\"_blank\">luma.com/calendar/virtuales</a></li>\n</ul>\n<p><strong>Clases virtuales — enlaces directos:</strong></p>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.5rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;text-align:left;border-bottom:2px solid var(--g3)\">Clase</th><th style=\"padding:.4rem .75rem;text-align:left;border-bottom:2px solid var(--g3)\">Plataforma</th><th style=\"padding:.4rem .75rem;text-align:left;border-bottom:2px solid var(--g3)\">Enlace</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Yoga y Funcional</td><td style=\"padding:.4rem .75rem\">YouTube / Facebook Live</td><td style=\"padding:.4rem .75rem\">Canal Koltin</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Cine Club</td><td style=\"padding:.4rem .75rem\">Google Meet</td><td style=\"padding:.4rem .75rem\"><a href=\"https://meet.google.com/kie-rehtewm\" target=\"_blank\">meet.google.com/kie-rehtewm</a><br><a href=\"https://luma.com/alzyrtod\" target=\"_blank\" style=\"font-size:.8rem\">luma.com/alzyrtod</a></td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Historia de Arte<br><span style=\"font-size:.8rem;color:var(--n5)\">Lun y Vie 1pm</span></td><td style=\"padding:.4rem .75rem\">Google Meet</td><td style=\"padding:.4rem .75rem\"><a href=\"https://meet.google.com/tja-byye-gxq\" target=\"_blank\">meet.google.com/tja-byye-gxq</a><br><a href=\"https://luma.com/hgmuumzz\" target=\"_blank\" style=\"font-size:.8rem\">luma.com/hgmuumzz</a></td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Historia de Arte<br><span style=\"font-size:.8rem;color:var(--n5)\">Mar y Jue 12pm</span></td><td style=\"padding:.4rem .75rem\">Google Meet</td><td style=\"padding:.4rem .75rem\"><a href=\"https://meet.google.com/vpv-fssx-rts\" target=\"_blank\">meet.google.com/vpv-fssx-rts</a><br><a href=\"https://luma.com/95ssugzo\" target=\"_blank\" style=\"font-size:.8rem\">luma.com/95ssugzo</a></td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Escritura Creativa</td><td style=\"padding:.4rem .75rem\">Google Meet</td><td style=\"padding:.4rem .75rem\"><a href=\"https://meet.google.com/tbu-qfur-uvj\" target=\"_blank\">meet.google.com/tbu-qfur-uvj</a></td></tr>\n<tr style=\"background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Mindfulness</td><td style=\"padding:.4rem .75rem\">Google Meet</td><td style=\"padding:.4rem .75rem\"><a href=\"https://meet.google.com/wzc-zdbgpox\" target=\"_blank\">meet.google.com/wzc-zdbgpox</a></td></tr>\n</table>\n\n<h3>📋 Lista de espera</h3>\n<p>Cuando una clase está llena, la GP puede registrarse en lista de espera desde LANA (con certificado y nombre). Si se libera un lugar, el equipo de Comunidad contacta directamente a la primera persona en lista para confirmar su incorporación.</p>\n\n<h3>🌟 Primera vez en Comunidad — 5 pasos adicionales</h3>\n<p>Cuando una GP se inscribe por primera vez, debe completar:</p>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li><strong>Cuestionario de Autopercepción</strong> — desde LANA, para medir expectativas y autopercepción de salud.</li>\n<li><strong>Reglamento de Casa Koltin</strong> — para mantener el espacio seguro y armonioso.</li>\n<li><strong>Declaración de Salud</strong> — confirma que no hay riesgo al participar en actividades físicas.</li>\n<li><strong>Deslinde de Responsabilidades</strong> — acompañamiento transparente, respetando el ritmo de cada cuerpo.</li>\n<li><strong>Sesión de Onboarding</strong> — se sugiere llegar 15 minutos antes de la primera clase para que el equipo de Comunidad dé la bienvenida.</li>\n</ol>\n<div class=\"callout blue\"><p>💡 No es obligatorio completar los 5 pasos al momento de la inscripción, pero es importante que la GP sepa que debe hacerlo.</p></div>\n</div>","subc3": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Guía de Comunidad para Expertxs, Sales &amp; Renewals.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás exactamente qué consultas de Comunidad sí puedes resolver, cuáles debes escalar, y cómo responder las preguntas más frecuentes de las GPs.</p>\n\n<h3>✅ Lo que SÍ resuelves tú</h3>\n<ul>\n<li><strong>Horarios de clases y talleres</strong> — por llamada, presencial o en recepción. Consulta disponibilidad en LANA.</li>\n<li><strong>Lista de espera</strong> — registrar a la GP en LANA cuando una clase está llena.</li>\n<li><strong>Información sobre inscripción</strong> — explicar el proceso, los criterios de modulación y los 5 pasos de primera vez.</li>\n<li><strong>Dudas sobre inasistencias</strong> — si la GP no puede asistir, debe avisar al equipo. Si no avisa, se asume que no asistirá y el lugar puede abrirse a lista de espera.</li>\n<li><strong>Dudas sobre eventos especiales</strong> — usar el calendario actualizado mensualmente (¿hay acompañante? ¿transmisión en línea? ¿cupo?).</li>\n<li><strong>Clases virtuales</strong> — enviar el enlace de la clase si aparece llena en LUMA.</li>\n</ul>\n\n<h3>❌ Lo que NO resuelves tú — Escalar a Comunidad</h3>\n<ul>\n<li><strong>Programa de Salud Muscular</strong> — reasignar ticket al equipo de Gero.</li>\n<li><strong>Quejas sobre clases o profesores</strong> — el equipo de Comunidad da solución oportuna.</li>\n<li><strong>Cambios de horarios o reprogramaciones</strong> — solo el equipo de Comunidad confirma modificaciones para evitar confusiones.</li>\n</ul>\n\n<h3>❓ Preguntas frecuentes y cómo responderlas</h3>\n\n<p><strong>\"¿Puedo asistir con acompañante?\"</strong><br>\nSolo si es indispensable para su movilidad. Si el acompañante no es miembro de Koltin, espera en el área de encuentro.</p>\n\n<p><strong>\"¿Desde qué edad puedo asistir?\"</strong><br>\nA partir de los 50 años.</p>\n\n<p><strong>\"¿Tengo que llevar material?\"</strong><br>\nNo — Koltin proporciona todo. Solo ropa cómoda y calzado adecuado.</p>\n\n<p><strong>\"¿Cualquiera puede entrar a las clases virtuales?\"</strong><br>\nSí — cualquier miembro activo de Koltin puede acceder sin importar en qué parte de México esté.</p>\n\n<p><strong>\"¿Cuándo son las reinscripciones?\"</strong><br>\nCada 3 meses, durante la primera semana del mes. Se avisa con una semana de anticipación.</p>\n\n<p><strong>\"¿Hay restricciones para las clases?\"</strong><br>\nNo hay restricciones, pero se pide llegar bien alimentada y firmar el kit de documentos en la primera visita presencial.</p>\n\n<div class=\"callout amber\"><p>🐝 Recuerda: las áreas de Expertxs y Comunidad son el primer puente entre las GPs y las actividades de Comunidad. Tu labor va más allá de dar información — eres quien cuida que cada interacción refleje la calidez y confianza que distingue este espacio.</p></div>\n</div>","subs1": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Seguro de Gastos Médicos Mayores · Koltin.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar comprenderás qué es el SGMM, por qué es un diferenciador clave de Koltin, qué cubre en México y cómo funciona la cobertura en el extranjero.</p>\n\n<h3>🔄 Contexto importante: la transición de aseguradora</h3>\n<div class=\"callout amber\">\n<p><strong>Antes del 14 de octubre de 2026:</strong> el SGMM estaba respaldado por <strong>BBVA Seguros Salud</strong>.<br>\n<strong>A partir del 14 de octubre de 2026:</strong> Koltin transicionó al público general a <strong>GNP Seguros</strong>.</p>\n<p>¿Quién sigue con BBVA Seguros Salud? Los clientes que llegaron a Koltin siendo <strong>empleados, familiares o jubilados de BBVA</strong>. Sus pólizas continúan con esa aseguradora.<br>\n¿Quién está con GNP? Todos los clientes del público general que hicieron la transición y <strong>todos los nuevos miembros que ingresen a partir del 14 de octubre de 2026</strong>.</p>\n<p>Como Experta, debes identificar con qué aseguradora está cada GP <strong>antes de orientarla en un proceso de siniestro</strong>.</p>\n<div class=\"callout green\"><p>🔍 <strong>¿Cómo identificar la aseguradora de una GP?</strong><br>\nEn <strong>Sails → Operación → Certificado</strong>, busca el nombre de la GP o su número de certificado. En el apartado \"Detalle del certificado\" verás la etiqueta de la aseguradora: <strong>BBVA Seguros Salud</strong> (azul) o <strong>GNP Seguros</strong> (naranja).</p></div>\n</div>\n\n<img src=\"/_blob/f7e8a7a21e434047ecd013da76c5f6f4\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Qué hace especial al SGMM Koltin?</p>\n\n<h3>🤝 ¿Por qué el SGMM es especial en Koltin?</h3>\n<p>Muchos clientes llegan a Koltin precisamente por el SGMM. La mayoría de las aseguradoras establecen un límite de edad de 60 a 65 años para contratar este tipo de seguros. <strong>Gracias a la alianza de Koltin con GNP, el seguro está disponible para personas de hasta 84 años y 11 meses.</strong></p>\n<p>GNP Seguros tiene más de 100 años de experiencia en el mercado asegurador mexicano — uno de los respaldos más sólidos que una aseguradora puede tener.</p>\n<div class=\"callout blue\"><p>📌 Este es uno de los principales diferenciadores de Koltin. Muchos clientes muestran incredulidad al conocer el producto — tu labor como Experta es transmitir confianza y claridad.</p></div>\n\n<h3>🛡️ Características únicas del SGMM Koltin</h3>\n<ul>\n<li><strong>Sin límite de edad para renovación</strong> — siempre que la GP mantenga su membresía activa.</li>\n<li><strong>Póliza grupal</strong> — permite ofrecer precios más accesibles que una póliza individual.</li>\n<li><strong>Cobertura en México y emergencias en el extranjero</strong> — bajo ciertas condiciones.</li>\n<li><strong>Se complementa con los beneficios preventivos</strong> — videoconsultas y EDL incluidos en la membresía.</li>\n</ul>\n\n<div class=\"callout blue\"><p>📋 <strong>Antes de continuar</strong> — Para entender bien el SGMM, ten presentes 3 elementos: (1) <strong>exclusiones generales</strong>: condiciones que nunca cubre; (2) <strong>tiempos de espera</strong>: plazos que deben cumplirse antes de usar ciertos beneficios; (3) <strong>deducible y coaseguro</strong>: los montos que siempre asume la GP. Los detalles completos están en los subtemas de Glosario y Exclusiones.</p></div>\n\n<h3>🌍 Cobertura en el Extranjero</h3>\n<div class=\"callout blue\"><p>💡 <strong>Pago directo vs Reembolso:</strong> En pago directo, la aseguradora liquida su parte directamente con el hospital — la GP no adelanta dinero. En reembolso, la GP paga de su bolsillo y después solicita la devolución con documentación. <strong>En el extranjero siempre aplica reembolso</strong>, ya que GNP no tiene convenios con hospitales fuera de México.</p></div>\n<p>El SGMM incluye cobertura para emergencias médicas en el extranjero por hasta <strong>50,000 dólares estadounidenses</strong>.
