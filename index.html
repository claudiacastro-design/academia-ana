// GAME RENDERING
// ════════════════════════════════════
function renderGame(s){
  const g=GAMES[s.id];
  const p=gProg(S.exp.email,s.id);
  if(!g)return`<div class="card"><p>Juego no disponible para este subtema.</p><button class="btn btn-primary" onclick="completeGame('${s.id}')">Continuar al Examen →</button></div>`;
  let html='';
  switch(g.type){
    case 'scenario': html=renderScenario(s,g); break;
    case 'memorama': html=renderMemorama(s,g); break;
    case 'truefalse': html=renderTrueFalse(s,g); break;
    case 'sequence':  html=renderSequence(s,g); break;
    case 'wordsearch':html=renderWordSearch(s,g); break;
    case 'hangman':   html=renderHangman(s,g); break;
    default: html='';
  }
  return`<div class="card">
  <div class="flex ai-c gap-3" style="margin-bottom:1.125rem;padding-bottom:.875rem;border-bottom:1px solid var(--g0)">
    <span style="font-size:1.25rem">🎮</span><h3>Juego interactivo</h3>
    ${p.gd?'<span class="badge bg" style="margin-left:auto;font-size:.7rem">✓ Completado</span>':''}
  </div>
  ${html}
  <div class="flex jc-b ai-c" style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--n1)">
    <button class="btn btn-ghost btn-sm" onclick="S.stage='animation';S.gameState={};renderSub()">← Volver a animación</button>
    <button class="btn btn-primary" id="btn-game-next" onclick="completeGame('${s.id}')" ${isGameDone(g)?'':' disabled'}>Continuar al Examen →</button>
  </div></div>`;
}

function unlockNext(){const b=document.getElementById('btn-game-next');if(b)b.disabled=false;}
function isGameDone(g){
  const gs=S.gameState;if(!gs)return false;
  switch(g.type){
    case 'scenario':  return gs.done&&gs.correct>=(g.pass||2);
    case 'memorama':  return gs.matched&&gs.matched.length>=(g.pairs?.length||0);
    case 'truefalse': return gs.done&&gs.correct>=3;
    case 'sequence':  return gs.checked&&gs.placed&&gs.items&&gs.placed.length===g.steps.length&&gs.placed.every((ii,pos)=>gs.items[ii].correct===pos);
    case 'wordsearch':return gs.found&&gs.found.length>=(g.words?.length||0);
    case 'hangman':   return gs.won===true;
    default: return false;
  }
}

// ── ESCENARIO DE DECISIÓN ──────────────────────
function renderScenario(s,g){
  if(!S.gameState.sc_idx)S.gameState={sc_idx:0,correct:0,done:false};
  const idx=S.gameState.sc_idx;
  const sc=g.scenarios[idx];
  if(S.gameState.done){
    const pass=S.gameState.correct>=g.pass;
    if(pass)unlockNext();
    return`<div class="game-wrap" style="text-align:center">
      <div style="font-size:2.5rem;margin-bottom:.5rem">${pass?'🎉':'💪'}</div>
      <h3 style="color:${pass?'var(--g9)':'var(--amber)'}">
        ${pass?'¡Bien hecho!':'Casi — repasa la lectura'}
      </h3>
      <p>${S.gameState.correct} de ${g.scenarios.length} escenarios respondidos correctamente.</p>
      ${!pass?`<button class="btn btn-muted btn-sm" style="margin-top:.75rem" onclick="S.gameState={sc_idx:0,correct:0,done:false};renderSub()">Intentar de nuevo</button>`:''}
    </div>`;
  }
  return`<div class="game-wrap">
    <div style="font-size:.75rem;color:var(--n5);margin-bottom:.75rem">Escenario ${idx+1} de ${g.scenarios.length}</div>
    <div class="sc-card"><div class="sc-txt">${sc.txt}</div>
      <div class="sc-opts">
        ${sc.opts.map((o,i)=>`<button class="sc-opt" onclick="pickScenario(${i},'${s.id}')">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
      </div>
    </div>
    <div id="sc-fb" style="display:none"></div>
  </div>`;
}

function pickScenario(i,sid){
  const g=GAMES[sid];const idx=S.gameState.sc_idx;const sc=g.scenarios[idx];
  const correct=i===sc.ok;
  document.querySelectorAll('.sc-opt').forEach((b,bi)=>{
    b.disabled=true;
    if(bi===i)b.classList.add(correct?'ok':'ko');
  });
  const fb=document.getElementById('sc-fb');
  if(fb){fb.style.display='block';fb.innerHTML=`<div class="callout ${correct?'green':'amber'}" style="margin-top:.5rem"><p>${correct?'✅ '+sc.fb:'❌ Respuesta incorrecta — regresa a la lectura para reforzar este tema.'}</p></div>`;}
  if(correct)S.gameState.correct++;
  setTimeout(()=>{
    S.gameState.sc_idx++;
    if(S.gameState.sc_idx>=g.scenarios.length)S.gameState.done=true;
    renderSub();
  },4000);
}

// ── MEMORAMA ──────────────────────────────────
function renderMemorama(s,g){
  if(!S.gameState.memo_init){
    const cards=[];
    g.pairs.forEach((p,i)=>{cards.push({id:'a'+i,text:p.a,num:p.n,pair:i});cards.push({id:'b'+i,text:p.b,num:p.n,pair:i});});
    cards.sort(()=>Math.random()-.5);
    S.gameState={memo_init:true,cards,flipped:[],matched:[]};
  }
  const {cards,matched}=S.gameState;
  if(matched.length===g.pairs.length)unlockNext();
  return`<div class="game-wrap">
    <p style="font-size:.8125rem;color:var(--n5);margin-bottom:.875rem;text-align:center">
      Relaciona cada concepto con su descripción — ${g.pairs.length} en total. Haz clic para voltear.
      ${matched.length>0?`<strong> ${matched.length}/${g.pairs.length} encontrados</strong>`:''}
    </p>
    <div class="memo-grid" style="grid-template-columns:repeat(4,1fr)">
      ${cards.map((c,ci)=>`
        <div class="memo-card ${S.gameState.flipped.includes(ci)||matched.includes(c.pair)?'flip':''}
          ${matched.includes(c.pair)?'match':''}"
          onclick="flipCard(${ci},'${s.id}')">
          <div class="m-front" style="font-size:.875rem;font-weight:700;letter-spacing:-.01em">Expertxs</div>
          <div class="m-back" style="font-size:.7rem;padding:.375rem"><strong style="color:var(--g5)">${c.num}-</strong> ${c.text}</div>
        </div>`).join('')}
    </div>
    ${matched.length===g.pairs.length?`<div class="callout green" style="margin-top:.875rem;text-align:center"><p>🎉 ¡Encontraste todos los pares! Ya puedes continuar al examen.</p></div>`:''}
  </div>`;
}

function flipCard(ci,sid){
  const gs=S.gameState;
  if(gs.matched.includes(gs.cards[ci].pair))return;
  if(gs.flipped.length===2||gs.flipped.includes(ci))return;
  gs.flipped.push(ci);
  renderSub();
  if(gs.flipped.length===2){
    const [a,b]=gs.flipped;
    const ca=gs.cards[a],cb=gs.cards[b];
    if(ca.pair===cb.pair&&ca.id!==cb.id){
      setTimeout(()=>{gs.matched.push(ca.pair);gs.flipped=[];renderSub();},700);
    } else {
      setTimeout(()=>{gs.flipped=[];renderSub();},1000);
    }
  }
}

// ── VERDADERO O FALSO RÁPIDO ──────────────────
function renderTrueFalse(s,g){

  }

    <div class="flex jc-b ai-c" style="margin-bottom:.5rem">

      <span id="tf-timer" style="font-size:1.5rem;font-weight:800;color:${gs.timer<=3?'var(--red)':'var(--g5)'}">${gs.timer}</span>
    </div>

    <div class="tf-row">
      <button class="tf-btn v" onclick="advanceTF(true,'${s.id}',GAMES['${s.id}'])">✓ Verdadero</button>
      <button class="tf-btn f" onclick="advanceTF(false,'${s.id}',GAMES['${s.id}'])">✗ Falso</button>
    </div>
  </div>`;
}

function advanceTF(answer,sid,g){
  const gs=S.gameState;
  if(gs.timerRef){clearInterval(gs.timerRef);gs.timerRef=null;}
  const item=g.items[gs.idx];
  if(answer===null){setTimeout(()=>{gs.idx++;gs.timer=10;if(gs.idx>=g.items.length)gs.done=true;renderSub();},400);return;}
  const correct=answer===item.ans;
  if(correct)gs.correct++;
  document.querySelectorAll('.tf-btn').forEach(b=>b.disabled=true);
  const wrap=document.querySelector('.game-wrap');
  if(wrap){const fb=document.createElement('div');fb.className='callout '+(correct?'green':'amber');fb.style.cssText='margin-top:1rem';fb.innerHTML='<p>'+(correct?'✅ ':'❌ ')+item.fb+'</p>';wrap.appendChild(fb);}
  setTimeout(()=>{gs.idx++;gs.timer=10;if(gs.idx>=g.items.length)gs.done=true;renderSub();},3500);
}

// ── ORDENAR SECUENCIA ─────────────────────────

  }

    <p style="font-size:.8125rem;color:var(--n5);margin-bottom:.75rem">Haz clic en los pasos en el orden correcto del proceso del EDL:</p>
    ${gs.placed.length>0?`<div style="margin-bottom:.875rem">
      <div style="font-size:.75rem;font-weight:600;color:var(--n5);margin-bottom:.375rem">Tu secuencia (${gs.placed.length}/${g.steps.length}):</div>
      <div class="seq-zone">
        ${gs.placed.map((itemIdx,pos)=>`<div class="seq-item placed">
          <div class="seq-num">${pos+1}</div>${gs.items[itemIdx].text}
          <button onclick="removeLast('${s.id}')" style="margin-left:auto;background:none;border:none;cursor:pointer;color:var(--n5);font-size:.875rem">✕</button>
        </div>`).join('')}
      </div>
    </div>`:''}
    <div class="seq-zone">
      ${gs.items.map((item,i)=>gs.placed.includes(i)?'':
        `<button class="seq-item" onclick="pickSeq(${i},'${s.id}')">
          <div class="seq-num">?</div>${item.text}
        </button>`).join('')}
    </div>
    ${allPlaced?`<button class="btn btn-primary btn-sm" style="margin-top:.75rem" onclick="S.gameState.checked=true;renderSub()">Verificar orden ✓</button>`:''}

function pickSeq(i,sid){S.gameState.placed.push(i);renderSub();}
function removeLast(sid){S.gameState.placed.pop();S.gameState.checked=false;renderSub();}

// ── SOPA DE LETRAS ────────────────────────────
function renderWordSearch(s,g){
  if(!S.gameState.ws_init)S.gameState={ws_init:true,found:[],sel:null};
  const gs=S.gameState;
  if(gs.found.length===g.words.length)unlockNext();
  const rows=g.grid.length,cols=g.grid[0].length;
  return`<div class="game-wrap">
    <p style="font-size:.8125rem;color:var(--n5);margin-bottom:.75rem;text-align:center">
      Encuentra las palabras ocultas. Haz clic en la primera letra y luego en la última.
      ${gs.found.length>0?`<strong> ${gs.found.length}/${g.words.length} encontradas</strong>`:''}
    </p>
    <div class="ws-grid-wrap"><div class="ws-grid" style="grid-template-columns:repeat(${cols},28px)">
      ${g.grid.map((row,r)=>row.map((cell,c)=>{
        const isFound=g.words.some((w,wi)=>gs.found.includes(wi)&&cellInWord(r,c,g.positions[w],w.length));
        const isSel=gs.sel&&gs.sel.r===r&&gs.sel.c===c;
        return`<div class="ws-cell ${isFound?'found':isSel?'sel':''}" onclick="wsClick(${r},${c},'${s.id}')">${cell}</div>`;
      }).join('')).join('')}
    </div></div>
    <div class="ws-words">
      ${g.words.map((w,i)=>`<span class="ws-word ${gs.found.includes(i)?'found':''}">${w}</span>`).join('')}
    </div>
    ${gs.found.length===g.words.length?`<div class="callout green" style="margin-top:.75rem;text-align:center"><p>🎉 ¡Encontraste todas las palabras!</p></div>`:''}
  </div>`;
}

function cellInWord(r,c,pos,len){
  for(let i=0;i<len;i++){if(pos.r+pos.dr*i===r&&pos.c+pos.dc*i===c)return true;}return false;
}

function wsClick(r,c,sid){
  const gs=S.gameState;const g=GAMES[sid];
  if(!gs.sel){gs.sel={r,c};renderSub();return;}
  // Check if selected cells match a word
  const sr=gs.sel.r,sc=gs.sel.c;
  const dr=r-sr,dc=c-sc;
  let found=false;
  g.words.forEach((w,wi)=>{
    if(gs.found.includes(wi))return;
    const pos=g.positions[w];const len=w.length;
    // Check forward and backward
    [[pos.dr,pos.dc],[-pos.dr,-pos.dc]].forEach(([ddr,ddc])=>{
      const er=pos.r+ddr*(len-1),ec=pos.c+ddc*(len-1);
      // Start must match one end, end must match other end
      if(((sr===pos.r&&sc===pos.c&&r===er&&c===ec)||(sr===er&&sc===ec&&r===pos.r&&c===pos.c))&&Math.abs(dr)+Math.abs(dc)===Math.abs(ddr*(len-1))+Math.abs(ddc*(len-1))){
        gs.found.push(wi);found=true;
      }
    });
  });
  gs.sel=null;
  renderSub();
}

// ── AHORCADO ──────────────────────────────────
function renderHangman(s,g){
  if(!S.gameState.hm_init){
    const words=[...g.words].sort(()=>Math.random()-.5);
    S.gameState={hm_init:true,words,wIdx:0,guessed:[],wrong:[],won:false,lost:false};
  }
  const gs=S.gameState;
  const word=gs.words[gs.wIdx];
  const maxWrong=6;
  const display=word.split('').map(l=>gs.guessed.includes(l)?l:'_');
  const complete=display.every(l=>l!=='_');
  if(complete){
    const next=gs.wIdx+1;
    if(next>=gs.words.length){unlockNext();gs.won=true;}
    else{setTimeout(()=>{gs.wIdx++;gs.guessed=[];gs.wrong=[];renderSub();},1200);}
  }
  if(gs.won)return`<div class="game-wrap" style="text-align:center"><div style="font-size:2.5rem;margin-bottom:.5rem">🎉</div><h3>¡Adivinaste todas las palabras!</h3><p>Ya puedes continuar al examen.</p></div>`;
  if(gs.lost)return`<div class="game-wrap" style="text-align:center"><div style="font-size:2.5rem;margin-bottom:.5rem">💪</div><h3 style="color:var(--amber)">Intenta de nuevo</h3><p>La palabra era: <strong>${word}</strong></p><button class="btn btn-muted btn-sm" style="margin-top:.75rem" onclick="S.gameState={};renderSub()">Reiniciar</button></div>`;
  
  const w=gs.wrong.length;
  return`<div class="game-wrap">
    <div class="flex jc-b ai-c" style="margin-bottom:.75rem">
      <span style="font-size:.8125rem;color:var(--n5)">Palabra ${gs.wIdx+1} de ${gs.words.length}</span>
      <span class="badge ${w>=4?'br':w>=2?'ba':'bn'}">${maxWrong-w} intentos restantes</span>
    </div>
    <svg class="hangman-svg" width="120" height="100" viewBox="0 0 120 100">
      <line x1="10" y1="95" x2="110" y2="95" stroke="var(--n7)" stroke-width="3"/>
      <line x1="30" y1="95" x2="30" y2="5" stroke="var(--n7)" stroke-width="3"/>
      <line x1="30" y1="5" x2="70" y2="5" stroke="var(--n7)" stroke-width="3"/>
      <line x1="70" y1="5" x2="70" y2="18" stroke="var(--n7)" stroke-width="2"/>
      ${w>0?'<circle cx="70" cy="26" r="8" stroke="var(--red)" stroke-width="2" fill="none"/>':''}
      ${w>1?'<line x1="70" y1="34" x2="70" y2="58" stroke="var(--red)" stroke-width="2"/>':''}
      ${w>2?'<line x1="70" y1="40" x2="55" y2="52" stroke="var(--red)" stroke-width="2"/>':''}
      ${w>3?'<line x1="70" y1="40" x2="85" y2="52" stroke="var(--red)" stroke-width="2"/>':''}
      ${w>4?'<line x1="70" y1="58" x2="55" y2="75" stroke="var(--red)" stroke-width="2"/>':''}
      ${w>5?'<line x1="70" y1="58" x2="85" y2="75" stroke="var(--red)" stroke-width="2"/>':''}
    </svg>
    <div class="hm-word">${display.map(l=>`<div class="hm-l">${l==='_'?'':l}</div>`).join('')}</div>
    <div class="hm-keys">
      ${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`
        <button class="hm-k ${gs.wrong.includes(l)?'ko':gs.guessed.includes(l)?'ok':''}"
          onclick="hmGuess('${l}','${s.id}')" ${gs.guessed.includes(l)||gs.wrong.includes(l)?'disabled':''}>${l}</button>`).join('')}
    </div>
  </div>`;
}

function hmGuess(l,sid){
  const gs=S.gameState;const word=gs.words[gs.wIdx];
  if(word.includes(l))gs.guessed.push(l);
  else{gs.wrong.push(l);if(gs.wrong.length>=6)gs.lost=true;}
  renderSub();
}

}

function modCard(m){
  const em=S.exp.email;
  const subs=SUBS.filter(s=>m.sids.includes(s.id));
  let pass=0;
  subs.forEach(s=>{if(gProg(em,s.id).pass)pass++});
  const pct=Math.round(pass/subs.length*100);
  const status=pass===subs.length?'Completado':pass>0?'En progreso':'No iniciado';
  const sc=pass===subs.length?'bg':pass>0?'bb':'bn';
  // Module locking: lock if previous module not fully passed (admins exempt)
  const sortedMods=[...MODS].sort((a,b)=>a.order-b.order);
  const modIdx=sortedMods.findIndex(x=>x.id===m.id);
  const prevMod=modIdx>0?sortedMods[modIdx-1]:null;
  const prevPassed=!prevMod||SUBS.filter(s=>prevMod.sids.includes(s.id)).every(s=>gProg(em,s.id).pass);
  const modLocked=false; // Temporalmente desbloqueado para pruebas — reactivar después
  return`<div class="mcard" style="opacity:${modLocked?.55:1};cursor:${modLocked?'default':'pointer'}" onclick="openMod('${m.id}')">
  <div class="mcard-head">
    <div class="mcard-meta"><div class="flex ai-c gap-3"><span class="mcard-emoji">${m.emoji}</span><div><h3><span style="color:var(--n4);font-size:.875rem;font-weight:600;margin-right:.375rem">Módulo ${m.order}</span>${m.name}</h3><p style="margin:0;font-size:.8125rem">${m.desc}</p></div></div><span class="badge ${sc}" style="flex-shrink:0;margin-left:.75rem">${status}</span></div>
    <div style="margin-top:.875rem"><div class="pbar"><div class="pfill" style="width:${pct}%"></div></div><div style="font-size:.75rem;color:var(--n5);margin-top:.3rem">${pass} de ${subs.length} subtemas aprobados</div></div>
  </div>
  <div class="mcard-body">
    ${subs.map(s=>{
      const p=gProg(em,s.id);
      const icon=p.pass?'✅':p.atts?.length?'🔄':p.rd?'📖':'⬜';
      const ic=p.pass?'var(--g5)':p.atts?.length?'var(--amber)':p.rd?'var(--blue)':'var(--n3)';
      const sc=p.best!==null?`${p.best}%`:'';
      return`<div class="subtopic-line" onclick="event.stopPropagation();openSub('${s.id}')">
        <div class="sub-dot" style="background:${ic}20;color:${ic}">${icon}</div>
        <div style="flex:1"><div style="font-size:.875rem;font-weight:500;color:var(--n9)">${s.name}</div><div style="font-size:.75rem;color:var(--n5)">${p.pass?'Aprobado':p.atts?.length?`${p.atts.length} intento(s)`:p.rd?'Lectura completada':'No iniciado'}</div></div>
        ${sc?`<span class="badge ${p.pass?'bg':'ba'}" style="font-size:.7rem">${sc}</span>`:''}
        <span style="color:var(--n3);font-size:.875rem">›</span>
      </div>`;
    }).join('')}
  </div>
  </div>`;
}

function nextCard(){
  const em=S.exp.email;
  for(const m of MODS)for(const sid of m.sids){const p=gProg(em,sid);if(!p.pass){const s=SUBS.find(x=>x.id===sid);return`<div class="next-card"><div style="flex:1"><div style="font-size:.75rem;color:var(--n5);font-weight:500;margin-bottom:.25rem">Continuar donde lo dejaste</div><h4>${s.name}</h4><p style="font-size:.8125rem;margin:.2rem 0 0">${s.obj}</p></div><button class="btn btn-primary btn-sm" onclick="openSub('${sid}')">Continuar →</button></div>`;}}
  return`<div class="card" style="margin-top:1.25rem;text-align:center;border-top:3px solid var(--g5)"><div style="font-size:2rem;margin-bottom:.5rem">🎉</div><h3 style="color:var(--g9)">¡Completaste todos los módulos disponibles!</h3><p style="margin-top:.5rem">Felicidades por tu dedicación. Pronto se añadirán nuevos módulos.</p></div>`;
}

    const sortedMods=[...MODS].sort((a,b)=>a.order-b.order);

  }
  mc().innerHTML=`<div class="fin">

    <div style="font-size:2rem;margin-bottom:.5rem">${m.emoji}</div>

  </div>

  <div style="display:flex;flex-direction:column;gap:.625rem">
    ${subs.map((s,i)=>{
      const p=gProg(em,s.id);
      const prev=i>0?gProg(em,subs[i-1].id):null;
      const locked=false; // Temporalmente desbloqueado para pruebas
      const si=p.pass?'✅':p.atts?.length?'🔄':p.rd?'📖':locked?'🔒':'⬜';
      const st=p.pass?'Aprobado':p.atts?.length?'Con intentos':p.rd?'Lectura hecha':locked?'Bloqueado':'No iniciado';
      const sc=p.pass?'bg':p.atts?.length?'ba':'bn';
      return`<div class="card" style="display:flex;align-items:center;gap:.875rem;cursor:${locked?'default':'pointer'};opacity:${locked?.6:1}" onclick="${locked?'':` openSub('${s.id}')`}">
        <div style="width:42px;height:42px;border-radius:50%;background:${p.pass?'var(--g1)':'var(--n1)'};display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0">${s.emoji}</div>
        <div style="flex:1"><div style="font-weight:600;color:var(--n9);margin-bottom:.125rem">${i+1}. ${s.name}</div><div style="font-size:.8125rem;color:var(--n5)">${s.obj}</div>${p.best!==null?`<div style="font-size:.75rem;color:${p.pass?'var(--g7)':'var(--amber)'};margin-top:.25rem">Mejor nota: ${p.best}% · ${p.atts?.length||0} intento(s)</div>`:''}</div>
        <div class="flex col ai-c gap-2"><span class="badge ${sc}" style="font-size:.7rem">${si} ${st}</span>${!locked?'<span style="color:var(--n3)">›</span>':''}</div>
      </div>`;
    }).join('')}
  </div>
  </div>`;
}

/* ═══════════════════════════════════
   SUBTOPIC SHELL
═══════════════════════════════════ */
function openSub(sid){if(S.atimer)clearInterval(S.atimer);S.sid=sid;S.stage='reading';S.ans={};S.result=null;S.astep=0;S.atimer=null;renderSub()}
function renderSub(){
  const s=SUBS.find(x=>x.id===S.sid);const m=MODS.find(x=>x.id===s.mid);
  const si=S.stage==='animation_done'?'animation':S.stage==='game_done'?'game':S.stage==='results'?'exam':S.stage;
  const stages=['reading','animation','game','exam'];const idx=stages.indexOf(si);
  mc().innerHTML=`<div class="fin">
  <div class="bc"><span class="bc-link" onclick="renderDash()">Inicio</span><span class="bc-sep">›</span><span class="bc-link" onclick="openMod('${m.id}')">${m.name}</span><span class="bc-sep">›</span><span>${s.name}</span></div>
  <h2 style="margin-bottom:.25rem">${s.name}</h2>
  <p style="margin-bottom:1.125rem">${s.obj}</p>
  <div class="stage-track">
    ${['Lectura','Animación','Juego','Examen'].map((n,i)=>{const done=i<idx||(i===2&&S.stage==='results');const act=i===idx&&S.stage!=='results';const stKey=['reading','animation','game','exam'][i];const oc=S.admin?'onclick="jumpStage(\''+stKey+'\')"':'';return(i>0?`<div class="stage-connector${done?' done':''}"></div>`:'')
+`<div class="stage-item${done?' done':act?' active':''}${S.admin?' clickable-stage':''}" style="${S.admin?'cursor:pointer':''}" ${oc}>`+`<div class="stage-num">${done?'✓':i+1}</div>${n}</div>`;}).join('')}
  </div>
  ${S.admin?'<div style="text-align:right;margin-bottom:.375rem"><button class="btn btn-ghost btn-sm" style="font-size:.7rem;color:var(--n4)" onclick="adminSkipToExam(\''+s.id+'\')">👁️ Ir al examen →</button></div>':''}
  <div id="sc">${renderStageContent(s)}</div>
  </div>`;
  if(S.stage==='animation'||S.stage==='animation_done')initAnim(s.id);
}

function renderStageContent(s){
  if(S.stage==='reading')return renderRead(s);
  if(S.stage==='animation'||S.stage==='animation_done')return renderAnim(s);
  if(S.stage==='game'||S.stage==='game_done')return renderGame(s);
  if(S.stage==='exam')return renderExam(s);
  if(S.stage==='results')return renderResults(s);
  return'';
}

/* ── Reading ── */
function renderRead(s){
  const p=gProg(S.exp.email,s.id);
  const adminSkip=S.admin?`<button class="btn btn-ghost btn-sm" style="color:var(--n5);font-size:.75rem" onclick="sProg(S.exp.email,'${s.id}',{rd:true,ad:true,gd:true});S.stage='exam';S.gameState={};renderSub()">Admin: ir al examen →</button>`:'';
  return`<div class="card"><div class="flex ai-c gap-3" style="margin-bottom:1.125rem;padding-bottom:.875rem;border-bottom:1px solid var(--g0)"><span style="font-size:1.25rem">📖</span><h3>Lectura</h3>${p.rd?'<span class="badge bg" style="margin-left:auto;font-size:.7rem">✓ Completada</span>':''}</div>
  ${READS[s.id]||'<p>Contenido de lectura pendiente de carga.</p>'}
  <div class="flex jc-b ai-c" style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--n1)">
    <span></span><button class="btn btn-primary" onclick="doneRead('${s.id}')">${p.rd?'Continuar a Animación →':'Marcar como leída y continuar →'}</button>
  </div></div>`;
}
function doneRead(sid){sProg(S.exp.email,sid,{rd:true});S.stage='animation';renderSub()}

/* ── Animation ── */
function renderAnim(s){
  const p=gProg(S.exp.email,s.id);
  const a=ANIMS[s.id];
  const steps=a?a.steps:[];
  const cur=steps[S.astep]||steps[0]||{i:'🔬',l:'Sin contenido',s:''};
  const total=steps.length;
  return`<div class="card"><div class="flex ai-c gap-3" style="margin-bottom:1.125rem;padding-bottom:.875rem;border-bottom:1px solid var(--g0)"><span style="font-size:1.25rem">🎬</span><h3>${a?a.title:'Animación'}</h3>${p.ad?'<span class="badge bg" style="margin-left:auto;font-size:.7rem">✓ Vista</span>':''}</div>
  <div class="anim-wrap" id="anim-wrap-main">
    <div id="anim-card-view">
      <div class="anim-step-card" id="acard">
        <div class="anim-step-emoji">${cur.i}</div>
        <div class="anim-step-title">${cur.l}</div>
        <div class="anim-step-sub">${cur.s}</div>
      </div>
      <div class="anim-nav">
        <button class="btn btn-muted btn-sm" onclick="animPrev()" id="btn-prev" ${S.astep===0?'disabled':''}>← Anterior</button>
        <div class="anim-counter" id="acounter">Paso ${S.astep+1} de ${total}</div>
        <button class="btn btn-primary btn-sm" onclick="animNext()" id="btn-next">${S.astep>=total-1?'Ver flujo completo ↓':'Siguiente →'}</button>
      </div>
      <div class="anim-hint" id="ahint">${S.astep===0?'Navega los pasos con los botones':S.astep>=total-1?'✅ Último paso — ve el flujo completo abajo':''}</div>
    </div>
    <div id="anim-full-flow" style="display:none;width:100%;max-width:400px">
      <div style="font-size:.8125rem;font-weight:600;color:var(--g9);margin-bottom:1rem">Flujo completo</div>
      ${steps.map((st,i)=>`<div style="display:flex;flex-direction:column;align-items:center">
        <div style="background:#fff;border:2px solid var(--g3);border-radius:10px;padding:.625rem 1.125rem;width:100%;text-align:center">
          <span style="font-size:1.125rem">${st.i}</span>
          <div style="font-weight:600;font-size:.8125rem;color:var(--g9);margin:.2rem 0 .1rem">${st.l}</div>
          <div style="font-size:.75rem;color:var(--n5)">${st.s}</div>
        </div>
        ${i<steps.length-1?'<div style="color:var(--g5);font-size:1rem;margin:.2rem 0;line-height:1">↓</div>':''}
      </div>`).join('')}
      <button class="btn btn-muted btn-sm" style="margin-top:1rem" onclick="animShowCard()">← Volver a los pasos</button>
    </div>
  </div>
  <div style="display:flex;gap:.5rem;justify-content:center;margin-top:.75rem">
    <button class="btn btn-muted btn-sm" onclick="animRst()">↺ Reiniciar</button>
    <button class="btn btn-muted btn-sm" id="bpp" onclick="animToggle()">▶ Reproducción automática</button>
  </div>
  <div class="flex jc-b ai-c" style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--n1)">
    <button class="btn btn-ghost btn-sm" onclick="S.stage='reading';renderSub()">← Volver a lectura</button>
    <button class="btn btn-primary" onclick="doneAnim('${s.id}')">Continuar al Juego →</button>
  </div></div>`;
}
function initAnim(sid){/* step already set in S.astep */}
function animUpdateCard(){
  const a=ANIMS[S.sid];if(!a)return;
  const steps=a.steps;const total=steps.length;const cur=steps[S.astep];
  const card=document.getElementById('acard');
  if(card&&cur){
    card.classList.add('hide');
    setTimeout(()=>{
      card.innerHTML='<div class="anim-step-emoji">'+cur.i+'</div><div class="anim-step-title">'+cur.l+'</div><div class="anim-step-sub">'+cur.s+'</div>';
      card.classList.remove('hide');
    },200);
  }
  const ctr=document.getElementById('acounter');if(ctr)ctr.textContent='Paso '+(S.astep+1)+' de '+total;
  const prev=document.getElementById('btn-prev');if(prev)prev.disabled=S.astep===0;
  const next=document.getElementById('btn-next');if(next){next.disabled=false;next.textContent=S.astep>=total-1?'Ver flujo completo ↓':'Siguiente →';}
  const h=document.getElementById('ahint');
  if(h)h.textContent=S.astep===0?'Navega los pasos con los botones':S.astep>=total-1?'✅ Último paso — ve el flujo completo abajo':'';
}
function animNext(){
  const a=ANIMS[S.sid];if(!a)return;
  if(S.astep<a.steps.length-1){S.astep++;animUpdateCard();}
  else{animShowFullFlow();}
}
function animShowFullFlow(){
  const cv=document.getElementById('anim-card-view');
  const fv=document.getElementById('anim-full-flow');
  if(cv)cv.style.display='none';
  if(fv)fv.style.display='block';
  const wrap=document.getElementById('anim-wrap-main');
  if(wrap)wrap.style.minHeight='auto';
}
function animShowCard(){
  const cv=document.getElementById('anim-card-view');
  const fv=document.getElementById('anim-full-flow');
  if(cv)cv.style.display='block';
  if(fv)fv.style.display='none';
  const wrap=document.getElementById('anim-wrap-main');
  if(wrap)wrap.style.minHeight='260px';
}
function animPrev(){if(S.astep>0){S.astep--;animUpdateCard();}}
function animToggle(){const btn=document.getElementById('bpp');if(!btn)return;if(S.atimer){clearInterval(S.atimer);S.atimer=null;btn.textContent='▶ Reproducción automática'}else{btn.textContent='⏸ Pausar';S.atimer=setInterval(()=>{const a=ANIMS[S.sid];if(!a||S.astep>=a.steps.length-1){clearInterval(S.atimer);S.atimer=null;const b=document.getElementById('bpp');if(b)b.textContent='▶ Reproducción automática';animShowFullFlow();return;}S.astep++;animUpdateCard();},3000);}}
function animRst(){if(S.atimer){clearInterval(S.atimer);S.atimer=null}S.astep=0;animShowCard();animUpdateCard();const b=document.getElementById('bpp');if(b)b.textContent='▶ Reproducción automática';}
function doneAnim(sid){if(S.atimer)clearInterval(S.atimer);sProg(S.exp.email,sid,{ad:true});S.stage='game';S.gameState={};renderSub()}
function jumpStage(stage){
  if(S.atimer)clearInterval(S.atimer);
  S.atimer=null;
  S.stage=stage;
  S.gameState={};
  renderSub();
}
function adminSkipToExam(sid){
  sProg(S.exp.email,sid,{rd:true,ad:true,gd:true});
  S.stage='exam';S.gameState={};renderSub();
}
function completeGame(sid){sProg(S.exp.email,sid,{gd:true});S.stage='exam';renderSub();}

/* ── Exam ── */
function renderExam(s){
  const p=gProg(S.exp.email,s.id);const qs=QS[s.id]||[];S.ans={};
  return`<div class="card"><div class="flex ai-c gap-3" style="margin-bottom:1.125rem;padding-bottom:.875rem;border-bottom:1px solid var(--g0)">
    <span style="font-size:1.25rem">📝</span><h3>Examen · ${s.name}</h3>
    <div class="flex gap-2 ml-a"><span class="badge bb" style="font-size:.7rem">${qs.length} preguntas</span><span class="badge bn" style="font-size:.7rem">Aprobatorio: 85%</span></div>
  </div>
${p.atts?.length?`<div class="callout amber" style="margin-bottom:.875rem"><p>Intentos anteriores: <strong>${p.atts.length}</strong> · Mejor nota: <strong>${p.best}%</strong></p></div>`:''}
  ${qs.map((q,qi)=>`<div class="q-block">
    <div class="q-head"><div class="q-num">${qi+1}</div><div class="q-text">${q.text}</div></div>
    <div class="opts">${q.opts.map((o,oi)=>`<button class="opt" id="o${q.id}_${oi}" onclick="selAns('${q.id}',${oi},this)"><span class="opt-l">${String.fromCharCode(65+oi)}</span>${o}</button>`).join('')}</div>
  </div>`).join('')}
  <div class="flex jc-b ai-c" style="margin-top:1.125rem;padding-top:1rem;border-top:1px solid var(--n1)">
    <button class="btn btn-ghost btn-sm" onclick="S.stage='animation';renderSub()">← Volver a animación</button>
    <div id="exam-warn" style="display:none;color:var(--red);font-size:.875rem;font-weight:500;margin-bottom:.5rem"></div><button class="btn btn-primary" onclick="submitExam('${s.id}')">Enviar examen →</button>
  </div></div>`;
}
function selAns(qid,oi,btn){document.querySelectorAll(`[id^="o${qid}_"]`).forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');S.ans[qid]=oi}
function submitExam(sid){
  const qs=QS[sid]||[];
  const miss=qs.filter(q=>S.ans[q.id]===undefined);
  if(miss.length){
    const warn=document.getElementById('exam-warn');
    if(warn){warn.textContent='⚠️ Faltan '+miss.length+' pregunta(s) por responder.';warn.style.display='block';}
    // Scroll to first unanswered question
    const firstMiss=document.getElementById('q-'+miss[0].id);
    if(firstMiss)firstMiss.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  let correct=0;qs.forEach(q=>{if(S.ans[q.id]===q.ok)correct++});
  const score=Math.round(correct/qs.length*100);
  S.result={score,pass:score>=90,correct,total:qs.length,qs,ans:{...S.ans}};
  sAtt(S.exp.email,sid,score,S.ans);
  if(score>=90)sProg(S.exp.email,sid,{pass:true});
  S.stage='results';renderSub();
}

/* ── Results ── */
function renderResults(s){
  const r=S.result;if(!r)return'';
  const {score,pass,correct,total,qs,ans}=r;
  const prog=gProg(S.exp.email,s.id);
  const atts=prog.atts||[];
  const attHtml=atts.length>1?`<div style="margin-bottom:1rem;padding:.75rem;background:var(--n0);border-radius:var(--r);border:1px solid var(--n1)">
    <p style="font-size:.8125rem;font-weight:600;color:var(--n5);margin-bottom:.5rem">Historial de intentos</p>
    ${atts.map((a,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:.25rem 0;border-bottom:${i<atts.length-1?'1px solid var(--n1)':'none'}">
      <span style="font-size:.875rem;color:var(--n6)">Intento ${i+1}</span>
      <span style="font-size:.875rem;font-weight:600;color:${a.pass?'var(--g7)':'var(--red)'}">${a.score}% ${a.pass?'✅':'❌'}</span>
    </div>`).join('')}
  </div>`:'';
  return`<div class="card"><div class="tc" style="padding:.5rem 0 1rem">
    ${attHtml}
    <div class="score-ring ${pass?'pass':'fail'}"><div class="score-n">${score}%</div><div class="score-sub">${correct}/${total} correctas</div></div>
    <h2 style="color:${pass?'var(--g9)':'#92400E'}">${pass?'¡Aprobado! 🎉':'Sigue adelante 💪'}</h2>
    <p style="margin:.375rem 0 1rem">${pass?'Excelente trabajo. Has aprobado este subtema.':score>=70?`Estás cerca. Necesitas 90% y obtuviste ${score}%. Repasa los conceptos fallados.`:`Necesitas 90% para aprobar. Tu calificación fue ${score}%. Revisa la lectura y la animación.`}</p>
    ${!pass?`<div class="callout amber tc" style="text-align:left"><p><strong>Recomendación:</strong> Revisa la lectura y la animación antes de intentar nuevamente, poniendo atención en las preguntas que fallaste.</p></div>`:''}
  </div>
  <div style="border-top:1px solid var(--n1);padding-top:1.125rem;margin-top:.5rem">
    <h4 style="margin-bottom:.875rem">Revisión de respuestas</h4>
    ${qs.map((q,i)=>{const ok=ans[q.id]===q.ok;return`<div class="review-item ${ok?'ok':'ko'}"><div class="review-q">${i+1}. ${q.text}</div>
    ${ok
      ?`<div class="review-ans" style="color:#14532D">✅ Correcta</div><div class="review-exp">💡 ${q.exp}</div>`
      :`<div class="review-ans" style="color:var(--red)">❌ Tu respuesta: ${q.opts[ans[q.id]]}</div><div class="review-exp" style="color:var(--n5)">Regresa a la lectura para encontrar la respuesta correcta.</div>`
    }</div>`;}).join('')}
  </div>
  <div class="flex jc-b ai-c" style="margin-top:1.125rem;padding-top:1rem;border-top:1px solid var(--n1)">

  </div></div>`;

function exportCSV(){

  const rows=[['Experta','Correo','Módulo','Subtema','Intento','Fecha','Calificación','Aprobó','Pregunta incorrecta','Respuesta dada']];
  exps.forEach(exp=>{
    MODS.forEach(mod=>{
      mod.sids.forEach(sid=>{
        const sub=SUBS.find(s=>s.id===sid);
        const prog=exp.prog?.[sid];
        if(!prog?.atts?.length)return;
        prog.atts.forEach((att,i)=>{
          const qs=QS[sid]||[];
          const wrongs=qs.filter(q=>att.ans&&att.ans[q.id]!==undefined&&att.ans[q.id]!==q.ok);
          if(wrongs.length===0){
            rows.push([exp.name,exp.email,mod.name,sub?.name||sid,i+1,att.date?.slice(0,10)||'',att.score,att.pass?'Sí':'No','—','—']);
          } else {
            wrongs.forEach(q=>{
              rows.push([exp.name,exp.email,mod.name,sub?.name||sid,i+1,att.date?.slice(0,10)||'',att.score,att.pass?'Sí':'No',q.text,q.opts[att.ans[q.id]]||'']);
            });
          }
        });
      });
    });
  });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  // Show modal with copyable CSV
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem';
  overlay.innerHTML=`<div style="background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.2)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">

        <h3 style="margin:0;font-size:1rem;font-weight:700;color:#064E3B">Exportar datos — ${rows.length-1} registros</h3>

      </div>
      <button onclick="this.closest('div[style*=fixed]').remove()" style="border:none;background:var(--n1,#F3F4F6);border-radius:8px;padding:.375rem .75rem;cursor:pointer;font-size:.875rem;color:#374151">✕ Cerrar</button>
    </div>
    <textarea id="csv-out" readonly style="width:100%;height:220px;font-family:monospace;font-size:.75rem;border:1.5px solid #D1D5DB;border-radius:8px;padding:.75rem;resize:vertical;color:#374151;background:#FAFAFA">${csv.replace(/</g,'&lt;')}</textarea>
    <div style="display:flex;gap:.625rem;margin-top:.875rem">
      <button onclick="const t=document.getElementById('csv-out');t.select();document.execCommand('copy');this.textContent='✓ ¡Copiado!';this.style.background='#059669';this.style.color='#fff';setTimeout(()=>{this.textContent='📋 Copiar todo';this.style.background='';this.style.color='';},2000)" style="flex:1;padding:.625rem 1rem;background:#059669;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.875rem">📋 Copiar todo</button>
      <button onclick="this.closest('div[style*=fixed]').remove()" style="padding:.625rem 1rem;background:#F3F4F6;color:#374151;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.875rem">Cerrar</button>
    </div>
    <p style="font-size:.75rem;color:#9CA3AF;margin:.625rem 0 0;text-align:center">Pega en Excel → Datos → Texto en columnas → Delimitado por comas</p>

function adminDashTab(exps){
  const subStats=SUBS.map(s=>{
    let scores=[],pass=0,total=0;
    exps.forEach(e=>{
      const p=e.prog&&e.prog[s.id];
      if(!p)return;
      total++;
      if(p.pass)pass++;
      if(p.best!==null&&p.best!==undefined)scores.push(p.best);
    });
    const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;
    const pct=total?Math.round(pass/total*100):0;
    return{name:s.name,avg,pass,total,pct,attempts:scores.length};
  }).filter(s=>s.attempts>0);
  const buckets={90:0,75:0,60:0,0:0};
  exps.forEach(e=>MODS.forEach(m=>m.sids.forEach(sid=>{
    const p=e.prog&&e.prog[sid];
    if(p&&p.best!==null&&p.best!==undefined){
      if(p.best>=90)buckets[90]++;
      else if(p.best>=75)buckets[75]++;
      else if(p.best>=60)buckets[60]++;
      else buckets[0]++;
    }
  })));
  const totalScores=Object.values(buckets).reduce((a,b)=>a+b,0);
  if(exps.length===0)return'<div class="card" style="text-align:center;padding:2.5rem"><div style="font-size:2rem;margin-bottom:.5rem">📊</div><p>Aún no hay datos. El dashboard se llenará conforme las Expertas completen exámenes.</p></div>';
  let html='<div style="display:flex;flex-direction:column;gap:1.25rem">';
  // Subtopic progress
  html+='<div class="card"><h3 style="margin-bottom:1rem">Progreso por subtema</h3>';

    subStats.forEach(s=>{
      html+='<div style="margin-bottom:1rem"><div class="flex jc-b ai-c" style="margin-bottom:.375rem">'
        +'<span style="font-size:.875rem;font-weight:500;color:var(--n9)">'+s.name+'</span>'
        +'<div class="flex gap-2 ai-c">'
        +(s.avg!==null?'<span class="badge '+(s.avg>=85?'bg':'ba')+'" style="font-size:.7rem">Prom: '+s.avg+'%</span>':'')
        +'<span style="font-size:.75rem;color:var(--n5)">'+s.pass+'/'+s.total+' aprobaron</span>'
        +'</div></div><div class="pbar" style="height:10px"><div class="pfill '+(s.avg!==null&&s.avg<85?'amber':'')+'" style="width:'+s.pct+'%"></div></div></div>';
    });
  } else { html+='<p>Sin datos aún.</p>'; }
  html+='</div>';
  // Score distribution
  if(totalScores>0){
    html+='<div class="card"><h3 style="margin-bottom:1rem">Distribución de calificaciones</h3>'
      +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;text-align:center">';
    [{label:'90-100%',key:90,color:'var(--g5)',bg:'var(--g0)'},
     {label:'75-89%',key:75,color:'var(--amber)',bg:'var(--amber-bg)'},
     {label:'60-74%',key:60,color:'#D97706',bg:'#FEF3C7'},
     {label:'0-59%',key:0,color:'var(--red)',bg:'var(--red-bg)'}
    ].forEach(b=>{
      html+='<div style="background:'+b.bg+';border-radius:var(--r);padding:.875rem .5rem">'
        +'<div style="font-size:1.75rem;font-weight:800;color:'+b.color+'">'+buckets[b.key]+'</div>'
        +'<div style="font-size:.75rem;color:var(--n5);margin-top:.25rem">'+b.label+'</div></div>';
    });
    html+='</div></div>';
  }
  // Recent activity
  html+='<div class="card"><h3 style="margin-bottom:.875rem">Actividad reciente</h3>';
  const sorted=[...exps].sort((a,b)=>new Date(b.last||0)-new Date(a.last||0)).slice(0,30);
  sorted.forEach(e=>{
    let pass=0,total=0;
    MODS.forEach(m=>m.sids.forEach(s=>{total++;if(e.prog&&e.prog[s]&&e.prog[s].pass)pass++;}));
    const pct=total?Math.round(pass/total*100):0;

      +'<div class="ava">'+initials(e.name)+'</div>'
      +'<div style="flex:1"><div style="font-size:.875rem;font-weight:500;color:var(--g7)">'+e.name+' →</div>'
      +'<div style="font-size:.75rem;color:var(--n5)">Última actividad: '+fmtDate(e.last)+'</div></div>'
      +'<div style="text-align:right"><div style="font-size:.875rem;font-weight:600;color:'+(pct>=50?'var(--g7)':'var(--n7)')+'">'+pct+'%</div>'
      +'<div style="font-size:.7rem;color:var(--n5)">'+pass+'/'+total+' subtemas</div></div></div>';
  });
  html+='</div></div>';
  return html;

function adminAnaTab(exps){
  const qFails={};
  SUBS.forEach(s=>{
    const qs=QS[s.id]||[];
    qs.forEach(q=>{qFails[q.id]={text:q.text,subtopic:s.name,total:0,fails:0};});
    exps.forEach(e=>{
      const p=e.prog&&e.prog[s.id];
      if(p&&p.atts){p.atts.forEach(a=>{
        if(!a.ans)return;
        qs.forEach(q=>{
          if(a.ans[q.id]!==undefined){
            qFails[q.id].total++;
            if(a.ans[q.id]!==q.ok)qFails[q.id].fails++;
          }
        });
      });}
    });
  });
  const topFails=Object.values(qFails).filter(q=>q.fails>0).sort((a,b)=>b.fails-a.fails).slice(0,8);
  let html='<div style="display:flex;flex-direction:column;gap:.75rem">';
  SUBS.forEach(s=>{
    let scores=[],fails=0,pass=0;
    exps.forEach(e=>{const p=e.prog&&e.prog[s.id];if(p&&p.atts){p.atts.forEach(a=>{scores.push(a.score);if(!a.pass)fails++;});if(p.pass)pass++;}});
    const avg=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):null;
    html+='<div class="card"><div class="flex ai-c jc-b">'
      +'<div><h4>'+s.name+'</h4><p style="font-size:.8125rem;margin:.25rem 0 0">'+scores.length+' exámenes · '+pass+' aprobados · '+fails+' fallidos</p></div>'
      +(avg!==null?'<span class="badge '+(avg>=85?'bg':'ba')+'">Promedio: '+avg+'%</span>':'<span class="badge bn">Sin datos aún</span>')
      +'</div>'+(scores.length?'<div class="pbar" style="margin-top:.75rem"><div class="pfill '+(avg<60?'red':avg<85?'amber':'')+'" style="width:'+(avg||0)+'%"></div></div>':'')+'</div>';
  });
  if(topFails.length){
    html+='<h3 style="margin-top:.5rem;margin-bottom:.5rem">⚠️ Preguntas con más errores</h3>';
    topFails.forEach(q=>{
      const pct=Math.round(q.fails/q.total*100);
      html+='<div class="card" style="border-left:3px solid '+(pct>=60?'var(--red)':pct>=40?'var(--amber)':'var(--n3)')+'">'
        +'<div class="flex jc-b ai-c" style="margin-bottom:.375rem">'
        +'<div style="font-size:.8125rem;font-weight:600;color:var(--n9);flex:1;margin-right:.5rem">'+(q.text.length>90?q.text.slice(0,90)+'…':q.text)+'</div>'
        +'<span class="badge '+(pct>=60?'br':pct>=40?'ba':'bn')+'" style="flex-shrink:0">'+q.fails+'/'+q.total+' fallan</span>'
        +'</div><div style="font-size:.75rem;color:var(--n5);margin-bottom:.375rem">'+q.subtopic+'</div>'
        +'<div class="pbar"><div class="pfill '+(pct>=60?'red':'amber')+'" style="width:'+pct+'%"></div></div></div>';
    });
  }
  html+='</div>';
  return html;
}


function mergeDBIntoLocal(dbData){
  if(!dbData||!dbData.length)return false;
  const d=gDB();if(!d.experts)d.experts={};
  dbData.forEach(function(exp){
    if(!exp.email||!exp.name)return;
    if(!d.experts[exp.email]){
      d.experts[exp.email]={...exp,prog:exp.prog||{}};
    } else {
      if(new Date(exp.last||0)>new Date(d.experts[exp.email].last||0)){
        d.experts[exp.email].last=exp.last;
        d.experts[exp.email].name=exp.name;
      }
      const lp=d.experts[exp.email].prog||{};
      const dp=exp.prog||{};
      Object.keys(dp).forEach(function(sid){
        if(!lp[sid]){lp[sid]=dp[sid];}
        else{lp[sid]={rd:lp[sid].rd||dp[sid].rd||false,ad:lp[sid].ad||dp[sid].ad||false,gd:lp[sid].gd||dp[sid].gd||false,pass:lp[sid].pass||dp[sid].pass||false,best:Math.max(lp[sid].best||0,dp[sid].best||0)||null,atts:((lp[sid].atts||[]).length>=(dp[sid].atts||[]).length)?lp[sid].atts:(dp[sid].atts||[])};}
      });
      d.experts[exp.email].prog=lp;
    }
  });
  sDB(d);return true;
}

      +'</div>';
    // ── Async: sincronizar TODAS las tabs con el artifact DB ──
    dbLoadAll().then(function(dbData){
      const lbl=document.getElementById('admin-sync-lbl');
      if(!dbData||!dbData.length){if(lbl)lbl.textContent='';return;}
      mergeDBIntoLocal(dbData);
      const freshExps=Object.values(gDB().experts||{}).filter(function(e){return e.email&&e.name;});
      refreshAdminTabs(freshExps);
      if(lbl){lbl.textContent='✓ '+freshExps.length+' expertos sincronizados';setTimeout(function(){if(lbl)lbl.textContent='';},3000);}
    }).catch(function(){const lbl=document.getElementById('admin-sync-lbl');if(lbl)lbl.textContent='';});
  }catch(err){
    mc().innerHTML='<div class="card" style="margin-top:1rem"><h3 style="color:var(--red)">Error al cargar el panel</h3><p>'+err.message+'</p><button class="btn btn-primary btn-sm" onclick="renderAdmin()" style="margin-top:.75rem">Reintentar</button></div>';
  }
}
function safeCall(fn,name){try{return fn();}catch(e){return '<div class="card"><p style="color:var(--red)">Error en '+name+': '+e.message+'</p></div>';}}
function atab(btn,tid){
  tid=tid.replace(/&quot;/g,'');
  document.querySelectorAll('.atab-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  ['tab-dash','tab-exp','tab-ana','tab-acc'].forEach(t=>{
    const div=document.getElementById(t);
    if(div)div.style.display=t===tid?'block':'none';
  });
  if(tid==='tab-acc')loadAccesos();
}
async function loadAccesos(){
  const el=document.getElementById('tab-acc');
  if(!el)return;
  el.innerHTML='<p style="text-align:center;padding:2rem;color:var(--n5)">⏳ Cargando accesos...</p>';
  try{
    // Start with localStorage data (includes current user's progress)
    const localDB=gDB();
    const local=localDB.experts||{};
    if(S.exp&&S.exp.email&&!local[S.exp.email])local[S.exp.email]={email:S.exp.email,name:S.exp.name,start:S.exp.start,last:S.exp.last,prog:{}};
    let merged=Object.values(local).filter(u=>u.email&&u.name);
    const adb=await getADB();
    if(adb){
      try{
        // Load experts + progress from DB
        const [eSnap,pSnap]=await Promise.all([
          adb.collection('experts').get(),
          adb.collection('progress').get()
        ]);
        // Build progress map by email
        const progByEmail={};
        if(pSnap&&pSnap.docs){
          pSnap.docs.forEach(d=>{
            const p=d.data();
            if(!p||!p.email)return;
            if(!progByEmail[p.email])progByEmail[p.email]={};
            if(p.sid)progByEmail[p.email][p.sid]={rd:p.rd,ad:p.ad,best:p.best,pass:p.pass,atts:[]};
          });
        }
        if(eSnap&&eSnap.docs&&eSnap.docs.length){
          const dbMap={};
          merged.forEach(u=>dbMap[u.email]=u);
          eSnap.docs.forEach(d=>{
            const u=d.data();
            if(!u.email||!u.name)return;
            const prog=progByEmail[u.email]||{};
            if(!dbMap[u.email]||new Date(u.last)>new Date(dbMap[u.email].last||0)){
              dbMap[u.email]={...u,prog:{...prog,...(dbMap[u.email]&&dbMap[u.email].prog||{})}};
            } else {
              // Merge progress from DB into localStorage entry
              dbMap[u.email].prog={...prog,...(dbMap[u.email].prog||{})};
            }
          });
          merged=Object.values(dbMap).filter(u=>u.email&&u.name);
        }
      }catch(e){}
    }
    merged.sort((a,b)=>new Date(b.last||0)-new Date(a.last||0));
    el.innerHTML=adminAccesosTab(merged);
  }catch(e){
    el.innerHTML='<p style="color:red;padding:1rem">Error: '+e.message+'</p>';
  }
}



window._callExpDetail=function(el){expDetail(el.getAttribute('data-email'));}
function expDetail(email){
  if(!email){console.error('expDetail: no email');return;}
  const db=gDB();const e=db.experts&&db.experts[email];
  if(!e){
    mc().innerHTML='<div class="card" style="margin-top:1rem;text-align:center"><p>No se encontraron datos para '+email+'</p><button class="btn btn-ghost btn-sm" onclick="renderAdmin()" style="margin-top:.5rem">← Volver</button></div>';
    return;
  }
  try{
  mc().innerHTML=`<div class="fin">
  <div class="bc"><span class="bc-link" onclick="renderAdmin()">Panel admin</span><span class="bc-sep">›</span><span>Detalle: ${e.name}</span></div>
  <div class="card" style="display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem">
    <div class="ava" style="width:48px;height:48px;font-size:1.125rem">${initials(e.name)}</div>
    <div style="flex:1"><h2 style="margin-bottom:.125rem">${e.name}</h2><p style="margin:0;font-size:.875rem">${e.email}</p><p style="margin:.25rem 0 0;font-size:.75rem;color:var(--n5)">Inicio: ${fmtDate(e.start)} · Última actividad: ${fmtDate(e.last)}</p></div>
  </div>
  ${MODS.map(m=>`<h3 style="margin-bottom:.75rem">${m.emoji} ${m.name}</h3><div style="display:flex;flex-direction:column;gap:.625rem;margin-bottom:1.25rem">
    ${SUBS.filter(s=>m.sids.includes(s.id)).map(s=>{
      const p=e.prog?.[s.id]||{};const atts=p.atts||[];
      return`<div class="card">
        <div class="flex ai-c jc-b" style="margin-bottom:${atts.length?'.75rem':'0'}">
          <div><h4>${s.name}</h4><div class="flex gap-2" style="margin-top:.375rem">
            <span class="badge ${p.rd?'bg':'bn'}" style="font-size:.7rem">📖 Lectura</span>
            <span class="badge ${p.ad?'bg':'bn'}" style="font-size:.7rem">🎬 Animación</span>
            <span class="badge ${p.pass?'bg':atts.length?'ba':'bn'}" style="font-size:.7rem">📝 Examen</span>
          </div></div>
          ${p.best!==null?`<div style="text-align:right"><div style="font-size:1.375rem;font-weight:800;color:${p.pass?'var(--g5)':'var(--amber)'}">${p.best}%</div><div style="font-size:.7rem;color:var(--n5)">${p.pass?'Aprobado':'No aprobado'}</div></div>`:'<span class="badge bn">Sin intentos</span>'}
        </div>
        ${atts.length?`<div style="border-top:1px solid var(--n1);padding-top:.625rem">
                    <div style="font-size:.75rem;color:var(--n5);margin-bottom:.5rem">Historial de intentos:</div>
                    ${atts.map((a,i)=>{
                      const qs=QS[s.id]||[];
                      const wrongs=qs.filter(q=>a.ans&&a.ans[q.id]!==undefined&&a.ans[q.id]!==q.ok);
                      return '<div style="margin-bottom:.5rem;padding:.625rem;background:'+(a.pass?'var(--g0)':'#FFF5F5')+';border-radius:var(--r);border:1px solid '+(a.pass?'var(--g1)':'#FCA5A5')+'">'
                        +'<div class="flex jc-b ai-c" style="margin-bottom:'+(wrongs.length?'.375rem':'0')+'">'
                        +'<span style="font-size:.8125rem;font-weight:600;color:'+(a.pass?'var(--g9)':'var(--red)')+'">'+( a.pass?'✅':'❌')+' Intento #'+(i+1)+' — '+a.score+'%</span>'
                        +'<span style="font-size:.75rem;color:var(--n5)">'+fmtDate(a.date)+'</span></div>'
                        +(wrongs.length?'<div style="font-size:.75rem;color:var(--n5);margin-bottom:.25rem">Preguntas incorrectas:</div>'
                          +wrongs.map(q=>'<div style="font-size:.75rem;color:var(--red);padding:.2rem 0;border-bottom:1px solid #FEE2E2">• '+(q.text.length>75?q.text.slice(0,75)+'…':q.text)+'</div>').join('')
                        :'')
                        +'</div>';
                    }).join('')}
                  </div>`:''}
      </div>`;
    }).join('')}
  </div>`).join('')}
  </div>`;
  }catch(err){
    mc().innerHTML='<div class="card" style="margin-top:1rem"><h3 style="color:var(--red)">Error</h3><p>'+err.message+'</p><button class="btn btn-ghost btn-sm" onclick="renderAdmin()" style="margin-top:.5rem">← Volver</button></div>';
  }
}
