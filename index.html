 descargarlas, imprimirlas y agendar su cita en Chopo.</p>\n</div>","subc_v": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Guía de consultas Koltin · Expertxs, nov 2026.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás distinguir los dos tipos de videoconsulta Koltin, gestionar el agendamiento desde Sales/Calendly y acompañar a la GP en su seguimiento médico.</p>\n\n<h3>💻 ¿Qué son y qué NO son?</h3>\n<p>Las videoconsultas de Koltin están diseñadas para <strong>seguimiento médico y orientación preventiva</strong>. No son atención inmediata ni sustituyen urgencias. <strong>Siempre se realizan con cita programada.</strong></p>\n\n<h3>📋 Tipo 1 — Seguimiento y prevención (post-EDL)</h3>\n<p>Requieren haber completado el Estudio de Longevidad previamente.</p>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.5rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;text-align:left;border-bottom:2px solid var(--g3)\">Especialidad</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Para quién</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Qué cubre</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\"><strong>Medicina general</strong></td><td style=\"padding:.4rem .75rem\">50 a 74 años</td><td style=\"padding:.4rem .75rem\">Seguimiento de salud, resultados, dudas y orientación</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\"><strong>Geriatría</strong></td><td style=\"padding:.4rem .75rem\">75 años en adelante</td><td style=\"padding:.4rem .75rem\">Envejecimiento, medicamentos, autonomía y calidad de vida</td></tr>\n<tr><td style=\"padding:.4rem .75rem\"><strong>Nutrición</strong></td><td style=\"padding:.4rem .75rem\">Cualquier edad</td><td style=\"padding:.4rem .75rem\">Alimentación y hábitos — requiere referencia interna para priorización</td></tr>\n</table>\n<div class=\"callout blue\"><p>💡 No tienen tope anual — se otorgan las necesarias según indicación médica.</p></div>\n\n<h3>🔎 Tipo 2 — Molestias específicas</h3>\n<p>No están disponibles de manera automática. Primero se valida la sintomatología con el equipo médico para determinar si aplica videoconsulta o si la GP requiere orientación presencial. <strong>No sustituyen urgencias.</strong></p>\n\n<h3>✅ Flujo del Expertx — consulta de seguimiento</h3>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li>Revisar en <strong>Sales</strong> (expediente médico) si ya tiene seguimiento indicado en su receta.</li>\n<li>Si hay indicación → agendar directamente en <strong>Calendly</strong> en la agenda correspondiente.</li>\n<li>Si no hay indicación → validar con el equipo médico la pertinencia de una nueva consulta.</li>\n<li>Una vez confirmado → programar la cita.</li>\n</ol>\n\n<h3>🔄 Reagendamiento y recordatorios</h3>\n<ul>\n<li><strong>Si la GP quiere reagendar:</strong> ejecutar el cambio desde Sales (expediente médico) o directamente en Calendly.</li>\n<li><strong>Una semana antes:</strong> el sistema envía automáticamente recordatorios a la GP 7 días y 1 día antes de la consulta. Si la GP tiene estudios disponibles, <strong>Expertxs los sube al expediente</strong> (apartado de resultados) para que el médico los tenga listos.</li>\n</ul>\n\n<h3>💬 Si la GP pregunta algo médico en chat</h3>\n<p>Indicar que en el transcurso del día el doctor le contestará → reasignar al médico encargado. Si el médico no está en turno → reasignar con el coordinador.</p>\n<div class=\"callout blue\"><p>👨‍⚕️ Coordinador de consultas virtuales: <strong>Pablo Maycotte</strong></p></div>\n\n<div class=\"callout amber\"><p>⚠️ Los estudios de seguimiento los cubre directamente la GP — <strong>no están incluidos en la membresía.</strong></p></div>\n</div>","subc_e": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Guía de consultas Koltin · Expertxs, nov 2026.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar conocerás los beneficios de consultas incluidos en la membresía, el directorio médico de Santa Fe y Monterrey, y las reglas clave de agendamiento.</p>\n\n<h3>📊 Beneficios incluidos en membresía</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.5rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;text-align:left;border-bottom:2px solid var(--g3)\">Beneficio</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Cantidad</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Costo adicional</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Consultas de especialidad<br><span style=\"font-size:.8rem;color:var(--n5)\">ortopedia, cardiología, urología, reumatología, rehabilitación</span></td><td style=\"padding:.4rem .75rem\"><strong>4 al año</strong>, compartidas entre especialidades</td><td style=\"padding:.4rem .75rem\">A partir de la 5.ª: $1,200 MXN</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Fisioterapia</td><td style=\"padding:.4rem .75rem\"><strong>10 sesiones al año</strong></td><td style=\"padding:.4rem .75rem\">A partir de la sesión 11: $1,000 MXN</td></tr>\n<tr><td style=\"padding:.4rem .75rem\">Segunda opinión médica</td><td style=\"padding:.4rem .75rem\">Independiente de las 4 consultas</td><td style=\"padding:.4rem .75rem\"><strong>Sin costo adicional</strong></td></tr>\n</table>\n<div class=\"callout blue\"><p>📌 Anuales por ciclo de membresía — no acumulables, no transferibles, solo para el titular.<br>Cancelaciones con ≥24h de anticipación <strong>no</strong> se cuentan. Inasistencias <strong>sí</strong> se cuentan (excepto urgencias).</p></div>\n\n<h3>⏱️ Tipos de consulta y duración</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.5rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Tipo</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Duración</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Cómo se agenda</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Primera vez</td><td style=\"padding:.4rem .75rem\"><strong>1 hora</strong></td><td style=\"padding:.4rem .75rem\">Link de <strong>pool</strong> — nunca con calendario individual</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:#FEF9C3\"><td style=\"padding:.4rem .75rem\">Primera vez <strong>(urología)</strong></td><td style=\"padding:.4rem .75rem\"><strong>30 min</strong> — única excepción</td><td style=\"padding:.4rem .75rem\">Link de <strong>pool</strong> — nunca con calendario individual</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Seguimiento</td><td style=\"padding:.4rem .75rem\">30 min</td><td style=\"padding:.4rem .75rem\">Siempre con el <strong>mismo médico</strong> de la primera consulta</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Segunda opinión</td><td style=\"padding:.4rem .75rem\">1 hora</td><td style=\"padding:.4rem .75rem\">Igual que primera vez; independiente de las 4 consultas</td></tr>\n<tr style=\"background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Osteoporosis/Reumatología</td><td style=\"padding:.4rem .75rem\">30 min</td><td style=\"padding:.4rem .75rem\">Calendario específico (ver directorio)</td></tr>\n</table>\n\n<h3>🏥 Directorio médico — Santa Fe</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.8125rem;margin:.5rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Especialidad</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Médico</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Horario</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Cardiología</td><td style=\"padding:.4rem .75rem\">Dr. Carlos Cabrera</td><td style=\"padding:.4rem .75rem\">Martes, jueves y viernes 14:00–18:00</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Ortopedia</td><td style=\"padding:.4rem .75rem\">Dr. Erik Piñón</td><td style=\"padding:.4rem .75rem\">Lunes 9:00–13:00, jueves 14:00–18:00</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Ortopedia</td><td style=\"padding:.4rem .75rem\">Dr. Rodrigo Balcázar</td><td style=\"padding:.4rem .75rem\">Lunes y jueves 9:00–13:00 (miércoles: día quirúrgico, sin consulta)</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Reumatología</td><td style=\"padding:.4rem .75rem\">Dra. Viridiana del Río</td><td style=\"padding:.4rem .75rem\">Miércoles: 1er 9–18 · 2do 13–18 · 3ro y 4to 15–18</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Urología</td><td style=\"padding:.4rem .75rem\">Dr. Jesús Castrejón</td><td style=\"padding:.4rem .75rem\">Lunes y miércoles 14:00–18:00</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Rehabilitación</td><td style=\"padding:.4rem .75rem\">Dra. Paulina Chacón</td><td style=\"padding:.4rem .75rem\">9:00–13:00 · Pool primera vez</td></tr>\n<tr><td style=\"padding:.4rem .75rem\">Rehabilitación</td><td style=\"padding:.4rem .75rem\">Dra. Fernanda López</td><td style=\"padding:.4rem .75rem\">14:00–18:00 · Pool primera vez</td></tr>\n</table>\n<p style=\"font-size:.8125rem;color:var(--n5)\"><strong>Fisioterapeutas Santa Fe — matutino:</strong> Beatriz Cabrera, Iván Peña, Ariadna Verónica Fernández, Adriana León, Mariana Padilla. <strong>Vespertino:</strong> Iván Fernández, Ariadna Verónica, Mariana Padilla, Jonathan Dominguez.</p>\n\n<h3>🏥 Directorio médico — Monterrey</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.8125rem;margin:.5rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Especialidad</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Médico</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Horario</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Cardiología</td><td style=\"padding:.4rem .75rem\">Dr. Arnold Hernández</td><td style=\"padding:.4rem .75rem\">Lunes y miércoles 9:00–13:00</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Ortopedia</td><td style=\"padding:.4rem .75rem\">Dr. Elías Godoy</td><td style=\"padding:.4rem .75rem\">Martes y viernes 9:00–13:00</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Reumatología</td><td style=\"padding:.4rem .75rem\">Dr. José Antonio Dávila</td><td style=\"padding:.4rem .75rem\">Jueves 14:00–18:00</td></tr>\n<tr><td style=\"padding:.4rem .75rem\">Urología</td><td style=\"padding:.4rem .75rem\">Dr. Javier Alonso López</td><td style=\"padding:.4rem .75rem\">Lunes y jueves 14:00–18:00</td></tr>\n</table>\n<p style=\"font-size:.8125rem;color:var(--n5)\"><strong>Fisioterapeutas Monterrey:</strong> Raziel Lugo (matutino), Paola Saucedo (vespertino).</p>\n<div class=\"callout amber\"><p>⚠️ <strong>En Monterrey no hay rehabilitación.</strong> La GP pasa primero por Ortopedia con el Dr. Elías Godoy, quien determina el número de sesiones y la frecuencia.</p></div>\n</div>","subc_r": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Guía de consultas Koltin · Expertxs, nov 2026.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás aplicar el proceso correcto de rehabilitación y fisioterapia, y usar los cuestionarios de cada especialidad antes de agendar.</p>\n\n<h3>🏋️ Rehabilitación y fisioterapia — Regla fundamental</h3>\n<div class=\"callout amber\"><p>⚠️ <strong>Nadie agenda fisioterapia directamente.</strong> Siempre debe pasar antes por una valoración de rehabilitación — aunque ya haya pasado por ortopedia.</p></div>\n\n<h3>📍 Santa Fe</h3>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li>Agendar valoración con <strong>Dra. Paulina Chacón</strong> o <strong>Dra. Fernanda López</strong> usando el link de pool de primera vez.</li>\n<li>❌ No agendar en los links directos de Paulina / Fernanda — esos son de seguimiento.</li>\n<li>Rehabilitación define cuántas sesiones y con qué frecuencia. La membresía incluye 10, pero no significa que se usen todas.</li>\n</ol>\n\n<h3>📍 Monterrey</h3>\n<ul>\n<li>No hay rehabilitación en Monterrey.</li>\n<li>La GP pasa primero por Ortopedia con el <strong>Dr. Elías Godoy</strong>, quien determina sesiones y frecuencia.</li>\n<li>Fisioterapeutas: <strong>Raziel Lugo</strong> (matutino) · <strong>Paola Saucedo</strong> (vespertino).</li>\n</ul>\n\n<h3>⏱️ Logística de sesiones</h3>\n<ul>\n<li>Duración: <strong>50 minutos</strong> por sesión (llegar 10 minutos antes para toma de signos vitales).</li>\n<li>La GP debe llevar ropa cómoda deportiva y su propia toalla.</li>\n<li>A partir de la sesión 11: <strong>$1,000 MXN</strong> por sesión.</li>\n</ul>\n\n<h3>❤️ Cuestionario — Cardiología</h3>\n<p>Expertxs pregunta antes de agendar:</p>\n<ul>\n<li>¿Ha sido valorado por Cardiología previamente?</li>\n<li>¿Qué medicamentos toma (corazón, presión, colesterol)?</li>\n<li>¿Cuenta con ECG en los últimos 12 meses? Si no tiene EDL, que envíe el más reciente.</li>\n<li>Última cifra de presión arterial y frecuencia cardiaca.</li>\n<li>¿Entrena de forma intensa o hace deporte de resistencia?</li>\n<li>¿Fuma o fumaba? ¿Cuántos cigarrillos/día o hace cuánto dejó?</li>\n<li>¿Diagnóstico previo de angina, arritmia, insuficiencia cardiaca, infarto, EVC, HTA, stent?</li>\n<li>Síntomas en las últimas 4 semanas: dolor de cabeza, mareo, opresión en pecho, desmayo, falta de aire, palpitaciones, confusión, adormecimiento.</li>\n<li>¿Los síntomas aparecieron al caminar, subir escaleras o hacer esfuerzo?</li>\n</ul>\n<div class=\"callout blue\"><p>🔬 <strong>Estudios cardiología:</strong> ECG + laboratorios completos con perfil de lípidos + RX tórax para todos. Si ECG del EDL tiene más de 6 meses → se repite. Bradicardia: Holter 24h. Insuficiencia cardíaca: ecocardiograma + RX tórax.</p></div>\n\n<h3>🦴 Cuestionario — Reumatología</h3>\n<ul>\n<li>Sitio de la molestia (mano, dedos, muñeca, etc.).</li>\n<li>¿Enrojecimiento o aumento de volumen en articulaciones?</li>\n<li>¿Ambos lados o solo uno? ¿Cuándo iniciaron los síntomas?</li>\n<li>Intensidad del dolor (0–10) y tipo (ardor, presión, punzada, adormecimiento).</li>\n<li>¿El dolor viaja a otro sitio? ¿En músculos, huesos o ligamentos?</li>\n<li>Otros síntomas: fiebre, debilidad, pérdida de peso, cambios en piel, úlceras orales, hinchazón, cambios en orina.</li>\n<li>¿Dolor en espalda baja? ¿Con el movimiento o en reposo?</li>\n</ul>\n\n<h3>🔵 Cuestionario — Urología</h3>\n<p>Solo si hay hiperplasia prostática benigna o incontinencia urinaria:</p>\n<ul>\n<li><strong>IPSS</strong> → hiperplasia prostática, hombres 50+. Llenar en PDF y anexar al expediente.</li>\n<li><strong>ICIQ-SF</strong> → incontinencia urinaria, hombres y mujeres.</li>\n</ul>\n<p><strong>Estudios requeridos:</strong> Hombres: ultrasonido de vías urinarias y próstata + medición de orina residual + antígeno prostático libre + EGO. Mujeres: ultrasonido de vías urinarias.</p>\n\n<h3>🦵 Cuestionario — Ortopedia</h3>\n<p>El cuestionario de dolor es el punto de entrada. Membership (@reportes-interior) valida si corresponde a ortopedia, rehabilitación o reumatología.</p>\n<ul>\n<li>¿Cuándo comenzó el dolor? ¿De qué lado?</li>\n<li>¿Ha sido repentino o va aumentando? ¿Inició después de una caída o esfuerzo?</li>\n<li>¿Dónde exactamente? ¿Aumenta con el movimiento o en reposo?</li>\n<li>Tipo de dolor (ardor, presión, punzada, adormecimiento). ¿Empeora por las noches? ¿Se irradia?</li>\n<li>Intensidad del 1 al 10. ¿Hormigueo, pérdida de fuerza o sensibilidad en piernas?</li>\n<li>¿Infecciones recientes o fiebre persistente? ¿Qué medicamentos está tomando?</li>\n</ul>\n<div class=\"callout blue\"><p>📝 Una vez determinada la especialidad: dejar nota de referencia en el expediente con el tipo de consulta y motivo.</p></div>\n</div>","subc_s": "<div class=\"callout green\"><p>🟢 <strong>Contenido oficial</strong> — Guía de consultas Koltin · Expertxs, nov 2026.</p></div>\n<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás gestionar el proceso de segunda opinión médica, manejar la documentación y respetar los plazos de agendamiento.</p>\n\n<h3>🩺 Segunda opinión — ¿Cuándo aplica?</h3>\n<p>Es un paso <strong>obligatorio</strong> antes de que Ops Control continúe con la revisión de un siniestro. Sin ella, la programación no puede continuar.</p>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.5rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Sede</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Especialidades requeridas</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Aseguradora</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">CDMX (Santa Fe)</td><td style=\"padding:.4rem .75rem\">Cardiología, urología y MSK</td><td style=\"padding:.4rem .75rem\">BBVA y GNP</td></tr>\n<tr style=\"background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Nuevo León (Monterrey)</td><td style=\"padding:.4rem .75rem\">Urología y MSK</td><td style=\"padding:.4rem .75rem\">BBVA y GNP</td></tr>\n</table>\n<div class=\"callout blue\"><p>💡 Es independiente de las 4 consultas de especialidad incluidas en la membresía.</p></div>\n\n<h3>📋 Proceso paso a paso</h3>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li><strong>Disparador:</strong> Care Coordination u Ops Control reciben la imagenología y el informe del médico tratante.</li>\n<li><strong>Agendamiento:</strong> Care Coordination contacta al asegurado y agenda la segunda opinión en <strong>máximo 2 días hábiles</strong> desde que se reciben el informe médico y los estudios.</li>\n<li><strong>Consulta:</strong> el asegurado acude con el médico de segunda opinión.</li>\n<li><strong>Seguimiento post-cita:</strong> Care Coordination llama para saber el resultado y si menciona cambio de médico.</li>\n<li><strong>Informe médico:</strong> el médico comparte su informe con Erik (CDMX) o Paulina (Nuevo León) → se coloca en el hilo del aviso de siniestro.</li>\n<li><strong>Continúa la programación:</strong> Ops Control retoma su revisión con el informe de segunda opinión.</li>\n</ol>\n<div class=\"callout amber\"><p>⚠️ Siempre especificar en la nota de referencia que se trata de una <strong>segunda opinión</strong> (no primera vez), para que el médico sepa que debe revisar los estudios de la valoración previa.</p></div>\n\n<h3>📄 Documentos que maneja Expertxs</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.5rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Documento</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Para qué</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Debe incluir</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Receta</td><td style=\"padding:.4rem .75rem\">Medicamentos</td><td style=\"padding:.4rem .75rem\">Medicamento y dosis</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Orden médica</td><td style=\"padding:.4rem .75rem\">Estudios</td><td style=\"padding:.4rem .75rem\">Estudio solicitado</td></tr>\n<tr><td style=\"padding:.4rem .75rem\">Nota de referencia</td><td style=\"padding:.4rem .75rem\">Contexto / derivación</td><td style=\"padding:.4rem .75rem\">Tipo de consulta + motivo breve</td></tr>\n</table>\n<p><strong>Manejo de estudios:</strong> Convertir a PDF y subir a la plataforma. Radiografías: editar datos, tomar captura y guardar como PDF. Resonancias: copiar el reporte.</p>\n\n<h3>⏰ Plazos de agendamiento</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.5rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Situación</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Plazo</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">EDL</td><td style=\"padding:.4rem .75rem\">Mínimo 5 días de anticipación — pool de médicos</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Cita abierta</td><td style=\"padding:.4rem .75rem\">Se agenda en el momento en que se contacta al paciente</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Indicación médica con plazo</td><td style=\"padding:.4rem .75rem\">Respetar el plazo exacto indicado por el médico</td></tr>\n<tr style=\"background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Segunda opinión por siniestro</td><td style=\"padding:.4rem .75rem\">Máximo 2 días hábiles desde que se reciben informe y estudios</td></tr>\n</table>\n\n<h3>🚫 Reglas clave para no cometer errores</h3>\n<ul>\n<li>Primera vez siempre con <strong>link de pool</strong> — nunca con el calendario individual del médico.</li>\n<li>Seguimiento siempre con el <strong>mismo médico</strong> de la primera consulta.</li>\n<li>Fisioterapia siempre requiere <strong>valoración de rehabilitación previa</strong>, aunque ya haya pasado por ortopedia.</li>\n<li>En Monterrey no hay rehabilitación — pasa por <strong>Ortopedia primero</strong> (Dr. Elías Godoy).</li>\n<li>Segunda opinión: especificar en la nota de referencia que <strong>no es primera vez</strong>.</li>\n<li>Sin etiqueta de salud correcta en el expediente, la GP no recibe la <strong>notificación automática del EDL</strong>.</li>\n<li><strong>Roma Norte ya no opera EDL</strong> desde agosto 2026 — redirigir a Santa Fe.</li>\n</ul>\n</div>","subc5a": "<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás qué son las videoconsultas de Koltin, cuándo aplica cada tipo y cómo gestionar el agendamiento y seguimiento desde tu rol como Expertx.</p>\n\n<img src=\"/_blob/220b34da0d2376d9c68b1155aa9c6a3d\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Qué tipo de videoconsulta necesita tu GP?</p>\n\n<h3>💻 ¿Qué son y qué NO son?</h3>\n<p>Las videoconsultas de Koltin están diseñadas para <strong>seguimiento médico y orientación preventiva</strong>. No son atención inmediata ni sustituyen urgencias. Siempre se realizan con cita programada.</p>\n\n<h3>📋 Tipo 1 — Seguimiento y prevención (post-EDL)</h3>\n<p>Requieren haber completado el Estudio de Longevidad previamente.</p>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.75rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;text-align:left;border-bottom:2px solid var(--g3)\">Especialidad</th><th style=\"padding:.4rem .75rem;text-align:left;border-bottom:2px solid var(--g3)\">Para quién</th><th style=\"padding:.4rem .75rem;text-align:left;border-bottom:2px solid var(--g3)\">Qué cubre</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\"><strong>Medicina general</strong></td><td style=\"padding:.4rem .75rem\">50 a 74 años</td><td style=\"padding:.4rem .75rem\">Seguimiento de salud, resultados de estudios, dudas y orientación</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\"><strong>Geriatría</strong></td><td style=\"padding:.4rem .75rem\">75 años en adelante</td><td style=\"padding:.4rem .75rem\">Necesidades del envejecimiento, revisión de medicamentos, autonomía y calidad de vida</td></tr>\n<tr><td style=\"padding:.4rem .75rem\"><strong>Nutrición</strong></td><td style=\"padding:.4rem .75rem\">Cualquier edad</td><td style=\"padding:.4rem .75rem\">Alimentación y hábitos saludables — requiere referencia interna para priorización</td></tr>\n</table>\n<div class=\"callout blue\"><p>💡 No tienen tope anual — se otorgan las necesarias según indicación médica.</p></div>\n\n<h3>📋 Tipo 2 — Molestias específicas</h3>\n<p>No están disponibles de forma automática para todos. Primero se debe conocer y validar la sintomatología para que el equipo médico determine si aplica esta modalidad o si la GP requiere orientación presencial. <strong>No sustituyen urgencias.</strong></p>\n\n<img src=\"/_blob/1f45f669505137fd4c86b030a318b30c\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">¿Cómo agenda Expertxs una videoconsulta?</p>\n\n<h3>👤 ¿Qué hace Expertxs?</h3>\n<p><strong>Si la GP solicita una videoconsulta de seguimiento:</strong></p>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li>Revisar en Sales (expediente médico) si ya tiene seguimiento indicado en su receta.</li>\n<li>Si hay indicación → agendar directamente en Calendly en la agenda correspondiente.</li>\n<li>Si no hay indicación → validar con el equipo médico la pertinencia de una nueva consulta.</li>\n<li>Una vez confirmado → programar la cita.</li>\n</ol>\n<p><strong>Si la GP quiere reagendar:</strong> Ejecutar el cambio desde Sales (expediente médico) o directamente en Calendly.</p>\n\n<h3>📅 Una semana antes de la consulta</h3>\n<p>Enviar recordatorio preguntando si la GP tendrá sus estudios de seguimiento listos o si desea reagendar. Si ya tiene resultados, <strong>subirlos al expediente (apartado de resultados)</strong> para que el médico los tenga disponibles.</p>\n\n<h3>💬 Si la GP pregunta algo médico en chat</h3>\n<p>Indicar que en el transcurso del día el doctor le contestará y <strong>reasignar al médico encargado</strong>. Si el médico no está en turno, reasignar con el coordinador. En consultas virtuales el coordinador es <strong>Pablo Maycotte</strong>.</p>\n\n<div class=\"callout amber\"><p>⚠️ Los estudios de seguimiento los cubre directamente la GP — no están incluidos en la membresía.</p></div>\n\n<h3>📍 EDL — Modalidad según zona</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.75rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Zona</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Modalidad</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Sede</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Monterrey</td><td style=\"padding:.4rem .75rem\">Presencial siempre</td><td style=\"padding:.4rem .75rem\">Clínica de Longevidad Koltin Monterrey</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">CDMX / Edo. Méx.</td><td style=\"padding:.4rem .75rem\">GP elige presencial o virtual</td><td style=\"padding:.4rem .75rem\">Clínica de Longevidad Santa Fe</td></tr>\n<tr><td style=\"padding:.4rem .75rem\">Foráneos</td><td style=\"padding:.4rem .75rem\">Virtual siempre</td><td style=\"padding:.4rem .75rem\">—</td></tr>\n</table>\n<div class=\"callout amber\"><p>⚠️ Desde agosto 2026 el EDL se realiza únicamente en Santa Fe. <strong>Roma Norte ya NO opera EDL.</strong></p></div>\n</div>","subc5b": "<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar dominarás el catálogo de consultas de especialidad incluidas, los cuestionarios por especialidad, el directorio médico por sede y las reglas de agendamiento.</p>\n\n<h3>📦 Beneficios incluidos en membresía</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.75rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Beneficio</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Cantidad</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Costo adicional</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Consultas de especialidad (ortopedia, cardiología, urología, reumatología, rehabilitación)</td><td style=\"padding:.4rem .75rem\"><strong>4 al año</strong>, compartidas entre todas las especialidades</td><td style=\"padding:.4rem .75rem\">A partir de la 5.ª: <strong>$1,200 MXN</strong></td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Fisioterapia</td><td style=\"padding:.4rem .75rem\"><strong>10 sesiones al año</strong></td><td style=\"padding:.4rem .75rem\">A partir de la sesión 11: <strong>$1,000 MXN</strong></td></tr>\n<tr><td style=\"padding:.4rem .75rem\">Segunda opinión médica</td><td style=\"padding:.4rem .75rem\">Independiente de las 4 consultas</td><td style=\"padding:.4rem .75rem\"><strong>Sin costo adicional</strong></td></tr>\n</table>\n<div class=\"callout blue\"><p>📌 Las consultas son anuales por ciclo de membresía, no acumulables ni transferibles, solo para el titular. Cancelaciones con al menos 24h de anticipación no se contabilizan. Las inasistencias sí se cuentan (excepto urgencias).</p></div>\n\n<img src=\"/_blob/63c050bb681dcdcea0cba3a256acd8ba\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Reglas de oro del agendamiento</p>\n\n<h3>⏱️ Tipos de consulta y duración</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.75rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Tipo</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Duración</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Cómo se agenda</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Primera vez</td><td style=\"padding:.4rem .75rem\">1 hora (urología: 30 min)</td><td style=\"padding:.4rem .75rem\"><strong>Link de pool</strong> — nunca con el calendario individual</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Seguimiento</td><td style=\"padding:.4rem .75rem\">30 min</td><td style=\"padding:.4rem .75rem\">Siempre con el <strong>mismo médico</strong> de la primera consulta</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Segunda opinión</td><td style=\"padding:.4rem .75rem\">1 hora</td><td style=\"padding:.4rem .75rem\">Igual que primera vez; independiente de las 4 incluidas</td></tr>\n<tr><td style=\"padding:.4rem .75rem\">Osteoporosis/reumatología</td><td style=\"padding:.4rem .75rem\">30 min</td><td style=\"padding:.4rem .75rem\">Calendario específico (ver directorio)</td></tr>\n</table>\n\n<h3>🗂️ Directorio médico — Santa Fe</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.8125rem;margin:.75rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .6rem;border-bottom:2px solid var(--g3)\">Especialidad</th><th style=\"padding:.4rem .6rem;border-bottom:2px solid var(--g3)\">Médico</th><th style=\"padding:.4rem .6rem;border-bottom:2px solid var(--g3)\">Horario</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.35rem .6rem\">Cardiología</td><td style=\"padding:.35rem .6rem\">Dr. Carlos Cabrera</td><td style=\"padding:.35rem .6rem\">Mar, jue y vie 14:00–18:00</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.35rem .6rem\">Ortopedia</td><td style=\"padding:.35rem .6rem\">Dr. Erik Piñón</td><td style=\"padding:.35rem .6rem\">Lun 9:00–13:00, jue 14:00–18:00</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.35rem .6rem\">Ortopedia</td><td style=\"padding:.35rem .6rem\">Dr. Rodrigo Balcázar</td><td style=\"padding:.35rem .6rem\">Lun y jue 9:00–13:00 (mié sin consulta)</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.35rem .6rem\">Reumatología</td><td style=\"padding:.35rem .6rem\">Dra. Viridiana del Río</td><td style=\"padding:.35rem .6rem\">Mié variable (1er: 9–18h · 2do: 13–18h · 3ro/4to: 15–18h)</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.35rem .6rem\">Urología</td><td style=\"padding:.35rem .6rem\">Dr. Jesús Castrejón</td><td style=\"padding:.35rem .6rem\">Lun y mié 14:00–18:00</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.35rem .6rem\">Rehabilitación</td><td style=\"padding:.35rem .6rem\">Dra. Paulina Chacón</td><td style=\"padding:.35rem .6rem\">9:00–13:00</td></tr>\n<tr><td style=\"padding:.35rem .6rem\">Rehabilitación</td><td style=\"padding:.35rem .6rem\">Dra. Fernanda López</td><td style=\"padding:.35rem .6rem\">14:00–18:00</td></tr>\n</table>\n\n<h3>🗂️ Directorio médico — Monterrey</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.8125rem;margin:.75rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .6rem;border-bottom:2px solid var(--g3)\">Especialidad</th><th style=\"padding:.4rem .6rem;border-bottom:2px solid var(--g3)\">Médico</th><th style=\"padding:.4rem .6rem;border-bottom:2px solid var(--g3)\">Horario</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.35rem .6rem\">Cardiología</td><td style=\"padding:.35rem .6rem\">Dr. Arnold Hernández</td><td style=\"padding:.35rem .6rem\">Lun y mié 9:00–13:00</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.35rem .6rem\">Ortopedia</td><td style=\"padding:.35rem .6rem\">Dr. Elías Godoy</td><td style=\"padding:.35rem .6rem\">Mar y vie 9:00–13:00</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.35rem .6rem\">Reumatología</td><td style=\"padding:.35rem .6rem\">Dr. José Antonio Dávila</td><td style=\"padding:.35rem .6rem\">Jue 14:00–18:00</td></tr>\n<tr><td style=\"padding:.35rem .6rem\">Urología</td><td style=\"padding:.35rem .6rem\">Dr. Javier Alonso López</td><td style=\"padding:.35rem .6rem\">Lun y jue 14:00–18:00</td></tr>\n</table>\n<div class=\"callout amber\"><p>⚠️ En Monterrey <strong>no hay rehabilitación</strong>. Siempre pasa primero por Ortopedia con el Dr. Elías Godoy, quien determina el número de sesiones y frecuencia.</p></div>\n\n<h3>❓ Cuestionarios por especialidad</h3>\n<h3>❤️ Cardiología</h3>\n<ul>\n<li>¿Ha sido valorado por Cardiología previamente?</li>\n<li>¿Qué medicamentos toma habitualmente (corazón, presión, colesterol)?</li>\n<li>¿Cuenta con electrocardiograma en los últimos 12 meses?</li>\n<li>Última cifra de presión arterial y frecuencia cardiaca.</li>\n<li>¿Entrena de forma intensa o hace deporte de resistencia?</li>\n<li>¿Fuma o fumaba? ¿Cuántos cigarrillos / hace cuánto dejó?</li>\n<li>¿Diagnóstico previo de angina, arritmia, insuficiencia cardiaca, infarto, EVC, hipertensión, stent?</li>\n<li>Síntomas en las últimas 4 semanas: dolor de cabeza, mareo, dolor/opresión en pecho, desmayo, falta de aire, palpitaciones, confusión, adormecimiento.</li>\n</ul>\n\n<h3>🦴 Reumatología</h3>\n<p>No requiere cuestionario previo estandarizado. Expertxs pregunta: sitio de la molestia, enrojecimiento o inflamación articular, ambos lados o uno, inicio de síntomas, intensidad y tipo de dolor, si se irradia, otros síntomas sistémicos (fiebre, pérdida de peso, cambios en piel).</p>\n\n<h3>🔬 Urología</h3>\n<p>Solo se envía cuestionario si hay hiperplasia prostática benigna o incontinencia urinaria.</p>\n<ul>\n<li><strong>IPSS</strong> → hiperplasia prostática, hombres 50+</li>\n<li><strong>ICIQ-SF</strong> → incontinencia urinaria, hombres y mujeres</li>\n</ul>\n<p>Estudios requeridos — Hombres: ultrasonido vías urinarias y próstata + orina residual + antígeno prostático + EGO. Mujeres: ultrasonido vías urinarias.</p>\n\n<h3>🦵 Ortopedia</h3>\n<p>El cuestionario de dolor es el punto de entrada. Membership (@reportes-interior) valida si corresponde a ortopedia, rehabilitación o reumatología. Expertxs pregunta: cuándo inició, de qué lado, si fue repentino o gradual, si inició tras caída, dónde exactamente, si aumenta con movimiento o en reposo, tipo de dolor, si se irradia, intensidad 1-10, hormigueo o pérdida de fuerza, medicamentos actuales.</p>\n\n<img src=\"/_blob/62aa3db6323b4b380aa9f72ba65fe7e5\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Segunda opinión — paso obligatorio en siniestros</p>\n\n<h3>🔄 Segunda opinión médica</h3>\n<div class=\"callout amber\"><p>⚠️ Es un paso <strong>obligatorio</strong> antes de que Ops Control continúe con la revisión de un siniestro. Sin ella, la programación no puede continuar.</p></div>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.75rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Sede</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Especialidades</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Aseguradora</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">CDMX (Santa Fe)</td><td style=\"padding:.4rem .75rem\">Cardiología, urología y MSK</td><td style=\"padding:.4rem .75rem\">BBVA y GNP</td></tr>\n<tr><td style=\"padding:.4rem .75rem\">Monterrey</td><td style=\"padding:.4rem .75rem\">Urología y MSK</td><td style=\"padding:.4rem .75rem\">BBVA y GNP</td></tr>\n</table>\n<p><strong>Proceso:</strong></p>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li>Care Coordination u Ops Control reciben la imagenología y el informe del médico tratante.</li>\n<li>Care Coordination agenda la segunda opinión en máximo <strong>2 días hábiles</strong>.</li>\n<li>El asegurado acude con el médico de segunda opinión.</li>\n<li>Care Coordination llama al asegurado para conocer el resultado.</li>\n<li>El médico comparte su informe con Erik (CDMX) o Paulina (Monterrey).</li>\n<li>Ops Control retoma su revisión con el informe de segunda opinión.</li>\n</ol>\n</div>","subc5c": "<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar sabrás el flujo obligatorio para rehabilitación y fisioterapia, las diferencias entre Santa Fe y Monterrey y la logística de sesiones.</p>\n\n<img src=\"/_blob/eebc7dbe22d25ee71daccba6e3c715c7\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Rehabilitación y Fisioterapia — flujo obligatorio</p>\n\n<h3>⚠️ Regla fundamental</h3>\n<div class=\"callout amber\"><p>⚠️ <strong>Nadie agenda fisioterapia directamente.</strong> Siempre debe pasar antes por una valoración de rehabilitación — incluso si ya pasó por ortopedia.</p></div>\n\n<h3>🏥 Santa Fe — Flujo</h3>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li>Agendar valoración con <strong>Dra. Paulina Chacón</strong> (matutino) o <strong>Dra. Fernanda López</strong> (vespertino) usando el <strong>link de pool de primera vez</strong>.</li>\n<li>❌ No agendar directo en los links individuales de Paulina / Fernanda — esos son de seguimiento.</li>\n<li>Rehabilitación define cuántas sesiones y con qué frecuencia. La membresía incluye 10, pero no significa que se usen todas.</li>\n<li>Aunque la GP ya haya pasado por ortopedia, <strong>siempre necesita valoración de rehabilitación primero</strong> para fisioterapia.</li>\n</ol>\n<p><strong>Fisioterapeutas Santa Fe:</strong><br>\nMatutino: Beatriz Cabrera, Iván Peña, Ariadna Verónica Fernández, Adriana León, Mariana Padilla.<br>\nVespertino: Iván Fernández, Ariadna Verónica, Mariana Padilla, Jonathan Dominguez.</p>\n\n<h3>🏥 Monterrey — Flujo</h3>\n<div class=\"callout amber\"><p>⚠️ En Monterrey <strong>no hay rehabilitación</strong>.</p></div>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li>La GP pasa primero por <strong>Ortopedia con el Dr. Elías Godoy</strong>, quien determina el número de sesiones y frecuencia.</li>\n<li>Fisioterapeutas: <strong>Raziel Lugo</strong> (matutino) y <strong>Paola Saucedo</strong> (vespertino).</li>\n</ol>\n\n<h3>📋 Logística de sesiones</h3>\n<ul>\n<li>Duración: <strong>50 minutos</strong> por sesión (llegar 10 minutos antes para toma de signos vitales)</li>\n<li>La GP debe llevar <strong>ropa cómoda deportiva y su propia toalla</strong></li>\n<li>Membresía incluye <strong>10 sesiones al año</strong></li>\n<li>A partir de la sesión 11: <strong>$1,000 MXN</strong> por sesión</li>\n</ul>\n</div>","subc5d": "<div class=\"reading\">\n<h3>🎯 Objetivo</h3>\n<p>Al finalizar aplicarás correctamente los plazos de agendamiento, manejarás los documentos de Expertxs y evitarás los errores más comunes.</p>\n\n<h3>📄 Documentos que maneja Expertxs</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.75rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Documento</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Para qué</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Debe incluir</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Receta</td><td style=\"padding:.4rem .75rem\">Medicamentos</td><td style=\"padding:.4rem .75rem\">Medicamento y dosis</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Orden médica</td><td style=\"padding:.4rem .75rem\">Estudios</td><td style=\"padding:.4rem .75rem\">Estudio solicitado</td></tr>\n<tr><td style=\"padding:.4rem .75rem\">Nota de referencia</td><td style=\"padding:.4rem .75rem\">Contexto / derivación</td><td style=\"padding:.4rem .75rem\">Tipo de consulta + motivo breve</td></tr>\n</table>\n\n<h3>📁 Manejo de estudios</h3>\n<ul>\n<li>Convertir a PDF y subir a la plataforma</li>\n<li>Radiografías: editar datos, tomar captura de pantalla y guardar como PDF</li>\n<li>Resonancias: copiar el reporte</li>\n</ul>\n\n<h3>⏰ Plazos de agendamiento</h3>\n<table style=\"width:100%;border-collapse:collapse;font-size:.875rem;margin:.75rem 0\">\n<tr style=\"background:var(--g0)\"><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Situación</th><th style=\"padding:.4rem .75rem;border-bottom:2px solid var(--g3)\">Plazo</th></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">EDL</td><td style=\"padding:.4rem .75rem\">Mínimo <strong>5 días de anticipación</strong> — pool de médicos</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1);background:var(--n0)\"><td style=\"padding:.4rem .75rem\">Cita abierta</td><td style=\"padding:.4rem .75rem\">Se agenda en el momento en que se contacta al paciente</td></tr>\n<tr style=\"border-bottom:1px solid var(--n1)\"><td style=\"padding:.4rem .75rem\">Indicación médica con plazo</td><td style=\"padding:.4rem .75rem\">Respetar el plazo exacto indicado por el médico</td></tr>\n<tr><td style=\"padding:.4rem .75rem\">Segunda opinión por siniestro</td><td style=\"padding:.4rem .75rem\">Máximo <strong>2 días hábiles</strong> desde que se reciben informe y estudios</td></tr>\n</table>\n\n<h3>🚫 Reglas clave — no las rompas</h3>\n<div class=\"callout amber\">\n<ul style=\"margin:0;padding-left:1rem;line-height:1.8\">\n<li>Primera vez: <strong>siempre con link de pool</strong> — nunca con el calendario individual del médico</li>\n<li>Seguimiento: <strong>siempre con el mismo médico</strong> de la primera consulta</li>\n<li>Fisioterapia: <strong>siempre requiere valoración de rehabilitación previa</strong>, aunque ya haya pasado por ortopedia</li>\n<li>Monterrey: <strong>no hay rehabilitación</strong> — pasa por Ortopedia primero (Dr. Elías Godoy)</li>\n<li>Segunda opinión: especificar en la nota de referencia que <strong>no es primera vez</strong></li>\n<li>Sin etiqueta de salud correcta en el expediente, la GP <strong>no recibe la notificación automática del EDL</strong></li>\n<li>Roma Norte <strong>ya no opera EDL</strong> desde agosto 2026 — redirigir a Santa Fe</li>\n</ul>\n</div>\n\n<h3>GP sin EDL con sintomatología</h3>\n<ol style=\"padding-left:1.25rem;line-height:1.9;color:var(--n7)\">\n<li>Expertxs aplica el cuestionario correspondiente según la especialidad.</li>\n<li>Se manda al canal de Membership (<strong>@reportes-interior</strong>) para que los médicos determinen si avanza a consulta con especialista.</li>\n<li>Los médicos indican qué estudios debe realizarse antes de la consulta.</li>\n</ol>\n</div>\n<img src=\"/_blob/0af57486f00e75d3bd1fed13713077a1\" style=\"width:100%;border-radius:12px;margin:.875rem 0;box-shadow:0 4px 16px rgba(0,0,0,.12)\">\n<p style=\"font-size:.8125rem;color:var(--n5);text-align:center;margin-top:-.375rem;margin-bottom:.875rem\">Reglas que no debes romper — Módulo 5</p>\n"}</script>
<script type="application/json" id="qs-json">{"subs_t": [{"id": "qst1","text": "Una GP llama a las 11pm para preguntar si el seguro cubriría una operación de rodilla que quizás necesite. No tiene diagnóstico. ¿Cómo clasificas el caso?","opts": ["Como programación — es una cirugía potencial","Como emergencia — llama a deshoras","Como incidencia — no hay diagnóstico y puede o no avanzar a siniestro","Como reembolso — pagará de su bolsillo si decide operar"],"ok": 2,"exp": "Sin diagnóstico y sin un evento activo, es una incidencia. El 50% de estos casos nunca avanza. La clasificación correcta evita crear un siniestro que no procede."},{"id": "qst2","text": "¿Qué información NO debe ir en el campo de Diagnóstico/Sintomatología del triage?","opts": ["Dolor en rodilla derecha","Fiebre alta y evacuaciones frecuentes","Se cayó el 15 de octubre jugando fútbol con su nieto","Fractura de tibia"],"ok": 2,"exp": "El contexto — cuándo ocurrió, cómo, con quién — va en el campo Contexto. En Diagnóstico/Sintomatología van síntomas concretos: dolor, fiebre, fractura, sangrado. La confusión entre campos es uno de los errores más comunes."},{"id": "qst3","text": "Una GP tiene dolor fuerte de rodilla desde hace 3 semanas. ¿Qué especialidad capturas en el triage?","opts": ["Traumatología general","Músculo esquelético (MSK)","Ortopedia general","Reumatología"],"ok": 1,"exp": "Dolor de rodilla → MSK (músculo esquelético). Esta especialidad puede activar el proceso de segunda opinión médica, por eso es crucial capturarla correctamente desde el triage."},{"id": "qst4","text": "¿Qué pasa automáticamente cuando das clic en Enviar en el triage?","opts": ["El caso queda en borrador — debes ir a Slack para enviarlo manualmente","El sistema envía los correos correspondientes automáticamente y asigna el caso al equipo correcto","Se genera una notificación pero debes ir a Slack para confirmarlo manualmente","Debes llamar al equipo de Care Coordination para notificarles el nuevo caso"],"ok": 1,"exp": "Al dar clic en Enviar, el sistema manda automáticamente los correos y notificaciones correspondientes. Tu rol termina en ese punto. No necesitas ir a Slack ni hacer nada más."},{"id": "qst5","text": "¿Por qué es importante verificar si ya existe un siniestro antes de crear uno nuevo?","opts": ["Para no sobrecargar el sistema con casos innecesarios","Para evitar duplicados que manchan la data y complican el seguimiento del equipo","Para asegurarte de que el cliente no esté usando el seguro en exceso","Porque el sistema no permite más de un siniestro por cliente"],"ok": 1,"exp": "Los duplicados manchan la data y crean cuellos de botella — el equipo no puede saber cuál es el estatus real. Siempre verifica el número de certificado antes de registrar un caso nuevo."},{"id": "qst6","text": "¿Qué tipo de caso va a la pestaña de Siniestros en el nuevo módulo?","opts": ["Solo emergencias","Programaciones y reembolsos","Incidencias y emergencias","Todos los tipos de caso"],"ok": 1,"exp": "Programación y Reembolso van a la pestaña de Siniestros. Las Emergencias tienen su propia pestaña. Las Incidencias van a la pestaña de Incidencias. Care Coordination gestiona el traslado entre pestañas cuando corresponde."},{"id": "qst7","text": "¿Cuándo un accidente se trata como enfermedad para efectos del seguro?","opts": ["Siempre — la aseguradora no distingue entre accidente y enfermedad","Cuando el accidente fue por descuido propio de la GP","Cuando el primer gasto comprobable no puede acreditarse dentro de los primeros 30 días del evento","Cuando el hospital es de nivel superior al contratado"],"ok": 2,"exp": "Si el primer gasto comprobable no puede acreditarse dentro de los primeros 30 días del accidente, el caso se trata como enfermedad — lo que significa que aplican deducible y coaseguro."},{"id": "qst8","text": "¿Cuáles son las especialidades que pueden requerir segunda opinión médica?","opts": ["Cardiología, oncología y neurología","Músculo esquelético (MSK), cardiología y urología","Traumatología, ortopedia y geriatría","Todas las especialidades requieren segunda opinión"],"ok": 1,"exp": "MSK, cardiología y urología son las especialidades que actualmente pueden requerir segunda opinión, principalmente en CDMX, Monterrey y Guadalajara. Por eso capturar la especialidad correcta en el triage es tan importante."},{"id": "qst9","text": "¿Qué hace Care Coordination con una emergencia después de que tú la registras?","opts": ["La cierra automáticamente si no hay hospitalización","Determina la salida: incidencia, siniestro o reembolso según el estatus del caso","La transfiere a la aseguradora directamente","Contacta al hospital para gestionar el pago directo"],"ok": 1,"exp": "Care Coordination determina la salida de cada emergencia según su evolución: puede convertirse en incidencia (si no era emergencia real), siniestro (si se usó el seguro) o reembolso (si la GP pagó de su bolsillo)."},{"id": "qst10","text": "¿Qué actualiza los estados del siniestro en tiempo real en el nuevo sistema?","opts": ["El equipo de Expertxs después de cada llamada","La aseguradora directamente en el portal","El equipo de Ops Control","Care Coordination al dar seguimiento"],"ok": 2,"exp": "El equipo de Ops Control es responsable de actualizar los estados del siniestro en el sistema. Esto permite que cualquier miembro del equipo vea el estatus en tiempo real sin necesitar ir a Slack."}],"subs_e": [{"id": "qse1","text": "Una GP llama diciendo que su esposo tuvo un infarto. ¿Cuál es el tipo de caso?","opts": ["Incidencia — puede no requerir hospitalización","Programación — necesita trámite previo","Emergencia — compromete la vida y requiere atención inmediata","Reembolso — pagará de su bolsillo en urgencias"],"ok": 2,"exp": "Un infarto es una urgencia médica que compromete la vida. Requiere atención inmediata. Se registra como emergencia en el sistema y orientas a la GP al hospital más cercano de su nivel."},{"id": "qse2","text": "¿Qué verifica el Excel Vigor antes de confirmar pago directo?","opts": ["Si la GP tiene pagos pendientes de su membresía","Número de póliza, certificado y número de sistema GNP del asegurado","Los hospitales disponibles más cercanos a su domicilio","Si la GP ya ha tenido siniestros anteriores"],"ok": 1,"exp": "El Excel Vigor contiene el número de póliza, número de certificado y número de sistema GNP. Si la GP aparece en Vigor y el hospital es de su nivel, puede aplicar pago directo. Si no aparece, probablemente va por reembolso."},{"id": "qse3","text": "Una GP tiene nivel Medio. ¿A qué hospitales puede acudir con pago directo?","opts": ["A cualquier hospital de la red GNP","Solo a hospitales de nivel medio o bajo","A hospitales de su nivel y también de nivel alto con autorización previa","A cualquier hospital de su elección"],"ok": 1,"exp": "Nivel Medio solo da acceso a hospitales de nivel medio o bajo. Si acude a un hospital de nivel superior, la cobertura aplica por reembolso con penalización. Nunca envíes a una GP fuera de su nivel."},{"id": "qse4","text": "Durante una llamada de emergencia necesitas buscar información y la GP está esperando. ¿Qué haces?","opts": ["La pones en espera sin decirle nada para no alarmarla más","Le dices \"Permítame un momento, voy a…\" y retomas en menos de 60 segundos","La transfieres a otro Expertx para no interrumpir la llamada","La instruyes a llamar directamente al hospital mientras buscas la información"],"ok": 1,"exp": "Siempre justifica el tiempo: \"Permítame un momento, voy a…\" y mantén presencia confirmando que sigues trabajando. Retoma en menos de 60 segundos. Los silencios largos sin justificar aumentan la angustia."},{"id": "qse5","text": "¿Dónde se registra una llamada de emergencia?","opts": ["Solo en el nuevo sistema de siniestros — el triage","Solo en Slack canal de Siniestros","En Slack (canal de Siniestros) y en el triage de koltin-bandeja.vercel.app con todos los detalles","Solo en el triage — Slack es opcional"],"ok": 2,"exp": "El registro siempre va en dos lugares: Slack (canal de Siniestros) y el triage en koltin-bandeja.vercel.app/triage.html con todos los detalles del caso. Omitir el registro es uno de los errores más comunes y críticos."},{"id": "qse6","text": "Una GP tiene un accidente menor — torcedura de tobillo. ¿Aplica deducible?","opts": ["Sí — el deducible siempre aplica en emergencias","No — los accidentes menores no aplican deducible ni coaseguro","Solo si supera el deducible de $30,000","Depende de si el hospital es de su nivel o no"],"ok": 1,"exp": "En accidentes menores NO aplican deducible ni coaseguro. Esto es diferente a urgencias por enfermedad donde sí aplica deducible. Es importante aclarárselo a la GP para gestionar bien sus expectativas."},{"id": "qse7","text": "¿Puedes garantizarle a una GP que su hospitalización está cubierta si está en Vigor y en hospital de su nivel?","opts": ["Sí — si está en Vigor y en su nivel, la cobertura está garantizada","No — la cobertura siempre la determina la aseguradora con base en el dictamen","Solo si es accidente, no enfermedad","Sí, pero solo para las primeras 24 horas"],"ok": 1,"exp": "Nunca garantices cobertura. Aunque la GP esté en Vigor y en el hospital correcto, la elegibilidad final la determina GNP con base en el dictamen. Siempre comunica esto claramente."},{"id": "qse8","text": "¿Cuándo termina tu rol como Expertx en una emergencia?","opts": ["Cuando la aseguradora aprueba la cobertura","Cuando la GP recibe el alta médica","Cuando registras el caso y lo envías — Care Coordination toma el seguimiento","Cuando confirmas el ingreso hospitalario de la GP"],"ok": 2,"exp": "Tu rol como Expertx termina cuando registras y envías el caso en el sistema. Care Coordination se encarga del seguimiento durante la hospitalización y de determinar la salida del caso (incidencia, siniestro o reembolso)."}],"subs_c": [{"id": "qsc1","text": "Una GP tiene síntomas de posible necesidad de cirugía pero aún no tiene diagnóstico. ¿Cuándo puede iniciar el trámite?","opts": ["Inmediatamente — los síntomas son suficientes para abrir el caso","Cuando tenga el diagnóstico confirmado Y ese diagnóstico supere el deducible","Cuando el médico confirme que necesita cirugía, aunque no haya diagnóstico formal","No puede iniciar el trámite hasta tener la fecha de cirugía agendada"],"ok": 1,"exp": "La elegibilidad requiere dos condiciones: diagnóstico confirmado Y que ese diagnóstico supere el deducible. Sin ambas, el trámite no procede. Iniciar sin cumplirlas es uno de los errores más costosos."},{"id": "qsc2","text": "¿Quién llena el Aviso de Accidente y/o Enfermedad?","opts": ["El médico tratante","La Gran Persona — la propia asegurada","El Expertx con la información de la llamada","El contratante (Koltin / Aplicaciones Gerontológicas)"],"ok": 1,"exp": "El Aviso lo llena y firma la propia Gran Persona. El médico llena el Informe Médico. Nunca al revés. Esta distinción es la regla más importante de la documentación de cirugía programada."},{"id": "qsc3","text": "Un médico entregó el Informe Médico con una tachadura en la fecha de la cirugía. ¿Qué haces?","opts": ["Lo aceptas — un error menor no debería impedir el trámite","Le pides al médico que ponga sus iniciales sobre la tachadura para validarla","Le explicas que el Informe Médico no acepta tachaduras y debe llenarse un formato nuevo","Le pides que escriba una carta aclaratoria anexa al informe"],"ok": 2,"exp": "El Informe Médico no acepta tachaduras ni enmendaduras. No se puede corregir una vez enviado. Si tiene errores, el médico debe llenar un nuevo formato. Es importante comunicarlo antes de recibir el documento."},{"id": "qsc4","text": "Una GP tuvo una fractura de cadera en accidente. Además del Informe Médico y el Aviso, ¿qué documentos adicionales necesita?","opts": ["Solo la factura del hospital y los estudios de imagenología","Carta de hechos y lista de osteosíntesis — son requisitos adicionales para accidentes de ortopedia","Estado de cuenta bancaria y comprobante de domicilio","No requiere documentos adicionales — los estándar son suficientes"],"ok": 1,"exp": "En accidentes de ortopedia se requieren adicionalmente: carta de hechos (descripción del accidente) y lista de osteosíntesis (el material implantado, si aplica). Estos son específicos de este tipo de caso."},{"id": "qsc5","text": "¿Cuántos días hábiles tiene la aseguradora para emitir su dictamen en cirugía programada?","opts": ["5 días hábiles","10 días hábiles","15 días hábiles","30 días hábiles"],"ok": 0,"exp": "La aseguradora tiene hasta 5 días hábiles para responder una vez que la documentación está completa. Antes, Koltin tiene hasta 5 días hábiles para su revisión interna. Si falta documentación, el reloj no corre."},{"id": "qsc6","text": "¿Cuándo aplica el reembolso en una cirugía programada?","opts": ["Solo cuando la GP lo solicita expresamente","Cuando el hospital está fuera de la red, es de nivel superior, la atención es en extranjero o la GP lleva menos de 30 días de membresía","Solo cuando la aseguradora lo determina en el dictamen","En todos los casos de cirugía programada"],"ok": 1,"exp": "El reembolso aplica cuando el hospital está fuera de la red, es de nivel superior al contratado (con penalización), la atención es en el extranjero, o la GP tiene menos de 30 días de membresía."},{"id": "qsc7","text": "Al cerrar una llamada de cirugía programada, ¿qué no debe faltar?","opts": ["Confirmación del diagnóstico médico por parte del Expertx","Reconocer la situación, dejar claro el siguiente paso con fecha, enumerar documentos y confirmar correo/WhatsApp","Garantizar la fecha de la autorización de la aseguradora","Comprometer un tiempo específico de respuesta de la aseguradora"],"ok": 1,"exp": "El cierre tiene 5 elementos clave: reconocer la situación, siguiente paso con fecha concreta, lista de documentos, confirmar correo/WhatsApp y avisar que habrá un correo de seguimiento. Sin estos, la GP queda sin claridad sobre qué sigue."},{"id": "qsc8","text": "¿Qué pasa si el médico de la GP cobra más que el tabulador de la aseguradora?","opts": ["La aseguradora cubre el total sin límite si el médico está en la red","La aseguradora reembolsa según su tabulador y el excedente lo cubre la GP","La GP puede negociar directamente con la aseguradora para cubrir la diferencia","El Expertx gestiona con la aseguradora un aumento en el tabulador para ese caso"],"ok": 1,"exp": "La aseguradora reembolsa según su tabulador. El excedente no es reembolsable y lo cubre la GP. Si el médico no acepta el tabulador, la GP paga los honorarios completos y solicita el reembolso de lo que corresponde."}],"subs_r": [{"id": "qsr1","text": "¿Cuándo va por reembolso una GP con 20 días de membresía que es hospitalizada de urgencia?","opts": ["Pago directo — la urgencia justifica la excepción","Reembolso — menos de 30 días de membresía siempre va por reembolso","Depende del hospital donde fue atendida","Pago directo si el hospital es de su nivel"],"ok": 1,"exp": "Menos de 30 días de membresía siempre va por reembolso, sin importar la red hospitalaria. Es una de las reglas más importantes a comunicar desde el inicio."},{"id": "qsr2","text": "Una factura del hospital está emitida a nombre del esposo de la GP, quien pagó. ¿La aseguradora la acepta?","opts": ["Sí — quien pagó puede recibir el reembolso","Sí, si el esposo firma una carta de cesión de derechos","No — las facturas deben estar a nombre del asegurado (la GP)","Solo si ambos están en la misma póliza"],"ok": 2,"exp": "Las facturas DEBEN estar a nombre del asegurado. Si están a otro nombre, la aseguradora no procesa el pago. Esto es la regla crítica de las facturas — uno de los errores más comunes y costosos."},{"id": "qsr3","text": "¿En qué formato deben enviarse las facturas para un reembolso?","opts": ["En PDF escaneado con buena resolución","En PDF o imagen clara del documento físico","En PDF y XML — nunca escaneadas","En cualquier formato legible"],"ok": 2,"exp": "Las facturas deben enviarse en PDF y XML — nunca escaneadas. El XML es el archivo electrónico original del SAT que valida la factura. Sin el XML, la aseguradora no las procesa."},{"id": "qsr4","text": "¿Cuánto tiempo tiene la aseguradora para emitir el dictamen de un reembolso?","opts": ["5 días hábiles","15 días hábiles","30 días hábiles","60 días hábiles"],"ok": 2,"exp": "La aseguradora tiene hasta 30 días hábiles para emitir el dictamen de reembolso. Este plazo es significativamente mayor que en cirugía programada (5 días). Es importante comunicárselo a la GP para manejar bien las expectativas."},{"id": "qsr5","text": "Una GP no tiene RFC para la factura del hospital. ¿Cómo se resuelve?","opts": ["El hospital emite la factura a nombre de Koltin","Se usa el RFC genérico del SAT XAXX010101000 con el nombre de la GP","La GP puede tramitar su RFC urgente en el SAT","No puede solicitar reembolso sin RFC propio"],"ok": 1,"exp": "Si la GP no tiene RFC, la factura se emite a público en general con el RFC genérico del SAT: XAXX010101000, y se incluye el nombre de la GP. Esto es suficiente para el proceso de reembolso."},{"id": "qsr6","text": "¿A dónde se envía el expediente de reembolso una vez completo?","opts": ["Directamente a la aseguradora por correo oficial","A ayuda@koltin.mx en un solo correo — Koltin revisa antes de mandarlo a la aseguradora","Al equipo de Care Coordination por Slack","Se sube al portal de la aseguradora directamente"],"ok": 1,"exp": "Todo el expediente se envía a ayuda@koltin.mx en un solo correo. Koltin revisa que esté completo y correcto antes de mandarlo a la aseguradora, para evitar rechazos por información incompleta."},{"id": "qsr7","text": "Una GP tuvo una emergencia médica en Canadá. ¿Cuál es el deducible para el reembolso en el extranjero?","opts": ["$30,000 MXN — el mismo que el nacional","USD 100","USD 50","No hay deducible para emergencias en el extranjero"],"ok": 2,"exp": "El reembolso en el extranjero tiene un deducible de USD 50 y una suma asegurada máxima de USD 50,000. El tipo de cambio utilizado es el oficial de Banxico. Se aceptan recibos en lugar de facturas."},{"id": "qsr8","text": "Un reembolso lleva 3 semanas aprobado pero la GP no ve el dinero en su cuenta. ¿Qué haces?","opts": ["Le dices que espere — pueden tardarse hasta 60 días","Le pides que revise con su banco si el pago está pendiente de autorización","Levantas el reclamo con la aseguradora — la GP debe confirmar cuando recibe el dinero","Le das el número directo de la aseguradora para que ella gestione"],"ok": 2,"exp": "Una vez aprobado, el reembolso debe reflejarse en hasta 5 días hábiles adicionales. Si no llega en ese plazo, se levanta el reclamo con la aseguradora. La GP debe confirmar cuando recibe el dinero — si no, tú levantas el reclamo."}],"subco1": [{"id": "qco1a","text": "¿Cuántos días de gracia tiene una GP para pagar después del vencimiento?","opts": ["1 día hábil","3 días naturales","5 días hábiles","7 días naturales"],"ok": 1,"exp": "El periodo de gracia es de 3 días naturales posteriores a la fecha de vencimiento. Fuera de ese plazo los pagos atrasados no se aceptan."},{"id": "qco1b","text": "¿En qué momento se puede cambiar la fecha de pago de una membresía?","opts": ["Cuando el cliente lo solicite con 15 días de anticipación","Solo durante el proceso de renovación de la membresía","Nunca — las fechas son permanentes e inmutables","En cualquier momento si hay un acuerdo con Cobranzas"],"ok": 1,"exp": "Las fechas de pago son inamovibles durante la vigencia del contrato. La ventana de ajuste solo existe durante el proceso de renovación."},{"id": "qco1c","text": "Una GP quiere pagar con tarjeta y transferencia para completar el monto. ¿Es posible?","opts": ["Sí — si el monto total es el correcto","Sí — con autorización de Cobranzas","No — está prohibido usar múltiples métodos de pago para una misma cuota","Solo si ambos métodos son del mismo banco"],"ok": 2,"exp": "Está prohibido usar múltiples métodos de pago para una misma cuota. Tampoco se pueden pagar varias membresías en una sola cuenta o liga de pago."},{"id": "qco1d","text": "¿Qué método de pago de Koltin es 100% automatizado y recurrente?","opts": ["Transferencia STP","Link de pago Toku","Domiciliación","Ninguno — todos requieren acción del cliente"],"ok": 2,"exp": "La domiciliación es el único método 100% automatizado — cargo recurrente sin intervención del cliente. Evita olvidos y asegura la vigencia de la membresía."},{"id": "qco1e","text": "¿Quién tiene la facultad exclusiva de autorizar prórrogas de pago?","opts": ["El Expertx, si el cliente tiene buen historial","El equipo de Ventas y Renovaciones","Solo el área de Cobranzas","El Gerente de Atención al Cliente"],"ok": 2,"exp": "Solo el área de Cobranzas tiene la facultad exclusiva de autorizar prórrogas. Ningún Expertx puede comprometerse por cuenta propia. Cada caso se evalúa individualmente."},{"id": "qco1f","text": "Un cliente pide que le ayudes a coordinar el pago de 3 membresías distintas en una sola transferencia. ¿Qué haces?","opts": ["Le ayudas — una transferencia es más conveniente para él","Le explicas que no es posible: cada membresía tiene su propio proceso de pago y referencia","Escala a Cobranzas para que ellos gestionen el pago múltiple","Le dices que solo puede hacerse si las 3 membresías vencen el mismo día"],"ok": 1,"exp": "No se pueden pagar varias membresías en una sola cuenta o una sola liga de pago. Cada membresía tiene su referencia única y proceso de pago individual."},{"id": "qco1g","text": "¿Qué información recibe el Expertx al validar un comprobante de transferencia STP?","opts": ["Confirmación de recibo automática en el portal Sales","El cliente envía el comprobante y se etiqueta a @Pahoran y @cobranza en el canal correspondiente","Una notificación en la app de Koltin cuando el pago fue recibido","Nada — Cobranzas valida directamente con el banco"],"ok": 1,"exp": "Al recibir un comprobante de pago vía transferencia, el Expertx lo registra en el canal \"Facturas y pagos clientes\" etiquetando a @Pahoran y @cobranza, incluyendo nombre completo, número de certificado y comprobante."},{"id": "qco1h","text": "¿Qué método de pago acepta tarjetas de débito Y crédito en Koltin?","opts": ["Transferencia STP","Domiciliación","Link de pago Toku","Todos los métodos aceptan ambos tipos"],"ok": 2,"exp": "El Link de Pago Toku acepta tarjetas de débito y crédito, y permite pagos por cuotas. La transferencia STP es bancaria. La domiciliación es cargo automático a tarjeta registrada."},{"id": "qco1i","text": "¿Qué le dices a un cliente que quiere una prórroga de pago?","opts": ["Que sí se puede si paga antes del fin de mes","Que no es posible bajo ninguna circunstancia","Que el caso lo revisa únicamente el área de Cobranzas — informarás que está en revisión sin generar expectativas","Que puede hacer el pago en cuotas como excepción"],"ok": 2,"exp": "La respuesta correcta es que las prórrogas solo las puede revisar el área de Cobranzas. Se informa que el caso está en revisión, evitando generar expectativas o compromisos que no han sido aprobados."},{"id": "qco1j","text": "¿En qué tipo de situación una GP puede solicitar un convenio de pago?","opts": ["Siempre que lo necesite — es un beneficio de la membresía","Solo en el primer año de membresía","Los convenios se evalúan caso por caso exclusivamente con el área de Cobranzas según historial y viabilidad","Los convenios están disponibles solo para miembros con más de 2 años"],"ok": 2,"exp": "Los convenios de pago no son automáticos ni garantizados. El área de Cobranzas evalúa cada caso individualmente, considerando historial de la GP, motivo del retraso y viabilidad del compromiso."}],"subco2": [{"id": "qco2a","text": "¿En qué días del mes se emiten facturas manuales en Koltin?","opts": ["Los primeros 5 días del mes","Días 10, 20 y 30","Días 15, 30 y 31","Cualquier día del mes si el cliente lo solicita"],"ok": 2,"exp": "Las facturas manuales en Koltin se emiten los días 15, 30 y 31 del mes. No se puede prometer el envío inmediato ni en fechas distintas a estas."},{"id": "qco2b","text": "¿Qué tipo de CFDI NO aplica para la facturación de Koltin?","opts": ["CFDI de ingreso (I)","CFDI tipo D07 de seguros — Koltin no es aseguradora","CFDI de servicios en general","Cualquier CFDI con deducible de gastos personales"],"ok": 1,"exp": "CFDI tipo D07 (seguros) NO aplica porque Koltin no es aseguradora. El concepto fiscal correcto es \"Servicios preventivos de salud y gestión de seguro médico\", deducible como gastos personales."},{"id": "qco2c","text": "¿Cuántos complementos de pago tiene un cliente con membresía trimestral (desde abril 2025)?","opts": ["1 complemento","2 complementos","4 complementos","12 complementos"],"ok": 2,"exp": "A partir de abril 2025, el cliente trimestral tiene 4 complementos de pago — uno por cada pago trimestral. La factura sale con el monto anual total y cada complemento especifica el abono correspondiente."},{"id": "qco2d","text": "Un cliente contrató en enero 2025. ¿Dónde encuentras su factura?","opts": ["En el portal Sales, sección Facturas","En Airtable — ahí están todas las facturas","En Facturama — solicita su RFC para rastrearla","En clientes.koltin.mx bajo su perfil"],"ok": 2,"exp": "Las facturas de contratos anteriores a abril 2025 se encuentran en Facturama. Debes solicitar el RFC del cliente para poder rastrearla en ese sistema."},{"id": "qco2e","text": "¿Qué le manda el Expertx a un cliente que dice que no le llegó su factura y no aparece en el sistema?","opts": ["Una factura en blanco para que la llene","El link de Airtable para que llene sus datos de facturación antes de que termine el mes","El correo de facturacion@koltin.mx para que lo contacten directamente","Le dice que espere — las facturas tardan hasta 30 días en aparecer"],"ok": 1,"exp": "Si no aparece la factura, probablemente el cliente no la solicitó. Se le envía el link de Airtable (airtable.com/Koltin-Factura) para que llene sus datos antes de que termine el mes y así le llegue por correo."},{"id": "qco2f","text": "¿Cuál es el concepto fiscal correcto para la factura de la membresía Koltin?","opts": ["\"Seguro de Gastos Médicos Mayores con GNP\"","\"Servicios preventivos de salud y gestión de seguro médico\"","\"Membresía de salud y bienestar\"","\"Póliza de seguro de salud grupal\""],"ok": 1,"exp": "El concepto fiscal correcto es \"Servicios preventivos de salud y gestión de seguro médico\", clasificado como honorarios médicos/gastos en general, deducible como gastos personales. Nunca como seguro."},{"id": "qco2g","text": "¿A qué correo se escalan los temas fiscales complejos o problemas de facturación?","opts": ["cobranza@koltin.mx","soporte@koltin.mx","facturacion@koltin.mx","billing@koltin.mx"],"ok": 2,"exp": "Los escalamientos de facturación van a facturacion@koltin.mx. Siempre deben incluir evidencia clara (comprobantes, capturas) para agilizar la respuesta."},{"id": "qco2h","text": "¿Cuándo se puede facturar una membresía contratada en octubre pero el cliente la pide en noviembre?","opts": ["Siempre — el cliente tiene 3 meses para solicitarla","Solo si el pago se realizó en octubre — no se puede facturar fuera del mes de contratación o renovación","En cualquier momento del año fiscal","Solo en los meses de cierre: marzo, junio, septiembre, diciembre"],"ok": 1,"exp": "Solo se factura dentro del mismo mes calendario en que se realizó la contratación o renovación. Si el cliente de octubre la pide en noviembre, ya no se puede facturar ese periodo."}],"subco3": [{"id": "qco3a","text": "¿Cuándo puedes enviar el link de domiciliación SIN autorización previa de Cobranzas?","opts": ["Siempre que el cliente lo solicite directamente","Nunca — siempre requiere autorización","Cuando le robaron la tarjeta, se venció o no tiene tarjeta domiciliada","Solo cuando el área de Cobranzas está fuera de horario"],"ok": 2,"exp": "Hay 3 casos donde no necesitas autorización para enviar el link de domiciliación: robo de tarjeta, tarjeta vencida, o que la GP no tenga tarjeta domiciliada. En cualquier otro caso, primero consulta a Cobranzas."},{"id": "qco3b","text": "¿Qué extensión debes agregar al final del link de cuota para convertirlo en link de domiciliación?","opts": ["?domiciliar=1","&portal=1","#domiciliacion","?type=recurrent"],"ok": 1,"exp": "Para generar el link de domiciliación: seleccionas la cuota en Sales, copias la URL que se abre y agregas &portal=1 al final. Luego compartes el enlace completo."},{"id": "qco3c","text": "Un cliente con pagos pendientes NO está en proceso de renovación. ¿A quién lo derivas?","opts": ["A Renovaciones","A Cobranzas","A Ventas para que le ofrezcan un descuento","Al equipo de Atención al Cliente"],"ok": 1,"exp": "Todo lo que no esté en proceso de renovación y tenga pagos pendientes, acuerdos de pago, pagos duplicados o liquidaciones anticipadas va a Cobranzas."},{"id": "qco3d","text": "¿Qué información debes incluir al etiquetar un pago vía BBVA en el canal?","opts": ["Solo el comprobante de pago","Nombre completo, número de certificado y comprobante de pago","Nombre, RFC y comprobante","Solo el número de certificado y el monto pagado"],"ok": 1,"exp": "Al etiquetar un pago vía BBVA debes incluir: nombre completo del cliente, número de certificado y comprobante de pago. Además etiqueta a @Pahoran y @cobranza en el canal \"Facturas y pagos clientes\"."},{"id": "qco3e","text": "¿Cuál de estas acciones NUNCA debes hacer como Expertx en temas de cobranza?","opts": ["Informar al cliente que su fecha de pago está vencida","Enviar el link de pago desde Sales","Prometer facturas anticipadas para cerrar una venta o renovación","Derivar a Cobranzas cuando hay pagos duplicados"],"ok": 2,"exp": "Prometer facturas anticipadas para cerrar una venta o renovación es una acción que NUNCA debes hacer. Las facturas solo se emiten en días específicos y dentro del mes de contratación o renovación."},{"id": "qco3f","text": "¿Dónde verificas si un cliente está al corriente en sus pagos?","opts": ["En la app de Koltin bajo su perfil","En el canal de WhatsApp del equipo","En Sales sección Pagos o en clientes.koltin.mx","Preguntando directamente a Cobranzas"],"ok": 2,"exp": "La información de pagos y estatus del cliente se encuentra en Sales (sección Pagos) o en el portal de clientes clientes.koltin.mx. Si no está al corriente, avisar a Cobranzas en el canal soporte-de-cobranzas-y-reembolsos."},{"id": "qco3g","text": "Un cliente insiste en que le prometas un descuento para renovar. ¿Qué haces?","opts": ["Le ofreces un 5% de descuento — es una excepción menor","Le explicas que los descuentos y prórrogas solo los puede revisar Cobranzas — informas que el caso está en revisión sin comprometerte","Le dices que no hay descuentos bajo ninguna circunstancia","Escala inmediatamente a tu líder de equipo"],"ok": 1,"exp": "Nunca prometas descuentos sin consultar a Cobranzas. La respuesta correcta es informar que el caso está en revisión, sin generar expectativas ni compromisos que no han sido aprobados por el área responsable."},{"id": "qco3h","text": "¿Qué canal usas para escalar pagos duplicados o temas de reembolso?","opts": ["facturacion@koltin.mx","El canal de soporte-de-cobranzas-y-reembolsos","Directamente con @Pahoran","El canal general del equipo Expertxs"],"ok": 1,"exp": "Los casos de pagos duplicados, reembolsos, confirmación de pagos diferidos o temas fiscales se escalan levantando un ticket en el canal soporte-de-cobranzas-y-reembolsos, siguiendo el flujo correspondiente."}],"subc1": [{"id": "qc1a","text": "¿Cuál es la edad mínima para participar en las clases de la Comunidad Koltin?","opts": ["60 años","65 años","50 años","No hay límite de edad mínima"],"ok": 2,"exp": "A partir de los 50 años. Koltin atiende a adultos mayores desde los 50 — no desde los 60 o 65 como muchas instituciones que trabajan con adultos mayores."},{"id": "qc1b","text": "¿Con qué frecuencia se renuevan las inscripciones a las clases de Comunidad?","opts": ["Mensualmente","Cada 2 me
