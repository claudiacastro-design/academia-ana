 un plan personalizado de cuidado"],"ok": 3,"exp": "El EDL identifica el estado actual de salud para detectar riesgos a tiempo y construir un plan de atención personalizado. No reemplaza al médico de cabecera ni da diagnósticos definitivos."},{"id": "q1f","text": "¿Por qué la Experta NO debe interpretar los resultados del EDL con la GP?","opts": ["Porque los resultados son confidenciales y solo los ve el médico","Porque GNP lo prohíbe en las condiciones del seguro","Porque hacerlo puede generar alarma innecesaria o expectativas incorrectas — es responsabilidad del equipo médico","Porque la Experta no tiene acceso a los resultados en el sistema"],"ok": 2,"exp": "Interpretar resultados corresponde al equipo médico en la consulta de entrega. Hacerlo puede generar alarma innecesaria, expectativas incorrectas o información médica errónea — aunque la GP insista."},{"id": "q1g","text": "¿Qué es el EDL en una sola frase?","opts": ["Una consulta de rutina para verificar que la GP usa la app","Un seguro médico adicional que se activa al contratar la membresía","Un diagnóstico integral de salud que es la base del acompañamiento personalizado en Koltin","Un estudio que solo aplica para GPs mayores de 70 años"],"ok": 2,"exp": "El EDL es un diagnóstico integral de salud — no una consulta de rutina ni un trámite. Es la base de todo el acompañamiento personalizado que recibirá la GP en Koltin."},{"id": "q1h","text": "Una GP pregunta cuándo recibirá su Reporte de Salud. ¿Qué le dices?","opts": ["Que lo recibirá en la consulta de resultados, aproximadamente 5 días hábiles después de los estudios","Que lo recibirá en 24 horas por correo electrónico","Que depende del médico asignado — no hay tiempo definido","Que puede descargarlo desde la app cuando estén los estudios"],"ok": 0,"exp": "El Reporte de Salud se entrega en la consulta de resultados, aproximadamente 5 días hábiles después de los estudios. No se envía por correo ni se descarga de la app."},{"id": "q1i","text": "¿Con qué frecuencia se recomienda realizar el EDL?","opts": ["Una sola vez al inicio de la membresía","Cada 6 meses para mantener el seguimiento actualizado","Anualmente — aunque puede variar según la evolución de cada GP","Solo cuando el médico lo indique en una consulta"],"ok": 2,"exp": "Se recomienda anualmente. No hay límite de ciclos — la GP puede realizarlo tantas veces como su plan de salud lo indique. La frecuencia puede ajustarse según su evolución."},{"id": "q1j","text": "¿Qué hace que el EDL sea diferente a un chequeo médico tradicional?","opts": ["Que incluye estudios más costosos y especializados","Que se puede hacer desde casa","Un equipo multidisciplinario lo analiza y genera un plan de acompañamiento personalizado — no solo un diagnóstico","Que el resultado es un seguro de vida adicional"],"ok": 2,"exp": "El EDL lo analiza un equipo multidisciplinario (medicina general, geriatría, gerontología, nutrición, ortopedia) y genera un plan de acompañamiento. No es solo un diagnóstico — es el inicio de seguimiento continuo."}],"sub2": [{"id": "q2a","text": "¿Cuántos pasos conforman el proceso del EDL?","opts": ["5 pasos","7 pasos","9 pasos","11 pasos"],"ok": 2,"exp": "El proceso del EDL tiene 9 pasos: correo de bienvenida, crear cuenta, llenar expediente, órdenes automáticas, estudios en Chopo, resultados al expediente, reporte (~5 días), recordatorios y cita de entrega."},{"id": "q2b","text": "Si guardas el expediente de una GP y las órdenes médicas no aparecen después de 3 minutos, ¿qué haces?","opts": ["Esperas 15 minutos más — a veces el sistema tarda","Las generas manualmente desde el apartado de órdenes médicas usando el número de certificado","Le pides a la GP que cierre sesión y vuelva a entrar para que aparezcan","Vuelves a guardar el expediente para activar la generación automática"],"ok": 1,"exp": "Si pasan más de 3 minutos y las órdenes no aparecen, el paso correcto es generarlas manualmente desde el apartado de órdenes médicas usando el número de certificado de la GP."},{"id": "q2c","text": "¿Qué diferencia el proceso del EDL en foráneos respecto a CDMX y Monterrey?","opts": ["No tienen acceso al EDL — solo CDMX y Monterrey lo ofrecen","La consulta de resultados es por videollamada en lugar de presencial","Solo realizan el laboratorio, sin densitometría ni electrocardiograma","El reporte tarda 10 días hábiles en lugar de 5"],"ok": 1,"exp": "Para GPs foráneas, la entrega de resultados se hace por videollamada. También hay excepciones por estado (Guerrero, Durango, BC). El proceso varía según localidad."},{"id": "q2d","text": "Verdadero o Falso: El reporte del EDL con los resultados de la GP tarda aproximadamente 5 días hábiles.","opts": ["Verdadero","Falso"],"ok": 0,"exp": "Verdadero. El reporte tarda aproximadamente 5 días hábiles después de que se completan los estudios de laboratorio."},{"id": "q2e","text": "¿En qué momento del proceso se generan automáticamente las órdenes médicas del EDL?","opts": ["Al crear la cuenta de la GP en la app","Al guardar el expediente médico por primera vez","Al confirmar la cita de resultados con el médico","Al registrar al GP en el portal de Koltin"],"ok": 1,"exp": "Las órdenes se generan automáticamente al guardar el expediente. Si no aparecen en 3 minutos, se generan manualmente con el número de certificado de la GP."},{"id": "q2f","text": "Las órdenes del EDL no aparecen 4 minutos después de guardar el expediente. ¿Qué haces?","opts": ["Esperar 24 horas — el sistema a veces tarda","Generarlas manualmente desde el sistema","Pedirle a la GP que vuelva a llenar el expediente","Escalar a soporte inmediatamente"],"ok": 1,"exp": "Las órdenes deben aparecer en máximo 3 minutos al guardar. Si no aparecen, la Experta las genera manualmente. No hay que esperar más tiempo ni pedirle a la GP que rehaga el expediente."},{"id": "q2g","text": "¿Cuántos días antes de la cita del EDL debe recibir la GP recordatorios?","opts": ["Solo el día anterior","7 días antes y 1 día antes","15 días antes y 3 días antes","No hay recordatorios automáticos"],"ok": 1,"exp": "La GP recibe recordatorios automáticos 7 días antes y 1 día antes de su cita. Estos ayudan a reducir las inasistencias sin que la Experta tenga que hacer seguimiento manual."},{"id": "q2h","text": "¿En qué laboratorio realizan los estudios del EDL las GPs de Koltin?","opts": ["En cualquier laboratorio de su preferencia","En el hospital más cercano de la red GNP","En Chopo — laboratorio aliado de Koltin","En el centro de salud más cercano a su domicilio"],"ok": 2,"exp": "Los estudios del EDL se realizan en Chopo, el laboratorio aliado de Koltin. Las órdenes generadas están dirigidas específicamente a este laboratorio."},{"id": "q2i","text": "¿Cuántos días hábiles tarda aproximadamente el equipo médico en preparar el Reporte de Salud?","opts": ["1-2 días hábiles","3 días hábiles","5 días hábiles","10 días hábiles"],"ok": 2,"exp": "El equipo médico tarda aproximadamente 5 días hábiles en analizar los resultados y preparar el Reporte de Salud con el plan de acompañamiento personalizado."},{"id": "q2j","text": "Una GP completó su expediente pero no puede agendar en la app. ¿Qué puede estar faltando?","opts": ["No aceptó los términos en la app","Tiene un pago vencido en su membresía","Todavía no realizó sus estudios de laboratorio en Chopo","El médico debe aprobar el expediente primero"],"ok": 2,"exp": "Para agendar en la app se necesitan dos cosas: expediente enviado Y estudios de laboratorio realizados. Sin ambos, el agendamiento no se habilita — aunque el expediente esté al 100%."}],"sub3": [{"id": "q3a","text": "¿Cuántas pestañas tiene el sistema del expediente en la plataforma Koltin?","opts": ["5 pestañas","7 pestañas","9 pestañas","4 pestañas"],"ok": 1,"exp": "El expediente tiene 7 pestañas en el sistema. Es importante conocerlas para poder orientar a las GPs y hacer seguimiento correcto."},{"id": "q3b","text": "Verdadero o Falso: El DXA (densitometría) se realiza siempre en todos los ciclos de EDL.","opts": ["Verdadero","Falso"],"ok": 1,"exp": "Falso. El DXA se completa solo si aplica el triage (6 o 7 pasos). Si no aplica, el ciclo puede completarse con 5 o 6 pasos. No es un estudio universal."},{"id": "q3c","text": "¿Quién genera actualmente las órdenes médicas manualmente cuando es necesario?","opts": ["El área de soporte técnico a través de un ticket","El médico responsable del caso de la GP","El Expertx, desde el apartado de órdenes en el expediente","El sistema automáticamente después de 10 minutos"],"ok": 2,"exp": "Actualmente el Expertx genera las órdenes manualmente desde el apartado de órdenes médicas usando el número de certificado de la GP. Ya no se hace a través de @neto."},{"id": "q3d","text": "¿Cuántos pasos tiene la línea del tiempo del ciclo completo del EDL en el expediente?","opts": ["5 pasos","7 pasos","9 pasos","10 pasos"],"ok": 1,"exp": "La línea del tiempo del ciclo del EDL tiene 7 pasos reales. Es importante conocerlos para hacer seguimiento preciso con cada GP."},{"id": "q3e","text": "Una GP completó todas las secciones del expediente en la app. ¿Qué debe hacer para que quede registrado?","opts": ["Nada — el sistema lo envía automáticamente al detectar el 100%","Llamar al equipo Expertxs para que lo procesen","Tocar el botón de \"Tu expediente está listo\" y enviarlo desde la app","Esperar que el médico lo valide en el sistema antes de que se active"],"ok": 2,"exp": "Al terminar todas las secciones, la GP llega a la pantalla \"Tu expediente está listo\" y debe enviarlo desde ahí. No se envía automáticamente."},{"id": "q3f","text": "¿Qué pestaña del sistema muestra el historial cronológico de ciclos del EDL?","opts": ["Perfil","Consultas","Longevidad","Historial"],"ok": 3,"exp": "La pestaña \"Historial\" muestra el registro cronológico de todos los ciclos y eventos médicos de la GP. Es la referencia para saber cuántos ciclos ha completado y cuándo ocurrió cada uno."},{"id": "q3g","text": "¿Qué hace la Experta si las órdenes no aparecen 3 minutos después de guardar el expediente?","opts": ["Espera otros 10 minutos antes de actuar","Las genera manualmente desde el sistema","Pide a la GP que cierre y abra la app","Escala el caso a soporte sin intentar resolverlo"],"ok": 1,"exp": "Las órdenes no aparecen → se generan manualmente. Es un paso conocido del proceso. No requiere escalar ni esperar más tiempo."},{"id": "q3h","text": "¿Qué muestra la línea del tiempo del EDL en el sistema?","opts": ["Los resultados de laboratorio de la GP","Los 7 pasos del ciclo completo y en cuál está la GP","El historial de pagos de la membresía","Las consultas de seguimiento agendadas"],"ok": 1,"exp": "La línea del tiempo muestra los 7 pasos del ciclo del EDL y permite ver en cuál está cada GP. Es la herramienta de seguimiento principal de la Experta."},{"id": "q3i","text": "Una GP dice que ya hizo sus estudios pero no aparece ninguna orden en el sistema. ¿Qué verificas primero?","opts": ["Que el laboratorio los envió correctamente","Si el expediente fue enviado y si hay órdenes existentes o deben generarse manualmente","Si el médico ya revisó el expediente","Si la membresía está vigente y al corriente"],"ok": 1,"exp": "Primero verifica el estado del expediente y de las órdenes. Si el expediente no fue enviado, ahí está el problema. Si fue enviado pero no hay órdenes, se generan manualmente."},{"id": "q3j","text": "¿Qué pestaña contiene los datos personales y de contacto de la GP en el expediente?","opts": ["Diagnósticos","Perfil","Mediciones","Longevidad"],"ok": 1,"exp": "La pestaña \"Perfil\" contiene los datos generales del asegurado — nombre, contacto y datos personales básicos. Es la primera pestaña del expediente y el punto de partida para identificar a la GP."}],"sub4": [{"id": "q4a","text": "Una GP de CDMX llama para preguntar cuándo recibirá sus resultados del EDL. ¿Cuál es tu respuesta correcta?","opts": ["Que los resultados se envían en 48 horas por correo","Que deberá esperar a que el médico la contacte directamente por WhatsApp","Que recibirá el reporte en aproximadamente 5 días hábiles y se agendará una cita para revisarlos","Que puede ver los resultados en la app tan pronto como el Chopo los procese"],"ok": 2,"exp": "El reporte tarda aproximadamente 5 días hábiles. Después se agenda la cita de entrega con el médico para revisar los resultados. Los resultados no aparecen solos en la app."},{"id": "q4b","text": "Una GP pregunta cuál es el guión correcto para atender durante el EDL. ¿De qué depende?","opts": ["Del nivel de estudios que declaró la GP en su expediente","De su localidad: CDMX, Monterrey o foráneos tienen guiones distintos","De si es su primer EDL o una renovación","De la hora del día en que llama la GP"],"ok": 1,"exp": "El guión de atención varía según la localidad de la GP. Los procesos y puntos de contacto son distintos para CDMX, Monterrey y foráneos."},{"id": "q4c","text": "¿Qué NO le corresponde hacer a un Expertx durante el proceso del EDL?","opts": ["Orientar a la GP sobre cómo descargar la app de Koltin","Agendar la cita de resultados con el médico","Interpretar o explicar los resultados clínicos del EDL a la GP","Hacer seguimiento de los pasos completados en el expediente"],"ok": 2,"exp": "Interpretar o explicar los resultados clínicos no le corresponde al Expertx — eso es función del médico. Hacerlo puede generar confusión o malentendidos con la GP."},{"id": "q4d","text": "Verdadero o Falso: El Expertx puede llenar el expediente médico de la GP en el sistema si ella tiene dificultades.","opts": ["Verdadero","Falso"],"ok": 1,"exp": "Falso. El expediente debe llenarlo la GP. El Expertx puede orientarla y guiarla, pero no llenar el expediente por ella."},{"id": "q4e","text": "¿Cuándo debes escalar un caso a un área superior durante el EDL?","opts": ["Cuando la GP tarda más de 3 días en completar el expediente","Cuando la GP solicita hablar directamente con el médico desde el inicio","Cuando la GP tiene una situación que está fuera de tu guión o no sabes cómo resolverla","Cuando la GP menciona que tiene más de una condición de salud crónica"],"ok": 2,"exp": "Debes escalar cuando la situación está fuera de tu guión o no sabes la respuesta. Inventar información cuesta más que escalar. Conocer los límites de tu rol y escalar a tiempo es parte del trabajo."},{"id": "q4f","text": "Una GP de Monterrey pregunta si puede hacer su EDL por videoconsulta porque le es difícil trasladarse. ¿Qué le dices?","opts": ["Que sí — en Monterrey puede elegir entre presencial y virtual libremente","Que Monterrey es siempre presencial sin ninguna excepción posible","Que por default la modalidad en Monterrey es presencial, pero si tiene dificultades de movilidad o distancia puede solicitarse virtual con autorización del médico","Que la videoconsulta del EDL solo aplica para GPs foráneas y nunca para Monterrey"],"ok": 2,"exp": "El EDL en Monterrey es presencial por default. Sin embargo, en casos de limitaciones de movilidad o distancia, el médico puede autorizar la modalidad virtual. Es importante no cerrar la puerta definitivamente — siempre validar con el equipo médico antes de dar una respuesta final."},{"id": "q4g","text": "¿Cuándo NO debes comprometerte con tiempos médicos con una GP?","opts": ["Solo cuando el médico lo indica expresamente","Nunca — comprometerse con tiempos médicos no es tu responsabilidad y genera falsas expectativas","Solo en casos de siniestros","Cuando la GP pregunta de forma agresiva"],"ok": 1,"exp": "Comprometerte con tiempos médicos no es tu responsabilidad como Experta. Los tiempos los define el equipo médico. Hacerlo puede generar expectativas incumplibles que dañan la confianza de la GP."},{"id": "q4h","text": "Una GP foránea pregunta qué incluye su consulta del EDL. ¿Qué le explicas?","opts": ["Que será presencial en la sede más cercana","Que recibirá el reporte solo por correo sin consulta","Que su consulta de entrega de resultados es por videoconsulta — no hay sede presencial para su localidad","Que puede elegir la modalidad que prefiera"],"ok": 2,"exp": "Las GPs foráneas tienen su consulta de entrega de resultados por videoconsulta. No hay sede presencial disponible fuera de CDMX y Monterrey en este momento."},{"id": "q4i","text": "¿Qué hace la Experta cuando el primer intento de contacto con una GP no tiene respuesta?","opts": ["Marca el caso como cerrado y espera a que la GP contacte","Sigue el guión de seguimiento: realiza nuevos intentos según el protocolo de su localidad","Escala inmediatamente a su líder","Envía un solo mensaje más y cierra si no responde"],"ok": 1,"exp": "El primer contacto sin respuesta activa el protocolo de seguimiento del guión de la localidad. No se cierra el caso — se sigue el proceso de intentos de contacto establecido."},{"id": "q4j","text": "¿Qué NO debe hacer la Experta aunque la GP lo pida directamente?","opts": ["Explicarle el proceso del EDL paso a paso","Verificar el estado de sus órdenes de laboratorio","Interpretar o explicar los resultados del EDL","Agendar la cita de entrega de resultados"],"ok": 2,"exp": "Interpretar los resultados del EDL no es responsabilidad de la Experta. Es trabajo del médico en la consulta de entrega. Aunque la GP insista, hay que redirigirla amablemente a la consulta donde todo le será explicado."}],"sub5": [{"id": "q5a","text": "¿Cuánto tiempo mínimo debe haber pasado desde el último paso completado para iniciar un nuevo ciclo de EDL?","opts": ["6 meses","12 meses","3 meses","No hay tiempo mínimo — depende del médico"],"ok": 0,"exp": "El criterio es que hayan pasado al menos 6 meses desde el último paso completado del ciclo anterior. Con esto, puedes iniciar un nuevo ciclo aunque no haya pasado un año completo."},{"id": "q5b","text": "Al iniciar un nuevo ciclo de EDL, ¿cómo debe quedar configurado el expediente médico de la GP?","opts": ["Como \"Activo\" — para que el sistema tome la información más reciente automáticamente","Como \"Archivado\" — para conservar los datos del ciclo anterior sin modificarlos","Como \"En proceso\" — indica que el nuevo ciclo ha comenzado oficialmente","Como \"Sin expediente\" — para que la GP pueda editar y actualizar su información"],"ok": 3,"exp": "Debe quedar como \"Sin expediente\". Esto le permite a la GP editar y actualizar su historial. La información anterior se conserva — solo necesita agregar o corregir lo nuevo."},{"id": "q5c","text": "El ciclo anterior de una GP tiene 3 pasos pendientes y pasaron 8 meses. ¿Qué haces?","opts": ["No puedes iniciar nuevo ciclo hasta que el sistema cierre automáticamente el anterior","Inicias un nuevo ciclo directamente, el sistema omite los pasos del ciclo anterior","Usas \"Editar pasos\" para activar los pasos pendientes y cerrar el ciclo, y luego inicias el nuevo","Le explicas a la GP que su proceso quedó incompleto y no puede iniciar uno nuevo"],"ok": 2,"exp": "Con 6+ meses desde el último paso, puedes cerrar el ciclo manualmente con \"Editar pasos\" activando los pasos pendientes. Una vez cerrado, inicias el nuevo ciclo."},{"id": "q5d","text": "Verdadero o Falso: Las órdenes médicas del nuevo ciclo siempre se generan de forma automática.","opts": ["Verdadero","Falso"],"ok": 1,"exp": "Falso. Si pasan más de 3 minutos y las órdenes no aparecen, debes generarlas manualmente con el número de certificado de la GP. No siempre se generan automáticamente."},{"id": "q5e","text": "Una GP tiene 2 años con Koltin y nunca le han informado sobre hacer un segundo EDL. ¿Qué haces?","opts": ["Esperas a que el sistema lo notifique automáticamente cuando corresponda","Le explicas que el EDL solo se realiza una vez al inicio de la membresía","Le informas que ya caducó su oportunidad de hacer un segundo EDL","Verificas su ciclo anterior y, si pasaron 6+ meses, inicias el proceso de nuevo ciclo con ella proactivamente"],"ok": 3,"exp": "El EDL se recomienda anualmente. El Expertx gestiona este proceso de forma proactiva. Si ya pasaron 6 meses desde el último paso completado, es momento de iniciar un nuevo ciclo."},{"id": "q5f","text": "¿Cuánto tiempo mínimo debe haber pasado desde el último paso del ciclo anterior para iniciar un nuevo EDL?","opts": ["3 meses","6 meses","1 año","No hay tiempo mínimo"],"ok": 1,"exp": "Deben haber pasado al menos 6 meses desde el último paso completado. Este criterio asegura que los nuevos resultados sean representativos de la evolución actual de la GP."},{"id": "q5g","text": "El expediente de una GP que va a su segundo EDL dice \"Completado\". ¿Qué debe hacer la Experta?","opts": ["Crear un expediente nuevo desde cero","Cambiar el estado a \"Sin expediente\" para que la GP pueda actualizarlo","Esperar que el sistema lo resetee automáticamente","Escalar a Roxana para que lo active"],"ok": 1,"exp": "Para el segundo ciclo, el expediente se cambia a \"Sin expediente\" para que la GP pueda editarlo con información actualizada. No se crea uno nuevo — se actualiza el existente."},{"id": "q5h","text": "¿Qué verifica la Experta ANTES de activar un nuevo ciclo de EDL?","opts": ["Que el pago de la membresía esté al día","Que los 7 pasos del ciclo anterior estén completamente finalizados","Que hayan pasado exactamente 12 meses","Que la GP lo haya solicitado por escrito"],"ok": 1,"exp": "Antes de activar un nuevo ciclo, se verifica que los 7 pasos del ciclo anterior estén completamente cerrados. Un ciclo incompleto no puede coexistir con uno nuevo."},{"id": "q5i","text": "Una GP que renovó membresía pregunta si sus resultados del EDL anterior siguen disponibles. ¿Qué le dices?","opts": ["Que se borran al renovar para proteger su privacidad","Que sí — el expediente y resultados se conservan y el nuevo ciclo se agrega al historial","Que solo se conservan los 6 meses más recientes","Que debe solicitarlos al equipo médico con anticipación"],"ok": 1,"exp": "La renovación no borra el expediente ni los resultados. El nuevo ciclo se agrega al historial, permitiendo al equipo médico ver la evolución de la GP a lo largo del tiempo."},{"id": "q5j","text": "¿Qué pasa con las órdenes de estudios en el segundo ciclo del EDL?","opts": ["Solo se generan si el médico las autoriza","Se generan automáticamente al guardar el expediente, o manualmente si no aparecen en 3 minutos","La GP las solicita directamente en el laboratorio","El sistema las genera con 5 días de anticipación"],"ok": 1,"exp": "El proceso es igual en todos los ciclos: las órdenes deben aparecer al guardar. Si no aparecen en 3 minutos, se generan manualmente. Sin diferencia entre primer y segundo ciclo."}],"subc_v": [{"id": "qcv1","text": "¿Cuál de los dos tipos de videoconsulta requiere haber completado el EDL previamente?","opts": ["Tipo 2 — molestias específicas","Tipo 1 — seguimiento y prevención","Ambos tipos lo requieren","Ninguno — el EDL es independiente de las videoconsultas"],"ok": 1,"exp": "El Tipo 1 (seguimiento y prevención post-EDL) requiere haber completado el Estudio de Longevidad previamente. El Tipo 2 (molestias específicas) no lo requiere, pero tampoco está disponible de forma automática."},{"id": "qcv2","text": "Una GP tiene 76 años y quiere una videoconsulta de seguimiento post-EDL. ¿Con qué especialidad la agendas?","opts": ["Medicina general — es la opción por defecto","Nutrición — para revisar sus hábitos","Geriatría — para 75 años en adelante","Cualquiera según disponibilidad del día"],"ok": 2,"exp": "Geriatría atiende a GPs de 75 años en adelante, con enfoque en envejecimiento, revisión de medicamentos, autonomía y calidad de vida. Medicina general cubre de 50 a 74 años."},{"id": "qcv3","text": "Una GP llama diciendo que tiene molestias y quiere una videoconsulta. ¿Cuál es tu primer paso?","opts": ["Agendar inmediatamente en Calendly con el médico disponible","Revisar en Sales si ya tiene seguimiento indicado en su receta","Decirle que eso no aplica para videoconsulta","Transferirla al médico de guardia sin registrar"],"ok": 1,"exp": "Siempre revisas en Sales (expediente médico) si ya tiene seguimiento indicado en su receta. Si hay indicación → agendas en Calendly. Si no → validas con el equipo médico si aplica esta modalidad."},{"id": "qcv4","text": "El sistema envía automáticamente recordatorios a la GP antes de su videoconsulta. ¿Qué debe hacer Expertxs cuando la GP ya tiene estudios listos?","opts": ["Nada — el sistema gestiona todo de forma automática sin intervención","Llamar al médico para avisarle que la GP tiene estudios listos","Subirlos al expediente (apartado de resultados) para que el médico los tenga disponibles en la consulta","Cancelar la cita y reagendar una vez que los estudios sean revisados"],"ok": 2,"exp": "El sistema envía automáticamente recordatorios 7 días y 1 día antes de la consulta. Cuando la GP confirma que tiene estudios disponibles, Expertxs los sube al expediente (apartado de resultados) para que el médico los tenga listos durante la videoconsulta."},{"id": "qcv5","text": "¿Las videoconsultas de seguimiento post-EDL tienen tope anual?","opts": ["Sí — máximo 4 al año, igual que las de especialidad","Sí — máximo 6 al año por indicación médica","No — se otorgan las necesarias según indicación médica","Solo las primeras 2 son sin costo; del 3er en adelante tienen costo"],"ok": 2,"exp": "Las videoconsultas de Tipo 1 (seguimiento y prevención) no tienen tope anual — se otorgan las necesarias según indicación médica. Son independientes de las 4 consultas de especialidad."},{"id": "qcv6","text": "¿Qué especialidad de videoconsulta requiere referencia interna para priorización?","opts": ["Medicina general","Geriatría","Nutrición","Todas requieren referencia interna antes de agendar"],"ok": 2,"exp": "Nutrición requiere referencia interna para priorización antes de agendar la videoconsulta. Medicina general y Geriatría no la requieren — se agendan con indicación médica directa."},{"id": "qcv7","text": "Una GP escribe en chat preguntando si puede suspender un medicamento. ¿Qué haces?","opts": ["Le respondes con la información general que tengas","Le dices que eso no es parte del servicio de Expertxs","Le indicas que en el transcurso del día el doctor le contestará y reasignas al médico encargado","La transfieres a Care Coordination para que lo gestionen"],"ok": 2,"exp": "Si en chat la GP pregunta algo médico, debes indicar que en el transcurso del día el doctor le contestará y reasignar al médico encargado. Si el médico no está en turno, reasignar con el coordinador Pablo Maycotte."},{"id": "qcv8","text": "¿Quién es el coordinador de consultas virtuales cuando el médico no está en turno?","opts": ["Erik (CDMX)","Paulina (Monterrey)","Pablo Maycotte","Care Coordination asume el rol automáticamente"],"ok": 2,"exp": "En consultas virtuales el coordinador es Pablo Maycotte. Cuando el médico no está en turno, se reasigna el chat con él para que dé seguimiento a la GP."},{"id": "qcv9","text": "¿Los estudios de seguimiento que solicita el médico en videoconsulta están incluidos en la membresía?","opts": ["Sí — todos los estudios de seguimiento están cubiertos","Solo si son estudios básicos de laboratorio en Chopo","No — los cubre directamente la GP","Solo si se realizan antes de los 30 días de la consulta"],"ok": 2,"exp": "Los estudios de seguimiento los cubre directamente la GP — no están incluidos en la membresía. Es importante comunicárselo con claridad para evitar falsas expectativas."},{"id": "qcv10","text": "Una GP quiere reagendar su videoconsulta de seguimiento. ¿Desde dónde puede hacerlo Expertxs?","opts": ["Solo desde el canal de Slack de médicos con autorización","Desde Sales (expediente médico) o directamente en Calendly","Debe llamar a la clínica directamente para reagendar","Solo el médico puede modificar su propia agenda"],"ok": 1,"exp": "Expertxs puede ejecutar el reagendamiento desde Sales (apartado de expedientes médicos) o directamente en Calendly, según lo que sea más práctico en ese momento."}],"subc_e": [{"id": "qce1","text": "¿Cuántas consultas de especialidad incluye la membresía Koltin al año?","opts": ["2 por especialidad (10 en total entre las 5)","4 en total, compartidas entre todas las especialidades","6, dos por especialidad principal","Sin límite — las necesarias según indicación"],"ok": 1,"exp": "La membresía incluye 4 consultas de especialidad al año, compartidas entre TODAS las especialidades (ortopedia, cardiología, urología, reumatología y rehabilitación). No son 4 por especialidad sino 4 en total."},{"id": "qce2","text": "Una GP usó 3 consultas de ortopedia y 1 de cardiología. Ahora necesita reumatología. ¿Qué aplica?","opts": ["Puede tener la consulta gratis porque es una especialidad diferente","Ya no tiene consultas incluidas — la 5ª cuesta $1,200 MXN","Puede usar 1 más porque reumatología es especialidad nueva","Solo puede con autorización de Ops Control"],"ok": 1,"exp": "Las 4 consultas son compartidas entre TODAS las especialidades. Si ya usó 4 (3 ortopedia + 1 cardiología), la siguiente —sin importar la especialidad— cuesta $1,200 MXN."},{"id": "qce3","text": "¿Cómo se agenda siempre la primera vez con un especialista Koltin?","opts": ["Directamente con el calendario individual del médico para garantizar continuidad","Con el link de pool — nunca con el calendario individual del médico","Por teléfono a la recepción de la clínica","La GP elige al médico y lo contacta directamente"],"ok": 1,"exp": "La primera vez SIEMPRE se agenda con el link de pool — nunca con el calendario individual del médico. El seguimiento sí se hace con el mismo médico de la primera consulta usando su calendario individual."},{"id": "qce4","text": "Una GP cancela su cita de ortopedia 30 horas antes. ¿Se cuenta como consulta utilizada?","opts": ["Sí — una vez agendada ya se contabiliza aunque se cancele","No — las cancelaciones con al menos 24h de anticipación no se cuentan","Depende de si ya había cancelado antes en el mismo ciclo","Solo si avisa por WhatsApp, no por llamada"],"ok": 1,"exp": "Las cancelaciones con al menos 24 horas de anticipación NO se contabilizan como consulta utilizada. Las inasistencias SÍ se cuentan (excepto urgencias)."},{"id": "qce5","text": "¿Cuánto dura una primera consulta de urología?","opts": ["1 hora — igual que las demás especialidades","45 minutos","30 minutos — es la excepción entre las especialidades","2 horas por incluir cuestionario y estudios previos"],"ok": 2,"exp": "La primera consulta de urología dura 30 minutos, a diferencia de las otras especialidades donde la primera vez es 1 hora. Las consultas de seguimiento son 30 minutos para todas las especialidades."},{"id": "qce6","text": "¿Qué días atiende el Dr. Carlos Cabrera (cardiología) en Santa Fe?","opts": ["Lunes y miércoles 9:00–13:00","Martes, jueves y viernes 14:00–18:00","Lunes, miércoles y viernes 10:00–14:00","Solo jueves 14:00–18:00"],"ok": 1,"exp": "El Dr. Carlos Cabrera atiende cardiología en Santa Fe los martes, jueves y viernes de 14:00 a 18:00. Las citas se agendan por Calendly con el link de pool para primera vez."},{"id": "qce7","text": "Una GP tuvo su primera consulta de ortopedia con el Dr. Erik Piñón. ¿Cómo agendas su seguimiento?","opts": ["Con el link de pool de ortopedia, igual que la primera vez","Con el calendario individual del Dr. Erik Piñón — siempre el mismo médico","Con cualquier ortopedista disponible ese día","A través del área médica de Koltin para que ellos asignen"],"ok": 1,"exp": "El seguimiento siempre es con el mismo médico de la primera consulta — en este caso el Dr. Erik Piñón. Se agenda con su calendario individual, no con el pool."},{"id": "qce8","text": "¿Qué requisito es obligatorio para agendar una consulta de especialidad?","opts": ["Tener el EDL completado — sin él no se puede agendar bajo ningún criterio","Historia clínica completa y actualizada en el Portal de Clientes Koltin","Haber tenido al menos 2 videoconsultas de seguimiento previas","Tener una orden médica de un médico externo a Koltin"],"ok": 1,"exp": "La historia clínica completa y actualizada en el portal es obligatoria. El EDL es ideal pero si hay prioridad médica puede valorarse sin él. La derivación puede venir del médico Koltin o ser solicitud directa a Expertxs."},{"id": "qce9","text": "¿Cuánto cuesta la 5ª consulta de especialidad?","opts": ["$500 MXN","$800 MXN","$1,200 MXN","$1,500 MXN"],"ok": 2,"exp": "A partir de la 5ª consulta de especialidad el costo es de $1,200 MXN por consulta. Las 4 primeras están incluidas en la membresía, compartidas entre todas las especialidades."},{"id": "qce10","text": "¿Qué médico atiende reumatología en Monterrey?","opts": ["Dr. José Antonio Dávila — jueves 14:00–18:00","Dr. Arnold Hernández — lunes y miércoles 9:00–13:00","Dra. Viridiana del Río — miércoles con horario variable","Dr. Javier Alonso López — lunes y jueves 14:00–18:00"],"ok": 0,"exp": "El Dr. José Antonio Dávila atiende reumatología en Monterrey los jueves de 14:00 a 18:00. La Dra. Viridiana del Río atiende reumatología en Santa Fe (CDMX), no en Monterrey."}],"subc_r": [{"id": "qcr1","text": "¿Puede Expertxs agendar fisioterapia directamente para una GP que ya tiene indicación médica?","opts": ["Sí — si ya tiene indicación del médico es suficiente","Sí — si ya pasó por ortopedia eso equivale a la valoración","No — siempre debe pasar primero por valoración de rehabilitación","Solo en Monterrey donde no hay rehabilitación"],"ok": 2,"exp": "La regla fundamental es que nadie agenda fisioterapia directamente. Siempre debe pasar antes por una valoración de rehabilitación, aunque ya haya pasado por ortopedia y aunque tenga indicación médica."},{"id": "qcr2","text": "¿Quién determina el número de sesiones de fisioterapia en Monterrey?","opts": ["La Dra. Paulina Chacón en la valoración de rehabilitación","El área de Membership tras revisar el expediente","El Dr. Elías Godoy (Ortopedia) — en Monterrey no hay rehabilitación","La GP elige según sus necesidades y disponibilidad de horario"],"ok": 2,"exp": "En Monterrey no hay rehabilitación. La GP pasa primero por Ortopedia con el Dr. Elías Godoy, quien determina el número de sesiones y la frecuencia de fisioterapia."},{"id": "qcr3","text": "¿Cuánto dura cada sesión de fisioterapia en Koltin?","opts": ["30 minutos","45 minutos","50 minutos (llegar 10 minutos antes para signos vitales)","1 hora completa"],"ok": 2,"exp": "Cada sesión dura 50 minutos. La GP debe llegar 10 minutos antes para la toma de signos vitales, además de llevar ropa cómoda deportiva y su propia toalla."},{"id": "qcr4","text": "Una GP ya tuvo consulta con el Dr. Rodrigo Balcázar (ortopedia). Ahora necesita fisioterapia. ¿Qué haces?","opts": ["La agendas directo con un fisioterapeuta — ya tiene indicación de ortopedia","La agendas con la Dra. Paulina Chacón o Dra. Fernanda López usando el link de pool de primera vez","Le dices que el Dr. Balcázar debe referirla internamente antes de que actúes","La transfieres a Care Coordination para que gestionen el proceso"],"ok": 1,"exp": "Aunque ya pasó por ortopedia, para fisioterapia SIEMPRE necesita valoración de rehabilitación primero. Se agenda con la Dra. Paulina Chacón o Dra. Fernanda López usando el link de pool de primera vez — no sus links directos."},{"id": "qcr5","text": "¿Cuántas sesiones de fisioterapia incluye la membresía al año?","opts": ["5 sesiones","8 sesiones","10 sesiones","Ilimitadas según indicación médica"],"ok": 2,"exp": "La membresía incluye 10 sesiones de fisioterapia al año. A partir de la sesión 11 el costo es de $1,000 MXN por sesión. No son acumulables ni transferibles."},{"id": "qcr6","text": "¿A qué cuestionario aplica el ICIQ-SF?","opts": ["Hiperplasia prostática en hombres mayores de 50","Incontinencia urinaria en hombres y mujeres","Dolor musculoesquelético antes de ortopedia","Riesgo cardiovascular antes de cardiología"],"ok": 1,"exp": "El ICIQ-SF aplica para incontinencia urinaria, tanto en hombres como en mujeres. El IPSS aplica para hiperplasia prostática benigna en hombres mayores de 50."},{"id": "qcr7","text": "¿Qué estudios se requieren para un hombre antes de una consulta de urología?","opts": ["Solo antígeno prostático libre y EGO","ECG + laboratorios con lípidos + RX tórax","Ultrasonido de vías urinarias y próstata + orina residual + antígeno prostático libre + EGO","Solo ultrasonido de vías urinarias — igual que para mujeres"],"ok": 2,"exp": "Para hombres se requieren: ultrasonido de vías urinarias y próstata + medición de orina residual + antígeno prostático libre + EGO. Para mujeres solo se requiere ultrasonido de vías urinarias."},{"id": "qcr8","text": "¿Cuándo se envía el cuestionario IPSS antes de una consulta de urología?","opts": ["A todos los hombres que van a urología sin excepción","Solo si hay hiperplasia prostática benigna (antígeno elevado) o incontinencia urinaria","Solo si es referido por el equipo de salud de Koltin","Solo cuando el médico especialista lo solicita explícitamente"],"ok": 1,"exp": "El cuestionario IPSS solo se envía si hay hiperplasia prostática benigna (antígeno elevado) o incontinencia urinaria. Si el paciente es referido por el equipo de salud, los médicos aplican el cuestionario directamente."},{"id": "qcr9","text": "¿Qué canal valida si el dolor de una GP corresponde a ortopedia, rehabilitación o reumatología?","opts": ["El médico de guardia en turno lo decide","Care Coordination revisa el caso","Membership (@reportes-interior) valida con los médicos","Expertxs lo decide según el resultado del cuestionario"],"ok": 2,"exp": "Una vez que Expertxs aplica el cuestionario de dolor, se manda al canal de Membership (@reportes-interior) para que los médicos determinen la especialidad correcta: ortopedia, rehabilitación o reumatología."},{"id": "qcr10","text": "¿Con qué link se agenda la valoración de rehabilitación por primera vez en Santa Fe?","opts": ["Con el link del calendario individual de la Dra. Paulina Chacón","Con el link del calendario individual de la Dra. Fernanda López","Con el link de pool de primera vez de rehabilitación","Con el link de pool de ortopedia — son el mismo proceso"],"ok": 2,"exp": "La valoración de rehabilitación en Santa Fe se agenda con el link de pool de primera vez. Los links directos de la Dra. Paulina Chacón y la Dra. Fernanda López son de seguimiento — usarlos para primera vez es un error."}],"subc_s": [{"id": "qcs1","text": "¿Es opcional la segunda opinión antes de que Ops Control continúe con la revisión de un siniestro?","opts": ["Es opcional si el caso es urgente y no hay tiempo","Solo es obligatoria en casos de cirugía mayor planificada","Es obligatoria — sin ella la programación no puede continuar","Es obligatoria solo en CDMX, opcional en Monterrey"],"ok": 2,"exp": "La segunda opinión es un paso OBLIGATORIO antes de que Ops Control continúe con la revisión de un siniestro. Sin ella, la programación no puede continuar, independientemente de la urgencia del caso."},{"id": "qcs2","text": "¿En cuántos días hábiles debe agendarse la segunda opinión desde que se reciben el informe y los estudios?","opts": ["1 día hábil máximo","2 días hábiles máximo","5 días hábiles máximo","A la brevedad sin plazo fijo definido"],"ok": 1,"exp": "Care Coordination tiene un máximo de 2 días hábiles para contactar al asegurado y agendar la segunda opinión desde que se reciben el informe médico y los estudios completos."},{"id": "qcs3","text": "¿Qué especialidades requieren segunda opinión en la sede de Monterrey (Nuevo León)?","opts": ["Cardiología, urología y MSK — igual que CDMX","Cardiología y MSK solamente","Urología y MSK (músculo-esquelético)","Solo cardiología en Monterrey"],"ok": 2,"exp": "En Nuevo León (Monterrey) la segunda opinión es obligatoria para urología y MSK. En CDMX (Santa Fe) aplica para cardiología, urología y MSK. Aplica tanto para asegurados de BBVA como de GNP."},{"id": "qcs4","text": "¿Cómo se sube una radiografía al expediente de la GP?","opts": ["Se sube el archivo DICOM original del estudio","Se editan los datos, se toma captura de pantalla y se guarda como PDF","Se fotografía con el celular con buena iluminación y se sube como l médico indica agendar en la próxima semana","Cuando hay una cancelación de último momento disponible"],"ok": 1,"exp": "La cita abierta se agenda en el momento en que se contacta al paciente — no tiene plazo de anticipación mínimo. Contrasta con el EDL (5 días mínimo) y la segunda opinión por siniestro (máximo 2 días hábiles)."},{"id": "qcs9","text": "¿Qué consecuencia tiene no poner la etiqueta de salud correcta en el expediente de una GP?","opts": ["La GP no puede agendar sus estudios en Chopo","La GP no recibe la notificación automática para agendar su entrega de resultados del EDL","El sistema bloquea automáticamente su acceso a consultas de especialidad","Care Coordination no puede registrar el aviso de siniestro"],"ok": 1,"exp": "Sin la etiqueta de salud correcta en el expediente, la GP no recibe la notificación automática para agendar su entrega de resultados del EDL. Es una de las reglas críticas para no cometer errores operativos."},{"id": "qcs10","text": "¿Desde cuándo dejó de operar EDL en Roma Norte y a dónde se redirige?","opts": ["Desde enero 2026, se redirige a Monterrey","Desde agosto 2026, se redirige a Santa Fe","Desde octubre 2026, se redirige al formato virtual foráneos","Roma Norte sigue operando — no hubo ningún cambio"],"ok": 1,"exp": "Desde agosto 2026 Roma Norte ya no opera EDL. Todas las GPs de CDMX que antes iban a Roma Norte deben redirigirse a Santa Fe para sus estudios y consultas presenciales."}],"subc5a": [{"id": "q5a1","text": "¿Cuál es el requisito previo para las videoconsultas Tipo 1?","opts": ["Tener al menos 1 año de membresía","Haber completado el EDL","Haber tenido una consulta previa","No tienen requisito"],"ok": 1,"exp": "Las videoconsultas Tipo 1 (seguimiento y prevención) requieren haber completado el Estudio de Longevidad previamente."},{"id": "q5a2","text": "¿Cuántas videoconsultas de seguimiento puede tener una GP al año?","opts": ["6 al año","12 al año","Sin tope — según indicación médica","Solo 4"],"ok": 2,"exp": "No link de seguimiento","Con cualquier médico disponible"],"ok": 1,"exp": "Primera vez SIEMPRE con link de pool, nunca con el calendario individual. Duración: 1 hora."},{"id": "q5b2","text": "¿Cuántas consultas de especialidad incluye la membresía al año?","opts": ["2 por especialidad","4 en total compartidas","6 al año por especialidad","Sin límite"],"ok": 1,"exp": "4 consultas en total, compartidas entre todas las especialidades. A partir de la 5.ª: $1,200 MXN."},{"id": "q5b3","text": "¿Cuánto cuesta la segunda opinión médica?","opts": ["$1,200 MXN","$800 MXN","Sin costo adicional","Depende de la especialidad"],"ok": 2,"exp": "La segunda opinión es independiente de las 4 consultas e incluida en la membresía sin costo adicional."},{"id": "q5b4","text": "Seguimiento de urología con el Dr. Castrejón. ¿Cuánto dura?","opts": ["1 hora","30 minutos","45 minutos","20 minutos"],"ok": 1,"exp": "El seguimiento dura 30 minutos y siempre con el mismo médico de la primera consulta."},{"id": "q5b5","text": "La GP cancela su consulta de especialidad 12 horas antes. ¿Se descuenta?","opts": ["No — solo inasistencias cuentan","Sí se descuenta","Se cobra $500 MXN","Se recupera si reprograma"],"ok": 1,"exp": "Las inasistencias SÍ se cuentan. Solo cancelaciones con al menos 24h de anticipación no se contabilizan."},{"id": "q5b6","text": "GP de Monterrey necesita segunda opinión de cardiología. ¿Dónde?","opts": ["En Monterrey con Dr. Arnold Hernández","En CDMX (Santa Fe) — solo ahí hay cardiología","En cualquier sede","No aplica"],"ok": 1,"exp": "Segunda opinión de cardiología solo en CDMX (Santa Fe). Monterrey solo cubre urología y MSK para segunda opinión."},{"id": "q5b7","text": "Plazo máximo para agendar segunda opinión desde que llegan informe y estudios.","opts": ["5 días hábiles","3 días hábiles","2 días hábiles","1 día hábil"],"ok": 2,"exp": "Care Coordination agenda la segunda opinión en máximo 2 días hábiles desde que se reciben el informe médico y los estudios."},{"id": "q5b8","  "q5d1","text": "¿Cómo procesa Expertxs unas radiografías recibidas?","opts": ["Sube el archivo original","Convierte con escáner","Edita datos, toma captura y guarda como PDF","Imprime y digitaliza"],"ok": 2,"exp": "Radiografías: editar datos, captura de pantalla y guardar como PDF. Resonancias: copiar el reporte."},{"id": "q5d2","text": "¿Con cuántos días de anticipación mínima se agenda un EDL?","opts": ["2 días hábiles","3 días hábiles","5 días","1 semana exacta"],"ok": 2,"exp": "El EDL se agenda con mínimo 5 días de anticipación contra un pool de médicos."},{"id": "q5d3","text": "Nota de referencia para segunda consulta de cardiología. ¿Qué debe especificar?","opts": ["Solo el diagnóstico","Tipo de consulta y que es segunda opinión (no primera vez)","Solo el motivo","Número de consultas previas"],"ok": 1,"exp": "Para segunda opinión DEBE especificarse que no es primera vez, para que el médico revise los estudios de la valoración previa. Incluir historia clínica y estudios cargados al expediente."},{"id": "q5d4","text": "¿Dónde realiza el EDL una GP de Roma Norte, CDMX?","opts": ["En Roma Norte","En Santa Fe","En casa, virtual","En Monterrey si no hay disponibilidad"],"ok": 1,"exp": "Roma Norte dejó de operar EDL desde agosto 2026. Toda GP de CDMX debe ir a Santa Fe para EDL presencial."},{"id": "q5d5","text": "La GP no recibió notificación para agendar entrega de resultados del EDL. ¿Causa probable?","opts": ["Error del sistema","No tiene smartphone","No tiene la etiqueta de salud correcta en su expediente","El médico no subió resultados"],"ok": 2,"exp": "Sin la etiqueta de salud correcta, la GP no recibe la notificación automática. Verificar y corregir la etiqueta soluciona el problema."},{"id": "q5d6","text": "Indicación médica de seguimiento en 3 meses. ¿Cuándo agendas?","opts": ["Inmediatamente","Respetando el plazo exacto del médico","Con 5 días de anticipación al plazo","Cuando la GP contacte"],"ok": 1,"exp": "Con indicación médica con plazo, se respeta el subco1:{type:'truefalse',pass:3,items:[
  {txt:'La fecha de pago se puede cambiar durante la vigencia del contrato si el cliente lo solicita.',ans:false,fb:'Las fechas de pago son inamovibles durante la vigencia del contrato. Solo pueden modificarse durante el proceso de renovación.'},
  {txt:'Koltin acepta pagos con más de un método de pago para una misma cuota.',ans:false,fb:'Está prohibido usar múltiples métodos de pago para una misma cuota. Tampoco se pueden pagar varias membresías en una sola cuenta o liga de pago.'},
  {txt:'El periodo de gracia para pagos atrasados en Koltin es de 3 días naturales.',ans:true,fb:'Correcto. Se otorgan 3 días naturales después del vencimiento para aceptar pagos atrasados. Fuera de ese plazo no se procesan.'},
  {txt:'Un Expertx puede autorizar y comprometer prórrogas de pago — el área de Cobranzas solo interviene en casos difíciles.',ans:false,fb:'Incorrecto. Las prórrogas SOLO las puede autorizar el área de Cobranzas, sin excepción. Ningún Expertx puede comprometerse por cuenta propia, aunque el cliente tenga una buena razón o buen historial.'},
  {txt:'La domiciliación es el único método de pago automatizado que ofrece Koltin.',ans:true,fb:'Correcto. La domiciliación es el único método 100% automatizado — cargo recurrente sin intervención del cliente. El link de pago Toku y la transferencia STP requieren acción del cliente.'}
]},
subco2:{type:'scenario',pass:3,scenarios:[
  {txt:'Un cliente pide una factura con CFDI tipo D07 porque su membresía incluye seguro. ¿Qué le dices?',
   opts:['Que sí aplica D07 porque la membresía incluye el seguro GNP','Que Koltin NO es aseguradora — el CFDI D07 de seguros no aplica. El concepto correcto es "Servicios preventivos de salud y gestión de seguro médico", deducible como gastos personales','Que debe pedirle la factura directamente a GNP','Que escala el caso a Cobranzas para que ellos lo resuelvan'],
   ok:1,fb:'CFDI D07 (seguros) NO aplica para Koltin. Koltin no es aseguradora. El concepto fiscal correcto es "Servicios preventivos de salud y gestión de seguro médico", clasificado como honorarios médicos/gastos en general, deducible como gastos personales.'},
  {txt:'Un cliente contrató en febrero 2025 y pide su factura. ¿Dónde la encuentras?',
   opts:['En el nuevo sistema de Sales, sección facturas','En Facturama — solicita su RFC para rastrearla','En Airtable — el cliente la llena ahí','En el portal clientes.koltin.mx'],
   ok:1,fb:'Las facturas de contratos anteriores a abril 2025 se encuentran en Facturama. Solicita el RFC del cliente para poder rastrearla. A partir de abril 2025 están en el nuevo sistema.'},
  {txt:'Un cliente pide que le mandes la factura hoy porque la necesita urgente para un reporte. ¿Qué haces?',
   opts:['Le mandas la factura aunque no sea día 15, 30 o 31 — la urgencia justifica la excepción','Le explicas que las facturas se emiten los días 15, 30 o 31 del mes y no puedes comprometer el envío inmediato','Escala a Cobranzas para que ellos decidan','Le dices que no hay facturas disponibles en Koltin'],
   ok:1,fb:'No se promete el envío inmediato de facturas. Las facturas se emiten en días específicos: 15, 30 o 31 del mes, y solo dentro del mismo mes de contratación o renovación. Nunca prometer facturas anticipadas.'},
  {txt:'Un cliente semestral pregunta cuántos complementos de pago tendrá su factura (a partir de abril 2025).',
   opts:['1 complemento — solo la factura principal','2 complementos — uno por cada semestre','4 complementos — uno por trimestre','12 complementos — uno mensual'],
   ok:1,fb:'A partir de abril 2025, los complementos de pago corresponden a la frecuencia de pago: anual=1, semestral=2, trimestral=4, mensual=12. La factura sale con el monto anual y cada complemento especifica el abono.'},
  {txt:'Un cliente que contrató en octubre 2026 dice que no le llegó su factura. Al buscar en el sistema no aparece. ¿Qué haces?',
   opts:['Le dices que espere — las facturas tardan hasta 30 días','Le explicas que probablemente no solicitó facturación y le envías el link de Airtable para llenar sus datos antes de que termine el mes','Le dices que llame a Cobranzas','Buscas en Facturama con su RFC'],
   ok:1,fb:'Si no aparece su factura es porque el cliente no solicitó facturación. Se le envía el link de Airtable para que llene sus datos (airtable.com/Koltin-Factura) antes de que termine el mes — así le llegará a su correo.'}
]},
subco3:{type:'truefalse',pass:3,items:[
  {txt:'Un Expertx puede enviar el link de domiciliación sin autorización cuando la tarjeta del cliente fue robada.',ans:true,fb:'Correcto. Hay 3 casos en que no se necesita autorización previa de Cobranzas: robo de tarjeta, tarjeta vencida, o que la GP no tenga tarjeta domiciliada.'},
  {txt:'Para etiquetar un pago vía BBVA en el canal, solo necesitas el comprobante de pago.',ans:false,fb:'Debes incluir tres cosas: nombre completo del cliente, número de certificado Y comprobante de pago. Además etiquetar a @Pahoran y @cobranza en el canal "Facturas y pagos clientes".'},
  {txt:'Si una GP tiene pagos pendientes y NO está en proceso de renovación, se deriva a Cobranzas.',ans:true,fb:'Correcto. Todo lo que no esté en proceso de renovación y tenga pagos pendientes, acuerdos de pago, pagos duplicados o liquidaciones anticipadas va a Cobranzas. Lo que está en renovación va a Renovaciones.'},
  {txt:'Puedes prometer una prórroga a un cliente si ya pasó los 3 días de gracia y tiene buena historia de pagos.',ans:false,fb:'Nunca. Las prórrogas SOLO las autoriza el área de Cobranzas. Sin importar el historial del cliente, un Expertx no puede prometer ninguna prórroga. Se informa que el caso está en revisión y se espera la validación.'},
  {txt:'Para agregar el portal de domiciliación a un link de cuota, debes agregar "&portal=1" al final de la URL.',ans:true,fb:'Correcto. El proceso es: seleccionar la cuota en Sales → se abre pestaña → copiar URL → agregar &portal=1 al final → compartir el enlace completo.'}
]},
subc1:{type:'truefalse',pass:3,items:[
  {txt:'Las clases virtuales de Koltin solo están disponibles para GPs que viven en CDMX.',ans:false,fb:'Las clases virtuales son accesibles para cualquier miembro de Koltin en toda la república, sin importar en qué parte de México se encuentren.'},
  {txt:'La Comunidad Koltin ayuda a combatir el aislamiento y la soledad en adultos mayores.',ans:true,fb:'Correcto. El aislamiento y la soledad tienen efectos devastadores en la salud. La Comunidad crea un espacio donde las GPs se sienten valoradas, activas y conectadas.'},
  {txt:'Las reinscripciones a clases de Comunidad se hacen mensualmente.',ans:false,fb:'Las reinscripciones son cada 3 meses, durante la primera semana del mes correspondiente. Se avisa con una semana de anticipación.'},
  {txt:'El Tai Chi pertenece al dominio de "Movimiento y funcionalidad".',ans:true,fb:'Correcto. El dominio de Movimiento y funcionalidad incluye Tai Chi, Yoga, Funcional y Qi Gong — actividades que mejoran fuerza, equilibrio y movilidad.'},
  {txt:'Cualquier persona mayor de 60 años puede asistir a las clases de Comunidad.',ans:false,fb:'La edad mínima para asistir a las clases de Comunidad es 50 años — no 60. Koltin atiende a adultos mayores a partir de los 50.'}
]},
subc2:{type:'scenario',pass:3,scenarios:[
  {txt:'Una GP quiere inscribirse a 3 clases de Yoga. ¿Qué le explicas?',
   opts:['Que puede inscribirse a todas las que quiera','Que el criterio de modulación permite máximo 2 clases del mismo dominio — se recomienda combinar con clases de otros dominios','Que primero debe completar los 5 pasos de primera vez antes de inscribirse a cualquier clase','Que solo puede tomar 1 clase por semana'],
   ok:1,fb:'El criterio de modulación permite 1-2 clases por dominio. 3 clases de Yoga (todas del mismo dominio) no cumple la modulación. Se le orienta a combinar con clases de mente activa o conexión social.'},
  {txt:'Una GP quiere saber si hay lugar en Historia de Arte. ¿Dónde lo verificas?',
   opts:['En el calendario de Google del equipo','En LANA — plataforma operativa de gestión de Comunidad','En LUMA — el calendario público de eventos','Le preguntas directamente al equipo de Comunidad'],
   ok:1,fb:'La disponibilidad de clases en Casa Koltin se consulta en LANA, la plataforma operativa interna. LUMA es el calendario público que las GPs también pueden ver.'},
  {txt:'Una clase está llena y una GP quiere un lugar. ¿Qué haces?',
   opts:['Le dices que espere a la siguiente reinscripción en 3 meses','La registras en lista de espera en LANA con su certificado y nombre — Comunidad la contacta cuando se libere un lugar','Le buscas otra clase del mismo dominio con disponibilidad','Le das el enlace de la clase virtual como alternativa inmediata'],
   ok:1,fb:'Cuando una clase está llena, se registra a la GP en lista de espera en LANA (certificado + nombre). El equipo de Comunidad la contacta en cuanto se libere un lugar — no hay que esperar hasta la reinscripción.'},
  {txt:'Es la primera vez que una GP se une a Comunidad. ¿Qué documentos debe firmar?',
   opts:['Solo el Reglamento de Casa Koltin','Reglamento, Declaración de Salud y Deslinde de Responsabilidades','Solo la Declaración de Salud para actividades físicas','No hay documentos — solo necesita confirmar su membresía activa'],
   ok:1,fb:'En su primera visita presencial, la GP firma: Reglamento de Casa Koltin, Carta de Deslinde de Responsabilidades y Declaración de Salud. Además completa el Cuestionario de Autopercepción y puede tomar la sesión de Onboarding.'},
  {txt:'Una GP llama para inscribirse a una clase virtual de Yoga. ¿Cómo accede?',
   opts:['Desde la app de Koltin, sección Comunidad','Por YouTube Live o Facebook Live — no requiere inscripción previa','Debe inscribirse presencialmente en Casa Koltin primero','Enviando un correo al equipo de Comunidad para que le manden el enlace'],
   ok:1,fb:'Las clases de Yoga y Funcional son por transmisión en vivo en YouTube y Facebook de Koltin. No requieren inscripción previa — cualquier miembro activo puede acceder desde cualquier parte de la república.'}
]},
subc3:{type:'truefalse',pass:3,items:[
  {txt:'La Expertx puede confirmar cambios de horario de clases si los conoce de antemano.',ans:false,fb:'Solo el equipo de Comunidad confirma cambios o reprogramaciones de clases. Para evitar confusiones, la Expertx no debe confirmar modificaciones aunque las conozca.'},
  {txt:'Las quejas sobre profesores o clases se escalan al equipo de Comunidad, no a la Expertx.',ans:true,fb:'Correcto. Las quejas sobre clases o profesores las resuelve el equipo de Comunidad. La Expertx las recibe con empatía y genera el ticket/escalación correspondiente.'},
  {txt:'Si una GP pregunta sobre el Programa de Salud Muscular, la Expertx puede resolverlo.',ans:false,fb:'Las dudas sobre el Programa de Salud Muscular se reasignan al equipo de Gero — no las resuelve la Expertx ni el equipo de Comunidad.'},
  {txt:'Un acompañante de una GP puede asistir a las clases si paga una cuota de visitante.',ans:false,fb:'Los acompañantes pueden asistir SOLO si es indispensable para la movilidad de la GP. Si no son miembros de Koltin, deben esperar en el área de encuentro. No hay cuota de visitante.'},
  {txt:'La Expertx puede dar el enlace de una clase virtual a una GP aunque aparezca llena en LUMA.',ans:true,fb:'Correcto. Si una clase virtual aparece llena en LUMA, la Expertx puede enviar el enlace directo de la clase para que la GP pueda acceder de todas formas.'}
]},
subs1:{type:'truefalse',pass:3,items:[
  {txt:'El SGMM de Koltin puede contratarse para personas de 85 años o más.',ans:false,fb:'El seguro cubre hasta los 84 años y 11 meses — a partir de los 85 años ya no es posible contratar ni renovar.'},
  {txt:'La cobertura en el extranjero del SGMM funciona mediante pago directo en hospitales aliados de GNP.',ans:false,fb:'En el extranjero GNP no tiene convenios hospitalarios. El pago es mediante reembolso: la GP paga en el momento y después solicita el reembolso.'},
  {txt:'El plazo para reportar una emergencia médica en el extranjero es de 5 días posteriores al evento.',ans:true,fb:'Correcto. El asegurado debe llenar el "Aviso de accidente o enfermedad" dentro de los 5 días posteriores al evento. No cumplirlo puede afectar el reembolso.'},
  {txt:'Una urgencia médica termina cuando el asegurado decide que ya se siente bien.',ans:false,fb:'Según GNP, la urgencia médica termina cuando el médico TRATANTE considera que la situación crítica ha concluido — no es decisión del asegurado.'},
  {txt:'El SGMM forma parte de una póliza grupal, lo que permite ofrecer precios más accesibles.',ans:true,fb:'Correcto. La póliza grupal distribuye el riesgo entre todos los asegurados, permitiendo precios más competitivos que las pólizas individuales.'}
]},
subs2:{type:'scenario',pass:3,scenarios:[
  {txt:'Una GP llama molesta: "me operé la nariz para verme mejor y el seguro no me quiere cubrir". ¿Qué le explicas?',
   opts:['Que tiene razón y vas a escalar el caso a GNP para que lo revisen','Que las cirugías estéticas son una exclusión general del SGMM — el seguro no cubre procedimientos con fines estéticos','Que el seguro sí cubre pero necesita presentar más documentación médica','Que el problema es del hospital, no del seguro'],
   ok:1,fb:'Las cirugías estéticas son una exclusión general. Es importante explicarlo con empatía pero con claridad, sin generar falsas esperanzas.'},
  {txt:'Una GP tiene 2 meses de membresía y necesita operarse de la vesícula. ¿Le dices que el seguro la cubre?',
   opts:['Sí — desde el día 1 están cubiertas las cirugías','No — las enfermedades de vesícula tienen tiempo de espera de 6 meses','Sí — pero aplica un deducible mayor por ser cirugía reciente','No — las vesículas son una exclusión general del seguro'],
   ok:1,fb:'Las enfermedades de la vesícula biliar tienen un tiempo de espera de 6 meses. Con 2 meses de membresía, aún no está cubierta. Hay que orientar a la GP sobre cuándo podrá acceder al beneficio.'},
  {txt:'Una GP tuvo un accidente en su casa y fue hospitalizada. ¿Aplica deducible?',
   opts:['Sí — aplica el deducible de $30,000 como en cualquier evento','No — los accidentes amparados están exentos de deducible y coaseguro','Solo aplica el coaseguro, no el deducible','Depende del tipo de accidente y el hospital'],
   ok:1,fb:'Los gastos derivados de accidentes amparados están exentos de deducible y coaseguro. Es una ventaja clave que vale la pena comunicar proactivamente a las GPs.'},
  {txt:'Una GP pregunta cuándo puede usar el seguro para sus várices. Contrató hace 8 meses. ¿Qué le dices?',
   opts:['Que ya puede — con 8 meses de membresía está cubierta','Que las várices no tienen cobertura en el seguro de Koltin','Que necesita esperar 1 año desde la contratación para que las várices tengan cobertura','Que puede usarlo de inmediato si es una urgencia'],
   ok:2,fb:'Las afecciones de várices tienen tiempo de espera de 1 año. Con 8 meses, aún le faltan 4 meses para acceder a esa cobertura.'},
  {txt:'Una GP te pregunta cuánto pagará GNP por su operación de cadera. ¿Qué haces?',
   opts:['Consultas el tabulador de honorarios de GNP y le das la cifra exacta','Le explicas que Koltin no tiene acceso al tabulador de honorarios de GNP y la orientas a contactarlos directamente','Le das un estimado basado en casos similares que has manejado','Le dices que GNP cubre el 100% menos el deducible y coaseguro'],
   ok:1,fb:'Koltin no tiene acceso al tabulador de honorarios médicos de GNP. Nunca debes inventar cifras — orienta a la GP a contactar directamente a GNP para obtener esa información.'}
]},
subs3:{type:'hangman',words:['DEDUCIBLE','COASEGURO','ENDOSO','PREEXISTENCIA','REEMBOLSO','AMPARADA']},
subm1:{type:'truefalse',pass:3,items:[
  {txt:'El Estudio de Longevidad es opcional — la GP puede iniciar consultas sin haberlo realizado.',ans:false,fb:'El EDL es el primer paso obligatorio. Sin él no se pueden iniciar las consultas de seguimiento. Es la base de todo el acompañamiento.'},
  {txt:'Si una GP hace sus estudios del EDL dentro de los primeros 30 días, el aumento en su primera renovación será de máximo 15%.',ans:true,fb:'Correcto. La regla de los 30 días es clave: hacerlos en tiempo protege a la GP de incrementos basados en condiciones de mercado.'},
  {txt:'Las consultas de seguimiento con el Equipo de Salud requieren un costo adicional a la membresía.',ans:false,fb:'Las consultas de seguimiento están incluidas en la membresía. Son videollamadas sin costo adicional.'},
  {txt:'Durante una consulta virtual, el médico puede emitir recetas digitales válidas en cualquier farmacia.',ans:true,fb:'Correcto. El médico puede emitir órdenes de estudios, recetas digitales válidas en cualquier farmacia, y referencias a especialistas.'},
  {txt:'Una GP puede pedir que la trasladen a un hospital de su preferencia aunque no esté en la red hospitalaria.',ans:false,fb:'El traslado es al hospital más cercano dentro de la red hospitalaria. No se puede elegir un hospital fuera de la red.'}
]},
subm2:{type:'scenario',pass:3,scenarios:[
  {txt:'Una GP pregunta: "¿En qué se diferencia Koltin de un seguro médico normal?" ¿Cómo se lo explicas?',
   opts:['Que Koltin es más barato porque tiene menos cobertura que los seguros tradicionales','Que Koltin es igual a un seguro pero con mejor servicio al cliente','Que Koltin los conoce (EDL), los acompaña (consultas), los protege (seguro) y los conecta (comunidad) — no solo actúa cuando se enferman','Que Koltin es un seguro especializado solo para adultos mayores con enfermedades crónicas'],
   ok:2,fb:'La diferencia clave es que Koltin es proactivo: actúa ANTES de que la GP se enferme. Prevención + seguro + comunidad = ecosistema de salud integral, no solo una póliza.'},
  {txt:'Una GP dice "nunca escuché de GNP, ¿es confiable?" ¿Qué le dices?',
   opts:['Que GNP es relativamente nueva en el mercado pero está creciendo rápido','Que GNP es una de las aseguradoras más importantes de México y el socio de Koltin para el Seguro de Gastos Médicos Mayores','Que GNP es solo un intermediario — quien realmente asegura es Koltin','Que no puede darte información sobre GNP y debe consultar directamente con ellos'],
   ok:1,fb:'GNP (Grupo Nacional Provincial) es una de las aseguradoras más reconocidas y sólidas de México. Es el socio de Koltin para el Seguro de Gastos Médicos Mayores, que también incluye cobertura de accidentes y emergencias en el extranjero.'},
  {txt:'¿Cómo describirías la misión de Koltin en una sola frase a una GP?',
   opts:['"Somos un seguro médico para adultos mayores a precio accesible"','"Somos una plataforma de salud integral que cuida a las Grandes Personas antes, durante y después de que algo ocurra"','"Somos una red de hospitales y médicos especialistas en geriatría"','"Somos un servicio de telemedicina con seguro incluido"'],
   ok:1,fb:'Koltin es una plataforma de salud integral — no un seguro, no solo telemedicina. Cuida la salud de las Grandes Personas en todas sus dimensiones, de forma proactiva y continua.'},
  {txt:'Una GP pregunta si su membresía cubre su visita al médico de cabecera que no está en la red. ¿Qué le explicas?',
   opts:['Que sí — Koltin cubre cualquier médico que ella elija','Que el seguro GNP tiene condiciones específicas de cobertura — para detalles de siniestros hay un módulo dedicado, pero generalmente aplica la red hospitalaria','Que puede ir con cualquier médico y luego pedir reembolso sin límite','Que la membresía no cubre ningún médico externo'],
   ok:1,fb:'El Seguro de Gastos Médicos Mayores tiene condiciones específicas. Los detalles de siniestros y cobertura se verán en un módulo posterior. Por ahora, lo importante es posicionar que el seguro protege ante eventos mayores de salud.'},
  {txt:'¿Cuáles son los 3 pilares de la propuesta de valor de Koltin en orden correcto?',
   opts:['Comunidad → Seguros → Prevención','Seguros → Prevención → Comunidad','Prevención → Seguros → Comunidad','Consultas → EDL → Seguro'],
   ok:2,fb:'La pirámide de valor de Koltin: Prevención (base) → Seguros → Comunidad. La prevención es el cimiento sobre el que se construye todo lo demás.'}
]},

suba1:{type:'truefalse',pass:3,items:[
  {txt:'Puedes pedir el código de 6 dígitos (OTP) a una GP si necesitas ayudarla a entrar a la app.',ans:false,fb:'NUNCA debes pedir el código OTP. Es la llave de la cuenta. Pedirlo es facilitar un fraude.'},
  {txt:'La app Koltin tiene 3 secciones: Salud y Expediente, Emergencia y Membresía.',ans:true,fb:'Correcto. Esas son las 3 secciones principales de la app.'},
  {txt:'El Plan de Longevidad ya está disponible y se puede descargar desde la app.',ans:false,fb:'El Plan de Longevidad todavía NO existe. Lo que sí existe es el Reporte de Longevidad.'},
  {txt:'El botón "Tengo una emergencia" abre un chat de WhatsApp con el equipo de asistencia.',ans:false,fb:'No abre WhatsApp. Hace una llamada telefónica directa a la línea de asistencia 24/7.'},
  {txt:'Si una GP oculta su credencial y cierra la app, al volver a abrirla la credencial vuelve a verse.',ans:true,fb:'Correcto. El ocultar no se guarda entre sesiones — es el comportamiento esperado, no un error.'}
]},

suba3:{type:'scenario',pass:3,scenarios:[
  {txt:'Una GP dice: "eliminé mi cuenta porque quería cancelar mi membresía". ¿Qué le explicas?',
   opts:['Le digo que sí, que al eliminar la cuenta se cancela automáticamente la membresía','Le explico que eliminar la cuenta solo la desactiva — no cancela la membresía, no borra el expediente; cancelar membresía es otro trámite','Le digo que debe esperar 24 horas para que el sistema procese la cancelación','Le pido que vuelva a entrar a la app para reactivar la cuenta y desde ahí cancele'],
   ok:1,fb:'Eliminar la cuenta solo la deja desactivada. Si vuelve a entrar, se reactiva. Para cancelar la membresía, ese es otro trámite que no se hace desde la app.'},
  {txt:'Una GP de Puebla quiere agendar su consulta EDL de forma presencial. ¿Qué le dices?',
   opts:['Que elija presencial desde la app y la clínica más cercana aparecerá en el mapa','Que la opción presencial solo está en CDMX y Monterrey — en su caso solo aparecerá la modalidad virtual','Que llame para agendar presencial porque la app de foráneos no tiene esa función','Que tiene que ir a la clínica directamente porque la app no gestiona citas presenciales foráneas'],
   ok:1,fb:'La opción presencial solo aparece en CDMX y Monterrey. Si la GP es de otra ciudad, solo le sale la modalidad virtual.'},
  {txt:'Una GP dice que le desapareció su credencial de la app. ¿Cuál es lo primero que verificas?',
   opts:['Que su membresía esté activa en el sistema — puede estar vencida','Que haya actualizado la app a la última versión disponible','Que la haya ocultado con el control de ocultar/mostrar y que solo necesita tocarlo otra vez','Que no haya reiniciado el teléfono porque eso borra las credenciales'],
   ok:2,fb:'Casi seguro la ocultó con el control de ocultar/mostrar. El ocultar no se guarda entre sesiones. Solo necesita tocar el control otra vez y vuelve a aparecer.'},
  {txt:'Una GP reporta que en la app dice "Acceso pausado por seguridad" y no puede entrar. ¿Qué haces?',
   opts:['Escalo inmediatamente porque es un bug crítico de la app','Le explico que es una protección de seguridad — sucede cuando se ingresa mal el código muchas veces; no es una falla ni una suspensión','Le pido el código OTP para ayudarla a entrar directamente','Le digo que reinstale la app y vuelva a intentarlo'],

/* ═══════════════════════════════════
   DB — artifact db (cross-device) + localStorage (instant UI)
═══════════════════════════════════ */
let _adb=null;
async function getADB(){if(_adb)return _adb;try{_adb=await claude.use('db');}catch(e){_adb=null;}return _adb;}
function eid(e){return e.replace(/[@.]/g,'_');}

// localStorage helpers (instant UI, always available)
function gDB(){try{return JSON.parse(localStorage.getItem('kacad')||'{}')}catch(e){return{experts:{},_mem:{}}}}
function sDB(d){try{localStorage.setItem('kacad',JSON.stringify(d))}catch(e){}}
function gProg(email,sid){return gDB().experts?.[email]?.prog?.[sid]||{rd:false,ad:false,gd:false,atts:[],best:null,pass:false}}

// Artifact DB writes (async, fire-and-forget)
async function dbPutExpert(exp){
  const db=await getADB();if(!db)return;
  try{await db.doc('experts/'+eid(exp.email)).set({id:exp.id,email:exp.email,name:exp.name,start:exp.start,last:exp.last});}catch(e){}
}
async function dbPutProgress(email,sid,prog){
  const db=await getADB();if(!db)return;
  try{await db.doc('progress/'+eid(email)+'_'+sid).set({email,sid,rd:prog.rd||false,ad:prog.ad||false,best:prog.best||null,pass:prog.pass||false});}catch(e){}
}
async function dbPutAttempt(email,sid,att){
  const db=await getADB();if(!db)return;
  try{await db.doc('attempts/'+att.id).set({id:att.id,email,sid,date:att.date,score:att.score,pass:att.pass,ans_json:JSON.stringify(att.ans||{})});}catch(e){}
}

// Load progress from artifact DB → merge into localStorage
async function dbSyncToLocal(email){
  const db=await getADB();if(!db)return false;
  try{
    const pSnap=await db.collection('progress').where('email','==',email).get();
    if(pSnap.empty)return false;
    const aSnap=await db.collection('attempts').where('email','==',email).get();
    const attsBySid={};
    aSnap.docs.forEach(d=>{const a=d.data();if(!attsBySid[a.sid])attsBySid[a.sid]=[];attsBySid[a.sid].push(a);});
    const d=gDB();
    if(!d.experts)d.experts={};
    if(!d.experts[email])d.experts[email]={prog:{}};
    if(!d.experts[email].prog)d.experts[email].prog={};
    pSnap.docs.forEach(doc=>{
      const p=doc.data();
      const existing=d.experts[email].prog[p.sid]||{rd:false,ad:false,gd:false,best:null,pass:false,atts:[]};
      const dbAtts=(attsBySid[p.sid]||[]).map(a=>({id:a.id,date:a.date,score:a.score,pass:a.pass,ans:a.ans_json?JSON.parse(a.ans_json):(a.ans||{})}));
      // Merge: always take the most favorable value (never downgrade)
      d.experts[email].prog[p.sid]={
        rd:existing.rd||p.rd||false,
        ad:existing.ad||p.ad||false,
        gd:existing.gd||p.gd||false,
        best:Math.max(existing.best||0,p.best||0)||null,
        pass:existing.pass||p.pass||false,
        atts:dbAtts.length>=(existing.atts||[]).length?dbAtts:(existing.atts||[])
      };
    });
    sDB(d);return true;
  }catch(e){return false;}
}

// Load all data from artifact DB for admin
async function dbLoadAll(){
  const db=await getADB();if(!db)return null;
  try{
    const eSnap=await db.collection('experts').get();
    const pSnap=await db.collection('progress').get();
    const aSnap=await db.collection('attempts').get();
    const progByEmail={};
    pSnap.docs.forEach(d=>{const p=d.data();if(!progByEmail[p.email])progByEmail[p.email]={};progByEmail[p.email][p.sid]=p;});
    const attsByEmail={};
    aSnap.docs.forEach(d=>{const a=d.data();if(!attsByEmail[a.email])attsByEmail[a.email]=[];attsByEmail[a.email].push(a);});
    return eSnap.docs.map(d=>{
      const exp=d.data();
      const prog={};
      Object.entries(progByEmail[exp.email]||{}).forEach(([sid,p])=>{
        prog[sid]={rd:p.rd,ad:p.ad,best:p.best,pass:p.pass,
          atts:(attsByEmail[exp.email]||[]).filter(a=>a.sid===sid).map(a=>({id:a.id,date:a.date,score:a.score,pass:a.pass,ans:a.ans_json?JSON.parse(a.ans_json):(a.ans||{})}))};
      });
      return{...exp,prog};
    });
  }catch(e){return null;}
}

// localStorage → artifact DB (main write functions)
function sProg(email,sid,u){
  const d=gDB();
  if(!d.experts||!d.experts[email])return;
  if(!d.experts[email].prog)d.experts[email].prog={};
  const cur=d.experts[email].prog[sid]||{rd:false,ad:false,gd:false,atts:[],best:null,pass:false};
  // Merge: only allow progress forward, never backward
  const merged={
    rd:cur.rd||(u.rd||false),
    ad:cur.ad||(u.ad||false),
    gd:cur.gd||(u.gd||false),
    pass:cur.pass||(u.pass||false),
    best:u.best!==undefined?Math.max(cur.best||0,u.best||0):cur.best,
    atts:cur.atts||[]
  };
  d.experts[email].prog[sid]=merged;
  d.experts[email].last=new Date().toISOString();
  sDB(d);
  dbPutProgress(email,sid,merged);
}

function sAtt(email,sid,score,ans){
  const d=gDB();
  if(!d.experts?.[email])return;
  if(!d.experts[email].prog)d.experts[email].prog={};
  if(!d.experts[email].prog[sid])d.experts[email].prog[sid]={rd:false,ad:false,gd:false,atts:[],best:null,pass:false};
  const p=d.experts[email].prog[sid];
  const att={id:'a'+Date.now(),date:new Date().toISOString(),score,pass:score>=90,ans};
  if(!p.atts)p.atts=[];
  p.atts.push(att);
  p.best=Math.max(p.best||0,score);
  p.pass=p.pass||score>=90;
  d.experts[email].last=new Date().toISOString();
  sDB(d);
  dbPutAttempt(email,sid,att);
  dbPutProgress(email,sid,p);
}

function mkExp(name,email){
  const d=gDB();
  if(!d.experts)d.experts={};
  if(!d.experts[email])d.experts[email]={id:'e'+Date.now(),name,email,start:new Date().toISOString(),last:new Date().toISOString(),prog:{}};
  d.experts[email].last=new Date().toISOString();
  sDB(d);
  dbPutExpert(d.experts[email]);
  return d.experts[email];
}
